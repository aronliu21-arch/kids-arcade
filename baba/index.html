<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Baba · Kids Progress</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1b1f3b;--mut:#6b6a66;--line:#e6e3da;--nora:#7048e8;--lucas:#f76707;--milo:#2f9e44;--ok:#2f9e44;--bad:#e03131}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px 40px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:#e9e6dd;border-radius:999px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--ink);min-height:36px}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px #0002}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px #0000000d}
.card h2{font-size:15px;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px}.tile .l{font-size:12px;color:var(--mut)}.tile .v{font-size:24px;font-weight:700;margin-top:2px}.tile .d{font-size:12px;color:var(--mut)}
.kidtabs button{border-left:5px solid transparent}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%}
.goal{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dot{width:26px;height:26px;border-radius:50%;border:3px solid #f5b700;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}.dot.on{background:#f5b700}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}.pill.ok{background:#ebfbee;color:var(--ok)}.pill.no{background:#fff4e6;color:#d9480f}
.muted{color:var(--mut)}.small{font-size:12px}
svg text{font:11px -apple-system,sans-serif;fill:#6b6a66}
#gate{max-width:320px;margin:18vh auto 0;text-align:center}
#gate input{font:inherit;font-size:28px;letter-spacing:10px;text-align:center;width:180px;padding:10px;border-radius:12px;border:2px solid var(--line);margin:14px 0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 22px;background:var(--ink);color:#fff;cursor:pointer;min-height:44px}
.err{color:var(--bad);min-height:20px;font-size:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols .card{margin-bottom:0}
.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:3px;font-size:11px;color:var(--mut)}
.heat div.c{height:16px;border-radius:3px}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.hide-s{display:none}}

html,body{height:100%}
body{padding:10px 12px}
#app{height:calc(100vh - 20px);display:flex;flex-direction:column;gap:8px}
#app .top{margin:0;align-items:center}
#app h1{font-size:17px;margin:0}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.goalstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:7px 12px;font-size:14px}
.goalstrip .dot{width:20px;height:20px;border-width:2px;font-size:11px}
.tiles{margin:0;gap:8px}.tile{padding:8px 12px}.tile .v{font-size:20px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(170px,38%) 1fr;gap:8px}
.main .card{margin:0;padding:10px 12px;min-height:0;display:flex;flex-direction:column}
.main .card h2{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;gap:6px}
.main .card h2 span{font-weight:500;color:var(--mut);font-size:12px}
.scroll{overflow:auto;min-height:0;flex:1}
.chartbox{flex:1;min-height:0}
tr.g{cursor:pointer}tr.g:hover td{background:#faf8f2}tr.g.open td{background:#f3f0ff}
tr.mx td{background:#fbfaf6;font-size:13px;padding:6px 8px}
.mxl{margin:0;padding:0;list-style:none}.mxl li{padding:4px 0;border-bottom:1px dashed var(--line)}.mxl li:last-child{border:0}
.caret{display:inline-block;width:12px;color:var(--mut)}
.heat2{display:grid;gap:3px;font-size:11px;color:var(--mut);align-items:center}
.heat2 .c{height:100%;min-height:14px;border-radius:3px}
.heat2 .hd{text-align:center;line-height:1.15}
@media(max-width:740px){#app{height:auto}.main{grid-template-columns:1fr;grid-template-rows:auto}.main .card{max-height:none}.chartbox{height:170px}}
.goalstrip .gi{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:10px;background:#faf8f2}
.goalstrip .gi.met{background:#ebfbee}
.goalstrip .gbar{width:70px;height:8px;border-radius:4px;background:#eee;overflow:hidden;display:inline-block}.goalstrip .gbar i{display:block;height:100%;background:#f5b700}
.goalstrip .gi.met .gbar i{background:var(--ok)}
#ipad{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;min-height:36px}
#gd{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
#gd[hidden]{display:none}
#gd .panel{background:var(--bg);border-radius:18px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px #0005}
#gd .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
#gd .ph h2{margin:0;font-size:18px}
#gd .pb{overflow:auto;padding:12px 16px}
#gd .x{font:inherit;font-size:22px;border:0;background:#eee;border-radius:50%;width:40px;height:40px;cursor:pointer}
#gd .tiles{grid-template-columns:repeat(4,1fr)}
#gd table{font-size:14px}#gd td{padding:6px}
#gd tr.no td{background:#fff5f5}#gd tr.day td{background:#efece3;font-weight:700;font-size:13px;padding:5px 6px}
.ok{color:var(--ok);font-weight:700}.no2{color:var(--bad);font-weight:700}

.show-s{display:none}@media(max-width:700px){.show-s{display:block}}
@media(max-width:700px){#gd .tiles{grid-template-columns:repeat(2,1fr)}#gd .panel{border-radius:12px}}
#nav button:disabled{opacity:.3;cursor:default}#nav button{font-size:16px}
</style></head><body><div class="wrap">

<div id="gate">
  <div style="font-size:44px">👨</div><h1>Baba only</h1><div class="sub">爸爸專用 · enter the code</div>
  <form id="gf"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Code"><br>
  <button class="btn" type="submit">Open</button></form>
  <div class="err" id="gerr"></div>
  <p><a href="../" class="small muted">← Back to the arcade</a></p>
</div>

<div id="app" hidden>
  <div class="top">
    <div><h1>Kids Progress</h1><div class="sub" id="asof"></div></div>
    <div class="bar2">
      <div class="seg kidtabs" id="kids"></div>
      <div class="seg" id="range"><button data-m="day">Day</button><button data-m="week" class="on">Week</button><button data-m="month">Month</button></div>
      <div class="seg" id="nav"><button id="prev" aria-label="Earlier">‹</button><button id="plabel" style="font-weight:700;min-width:120px">This week</button><button id="next" aria-label="Later">›</button></div>
      <select id="ipad" aria-label="Whose iPad is this?"><option value="">This iPad: anyone</option><option value="nora">This iPad: Nora’s</option><option value="lucas">This iPad: Lucas’s</option></select>
      <a href="../" class="small muted">Arcade ↩</a>
    </div>
  </div>
  <div class="goalstrip" id="goalCard"></div>
  <div class="tiles" id="tiles"></div>
  <div class="main">
    <div class="card"><h2>Minutes played per day <span id="dayRange"></span></h2><div class="chartbox" id="dayChart"></div></div>
    <div class="card"><h2>When they play <span id="heatRange"></span></h2><div class="chartbox" id="heat"></div></div>
    <div class="card"><h2>Games <span>tap a game for every question</span></h2><div class="scroll" id="games"></div></div>
    <div class="card"><h2>Play sessions <span>newest first</span></h2><div class="scroll" id="sessions"></div></div>
  </div>
</div>
<div id="gd" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="gdT"><div class="ph"><div><h2 id="gdT"></h2><div class="small muted" id="gdS"></div></div><button class="x" id="gdX" type="button" aria-label="Close">×</button></div><div class="pb" id="gdB"></div></div></div>
</div>
<script>
(function(){
"use strict";
var ENDPOINT="https://script.google.com/macros/s/AKfycbwrTV9-YyjNl4MhkiAaOho-kIm30yp65u2ea_cO44sm8pr1_bEqYYzsSf6FSqs3O5z6/exec";
var KIDS={nora:{n:"Nora",c:"#7048e8"},lucas:{n:"Lucas",c:"#f76707"},milo:{n:"Milo",c:"#2f9e44"}};
var PAL=["#4c6ef5","#f59f00","#12b886","#e64980","#7950f2","#fd7e14","#15aabf","#82c91e","#fa5252","#868e96"];
var $=function(id){return document.getElementById(id);};
var D=null,kid="nora",days=7,mode="week",off=0;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function load(pin,cb){
  var name="_babaCb"+Date.now(),s=document.createElement("script"),done=false;
  window[name]=function(d){done=true;delete window[name];s.remove();cb(d);};
  s.onerror=function(){if(!done){delete window[name];cb({ok:false,error:"net"});}};
  setTimeout(function(){if(!done){done=true;cb({ok:false,error:"slow"});}},25000);
  s.src=ENDPOINT+"?view=dash&days=180&pin="+encodeURIComponent(pin)+"&callback="+name+"&t="+Date.now();
  document.body.appendChild(s);
}
$("gf").onsubmit=function(e){e.preventDefault();var pin=$("pin").value.trim();$("gerr").textContent="Loading…";
  load(pin,function(d){
    if(!d||!d.ok){$("gerr").textContent=d&&d.error==="pin"?"Wrong code.":d&&d.error==="slow"?"Couldn't load. Check you're online, then try again.":"Couldn't reach the Sheet. Are you online?";
      if(d&&d.error!=="pin"&&!d.ok&&!d.error)$("gerr").textContent="The dashboard isn't set up on the Google side yet.";return;}
    try{sessionStorage.setItem("babaPin",pin);}catch(e){}
    D=prep(d);$("gate").hidden=true;$("app").hidden=false;render();});
};
try{var sp=sessionStorage.getItem("babaPin");if(sp){$("pin").value=sp;}}catch(e){}

function prep(d){
  var rows=function(a,cols){return(a||[]).map(function(r){var o={};cols.forEach(function(c,i){o[c]=r[i];});o.ldate=String(o.ldate).slice(0,10);o.lhour=+o.lhour||0;return o;});};
  return{raw:d,a:rows(d.a,d.aCols),t:rows(d.t,d.tCols),p:rows(d.p,d.pCols||[]),games:d.games||{},goals:d.goals,now:new Date(d.now||Date.now())};
}
function ymd(dt){return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2);}
/* the period being viewed: Day / Week (Mon–Sun) / Month, stepped with ‹ › (off = 0 is the current one) */
function period(){var t=new Date(),a,b,lab;t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(mode==="day"){a=new Date(t.getFullYear(),t.getMonth(),t.getDate()+off);b=a;lab=off===0?"Today":off===-1?"Yesterday":wd(ymd(a))+" "+md(ymd(a));}
  else if(mode==="week"){var mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)+7*off);a=mon;b=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);lab=off===0?"This week":off===-1?"Last week":md(ymd(a))+" – "+md(ymd(b));}
  else{a=new Date(t.getFullYear(),t.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);lab=off===0?"This month":a.toLocaleDateString([],{month:"long",year:"numeric"});}
  var out=[];for(var x=new Date(a);x<=b&&x<=t;x=new Date(x.getFullYear(),x.getMonth(),x.getDate()+1))out.push(ymd(x));if(!out.length)out.push(ymd(a));
  return{from:ymd(a),to:ymd(b),list:out,label:lab};}
function dayList(){return period().list;}
function gname(g){return D.games[g]||g;}
function isT(v){return v===true||String(v).toLowerCase()==="true";}
function fmtMin(m){m=Math.round(m);return m<60?m+" min":Math.floor(m/60)+" h "+("0"+m%60).slice(-2)+" m";}
function wd(s){var p=s.split("-"),x=new Date(+p[0],p[1]-1,+p[2]);return["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][x.getDay()];}
function md(s){var p=s.split("-");return["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][p[1]-1]+" "+(+p[2]);}
function h12(h){return(h%12||12)+(h<12?" AM":" PM");}

var NAMES={};
var SHELF={};/* kid -> game id -> "practice" | "free" | "other", read from the arcade menu */
function gid(u){return String(u).replace(/\/$/,"").split("/").pop();}
fetch("../?n="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){var re=/en:"([^"]*)", url:"([^"]*)"/g,m;while((m=re.exec(t))){var id=gid(m[2]);NAMES[id]=m[1].replace(/&rsquo;|’/g,"'");}
  try{var a=t.indexOf("const MENU = {"),b=t.indexOf("\n};",a);var M=Function('"use strict";return '+t.slice(a+13,b+2))();
    Object.keys(M).forEach(function(k){SHELF[k]={};M[k].forEach(function(sh){var ty=/Student to Master/.test(sh[0])?"practice":/爸爸/.test(sh[0])?"free":"other";sh[1].forEach(function(u){SHELF[k][gid(u)]=ty;});});});}catch(e){}
  if(D)render();}).catch(function(){});
function gname2(g){return NAMES[g]||gname(g);}
var openGame=null;
function render(){
  $("kids").innerHTML=Object.keys(KIDS).map(function(k){return'<button data-k="'+k+'" class="'+(k===kid?"on":"")+'" style="border-left-color:'+KIDS[k].c+'">'+KIDS[k].n+'</button>';}).join("");
  [].forEach.call($("kids").children,function(b){b.onclick=function(){kid=b.dataset.k;openGame=null;render();};});
  [].forEach.call($("range").children,function(b){b.classList.toggle("on",b.dataset.m===mode);b.onclick=function(){mode=b.dataset.m;off=0;render();};});
  var PD=period(),dataFrom=String(D.raw.from||"").slice(0,10);$("plabel").textContent=PD.label;$("plabel").onclick=function(){off=0;render();};
  $("prev").disabled=!!dataFrom&&PD.from<=dataFrom;$("next").disabled=off>=0;
  $("prev").onclick=function(){off--;render();};$("next").onclick=function(){if(off<0){off++;render();}};
  $("asof").textContent="Updated "+D.now.toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  var dl=PD.list,from=PD.from,to=PD.to,inR=function(r){return r.kid===kid&&r.ldate>=from&&r.ldate<=to;};days=dl.length;
  var A=D.a.filter(inR),T=D.t.filter(inR),K=KIDS[kid],rangeTxt=dl.length===1?wd(dl[0])+" "+md(dl[0]):md(dl[0])+" – "+md(dl[dl.length-1]);
  $("dayRange").textContent=rangeTxt;$("heatRange").textContent=rangeTxt;

  /* goal strip: every goal for this kid */
  var gl=D.goals&&D.goals.list?D.goals.list.filter(function(x){return x.kid===kid;}):[];
  if(gl.length){var w=D.goals.week,met=gl.filter(function(g){return g.met;}).length;
    $("goalCard").innerHTML='<b>🎯 Week '+w.no+'</b><span class="muted small">'+md(w.from)+'–'+md(w.to)+' · '+met+'/'+gl.length+' done</span>'+gl.map(function(g){
      var unit=g.type==="correct"?"right":"rounds "+"★".repeat(g.min||0)+"+",tip=g.detail&&g.detail.length?g.detail.join(" · "):(g.type==="correct"?"none yet":"no rounds yet");
      return'<span class="gi'+(g.met?" met":"")+'" title="'+esc(tip)+'"><span>'+esc(g.label)+'</span><span class="gbar"><i style="width:'+Math.min(100,Math.round(100*g.done/g.n))+'%"></i></span><b>'+Math.min(g.done,g.n)+'/'+g.n+'</b><span class="small muted">'+unit+'</span>'+(g.met?'✅':'')+'</span>';}).join("");}
  else $("goalCard").innerHTML='<b>🎯 Weekly goal</b><span class="muted">None set for '+K.n+'</span>';

  /* tiles */
  var secs=T.reduce(function(s,r){return s+(+r.secs||0);},0),first=A.filter(function(r){return+r.tryNo===1;}),fok=first.filter(function(r){return isT(r.correct);}).length;
  var playDays={};T.forEach(function(r){if(+r.secs>0)playDays[r.ldate]=1;});A.forEach(function(r){playDays[r.ldate]=1;});
  var games={};T.forEach(function(r){games[r.game]=1;});A.forEach(function(r){games[r.game]=1;});
  $("tiles").innerHTML=tile("Play time",fmtMin(secs/60),"avg "+fmtMin(secs/60/days)+" / day")+tile("Days played",Object.keys(playDays).length+" / "+days,"")+
    tile("First-try right",first.length?Math.round(100*fok/first.length)+"%":"—",first.length+" questions")+tile("Games played",Object.keys(games).length,"");

  var gm={};T.forEach(function(r){gm[r.game]=(gm[r.game]||0)+(+r.secs||0);});
  var order=Object.keys(gm).sort(function(a,b){return gm[b]-gm[a];}),col={};order.forEach(function(x,i){col[x]=PAL[i%PAL.length];});
  $("dayChart").innerHTML=dayChart(dl,T,order,col);
  $("heat").innerHTML=heat(dl,T,K);

  /* games, split by arcade shelf: practice (accuracy) vs free play (where they are, % done) */
  var G={};function gg(x){return G[x]||(G[x]={s:0,n:0,f:0,fo:0,miss:0,last:""});}
  T.forEach(function(r){var o=gg(r.game);o.s+=+r.secs||0;if(r.ldate>o.last)o.last=r.ldate;});
  A.forEach(function(r){var o=gg(r.game);o.n++;if(+r.tryNo===1){o.f++;if(isT(r.correct))o.fo++;}if(!isT(r.correct))o.miss++;if(r.ldate>o.last)o.last=r.ldate;});
  var PR={};D.p.filter(function(r){return r.kid===kid;}).forEach(function(r){var o=PR[r.game]||(PR[r.game]={last:null,start:null});var k=String(r.ts||r.ldate);
    if(!o.last||k>String(o.last.ts||o.last.ldate))o.last=r;if(r.ldate<from&&(!o.start||k>String(o.start.ts||o.start.ldate)))o.start=r;});
  var sh=SHELF[kid]||{},type=function(x){return sh[x]||(PR[x]?"free":"other");};
  Object.keys(PR).forEach(function(x){gg(x);});Object.keys(sh).forEach(function(x){if(sh[x]==="free"&&PR[x])gg(x);});
  var maxS=Math.max.apply(null,Object.keys(G).map(function(x){return G[x].s;}).concat([1]));
  var cell=function(x){return'<td><span class="caret">▸</span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+(col[x]||"#ccc")+';margin-right:5px"></span>'+esc(gname2(x))+'<div class="bar" style="margin:3px 0 0 17px"><i style="width:'+(100*G[x].s/maxS)+'%;background:'+(col[x]||"#ccc")+'"></i></div></td>';};
  var groups=[["practice","練習變大師 Student to Master"],["free","爸爸的遊戲 Free play"],["other","Other games"]],h2="";
  groups.forEach(function(gp){var list=Object.keys(G).filter(function(x){return type(x)===gp[0];}).sort(function(a,b){return G[b].s-G[a].s;});if(!list.length)return;
    if(gp[0]==="free"){h2+='<tr class="day"><td colspan="5"><b>'+gp[1]+'</b> <span class="muted small">where they are · % of the game done</span></td></tr><tr><th>Game</th><th class="num">Time</th><th colspan="2">Where now</th><th class="num">Done</th></tr>';
      list.forEach(function(x){var o=G[x],p=PR[x],l=p&&p.last,pct=l?+l.pct||0:null,gain=l&&p.start?pct-(+p.start.pct||0):null;
        h2+='<tr class="g" data-g="'+esc(x)+'">'+cell(x)+'<td class="num">'+fmtMin(o.s/60)+'</td><td colspan="2">'+(l?esc(l.where)+'<div class="small muted">'+esc(l.detail||"")+' · '+mdShort(l.ldate)+'</div>':'<span class="muted small">game doesn’t report progress yet</span>')+'</td><td class="num">'+(pct==null?"—":'<b>'+pct+'%</b>'+(gain>0?'<div class="small" style="color:var(--ok)">▲'+gain+'</div>':''))+'</td></tr>';});}
    else{h2+='<tr class="day"><td colspan="5"><b>'+gp[1]+'</b></td></tr><tr><th>Game</th><th class="num">Time</th><th class="num">Right</th><th class="num">Missed</th><th class="num hide-s">Last</th></tr>';
      list.forEach(function(x){var o=G[x],acc=o.f?Math.round(100*o.fo/o.f):null;
        h2+='<tr class="g" data-g="'+esc(x)+'">'+cell(x)+'<td class="num">'+fmtMin(o.s/60)+'</td><td class="num" style="color:'+(acc==null?"var(--mut)":acc>=80?"var(--ok)":acc>=60?"#d9480f":"var(--bad)")+'">'+(acc==null?"—":acc+"%")+'</td><td class="num">'+(o.miss||"—")+'</td><td class="num hide-s">'+(o.last?wd(o.last)+" "+mdShort(o.last):"")+'</td></tr>';});}});
  $("games").innerHTML=h2?'<table>'+h2+'</table>':'<div class="muted">Nothing played in this period.</div>';
  [].forEach.call(document.querySelectorAll("#games tr.g"),function(tr){tr.onclick=function(){openDetail(tr.dataset.g,A,T,rangeTxt);};});

  /* sessions */
  var S={};function ss(r){var k=r.session||r.ldate+r.game;return S[k]||(S[k]={game:r.game,d:r.ldate,h:r.lhour,s:0,n:0,f:0,fo:0});}
  T.forEach(function(r){var o=ss(r);o.s+=+r.secs||0;if(r.ldate<o.d||(r.ldate===o.d&&r.lhour<o.h)){o.d=r.ldate;o.h=r.lhour;}});
  A.forEach(function(r){var o=ss(r);o.n++;if(+r.tryNo===1){o.f++;if(isT(r.correct))o.fo++;}});
  var sl=Object.keys(S).map(function(k){return S[k];}).filter(function(o){return o.s>=20||o.n;}).sort(function(a,b){return(b.d+("0"+b.h).slice(-2)).localeCompare(a.d+("0"+a.h).slice(-2));}).slice(0,60);
  $("sessions").innerHTML=sl.length?'<table><tr><th>When</th><th>Game</th><th class="num">Time</th><th class="num">Right</th></tr>'+sl.map(function(o){var acc=o.f?Math.round(100*o.fo/o.f):null;
    return'<tr><td style="white-space:nowrap">'+wd(o.d)+' '+mdShort(o.d)+' <span class="muted small">'+h12(o.h)+(o.h>=20?' 🌙':'')+'</span></td><td>'+esc(gname2(o.game))+'</td><td class="num">'+fmtMin(o.s/60)+'</td><td class="num">'+(acc==null?"—":acc+"%")+'</td></tr>';}).join("")+'</table>':'<div class="muted">No sessions in this period.</div>';
}
function mdShort(s){var p=s.split("-");return(+p[1])+"/"+(+p[2]);}
function tile(l,v,d){return'<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>';}
function hexA(h,a){var n=parseInt(h.slice(1),16);return"rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a.toFixed(2)+")";}
function heat(dl,T,K){
  var bands=[["Morning","6–12",6,12],["Afternoon","12–5",12,17],["Evening","5–8",17,20],["Late 🌙","8 PM+",20,24],["Night","12–6 AM",0,6]];
  var byDate=dl.length<=7,cols=byDate?dl:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],H={};
  T.forEach(function(r){var key=byDate?r.ldate:wd(r.ldate);bands.forEach(function(b,bi){if(r.lhour>=b[2]&&r.lhour<b[3])H[bi+"|"+key]=(H[bi+"|"+key]||0)+(+r.secs||0);});});
  var mx=Math.max.apply(null,Object.keys(H).map(function(k){return H[k];}).concat([1]));
  var h='<div class="heat2" style="height:100%;grid-template-columns:62px repeat('+cols.length+',1fr);grid-template-rows:repeat(5,1fr) auto">';
  bands.forEach(function(b,bi){h+='<div style="line-height:1.1">'+b[0]+'<br><span style="opacity:.7">'+b[1]+'</span></div>';cols.forEach(function(c){var v=H[bi+"|"+c]||0;h+='<div class="c" title="'+(byDate?wd(c)+" "+mdShort(c):c)+" "+b[0]+": "+fmtMin(v/60)+'" style="background:'+(v?hexA(K.c,.18+.82*v/mx):"#f1efe8")+'"></div>';});});
  h+='<div></div>'+cols.map(function(c){return'<div class="hd">'+(byDate?wd(c)+'<br>'+mdShort(c):c)+'</div>';}).join("");
  return h+'</div>'+(byDate?'':'<div class="small muted" style="margin-top:4px">Totals by weekday over '+dl.length+' days</div>');
}
function dayChart(dl,T,order,col){
  var box=$("dayChart"),W=Math.max(300,box.clientWidth||600),Hh=Math.max(130,box.clientHeight||170),pl=30,pb=30,bw=(W-pl)/dl.length,by={};
  T.forEach(function(r){var o=by[r.ldate]||(by[r.ldate]={});o[r.game]=(o[r.game]||0)+(+r.secs||0)/60;});
  var mx=Math.max.apply(null,dl.map(function(d){var o=by[d]||{};return Object.keys(o).reduce(function(s,k){return s+o[k];},0);}).concat([10]));
  mx=Math.ceil(mx/10)*10;var y=function(v){return(Hh-pb)-(Hh-pb-8)*v/mx;};
  var s='<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" height="'+Hh+'" role="img" aria-label="Minutes per day">';
  [0,mx/2,mx].forEach(function(v){s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#eee"/><text x="'+(pl-4)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>';});
  var every=dl.length<=7?1:dl.length<=31?Math.ceil(dl.length/8):Math.ceil(dl.length/9);
  dl.forEach(function(d,i){var o=by[d]||{},acc=0,x=pl+i*bw+bw*.15,w=bw*.7;
    order.forEach(function(g){var v=o[g]||0;if(!v)return;s+='<rect x="'+x+'" y="'+y(acc+v)+'" width="'+w+'" height="'+(y(acc)-y(acc+v))+'" fill="'+col[g]+'" rx="2"><title>'+esc(gname2(g))+': '+Math.round(v)+' min</title></rect>';acc+=v;});
    if(acc>=1&&dl.length<=31)s+='<text x="'+(x+w/2)+'" y="'+(y(acc)-3)+'" text-anchor="middle" style="font-size:10px">'+Math.round(acc)+'</text>';
    if(i%every===0||i===dl.length-1&&dl.length<=7){if(dl.length<=7)s+='<text x="'+(x+w/2)+'" y="'+(Hh-17)+'" text-anchor="middle">'+wd(d)+'</text>';s+='<text x="'+(x+w/2)+'" y="'+(Hh-4)+'" text-anchor="middle">'+mdShort(d)+'</text>';}});
  return s+'</svg>';
}
function tm(r){if(r.ts){var d=new Date(r.ts);if(!isNaN(d))return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}return h12(r.lhour);}
function tsKey(r){return r.ts?String(new Date(r.ts).getTime()).padStart(15,"0"):r.ldate+("0"+r.lhour).slice(-2);}
function openDetail(g,Aall,Tall,rangeTxt){
  var A=Aall.filter(function(r){return r.game===g;}).sort(function(a,b){return tsKey(b)<tsKey(a)?-1:1;}),T=Tall.filter(function(r){return r.game===g;});
  var secs=T.reduce(function(s,r){return s+(+r.secs||0);},0),first=A.filter(function(r){return+r.tryNo===1;}),fok=first.filter(function(r){return isT(r.correct);}).length,dd={};
  T.forEach(function(r){var o=dd[r.ldate]||(dd[r.ldate]={s:0,n:0,f:0,fo:0});o.s+=+r.secs||0;});
  A.forEach(function(r){var o=dd[r.ldate]||(dd[r.ldate]={s:0,n:0,f:0,fo:0});o.n++;if(+r.tryNo===1){o.f++;if(isT(r.correct))o.fo++;}});
  $("gdT").textContent=gname2(g)+" · "+KIDS[kid].n;$("gdS").textContent=rangeTxt+" · change Day / Week / Month on the page";
  var h='<div class="tiles">'+tile("Play time",fmtMin(secs/60),Object.keys(dd).length+" days")+tile("Answers",A.length,first.length+" first tries")+tile("First-try right",first.length?Math.round(100*fok/first.length)+"%":"—",fok+" of "+first.length)+tile("Missed",A.filter(function(r){return!isT(r.correct);}).length,"wrong answers")+'</div>';
  var P=D.p.filter(function(r){return r.kid===kid&&r.game===g;}).sort(function(a,b){return String(b.ts||b.ldate)<String(a.ts||a.ldate)?-1:1;});
  if(P.length)h+='<div class="card"><h2>Where they are <span class="muted small" style="font-weight:400">every step, newest first (all time)</span></h2><table><tr><th>When</th><th>Place in the game</th><th class="num">Done</th></tr>'+P.slice(0,60).map(function(r){return'<tr><td style="white-space:nowrap">'+wd(r.ldate)+' '+mdShort(r.ldate)+' <span class="muted small">'+tm(r)+'</span></td><td>'+esc(r.where)+'<div class="small muted">'+esc(r.detail||"")+'</div></td><td class="num"><b>'+(+r.pct||0)+'%</b></td></tr>';}).join("")+'</table></div>';
  /* every question, newest first, grouped by day */
  h+='<div class="card"><h2>Every question <span class="muted small" style="font-weight:400">newest first · red = wrong</span></h2>';
  if(!A.length)h+='<div class="muted">No answers recorded for this game in this period'+(secs?' (play time only — this game may not report answers)':'')+'.</div>';
  else{var last="";h+='<table><tr><th>Time</th><th>Question</th><th>Answered</th><th class="hide-s">Right answer</th><th class="num">Try</th><th></th></tr>';
    A.forEach(function(r){if(r.ldate!==last){last=r.ldate;var o=dd[r.ldate];h+='<tr class="day"><td colspan="6">'+wd(r.ldate)+' '+md(r.ldate)+' · '+o.n+' answers'+(o.f?' · '+Math.round(100*o.fo/o.f)+'% first-try right':'')+' · '+fmtMin(o.s/60)+'</td></tr>';}
      var ok=isT(r.correct),q=String(r.q||"").replace(/^\[\d+\/\d+\]\s*/,"");
      h+='<tr class="'+(ok?"":"no")+'"><td style="white-space:nowrap">'+tm(r)+'</td><td>'+esc(q)+(r.topic?'<div class="small muted">'+esc(r.topic)+'</div>':'')+'</td><td>'+esc(r.given)+(ok?'':'<div class="small show-s">→ '+esc(r.expected)+'</div>')+'</td><td class="hide-s">'+esc(r.expected)+'</td><td class="num">'+(+r.tryNo||1)+'</td><td class="'+(ok?"ok":"no2")+'">'+(ok?"✓":"✗")+'</td></tr>';});
    h+='</table>';}
  h+='</div>';
  /* topics + most missed */
  var tp={},mm={};A.forEach(function(r){var t=r.topic||"(no topic)",o=tp[t]||(tp[t]={f:0,fo:0,n:0});o.n++;if(+r.tryNo===1){o.f++;if(isT(r.correct))o.fo++;}
    if(!isT(r.correct)){var q=String(r.q||"").replace(/^\[\d+\/\d+\]\s*/,""),k=q+"|"+r.expected;(mm[k]||(mm[k]={q:q,e:r.expected,n:0})).n++;}});
  var tk=Object.keys(tp).sort(function(a,b){return tp[b].n-tp[a].n;}),mk=Object.keys(mm).sort(function(a,b){return mm[b].n-mm[a].n;});
  if(tk.length)h+='<div class="cols"><div class="card"><h2>By topic</h2><table><tr><th>Topic</th><th class="num">Answers</th><th class="num">First-try right</th></tr>'+tk.map(function(t){var o=tp[t];return'<tr><td>'+esc(t)+'</td><td class="num">'+o.n+'</td><td class="num">'+(o.f?Math.round(100*o.fo/o.f)+"%":"—")+'</td></tr>';}).join("")+'</table></div>'+
    '<div class="card"><h2>Most missed</h2>'+(mk.length?'<table>'+mk.slice(0,12).map(function(k){var m=mm[k];return'<tr><td><b>'+m.n+'×</b> '+esc(m.q)+' <span class="muted">→ '+esc(m.e)+'</span></td></tr>';}).join("")+'</table>':'<div class="muted">No misses 🎉</div>')+'</div></div>';
  $("gdB").innerHTML=h;$("gd").hidden=false;$("gdB").scrollTop=0;
}
$("gdX").onclick=function(){$("gd").hidden=true;};
$("gd").addEventListener("click",function(e){if(e.target===$("gd"))$("gd").hidden=true;});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("gd").hidden=true;});
/* whose iPad is this: the arcade opens to that kid; the other big kid's profile and Tester then need the code */
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode("ka-owner|"+t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2);}).join("");});}
try{$("ipad").value=localStorage.getItem("ka-owner")||"";}catch(e){}
$("ipad").onchange=function(){var v=$("ipad").value,pin="";try{pin=sessionStorage.getItem("babaPin")||"";}catch(e){}
  if(!v){try{localStorage.removeItem("ka-owner");localStorage.removeItem("ka-owner-pin");}catch(e){}alert("This iPad can open every profile again.");return;}
  sha(pin).then(function(hx){try{localStorage.setItem("ka-owner",v);localStorage.setItem("ka-owner-pin",hx);}catch(e){}
    alert("Done. This iPad now opens to "+KIDS[v].n+". Milo stays open; the other profile and Tester need the Baba code.");});};
window.addEventListener("resize",function(){if(D&&!$("app").hidden)render();});
})();
