<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3d1c">
<title>Animal Safari Detective · 動物探險小偵探</title>
<link rel="preload" as="image" href="art/cover.webp">
<style>
:root{--wood1:#a86a35;--wood2:#7a4520;--wood3:#5a3014;--cream:#fff6e2;--paper:#fbefd2;--ink:#4a2a12;--leaf:#3f8f3a;--leaf2:#2f6e2b;--teal:#2fa39a;--gold:#ffc83d;
  --fnt:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","PingFang TC","Heiti TC",system-ui,sans-serif;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1f3d1c;color:var(--ink);font-family:var(--fnt);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
ruby{ruby-position:over;ruby-align:center}rt{font-size:.36em;letter-spacing:-.04em;font-weight:600;opacity:.85;white-space:nowrap}
/* ---------- title ---------- */
#title{background:#5c8f3a}
#title .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:13% 50%}
#title::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,0) 40%,rgba(10,30,5,.35));pointer-events:none}
.plaque{position:absolute;z-index:2;left:0;top:max(12px,var(--safeT));padding:14px 26px 16px max(30px,calc(var(--safeL) + 22px));border-radius:0 22px 22px 0;border-left:0!important;color:#fff3cf;text-align:center;
  background:linear-gradient(180deg,#b57538,#8a4f22 55%,#6d3a17);border:4px solid #4f2a10;box-shadow:0 8px 0 #3d200b,0 14px 26px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 3px 0 #4f2a10;max-width:min(92vw,560px)}
.plaque .en{font-size:clamp(26px,5.2vmin,52px);font-weight:900;line-height:1.02;letter-spacing:.5px}
.plaque .zh{font-size:clamp(17px,3.2vmin,30px);font-weight:800;margin-top:4px;color:#ffe9a8}
.plaque .paw{display:inline-block;width:.8em;height:.8em;vertical-align:-.05em;margin-left:.2em}
.titleBtns{position:absolute;z-index:3;right:max(22px,var(--safeR));bottom:max(22px,calc(var(--safeB) + 12px));display:flex;gap:18px;align-items:flex-end}
.bigBtn{width:clamp(96px,18vmin,150px);height:clamp(96px,18vmin,150px);border-radius:50%;display:grid;place-items:center;position:relative;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 14px 26px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.4);border:5px solid #fff}
.bigBtn.play{background:radial-gradient(circle at 35% 30%,#7fe06a,#2f9a2a 70%);animation:pulse 1.6s ease-in-out infinite}
.bigBtn.play svg{width:52%;fill:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));margin-left:8%}
.bigBtn.book{width:clamp(76px,13vmin,110px);height:clamp(76px,13vmin,110px);background:radial-gradient(circle at 35% 30%,#ffe18a,#e9a21b 75%)}
.bigBtn.book img{width:46%}
.bigBtn.book span{position:absolute;right:-6px;top:-6px;min-width:34px;height:34px;border-radius:17px;background:#e8590c;color:#fff;font-weight:900;font-size:18px;display:grid;place-items:center;border:3px solid #fff;padding:0 6px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.langPill{position:absolute;z-index:3;left:max(14px,var(--safeL));bottom:max(16px,calc(var(--safeB) + 10px));display:flex;background:rgba(255,246,226,.92);border-radius:999px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.langPill button{min-width:88px;height:52px;border-radius:999px;font-weight:800;font-size:19px;color:#6d4520}
.langPill button.sel{background:var(--teal);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.gear{position:absolute;z-index:3;right:max(14px,var(--safeR));top:max(12px,var(--safeT));display:flex;gap:6px;align-items:center;height:48px;padding:0 14px;border-radius:24px;background:rgba(255,246,226,.85);font-weight:700;font-size:14px;color:#6d4520}
.gear svg{width:22px;fill:#6d4520}
/* ---------- map ---------- */
#map,#journal{background:radial-gradient(ellipse at 50% 30%,#fbe8bf,#e8c98d 70%,#d2a868)}
#map::before,#journal::before{content:"";position:absolute;inset:0;background:url(art/trail.webp) center/cover;opacity:.18;filter:blur(2px)}
.mapHead{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:max(10px,var(--safeT)) max(12px,var(--safeR)) 0 max(12px,var(--safeL))}
.mapTitle{font-size:clamp(22px,4.4vmin,40px);font-weight:900;color:#5a3014;text-align:center;text-shadow:0 2px 0 #fff8;padding:0 8px}
.hud{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(180deg,#b57538,#7a4520);border:3px solid #4f2a10;box-shadow:0 5px 0 #3d200b,0 8px 16px rgba(0,0,0,.3)}
.hud svg{width:34px;fill:#fff3cf;stroke:#fff3cf}
.hud:active{transform:translateY(3px);box-shadow:0 2px 0 #3d200b}
.cards{position:absolute;z-index:2;left:0;right:0;top:calc(max(10px,var(--safeT)) + 80px);bottom:max(14px,var(--safeB));display:flex;gap:2.4vw;align-items:center;justify-content:center;padding:0 3vw}
.card{position:relative;flex:1 1 0;max-width:340px;aspect-ratio:.82;border-radius:26px;background:var(--cream);border:5px solid #fff;box-shadow:0 10px 0 #b98a4c,0 16px 30px rgba(60,30,0,.35);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .pic{flex:1;background-size:cover;background-position:center;position:relative}
.card .nm{padding:10px 8px 12px;text-align:center;font-weight:900;font-size:clamp(17px,2.6vmin,26px);color:#5a3014;line-height:1.15}
.card .nm small{display:block;font-size:.72em;color:#8a5a2b;font-weight:800}
.card .solved{position:absolute;right:10px;top:10px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 10px 4px 6px;font-weight:900;color:#e8590c;font-size:20px}
.card .solved img{width:30px}
.card .num{position:absolute;left:10px;top:10px;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;font-size:24px;display:grid;place-items:center;border:3px solid #fff}
.mapLeo,.mapCoco{position:absolute;z-index:1;bottom:0;pointer-events:none}
.mapLeo{left:1vw;height:28vh;opacity:.0}.mapCoco{right:1vw;height:16vh;opacity:0}
body.portrait .cards{flex-direction:column;gap:2.2vh;padding:0 7vw}
body.portrait .card{flex-direction:row;width:100%;max-width:640px;aspect-ratio:auto;flex:1 1 0;max-height:250px}
body.portrait .card .pic{flex:1.5}
body.portrait .card .nm{flex:1;display:grid;place-content:center}
/* ---------- scene ---------- */
#scene{background:#1b2a14}
body.portrait #scene{background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 38px,rgba(0,0,0,.18) 38px 41px),linear-gradient(90deg,#8a5426,#a86a35 30%,#8a5426 60%,#a86a35)}
#stage{position:absolute;left:0;right:0;overflow:hidden;touch-action:none}
body.portrait #stage{border-top:5px solid #6d3a17;border-bottom:5px solid #6d3a17;box-shadow:0 0 0 3px #3d200b}
#world{position:absolute;left:0;top:0;will-change:transform}
#bg{position:absolute;left:0;top:0;display:block}
#fx{position:absolute;inset:0}
#fg{position:absolute;left:0;bottom:-2px;pointer-events:none;z-index:40;will-change:transform}
#fg img{display:block;height:100%;width:100%}
#motes{position:absolute;inset:0;pointer-events:none;z-index:41;overflow:hidden}
.mote{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#fff8c8,rgba(255,240,160,0));animation:float 9s linear infinite;opacity:.0}
@keyframes float{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}85%{opacity:.6}100%{transform:translate(40px,-120px);opacity:0}}
.obj{position:absolute;transform-origin:50% 100%;touch-action:none}
.obj img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.28))}
.obj.hot{cursor:pointer}
.obj .shadow,.chr .shadow{position:absolute;left:10%;right:10%;bottom:-5%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%);z-index:-1}
.obj.hang{transform-origin:50% 0}
.obj.hang .vine{position:absolute;left:calc(50% - 3px);bottom:92%;width:6px;height:600px;background:linear-gradient(90deg,#4d6b1f,#7c9a32,#4d6b1f);border-radius:3px}
.obj.decal img{filter:none;opacity:.8}
.obj.hotspot{border-radius:50%}
.obj.done img{filter:drop-shadow(0 4px 3px rgba(0,0,0,.28)) saturate(.8)}
.sparkle{position:absolute;inset:-18%;pointer-events:none;background:radial-gradient(circle,rgba(255,248,190,.0) 40%,rgba(255,236,120,.55) 55%,rgba(255,236,120,0) 70%);animation:glow 1.1s ease-in-out infinite;border-radius:50%}
@keyframes glow{0%,100%{transform:scale(.85);opacity:.4}50%{transform:scale(1.1);opacity:1}}
.twinkle{position:absolute;width:26px;height:26px;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 40deg,#fff6a8 45deg,transparent 50deg 130deg,#fff6a8 135deg,transparent 140deg 220deg,#fff6a8 225deg,transparent 230deg 310deg,#fff6a8 315deg,transparent 320deg);border-radius:50%;animation:tw 1.2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.chr{position:absolute;transform-origin:50% 100%;pointer-events:auto}
.chr img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 5px 4px rgba(0,0,0,.3))}
.chr.flip img{transform:scaleX(-1)}
.fall{position:absolute;pointer-events:none;z-index:30;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.leafbit{position:absolute;width:14px;height:9px;border-radius:0 80% 0 80%;background:#5aa63a;pointer-events:none;z-index:31}
.ripple{position:absolute;border:3px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;animation:rip 1s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.mist{position:absolute;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.22) 26px,rgba(255,255,255,0) 34px);background-size:100% 52px;animation:fallw .7s linear infinite;mix-blend-mode:screen;opacity:.45;filter:blur(3px);border-radius:40%}
@keyframes fallw{to{background-position:0 52px}}
.ray{position:absolute;pointer-events:none;background:linear-gradient(200deg,rgba(255,250,200,.45),rgba(255,250,200,0) 70%);filter:blur(6px);animation:rayp 6s ease-in-out infinite;transform-origin:top}
@keyframes rayp{0%,100%{opacity:.35}50%{opacity:.75}}
.flyer{position:absolute;pointer-events:none;z-index:5}
/* hud */
#hudTop{position:absolute;left:0;right:0;top:0;z-index:60;display:flex;align-items:flex-start;justify-content:space-between;padding:max(10px,var(--safeT)) max(12px,var(--safeR)) 0 max(12px,var(--safeL));pointer-events:none}
#hudTop>*{pointer-events:auto}
.hudR{display:flex;gap:10px}
#btnMute .off{display:none;stroke:#fff3cf}#btnMute .on{stroke:#fff3cf}
body.muted #btnMute .off{display:block}body.muted #btnMute .on{display:none}
#tray{display:flex;gap:10px;padding:6px 12px;border-radius:22px;background:rgba(255,246,226,.9);box-shadow:0 5px 0 rgba(90,48,20,.35),0 8px 18px rgba(0,0,0,.25);border:3px solid #fff}
.slot{width:58px;height:58px;border-radius:50%;background:#e9d6ad;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 3px 6px rgba(0,0,0,.18)}
.slot>img{width:56%;opacity:.35}
.slot.full{background:#fff;box-shadow:0 0 0 3px var(--gold)}
.slot .clueMini{position:absolute;inset:0}
.slot.full>img{display:none}
.arrow{position:absolute;z-index:60;bottom:max(16px,calc(var(--safeB) + 10px));width:clamp(84px,13vmin,118px);height:clamp(84px,13vmin,118px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,236,170,.95),rgba(232,170,60,.95) 75%);border:4px solid #fff;box-shadow:0 6px 0 rgba(120,70,10,.5),0 10px 20px rgba(0,0,0,.3);display:grid;place-items:center;touch-action:none}
.arrow svg{width:52%;fill:none;stroke:#7a4520;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.arrow.left{left:max(16px,var(--safeL))}.arrow.right{right:max(16px,var(--safeR))}
.arrow.press{transform:scale(.92)}
.arrow.nudge{animation:nudge .8s ease-in-out 3}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bubble{position:absolute;z-index:61;left:50%;transform:translateX(-50%) translateY(-10px);top:calc(max(10px,var(--safeT)) + 84px);width:max-content;max-width:min(90vw,640px);display:flex;gap:10px;align-items:center;
  background:rgba(255,250,236,.96);border-radius:22px;padding:8px 18px 8px 8px;box-shadow:0 6px 18px rgba(0,0,0,.25);border:3px solid #fff;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bubble img{width:46px;height:46px;object-fit:contain;flex:none}
.bubble .txt{font-size:clamp(15px,2.3vmin,21px);font-weight:700;line-height:1.35;color:#4a2a12}
body.zh .bubble .txt{line-height:1.6}
body.portrait .arrow{bottom:max(18px,calc(var(--safeB) + 14px))}
/* ---------- activity panel ---------- */
.panelWrap{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,30,10,.45);padding:max(10px,var(--safeT)) max(10px,var(--safeR)) max(10px,var(--safeB)) max(10px,var(--safeL))}
.panelWrap.on{display:flex;animation:fadeIn .3s}
.panel{position:relative;width:min(96vw,980px);height:min(94%,700px);border-radius:30px;background:linear-gradient(180deg,#fff8e6,#f6e3b9);border:6px solid #fff;
  box-shadow:0 0 0 5px #8a4f22,0 18px 40px rgba(0,0,0,.45);overflow:hidden;animation:popIn .35s cubic-bezier(.3,1.5,.6,1)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.panel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 46px,rgba(160,110,50,.07) 46px 48px);pointer-events:none}
.pBody{position:absolute;inset:0}
.pCoco{position:absolute;left:10px;bottom:6px;height:min(26%,150px);z-index:3;pointer-events:none;transform-origin:50% 100%}
.pCoco.talk{animation:talk .5s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.pClose{position:absolute;right:10px;top:10px;z-index:5;width:56px;height:56px;border-radius:50%;background:#e9d6ad;display:grid;place-items:center;font-size:30px;font-weight:900;color:#7a4520}
.zone{position:absolute;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center}
.item{position:relative;display:grid;place-items:center;border-radius:50%;transition:transform .2s}
.item img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));pointer-events:none}
.item .n{position:absolute;right:-4px;top:-6px;min-width:38px;height:38px;border-radius:19px;background:var(--teal);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;border:3px solid #fff;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
.item.on .n{transform:scale(1)}
.item.hl{transform:scale(1.22)}
.bounce{animation:bounce .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.28) translateY(-8%)}100%{transform:scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.opts{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:clamp(12px,3vw,34px)}
.opt{width:clamp(92px,15vmin,138px);height:clamp(92px,15vmin,138px);border-radius:28px;background:linear-gradient(180deg,#fffdf6,#ffe9b8);border:4px solid #fff;box-shadow:0 7px 0 #c48a3c,0 10px 18px rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#5a3014;transition:transform .15s,opacity .3s;animation:popIn .35s backwards}
.opt .big{font-size:clamp(44px,7.5vmin,68px);line-height:1}
.opt .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:78%;margin-top:4px}
.opt .dots i{width:9px;height:9px;border-radius:50%;background:#e8590c}
.opt:active{transform:translateY(4px)}
.opt.no{opacity:.28;pointer-events:none;filter:grayscale(1)}
.opt.glow{box-shadow:0 7px 0 #c48a3c,0 0 0 6px #ffd43b,0 0 30px 10px rgba(255,212,59,.9);animation:pulse 1s infinite}
.opt.yes{background:linear-gradient(180deg,#d3f9d8,#8ce99a);box-shadow:0 7px 0 #2b8a3e,0 0 0 6px #fff}
.opt.zy .big{font-family:"PingFang TC","Heiti TC",var(--fnt)}
.leafpad{position:absolute;border-radius:50% 50% 46% 54%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 40%,#8fd06b,#4c9a35 70%,#357a24);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 6px 12px rgba(0,0,0,.2)}
.basket{position:absolute;border-radius:24px 24px 50% 50%/24px 24px 40% 40%;background:repeating-linear-gradient(90deg,#c98a45 0 12px,#b5763a 12px 24px);border:5px solid #8a5220;box-shadow:inset 0 10px 0 rgba(0,0,0,.12),0 8px 14px rgba(0,0,0,.25)}
.eq{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#5a3014;font-size:clamp(34px,6vmin,58px);letter-spacing:2px}
.eq b{color:#e8590c}
.bigAnimal{position:absolute;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3));transform-origin:50% 100%}
.teach{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 18px;box-shadow:0 6px 14px rgba(0,0,0,.18);border:3px solid var(--teal)}
.teach .ltr{font-size:clamp(46px,8vmin,74px);font-weight:900;color:var(--teal);line-height:1}
.teach img{height:clamp(60px,11vmin,100px)}
.clueCard{position:absolute;border-radius:50%;background:#fff;border:6px solid #fff;box-shadow:0 0 0 5px var(--gold),0 10px 24px rgba(0,0,0,.3);overflow:hidden}
.clueCard .ci{position:absolute;background-repeat:no-repeat}
.clueCard.shadow .ci{filter:brightness(0) opacity(.85)}
.clueCard.shadowBg{background:radial-gradient(circle,#fff6d8,#e9cf98)}
.clueCard .tag{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:28%;opacity:.9}
.lineup{position:absolute;left:12%;right:2%;display:flex;justify-content:center;align-items:flex-end;gap:3vw}
.suspect{position:relative;border-radius:26px;background:radial-gradient(ellipse at 50% 80%,#d7efb0,#fff8e6 70%);border:4px solid #fff;box-shadow:0 7px 0 #b98a4c,0 10px 18px rgba(0,0,0,.2);display:grid;place-items:end center;transition:opacity .3s,transform .2s}
.suspect img{width:84%;height:88%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 5px 4px rgba(0,0,0,.25))}
.suspect.no{opacity:.35;filter:grayscale(.8)}
.suspect.no::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:70px;color:#c92a2a;font-weight:900;opacity:.6}
.suspect.yes{box-shadow:0 7px 0 #2b8a3e,0 0 0 6px var(--gold),0 0 40px 10px rgba(255,212,59,.8)}

/* ---------- solve the mystery ---------- */
async function finalCase() {
  const k = S.kase; openPanel(); const {b, w, h} = pDims(); S.act = {type: 'final'};
  const cs = Math.min(h * .27, w * .2), cards = [];
  CLUE_ORDER.forEach((type, i) => {
    const c = el('div', 'clueCard ' + (type === 'shadow' ? 'shadow shadowBg' : ''), b, clueHTML(type, cs));
    placeAbs(c, w / 2 + (i - 1) * cs * 1.35 - cs / 2, h * .05, cs); cards.push(c);
    onTap(c, () => { bounce(c); AU.say(type === 'shadow' ? 'shadow' : type + '_' + k.culprit); });
  });
  const lineup = el('div', 'lineup', b); lineup.style.top = h * .42 + 'px'; lineup.style.height = h * .52 + 'px';
  const sus = shuffle([k.culprit].concat(k.decoys));
  const sh = h * .5, sw = Math.min(w * .26, sh * .95);
  const els = sus.map(a => { const s = el('button', 'suspect', lineup, '<img src="' + IMG(ANIMALS[a].img) + '" alt="' + a + '">'); s.style.width = sw + 'px'; s.style.height = sh + 'px'; s.dataset.a = a; return s; });
  addCoco(b);
  for (let i = 0; i < 3; i++) { if (!G.panelOpen) return; cards[i].classList.add('bounce'); AU.sfx('pop'); await wait(260); }
  AU.say('final_ask', {prompt: true});
  let misses = 0; S.act.correct = k.culprit;
  while (true) {
    const a = await new Promise(res => { els.forEach(s => s.onpointerdown = ev => { ev.stopPropagation(); ev.preventDefault(); AU.unlock(); G.poke(); res(s.dataset.a); }); S.act.answer = () => res(k.culprit); S.act.cancel = () => res(null); });
    if (a == null || !G.panelOpen) return;
    const s = els.find(x => x.dataset.a === a);
    try { window.KA && KA.answer({q: 'who did it (' + k.area + ')', given: a, expected: k.culprit, correct: a === k.culprit, tryNo: misses + 1, qid: 'final-' + k.area + '-' + k.culprit, topic: 'animals'}); } catch (e) {}
    if (a === k.culprit) { s.classList.add('yes'); AU.sfx('fanfare'); hop(s); break; }

    els.forEach(x => x.style.pointerEvents = 'none');
    await AU.say('notme_' + a); s.classList.add('no');

    if (misses >= 2) { const c = els.find(x => x.dataset.a === k.culprit); c.style.animation = 'pulse 1s infinite'; }

  const h = el('div', 'mHand drag', b, '👆'), x1 = r1.left - br.left + r1.width * .45, y1 = r1.top - br.top + r1.height * .5, x2 = r2.left - br.left + r2.width * .45, y2 = r2.top - br.top + r2.height * .5;

/* =========== 1. Feeding time: feed each animal the number it asks for =========== */
async function runFeed(sid) {
  const {b} = mDims(); M.done = false;
  const order = shuffle(AN_IDS).slice(0, 4);
  await mprompt('Feeding time! The animals are hungry. Tap the food to feed them!', '餵食時間到了!動物們肚子餓了,點食物餵牠們吃!');
  for (let r = 0; r < order.length; r++) {
    if (!alive(sid)) return;
    b.innerHTML = '';
    const id = order[r], A = AN[id], add = r >= 2;
    const n = add ? rnd(4, 9) : rnd(3, 7), a = add ? rnd(1, n - 1) : n, c = n - a;
    const an = animalImg(id, b, 'feedAn'); place(an, 8, 16, 52);
    anim(an, [{transform: 'translateX(-60%)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 500});
    const want = el('div', 'want', b); place(want, 40, 8);
    want.innerHTML = '<b>' + (add ? a + ' + ' + c : n) + '</b>'; thing(A.food, want);
    const tum = el('div', 'tummy', b); place(tum, 40, 34);
    const ok = el('button', 'okBtn', b, '✓'); place(ok, 80, 34);
    const bas = el('div', 'foodBasket', b); place(bas, 22, 70);
    for (let i = 0; i < 10; i++) thing(A.food, bas, 'src');
    let eaten = 0, miss = 0;
    const redrawTummy = () => {
      tum.innerHTML = '';
      for (let i = 0; i < Math.max(eaten, miss >= 2 ? n : 0); i++) { const s = el('div', 'slot' + (i < eaten ? ' full' : ' ghost'), tum); if (i < eaten) { thing(A.food, s); el('span', 'k', s, String(i + 1)); } }
    };
    redrawTummy();
    if (r === 0) handAt(bas.querySelector('.src'));
    let okT = 0;
    const feedOne = () => {
      if (eaten >= 10 || !alive(sid)) return;
      dropHands(); clearTimeout(okT); ok.classList.remove('glow'); okT = setTimeout(() => { if (alive(sid) && eaten) ok.classList.add('glow'); }, 3000);
      eaten++; AU.sfx('count'); redrawTummy(); hop(an); AU.say('num_' + eaten);
    };
    bas.querySelectorAll('.src').forEach(f => f.onpointerdown = ev => { ev.preventDefault(); ev.stopPropagation(); AU.unlock(); bounce(f); feedOne(); });
    const say1 = add
      ? [cap(A.en) + ' wants ' + a + ' ' + (a === 1 ? ({bananas: 'banana', berries: 'berry', apples: 'apple', leaves: 'leaf', carrots: 'carrot'}[A.fen] || A.fen) : A.fen) + ', and ' + c + ' more!', A.zh + '想吃' + a + A.mw + A.fzh + ',再' + c + A.mw + '!']
      : [cap(A.en) + ' wants ' + n + ' ' + A.fen + '!', A.zh + '想吃' + n + A.mw + A.fzh + '!'];
    mprompt(say1[0] + ' Then tap the check.', say1[1] + '餵好了就點勾勾。');
    M.solve = () => { eaten = n; redrawTummy(); ok.onpointerdown && ok.onpointerdown({preventDefault() {}, stopPropagation() {}}); };
    while (true) {
      const t = await tapWait([ok, an], sid);
      if (!t || !alive(sid)) return;
      clearTimeout(okT); ok.classList.remove('glow');
      try { window.KA && KA.answer({q: (add ? a + '+' + c : 'feed ' + n), given: eaten, expected: n, correct: eaten === n, tryNo: miss + 1, qid: 'feed-' + (add ? a + '+' + c : n), topic: add ? 'adding' : 'counting'}); } catch (e) {}
      if (eaten === n) {
        AU.sfx('ding'); hop(an); tum.querySelectorAll('.slot').forEach(s => anim(s, [{transform: 'scale(1)'}, {transform: 'scale(0)'}], {duration: 400}));
        await msay('Yum yum! Thank you!', '好好吃!謝謝你!'); starUp(); await wait(250); break;
      }
      miss++; wobble(an);
      if (eaten < n) await msay('Still hungry! More please!', '還好餓喔!再多一點!');
      else { await msay('Too full! Too many! Let\'s try again.', '太飽了!太多了!再試一次。'); eaten = 0; }
      redrawTummy();
      if (miss >= 2) mprompt('Fill every circle!', '把圓圈都放滿!');
    }
  }
  jobDone(sid);
}

/* =========== 2. Night zoo: move the flashlight, find N of one animal =========== */
async function runNight(sid) {
  const {b} = mDims(); M.done = false;
  $('#mini').classList.add('dark');
  const dark = el('div', 'darkness', b), eyesL = el('div', 'eyesLayer', b);
  const setLight = (x, y) => { dark.style.setProperty('--mx', x + 'px'); dark.style.setProperty('--my', y + 'px'); M.light = [x, y]; };
  const r0 = b.getBoundingClientRect(); setLight(r0.width / 2, r0.height / 2);
  const mv = ev => { const r = b.getBoundingClientRect(); setLight(ev.clientX - r.left, ev.clientY - r.top); };
  b.onpointermove = mv; b.onpointerdown = ev => { AU.unlock(); G.poke(); mv(ev); };
  await mprompt('Night zoo! It\'s dark. Move the flashlight to find the animals.', '晚上的動物園好暗喔!移動手電筒找動物。');
  const ns = [2, 3, 4];
  for (let r = 0; r < 3; r++) {
    if (!alive(sid)) return;
    b.querySelectorAll('.nAn,.eyes').forEach(e => e.remove());
    const target = pick(AN_IDS), n = ns[r], others = shuffle(AN_IDS.filter(x => x !== target)).slice(0, 3);
    const kinds = shuffle(Array(n).fill(target).concat(others));
    const cells = shuffle([[6, 18], [30, 14], [54, 18], [76, 14], [8, 52], [32, 56], [56, 50], [78, 54]]);
    const els = kinds.map((k, i) => {
      const [cx, cy] = cells[i], e = animalImg(k, b, 'nAn'); place(e, cx + rnd(-3, 3), cy + rnd(-3, 3), k === 'giraffe' ? 30 : 22);
      const ey = el('div', 'eyes', eyesL, '<i></i><i></i>'); ey.style.left = (cx + 6) + '%'; ey.style.top = (cy + 6) + '%'; ey.style.animationDelay = rnd(0, 2000) + 'ms'; e.eyes = ey;
      return e;
    });
    let found = 0;
    const lit = e => { const r = e.getBoundingClientRect(), br = b.getBoundingClientRect(), x = r.left - br.left + r.width / 2, y = r.top - br.top + r.height / 2, R = Math.min(br.width, br.height) * .26; return Math.hypot(x - M.light[0], y - M.light[1]) < R + r.width * .3; };
    const name = n + ' ' + AN[target].pl;
    mprompt('Find ' + name + '!', '找出' + n + '隻' + AN[target].zh + '!');
    if (r === 0) { const sweep = el('div', 'mHand sweep', b, '👆'); setTimeout(() => sweep.remove(), 5200); }
    M.solve = () => { const e = els.find(x => x.dataset.a === target && !x.found); if (e) { const r = e.getBoundingClientRect(), br = b.getBoundingClientRect(); setLight(r.left - br.left + r.width / 2, r.top - br.top + r.height / 2); e.onpointerdown({preventDefault() {}, stopPropagation() {}, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2}); } };
    await new Promise(res => {
      els.forEach(e => e.onpointerdown = ev => {
        ev.preventDefault(); ev.stopPropagation(); AU.unlock(); G.poke();
        if (ev.clientX != null) mv(ev);
        if (!lit(e) || e.found) return;
        if (e.dataset.a === target) {
          e.found = true; found++; e.classList.add('lit'); e.eyes.remove(); hop(e); AU.sfx('sparkle'); AU.say('num_' + found);
          if (found === n) setTimeout(res, FASTMODE ? 30 : 900);
        } else { wobble(e); AU.sfx('soft'); AU.say('name_' + e.dataset.a); }
      });
      M.cancel = () => res();
    });
    if (!alive(sid)) return;
    await msay('You found ' + name + '!', '你找到' + n + '隻' + AN[target].zh + '了!'); starUp();
  }
  dark.style.transition = 'opacity 1s'; dark.style.opacity = 0; eyesL.remove(); b.querySelectorAll('.nAn').forEach(e => e.classList.add('lit'));
  b.onpointermove = b.onpointerdown = null;
  jobDone(sid);
}

    }
  };
  M.solve = () => { const p = poops.find(x => x.style.pointerEvents !== 'none'); if (p) drop(p, homes.find(h => h.dataset.a === SZ[+p.dataset.s].id)); };
  poops.forEach(p => {
    p.home = [p.style.left, p.style.top];
    p.onpointerdown = ev => {
      ev.preventDefault(); ev.stopPropagation(); AU.unlock(); G.poke(); dropHands();
      const br = b.getBoundingClientRect(), ox = ev.clientX - p.getBoundingClientRect().left, oy = ev.clientY - p.getBoundingClientRect().top;
      let moved = false; p.style.transition = 'none'; p.classList.add('drag'); try { p.setPointerCapture(ev.pointerId); } catch (e) {}
      p.onpointermove = e2 => { moved = true; p.style.left = (e2.clientX - br.left - ox) + 'px'; p.style.top = (e2.clientY - br.top - oy) + 'px'; };
      p.onpointerup = e2 => {
        p.onpointermove = p.onpointerup = null; p.classList.remove('drag');
        if (!moved) { if (sel) sel.classList.remove('sel'); sel = p; p.classList.add('sel'); bounce(p); AU.sfx('tap'); return; }
        const h = homeAt(e2.clientX, e2.clientY);
        if (h) drop(p, h); else { p.style.transition = 'left .4s, top .4s'; p.style.left = p.home[0]; p.style.top = p.home[1]; }
      };
    };
  });
  homes.forEach(h => h.onpointerdown = ev => { ev.preventDefault(); ev.stopPropagation(); if (sel) { const p = sel; sel = null; p.classList.remove('sel'); drop(p, h); } else { hop(h.querySelector('.mAn')); AU.say('name_' + h.dataset.a); } });
  while (left > 0) { await wait(300); if (!alive(sid)) return; }
  await wait(600);
  if (!alive(sid)) return;
  await msay('All clean! Thank you, zookeeper!', '都乾淨了!謝謝你!');
  jobDone(sid);
}

/* =========== 4. Zookeeper says: hear a Chinese command, give the right thing to the right animal =========== */
const TOOLS = {
  food:   {pic: 'banana1', zh: a => '請餵' + a + '吃東西', en: a => 'Feed the ' + a + '!', ok: ['Yum yum!', '好好吃!']},
  sponge: {pic: 'sponge', zh: a => '請幫' + a + '洗澡', en: a => 'Give the ' + a + ' a bath!', ok: ['Splish splash! So clean!', '洗得好乾淨!']},
  heart:  {pic: 'heart', zh: a => '請抱抱' + a, en: a => 'Give the ' + a + ' a hug!', ok: ['I love you too!', '我也愛你!']},
  pillow: {pic: 'pillow', zh: a => '請讓' + a + '睡覺', en: a => 'Put the ' + a + ' to sleep!', ok: ['Zzz… good night!', '呼呼…晚安!']},
};
async function runKeeper(sid) {
  const {b} = mDims(); M.done = false;
  const ids = shuffle(AN_IDS).slice(0, 3);
  const ans = ids.map((id, i) => { const e = animalImg(id, b, 'kAn'); place(e, 6 + i * 31, 18, id === 'giraffe' ? 46 : 36); return e; });
  const bar = el('div', 'toolBar', b);
  const tools = Object.keys(TOOLS).map(k => { const t = el('button', 'tool', bar); t.dataset.t = k; thing(TOOLS[k].pic, t); return t; });
  let cur = null, selTool = null;
  const waitGive = () => new Promise(d => { cur = d; M.cancel = () => d(null); });
  const give = (tool, an) => { if (tool && an && cur) { const d = cur; cur = null; tools.forEach(x => x.classList.remove('sel')); selTool = null; d([tool.dataset.t, an.dataset.a, tool, an]); } };
  tools.forEach(t => t.onpointerdown = ev => {
    ev.preventDefault(); ev.stopPropagation(); AU.unlock(); G.poke();
    const br = b.getBoundingClientRect(), r0 = t.getBoundingClientRect();
    const ghost = el('div', 'ghost', b); ghost.innerHTML = t.innerHTML; Object.assign(ghost.style, {left: r0.left - br.left + 'px', top: r0.top - br.top + 'px', width: r0.width + 'px', height: r0.height + 'px'});
    let moved = false; try { t.setPointerCapture(ev.pointerId); } catch (e) {}
    t.onpointermove = e2 => { if (Math.abs(e2.clientX - ev.clientX) + Math.abs(e2.clientY - ev.clientY) > 8) moved = true; ghost.style.left = (e2.clientX - br.left - r0.width / 2) + 'px'; ghost.style.top = (e2.clientY - br.top - r0.height / 2) + 'px'; };
    const up = e2 => {
      t.onpointermove = t.onpointerup = t.onpointercancel = null; ghost.remove();
      if (!moved) { tools.forEach(x => x.classList.remove('sel')); selTool = t; t.classList.add('sel'); bounce(t); AU.sfx('tap'); return; }
      const an = ans.find(a => { const r = a.getBoundingClientRect(); return e2.clientX > r.left && e2.clientX < r.right && e2.clientY > r.top && e2.clientY < r.bottom; });
      give(t, an);
    };
    t.onpointerup = up; t.onpointercancel = () => { t.onpointermove = t.onpointerup = t.onpointercancel = null; ghost.remove(); };
  });
  ans.forEach(a => a.onpointerdown = ev => { ev.preventDefault(); ev.stopPropagation(); AU.unlock(); G.poke(); if (selTool) give(selTool, a); else { hop(a); AU.say('name_' + a.dataset.a); } });
  await msay('Zookeeper says! Listen carefully, then drag the right thing to the right animal.', '管理員說!仔細聽,再把東西拖到對的動物身上。');
  let last = '';
  for (let r = 0; r < 5; r++) {
    if (!alive(sid)) return;
    let id, tk; do { id = pick(ids); tk = pick(Object.keys(TOOLS)); } while (id + tk === last); last = id + tk;
    const T = TOOLS[tk], zh = T.zh(AN[id].zh), en = T.en(AN[id].en);
    const speak = async withEn => { cap2(en, zh); await AU.raw(zh, 'zh'); if (withEn && DB.lang !== 'zh' && alive(sid)) await AU.raw(en, 'en'); };
    M.last = null; M.replay = () => speak(false); M.altText = () => [en, 'en'];
    M.solve = () => give(tools.find(x => x.dataset.t === tk), ans.find(x => x.dataset.a === id));
    speak(false);
    if (r === 0) setTimeout(() => { if (alive(sid) && cur) handDrag(tools.find(x => x.dataset.t === tk), ans.find(x => x.dataset.a === id)); }, 1200);
    let miss = 0, v = await waitGive(), hit = null; dropHands();
    while (v && alive(sid)) {
      const [t, a, , aEl] = v;
      try { window.KA && KA.answer({q: zh, given: t + ' > ' + a, expected: tk + ' > ' + id, correct: t === tk && a === id, tryNo: miss + 1, qid: 'keeper-' + tk + '-' + id, topic: 'chinese listening'}); } catch (e) {}
      if (t === tk && a === id) { hit = aEl; break; }
      miss++; AU.sfx('soft'); wobble(aEl);
      await msay('Hmm, listen again!', '嗯…再聽一次!'); if (!alive(sid)) return;
      if (miss >= 2) { tools.find(x => x.dataset.t === tk).classList.add('glow'); ans.find(x => x.dataset.a === id).classList.add('glow'); }
      speak(miss >= 2);
      v = await waitGive();
    }
    if (!hit || !alive(sid)) return;
    M.replay = null;
    b.querySelectorAll('.glow').forEach(x => x.classList.remove('glow'));
    await react(tk, hit, b);
    await msay(T.ok[0], T.ok[1]); starUp();
  }
  jobDone(sid);
}
async function react(tk, aEl, b) {
  const r = aEl.getBoundingClientRect(), br = b.getBoundingClientRect(), cx = r.left - br.left + r.width / 2, cy = r.top - br.top + r.height * .35;
  const fx = (cls, txt, n) => { for (let i = 0; i < n; i++) { const e = el('div', 'fxp ' + cls, b, txt); e.style.left = cx + rnd(-r.width * .4, r.width * .4) + 'px'; e.style.top = cy + rnd(-20, r.height * .4) + 'px'; e.style.animationDelay = i * 110 + 'ms'; setTimeout(() => e.remove(), 2200); } };
  if (tk === 'food') { AU.sfx('count'); hop(aEl); setTimeout(() => hop(aEl), 300); fx('crumb', '✨', 4); }
  if (tk === 'sponge') { AU.sfx('splash'); fx('bubble', '', 12); wobble(aEl); }
  if (tk === 'heart') { AU.sfx('sparkle'); fx('heartP', '❤', 7); hop(aEl); }
  if (tk === 'pillow') { AU.sfx('soft'); fx('zzz', 'Z', 3); anim(aEl, [{transform: 'rotate(0)'}, {transform: 'rotate(-8deg)'}, {transform: 'rotate(0)'}], {duration: 1600, fill: 'none'}); }
  await wait(900);
}
