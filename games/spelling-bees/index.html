<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Bees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4d6;--ink:#1d1b2e;--card:#ffffff;--line:#1d1b2e;--muted:#5b5670;--soft:#f1e6c8;
--purple:#7048e8;--orange:#f76707;--kid:#7048e8;--blue:#1c7ed6;--red:#e03131;--gold:#f5b301;--green:#2f9e44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1730;--ink:#f4f1ff;--card:#28243f;--line:#05040c;--muted:#bcb5da;--soft:#332e52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1730;--ink:#f4f1ff;--card:#28243f;--line:#05040c;--muted:#bcb5da;--soft:#332e52;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.lucas{--kid:#f76707}
.disp{font-family:Bungee,"Arial Black",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:52px;padding:0 20px;border:3px solid var(--line);border-radius:14px;background:var(--gold);color:#1d1b2e;font-family:Bungee,"Arial Black",Impact,sans-serif;font-size:18px;box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:900;font-size:16px}
.btn.kid{background:var(--kid);color:#fff}
.btn:focus-visible,.key:focus-visible,.mcard:focus-visible,.who:focus-visible{outline:3px solid var(--kid);outline-offset:3px}
/* intro */
#intro{flex-direction:column;background:#ffb703}
#intro svg{width:100%;height:100%;display:block;overflow:hidden}
#startBtn{position:absolute;left:70%;bottom:9%;transform:translateX(-50%);font-size:24px;min-height:64px;padding:0 32px}
#startBtn:active{transform:translate(-50%,3px)}
/* who's playing */
#pick{flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow-y:auto}
#pick h1{margin:0;font-size:clamp(26px,5vw,40px);text-align:center}
.whos{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.who{width:min(260px,42vw);min-height:220px;border:4px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.who:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.who svg{width:130px;height:130px}
.who b{font-family:Bungee,"Arial Black",sans-serif;font-weight:400;font-size:26px;color:#fff;padding:2px 18px;border-radius:999px;border:3px solid var(--line)}
.who span{font-size:15px;color:var(--muted)}
/* menu */
#menu{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mwrap{max-width:980px;width:100%;margin:0 auto;padding:18px 16px 28px}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mhead svg{width:76px;height:76px;flex:none}
.mhead h1{margin:0;font-size:clamp(22px,4.4vw,34px);line-height:1.05}
.mhead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.review{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--kid);color:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--line);margin-bottom:18px}
.review b{font-family:Bungee,"Arial Black",sans-serif;font-weight:400;font-size:20px;display:block}
.review span{font-size:15px;opacity:.95}
.review .btn{flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mcard{text-align:left;background:var(--card);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:12px 14px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.mcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mcard .t{font-family:Bungee,"Arial Black",sans-serif;font-weight:400;font-size:17px;line-height:1.15}
.mcard .ex{color:var(--muted);font-size:14px}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px;-webkit-text-stroke:1px var(--line)}
.stars .off{color:transparent}
.bar{height:10px;border-radius:6px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.mcard .st{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mfoot{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
/* play */
#play{flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px;height:58px;flex:none}
.top .mname{font-family:Bungee,"Arial Black",sans-serif;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dots i.g{background:var(--green)}.dots i.h{background:var(--gold)}.dots i.m{background:var(--red)}.dots i.c{background:var(--kid)}
.score{font-family:Bungee,"Arial Black",sans-serif;font-size:16px;min-width:40px;text-align:right}
.ibtn{width:48px;height:48px;border:3px solid var(--line);border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.ibtn svg{width:24px;height:24px}
.stage{flex:1;min-height:0;position:relative;background:linear-gradient(#ffd166 50%,#2f9e44 50%)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.panel{flex:none;padding:8px 10px 10px;max-width:760px;width:100%;margin:0 auto}
.clue{font-size:16px;color:var(--muted);text-align:center;min-height:22px;margin-bottom:6px;line-height:1.3}
.clue em{font-style:normal;color:var(--kid)}
.arow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.answer{flex:1;min-width:0;min-height:56px;border:3px solid var(--line);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;letter-spacing:.06em;overflow:hidden;white-space:nowrap;padding:4px}
.answer.boxes{background:transparent;border-color:transparent;gap:4px;letter-spacing:0}
.slot{flex:1 1 0;max-width:46px;min-width:0;height:48px;border:3px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.slot.now{border-color:var(--kid);box-shadow:0 0 0 3px var(--kid) inset}
.slot.fix{background:var(--gold);color:#1d1b2e}
.answer .caret{display:inline-block;width:3px;height:30px;background:var(--kid);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.answer.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#shoot{min-height:56px;font-size:20px;background:var(--blue);color:#fff}
.hear{display:flex;gap:8px;margin-bottom:8px}
.hear .btn{flex:1;min-height:48px;font-size:15px;padding:0 10px}
#helpBtn{background:#fff3bf;color:#1d1b2e}
.kb{display:flex;flex-direction:column;gap:6px;touch-action:manipulation}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:64px;height:50px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:22px;font-weight:900;box-shadow:0 3px 0 var(--line);padding:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key.wide{flex:1.6 1 0;max-width:96px;font-size:18px}
/* overlays in stage */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(10,8,25,.45)}
.ov.on{display:flex}
.card{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:16px 18px;max-width:440px;width:100%;text-align:center}
.card h2{margin:0 0 6px;font-family:Bungee,"Arial Black",sans-serif;font-weight:400;font-size:22px}
.card p{margin:6px 0;font-size:17px;line-height:1.4}
.card .big{font-size:38px;font-weight:900;letter-spacing:.04em;color:var(--kid);margin:6px 0}
.card .btn{margin-top:10px}
#result,#brk{align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#result .card,#brk .card{max-width:520px}
.rstars{font-size:52px;color:var(--gold);-webkit-text-stroke:2px var(--line);letter-spacing:6px}
.rstars .off{color:transparent}
.tip{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:16px;text-align:left;margin-top:10px}
.bt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#gate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,25,.55);padding:16px;z-index:5}
#gate.on{display:flex}
#gate input[type=text]{font:inherit;font-size:26px;width:180px;text-align:center;border:3px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)}
.chk{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;min-height:48px}
.chk input{width:26px;height:26px}
.err{color:var(--red);font-size:15px;min-height:20px}
#rotate{display:none}
@media (orientation:portrait) and (max-width:600px){
 body.playing #rotate{display:flex;position:absolute;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:20px}
}
@media (orientation:landscape) and (max-height:540px){
 #play.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);grid-template-rows:auto minmax(0,1fr)}
 #play .top{grid-column:1/3;height:52px}
 #play .stage{grid-row:2;grid-column:1}
 #play .panel{grid-row:2;grid-column:2;overflow:auto;padding-top:0;display:flex;flex-direction:column;justify-content:center}
 .key{height:44px;font-size:20px}
 .answer{min-height:48px;font-size:26px}
 .slot{height:42px;font-size:22px}
 #shoot{min-height:48px}
 .hear .btn{min-height:44px;font-size:14px}
 .clue{margin-bottom:4px;font-size:14px;min-height:18px}
}
@media (prefers-reduced-motion:reduce){.answer .caret{animation:none}.answer.shake{animation:none}}
</style>
</head>
<body>
<div id="app">

<section id="intro" class="screen on" aria-label="Opening">
<svg id="isvg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
 <rect width="800" height="450" fill="#ffb703"/>
 <g id="rays" transform="translate(560 190)"></g>
 <g id="speed" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0">
  <line x1="-40" y1="250" x2="140" y2="250"/><line x1="0" y1="290" x2="220" y2="290"/><line x1="-30" y1="320" x2="120" y2="320"/><line x1="40" y1="215" x2="180" y2="215"/>
 </g>
 <rect y="362" width="800" height="90" fill="#2f9e44"/>
 <rect y="362" width="800" height="8" fill="#237a33"/>
 <g id="nsBack"></g>
 <g id="nsFront"></g>
 <g id="ib"><circle r="15" fill="#fff" stroke="#000" stroke-width="4"/><path d="M-5,-5 L5,-5 L7,4 L0,9 L-7,4Z" fill="#1d1b2e"/></g>
 <g id="ishout" opacity="0" transform="translate(150 120)">
  <path d="M-80,-30 L-56,-48 L-34,-34 L-8,-56 L10,-36 L40,-52 L52,-28 L84,-30 L68,-6 L90,12 L60,20 L64,46 L34,34 L10,56 L-8,34 L-40,50 L-44,24 L-82,22 L-62,0 Z" fill="#fff" stroke="#1d1b2e" stroke-width="5" stroke-linejoin="round"/>
  <text id="ishoutT" y="10" text-anchor="middle" font-family="Bungee,Arial Black,Impact,sans-serif" font-size="28" fill="#7048e8">Nora!</text>
 </g>
 <g id="ttl" opacity="0" transform="translate(560 190)">
  <text y="-28" text-anchor="middle" font-family="Bungee,Arial Black,Impact,sans-serif" font-size="70" fill="#fff" stroke="#1d1b2e" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Spelling</text>
  <text y="52" text-anchor="middle" font-family="Bungee,Arial Black,Impact,sans-serif" font-size="70" fill="#1c7ed6" stroke="#1d1b2e" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Bees</text>
 </g>
</svg>
<button id="startBtn" class="btn">▶ Tap to start</button>
</section>

<section id="pick" class="screen" aria-label="Who’s playing">
 <h1 class="disp">Who’s playing?</h1>
 <div class="whos">
  <button class="who" data-kid="nora"><svg viewBox="-60 -190 120 120" aria-hidden="true"><g class="face-nora"></g></svg><b style="background:#7048e8">Nora</b><span id="pickNora"></span></button>
  <button class="who" data-kid="lucas"><svg viewBox="-60 -195 120 125" aria-hidden="true"><g class="face-lucas"></g></svg><b style="background:#f76707">Lucas</b><span id="pickLucas"></span></button>
 </div>
</section>

<section id="menu" class="screen" aria-label="Missions">
<div class="mwrap">
 <div class="mhead"><svg viewBox="-60 -195 120 125" aria-hidden="true"><g id="mface"></g></svg>
  <div><h1 class="disp" id="mtitle"></h1><p id="msub"></p></div></div>
 <div class="review"><div><b id="revT">Review</b><span id="revS"></span></div><button class="btn" id="revBtn">Play review</button></div>
 <div class="grid" id="grid"></div>
 <div class="mfoot"><button class="btn ghost" id="switchBtn">Switch player</button><button class="btn ghost" id="boxBtn"></button><button class="btn ghost" id="sndM"></button><button class="btn ghost" id="resetBtn">Reset records</button></div>
</div>
</section>

<section id="play" class="screen" aria-label="Penalty kick">
 <div class="top">
  <button class="ibtn" id="homeBtn" aria-label="Back to missions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <div class="mname" id="mname"></div>
  <div class="dots" id="dots"></div>
  <div class="score" id="score">0</div>
  <button class="ibtn" id="sndP" aria-label="Sound"></button>
 </div>
 <div class="stage">
  <svg id="scene" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
   <defs><clipPath id="vbclip" clipPathUnits="userSpaceOnUse"><rect width="800" height="420"/></clipPath><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f5b301" flood-opacity="1"/></filter></defs>
   <rect width="800" height="420" fill="#ffd166"/>
   <g clip-path="url(#vbclip)"><g id="srays" transform="translate(400 30)"></g></g>
   <rect y="50" width="800" height="60" fill="#3b3560"/>
   <g id="crowd" clip-path="url(#vbclip)"></g>
   <rect y="110" width="800" height="310" fill="#2f9e44"/>
   <g fill="#37a84c"><rect y="160" width="800" height="40"/><rect y="240" width="800" height="40"/><rect y="320" width="800" height="40"/></g>
   <path d="M140,230 L660,230 L720,380 L80,380 Z" fill="none" stroke="#fff" stroke-width="4" opacity=".9"/>
   <line x1="0" y1="230" x2="800" y2="230" stroke="#fff" stroke-width="4" opacity=".9"/>
   <rect x="250" y="96" width="300" height="134" fill="#ffffff" fill-opacity=".22"/>
   <g stroke="#ffffff" stroke-opacity=".55" stroke-width="1.5" id="net"></g>
   <path d="M250,230 L250,96 L550,96 L550,230" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
   <circle cx="420" cy="368" r="4" fill="#fff"/>
   <g id="keeper" transform="translate(400 232)"><g id="kbody"></g></g>
   <g id="me" transform="translate(214 410) scale(1.12)"></g>
   <g id="ball" transform="translate(420 362)"><circle r="14" fill="#fff" stroke="#000" stroke-width="3.5"/><path d="M-5,-5 L5,-5 L7,4 L0,9 L-7,4Z" fill="#1d1b2e"/></g>
   <g id="badge"></g>
   <g id="burst" opacity="0" transform="translate(400 160)">
    <text id="bt1" text-anchor="middle" font-family="Bungee,Arial Black,Impact,sans-serif" font-size="74" fill="#f5b301" stroke="#1d1b2e" stroke-width="10" paint-order="stroke" stroke-linejoin="round">GOAL!</text>
    <text id="bt2" y="44" text-anchor="middle" font-family="Bungee,Arial Black,Impact,sans-serif" font-size="30" fill="#fff" stroke="#1d1b2e" stroke-width="7" paint-order="stroke" stroke-linejoin="round"></text>
   </g>
  </svg>
  <div class="ov" id="preOv"><div class="card"><h2 id="preT"></h2><p id="preR"></p><p style="color:var(--muted);font-size:15px" id="preHow"></p><button class="btn" id="kickoff">Kick off ▶</button></div></div>
  <div class="ov" id="revOv"><div class="card"><h2>Saved twice</h2><p>The word is</p><div class="big" id="revW"></div><p id="revWhy"></p><p style="color:var(--muted);font-size:15px">This word will come back so you can score it next time.</p><button class="btn" id="revNext">Next kick ▶</button></div></div>
  <div class="ov" id="doneOv"><div class="card"><h2 id="doneT"></h2><p id="doneP"></p><button class="btn" id="doneBtn">Back to missions</button></div></div>
 </div>
 <div class="panel">
  <div class="clue" id="clue"></div>
  <div class="hear"><button class="btn ghost" id="hearAll">🔊 Sentence</button><button class="btn ghost" id="hearWord">🔊 Word</button><button class="btn ghost" id="helpBtn">💡 Give me a letter</button></div>
  <div class="arow"><div class="answer" id="answer" aria-live="polite"></div><button class="btn" id="shoot">Shoot</button></div>
  <div class="kb" id="kb"></div>
 </div>
</section>

<section id="result" class="screen" aria-label="Mission result">
 <div class="card">
  <h2 id="resT"></h2>
  <div class="rstars" id="resS"></div>
  <p id="resP"></p>
  <p id="resMiss" style="color:var(--muted)"></p>
  <div class="tip" id="resTip"></div>
  <div class="bt"><button class="btn" id="nextBtn"></button><button class="btn ghost" id="menuBtn">Missions</button></div>
 </div>
</section>

<section id="brk" class="screen" aria-label="Break">
 <div class="card"><h2>Great practice! Time for a break</h2><p id="brkP"></p><button class="btn" id="finishBtn">Finish for now</button></div>
</section>

<div id="gate" role="dialog" aria-modal="true" aria-label="Parent check">
 <div class="card">
  <h2>Parent check</h2>
  <div id="g1"><p id="gq"></p><input type="text" id="ga" inputmode="numeric" autocomplete="off" aria-label="Answer"><div class="err" id="gerr"></div>
   <div class="bt"><button class="btn" id="gok">Check</button><button class="btn ghost" id="gx1">Cancel</button></div></div>
  <div id="g2" style="display:none"><p>Choose whose records to clear on this device. This clears stars, mastered words, review words and settings.</p>
   <label class="chk"><input type="checkbox" id="gNora"> Nora</label><label class="chk"><input type="checkbox" id="gLucas"> Lucas</label><div class="err" id="gerr2"></div>
   <div class="bt"><button class="btn kid" id="gdo">Reset</button><button class="btn ghost" id="gx2">Cancel</button></div></div>
 </div>
</div>

<div id="rotate"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 9a9 9 0 0 1 3-5"/><path d="M3 4v5h5"/></svg><div class="disp">Turn your phone sideways</div><div style="color:var(--muted)" id="rotP"></div></div>
</div>

<script src="../../tracker.js" data-game="spelling-bees"></script>
<script>
"use strict";
// ==== Word banks. word|sentence|note(optional)
const M=[
{n:'Long a',ex:'ai, ay, a_e, eigh, ey',rule:'Long a is often spelled ai in the middle of a word, ay at the end, or a-consonant-e.',tip:'Try it today: find three ai or ay words in the book you’re reading.',w:`
explain|Can you explain how you solved it?
remain|Please remain in your seat.
display|Her art is on display in the hall.
mistake|Everyone makes a mistake sometimes.
delay|The rain caused a delay in the game.
complain|She did not complain about the cold.
escape|The puppy tried to escape from the yard.
sailor|The sailor tied a strong knot.
holiday|Our favorite holiday is in the winter.
stain|Juice left a stain on her shirt.
crayon|She picked a purple crayon.
grateful|I am grateful for my friends.
parade|The parade marched down the street.
afraid|She was not afraid of the dark.
railway|The railway runs along the river.
basement|We keep the bikes in the basement.
neighbor|Our neighbor waters her garden every day.|eigh can also spell long a: n-eigh-bor.

 if(mi<0)return shuffle(ALLW(KID).filter(isDue)).slice(0,KICKS);

 if(KID!=='nora')return pickFrom(w,KICKS);

 let h=hard.slice(0,KICKS/2),e=easy.slice(0,KICKS/2);
 if(h.length<KICKS/2)e=easy.slice(0,KICKS-h.length);
 if(e.length<KICKS/2)h=hard.slice(0,KICKS-e.length);
 const out=[],order=Math.random()<.5?[h,e]:[e,h];
 while(h.length||e.length)order.forEach(a=>{if(a.length)out.push(a.shift())});
 return out.slice(0,KICKS)}

function typeKey(ch){if(!G||G.stage!=='kick'||G.busy)return;
 if(boxes()){if(ch==='back'){for(let i=G.slots.length-1;i>=0;i--){const s=G.slots[i];if(!s.fix&&s.ch){s.ch='';break}}}else{const i=G.slots.findIndex(s=>!s.fix&&!s.ch);if(i<0)return;G.slots[i].ch=ch}}

 if(boxes()){p=G.slots.findIndex((s,i)=>!s.fix&&norm(s.ch)!==norm(ans[i]));if(p<0)p=G.slots.findIndex(s=>!s.fix);if(p<0)return false;G.slots[p]={ch:ans[p],fix:true}}
 else{const t=G.typed;p=0;while(p<ans.length&&p<t.length&&norm(t[p])===norm(ans[p]))p++;if(p>=ans.length)return false;G.typed=t.slice(0,p)+ans[p];G.hintMsg=`Letter ${p+1} is “${pretty(ans[p])}”.`}

  else{G.max+=2;record(c,false);G.marks[G.i]='m';renderPanel();

// A word is retired only when scored on the first try with no letter given. Anything else comes back.
function record(c,clean){
 const id=c.w.id,s=ws(id),t=today(),W=KD().w;
 if(clean){
  if(s.s==='n')W[id]={s:'m',k:0,d:0};
  else if(s.s==='l'){const k=s.k+1;W[id]=k>=2?{s:'m',k:0,d:0}:{s:'l',k,d:t+1}}
 }else{
  if(!G.missed.includes(c.w.w))G.missed.push(c.w.w);
  const canReb=!c.reb&&G.rebounds<REBOUND_MAX;
  W[id]={s:'l',k:0,d:canReb?t:t+1};
  if(canReb){G.rebounds++;G.queue.push({w:c.w,reb:true})}
 }
 save();
}

  ()=>{if(!goal)$('#ball').setAttribute('transform',`translate(${(400+kdir*(Math.abs(tx-400)-10)).toFixed(1)} ${(ty+18).toFixed(1)}) scale(.62)`);done()});
}
function burst(a,b){$('#bt1').textContent=a;$('#bt1').setAttribute('fill',a==='GOAL!'?'#f5b301':'#ff6b6b');$('#bt2').textContent=b;const g=$('#burst');g.setAttribute('opacity','1');tween(260,k=>g.setAttribute('transform',`translate(400 160) scale(${(1.6-.6*k).toFixed(3)})`))}

// ==== Finish, result, break
function nextMissionIndex(from){const n=BANK().length;for(let j=1;j<=n;j++){const i=((from<0?-1:from)+j)%n;const st=mStat(i);if(st.due+st.fresh>0)return i}return -1}
function finish(){
 const k=KIDS[KID],pct=G.max?G.score/G.max:0,stars=pct>=.9?3:pct>=.7?2:1;
 if(G.mi>=0)KD().stars[G.mi]=Math.max(KD().stars[G.mi]||0,stars);
 const row=KD().row,now=Date.now();if(now-row.t>30*60*1000)row.n=0;row.n++;row.t=now;save();
 G.stage='done';
 if(row.n>=3){$('#brkP').textContent=`Three missions in a row, ${k.name}. Your brain grows while you rest.`;show('brk');return}
 $('#resT').textContent=G.mi<0?'Review complete':`${BANK()[G.mi].n} complete`;
 $('#resS').innerHTML=starsHTML(stars);
 $('#resP').textContent=`${k.name} scored ${G.score} of ${G.max} points.`;
 $('#resMiss').textContent=G.missed.length?`Coming back for practice: ${G.missed.map(pretty).join(', ')}.`:'Every word scored on the first try with no help!';
 $('#resTip').textContent=G.mi<0?'Try it today: write your two hardest words on a sticky note and spell them out loud before bed.':BANK()[G.mi].tip;
 const nx=nextMissionIndex(G.mi),nb=$('#nextBtn');
 if(nx>=0){nb.style.display='';nb.textContent=`Next: ${BANK()[nx].n} ▶`;nb.onclick=()=>startMission(nx)}else nb.style.display='none';
 show('result');
}
$('#menuBtn').addEventListener('click',openMenu);
$('#finishBtn').addEventListener('click',()=>{KD().row={n:0,t:0};save();G=null;$('#startBtn').style.display='';introPoster();show('intro')});

// ==== Parent gate and reset
let gA=0;
function newQ(){const a=100+Math.floor(Math.random()*900),b=10+Math.floor(Math.random()*90);gA=a*b;$('#gq').textContent=`What is ${a} × ${b}?`;$('#ga').value=''}
$('#resetBtn').addEventListener('click',()=>{newQ();$('#gerr').textContent='';$('#g1').style.display='';$('#g2').style.display='none';$('#gNora').checked=false;$('#gLucas').checked=false;$('#gate').classList.add('on');setTimeout(()=>$('#ga').focus(),50)});
$('#gok').addEventListener('click',()=>{const v=$('#ga').value.trim();if(!v){$('#gerr').textContent='Enter an answer first.';return}if(parseInt(v,10)===gA){$('#g1').style.display='none';$('#g2').style.display='';$('#gerr2').textContent=''}else{$('#gerr').textContent='Not quite. Here’s a new one.';newQ()}});
$('#ga').addEventListener('input',()=>$('#gerr').textContent='');
$('#ga').addEventListener('keydown',e=>{if(e.key==='Enter')$('#gok').click()});
$('#gdo').addEventListener('click',()=>{const n=$('#gNora').checked,l=$('#gLucas').checked;if(!n&&!l){$('#gerr2').textContent='Tick a name first.';return}if(n)DB.kids.nora=kidFresh();if(l)DB.kids.lucas=kidFresh();save();$('#gate').classList.remove('on');openMenu()});
['#gNora','#gLucas'].forEach(s=>$(s).addEventListener('change',()=>$('#gerr2').textContent=''));
['#gx1','#gx2'].forEach(s=>$(s).addEventListener('click',()=>$('#gate').classList.remove('on')));

// ==== Boot
buildArt();buildKidArt();introPoster();drawSnd();

// Expose for automated playtests. Harmless for players.
window.__test={
 state:()=>({screen:CUR,kid:KID,round:G?G.i+1:0,stage:G?G.stage:null,done:CUR==='result'||CUR==='brk',word:G&&cur()?cur().w.w:null,score:G?G.score:0,queue:G?G.queue.length:0,value:G?value():'',slots:G?G.slots.map(s=>(s.fix?'*':'')+s.ch):[]}),
 solve:()=>{if(CUR==='play'&&G){if(G.stage==='pre')startKicks();if(G.stage==='reveal'){$('#revNext').click();return}if(G.stage==='kick'&&!G.busy){const a=cur().w.w;if(boxes())G.slots.forEach((s,i)=>{if(!s.fix)s.ch=a[i].toLowerCase()});else G.typed=a.toLowerCase();submit()}}else if(CUR==='result'){$('#nextBtn').click()}},
 miss:()=>{if(CUR==='play'&&G&&G.stage==='kick'&&!G.busy){if(boxes())G.slots.forEach(s=>{if(!s.fix)s.ch='z'});else G.typed='zzzz';submit()}},
 help:()=>giveLetter(false),
 type:s=>[...s].forEach(typeKey),
 kid:k=>{KID=k;buildKidArt()},
 start:(k,mi)=>{KID=k;startMission(mi)},
 shiftDay:n=>{dayShift+=n},
 db:()=>JSON.parse(JSON.stringify(DB)),
 bank:k=>KIDS[k].bank.map(m=>m.words.map(w=>({w:w.w,easy:w.easy,blank:blankOut(w.s,w.w)})))
};

</script>
</body>
