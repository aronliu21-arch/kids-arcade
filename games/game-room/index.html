<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>遊戲間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&family=Press+Start+2P&display=swap">
<script src="../../tracker.js" data-game="game-room"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
/* Layout concept: a sports-anime league hub. Each kid opens their own arena:
   Nora = neon arcade, Lucas = pixel adventure, Milo = paper-craft dino park. */
:root{
  --ink:#16132b; --paper:#fffaf0; --team:#1c7ed6; --red:#e03131; --gold:#fcc419;
  --nora:#7048e8; --lucas:#f76707; --milo:#2f9e44; --ok:#2b8a3e; --bad:#c92a2a;
  --h:'Bangers','Impact',sans-serif; --b:'Nunito',system-ui,-apple-system,sans-serif; --px:'Press Start 2P',monospace;
  --bg:#12306f; --card:#ffffff; --fg:#16132b; --muted:#5b5780; --acc:#f76707; --acc2:#fcc419; --line:#16132b; --chip:#eef3ff;
}
body[data-k="nora"]{--bg:#150f2e;--card:#241a4d;--fg:#f3eeff;--muted:#b9a9f0;--acc:#7048e8;--acc2:#b197fc;--line:#b197fc;--chip:#33266b}
body[data-k="lucas"]{--bg:#fff1dc;--card:#ffffff;--fg:#3b2a1a;--muted:#7a5a3a;--acc:#f76707;--acc2:#ffd43b;--line:#3b2a1a;--chip:#ffe8cc}
body[data-k="milo"]{--bg:#e3f3d0;--card:#fffdf4;--fg:#27431f;--muted:#4f7a3d;--acc:#2f9e44;--acc2:#ffd43b;--line:#9cc97f;--chip:#d3ecb9}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b);font-weight:700;min-height:100vh;min-height:100dvh;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body[data-k="hub"]{background:radial-gradient(circle at 50% 0,#2b59c9,#12306f 70%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.pill{min-height:48px;min-width:48px;padding:6px 14px;border-radius:999px;border:3px solid var(--line);background:var(--card);font-weight:900;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.pill.on{background:var(--acc2);color:#16132b}
h1,h2,h3{margin:0;text-wrap:balance}
.title{font-family:var(--h);letter-spacing:2px;font-weight:400}
body[data-k="lucas"] .title,body[data-k="lucas"] .gtitle{font-family:var(--px);letter-spacing:0;line-height:1.5}
.btn{min-height:56px;padding:10px 22px;border-radius:16px;border:4px solid #16132b;background:var(--acc);color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 #16132b}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #16132b}
.btn.alt{background:var(--card);color:var(--fg)}
.btn.big{font-size:26px;padding:14px 30px}
body[data-k="nora"] .btn{border-color:#d0bfff;box-shadow:0 0 18px #7048e8,0 5px 0 #3b2a85}
body[data-k="milo"] .btn{border:3px dashed #fff;box-shadow:0 6px 0 #1f7a34;border-radius:28px}

/* hub */
.hero{text-align:center;color:#fff;padding:6px 0}
.hero .title{font-size:clamp(38px,9vw,72px);color:#ffd43b;text-shadow:3px 3px 0 #16132b,-2px -2px 0 #16132b,2px -2px 0 #16132b,-2px 2px 0 #16132b;margin:0}
.hero p{margin:4px 0 0;font-size:18px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.player{position:relative;overflow:hidden;border:5px solid #16132b;border-radius:10px 28px 10px 28px;padding:14px;text-align:left;color:#fff;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:6px 6px 0 #16132b}
.player::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 70% 40%,rgba(255,255,255,.18) 0 6deg,transparent 6deg 14deg)}
.player>*{position:relative}
.player .av{position:absolute;right:6px;top:6px;width:150px}
.player .num{font-family:var(--h);font-size:70px;line-height:.9;color:rgba(255,255,255,.9);text-shadow:3px 3px 0 #16132b}
.player .nm{font-family:var(--h);font-size:40px;letter-spacing:2px;text-shadow:2px 2px 0 #16132b}
.player .st{font-size:18px}
.player.nora{background:linear-gradient(135deg,#7048e8,#a56bff)}
.player.lucas{background:linear-gradient(135deg,#f76707,#ffa94d)}
.player.milo{background:linear-gradient(135deg,#2f9e44,#8ce99a)}
.foot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.foot .btn{font-size:16px;min-height:48px;box-shadow:0 3px 0 #16132b}

/* avatars */
.me{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.me svg{width:125px;height:150px;filter:drop-shadow(0 0 3px #fcc419) drop-shadow(0 0 12px #fcc419)}
.badge{margin-top:-6px;padding:4px 12px;border-radius:999px;color:#fff;font-weight:900;border:3px solid #16132b;font-size:15px;white-space:nowrap}

/* kid screen */
.khead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.khead .title{font-size:clamp(30px,7vw,48px)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.gcard{text-align:left;background:var(--card);border:4px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.gcard .em{font-size:44px;line-height:1}
.gcard .gtitle{font-size:20px;font-weight:900}
.gcard p{margin:0;color:var(--muted);font-size:16px}
.gcard .stars{color:#f59f00;font-size:22px;letter-spacing:2px;margin-top:auto}
body[data-k="nora"] .gcard{box-shadow:0 0 16px rgba(177,151,252,.45)}
body[data-k="lucas"] .gcard{border-radius:0;box-shadow:6px 6px 0 var(--line)}
body[data-k="milo"] .gcard{border:3px dashed var(--line);border-radius:30px;box-shadow:0 7px 0 #b9d7a0}
body[data-k="milo"] .gcard .em{font-size:64px}

/* play */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;min-width:90px}
.dots .d{flex:1;height:12px;border-radius:6px;background:var(--chip);border:2px solid var(--line)}
.dots .d.on{background:var(--acc)} .dots .d.cur{background:var(--acc2)}
.stage{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:560px){.stage{grid-template-columns:1fr;justify-items:center}.me svg{width:100px;height:120px}}
.qcard{background:var(--card);border:4px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}
body[data-k="nora"] .qcard{box-shadow:0 0 22px rgba(112,72,232,.7)}
body[data-k="lucas"] .qcard{border-radius:0;box-shadow:6px 6px 0 var(--line)}
body[data-k="milo"] .qcard{border:3px dashed var(--line);border-radius:34px;box-shadow:0 8px 0 #b9d7a0;align-items:center;text-align:center}
.q{font-size:clamp(20px,4.6vw,28px);line-height:1.35;overflow-wrap:anywhere}
.q.zh{font-size:clamp(26px,6vw,36px);line-height:2.3}
.q.huge{font-size:clamp(64px,18vw,120px);line-height:1.1}
.lvl{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
ruby{ruby-position:over} rt{font-size:.42em;font-weight:800;color:var(--muted)}
.hero rt,.full rt{color:#fff;text-shadow:2px 2px 0 #16132b;font-size:.28em;letter-spacing:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ch{min-height:68px;padding:10px;border-radius:18px;border:4px solid var(--line);background:var(--card);font-size:clamp(20px,5vw,26px);font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;line-height:1.6}
.ch:active{transform:scale(.97)}
.ch.dead{opacity:.35;text-decoration:line-through}
.ch.right{background:#d3f9d8;color:#1b5e20;border-color:#2b8a3e}
.ch.pulse{animation:pulse .8s infinite}
body[data-k="milo"] .choices{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
body[data-k="milo"] .ch{min-height:130px;font-size:56px;border-radius:30px;border:4px dashed var(--line);box-shadow:0 6px 0 #b9d7a0}
body[data-k="lucas"] .ch{border-radius:0;box-shadow:4px 4px 0 var(--line)}
body[data-k="nora"] .ch{border-color:#7048e8;background:#2f2262;box-shadow:0 0 12px rgba(112,72,232,.6)}
body[data-k="nora"] .ch.right{background:#2b8a3e;color:#fff}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(252,196,25,.6)}}
.fb{min-height:64px;border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--chip);border:3px solid var(--line);font-size:19px}
.fb.good{background:#d3f9d8;color:#1b5e20;border-color:#2b8a3e}
.fb.bad{background:#fff3bf;color:#5c4b00;border-color:#f59f00}
.fb .grow{flex:1;min-width:180px}
.fb .btn{font-size:18px}
body[data-k="milo"] .fb{justify-content:center;font-size:48px}
.egg{width:84px;height:104px;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;background:#fff3c4;border:4px solid #b08a2e;display:flex;align-items:center;justify-content:center;font-size:48px;color:#27431f}
.tcard{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:12px;border:3px solid #3b2a1a;background:#fff;font-size:18px;min-width:96px;color:#3b2a1a}
.tcard b{font-size:30px}
.cards{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pic{font-size:72px;line-height:1.1}
.seq{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seq .qm{width:42px;height:42px;border-radius:10px;border:3px dashed var(--acc2);display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:var(--acc2)}
.nchip{font-size:34px;padding:4px 10px;border-radius:10px;background:var(--chip);border:3px solid var(--line)}
.story{font-size:clamp(19px,4.2vw,24px);line-height:1.5}
.cheer{font-family:var(--h);font-size:32px;letter-spacing:2px}

/* result */
.res{background:var(--card);border:4px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.res .big{font-size:60px;color:#f59f00;letter-spacing:6px}
.tip{background:var(--chip);border:3px dashed var(--line);border-radius:16px;padding:12px 16px;max-width:560px;text-align:left}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* gate */
.gate{background:var(--card);color:var(--fg);border:4px solid #16132b;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto;width:100%}
.gate input[type=text]{font:inherit;font-size:26px;padding:10px 14px;border-radius:12px;border:3px solid #16132b;width:100%}
.gate label{display:flex;align-items:center;gap:12px;font-size:20px;min-height:48px}
.gate input[type=checkbox]{width:28px;height:28px}

/* splash + intro */
.full{position:fixed;inset:0;overflow:hidden;background:#12306f;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#ffd43b 0 9deg,#ff922b 9deg 18deg);animation:spin 24s linear infinite;opacity:.9}
.speed{position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(255,255,255,.22) 22px 25px)}
.full>*:not(.rays):not(.speed){position:relative}
.full .title{font-size:clamp(44px,12vw,110px);color:#fff;text-shadow:4px 4px 0 #16132b,-3px -3px 0 #16132b,3px -3px 0 #16132b,-3px 3px 0 #16132b;text-align:center;line-height:1}
.who{position:absolute!important;bottom:0;height:min(40vh,44vw)}
.who svg{height:100%;width:auto;display:block}
.who.n{left:4%;animation:inL .8s cubic-bezier(.2,1.4,.4,1) .2s both}
.who.l{right:4%;animation:inR .8s cubic-bezier(.2,1.4,.4,1) .5s both}
.who.m{left:0;right:0;margin:auto;width:fit-content;height:min(20vh,26vw);animation:pop 1s ease 1.4s both,bob 1s ease-in-out 2.4s infinite}
.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1) 1.1s both}
.start{font-size:32px;animation:pulse 1.1s infinite}
.skip{font-size:15px;color:#fff;text-shadow:1px 1px 0 #16132b;position:absolute!important;top:10px;right:14px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes inL{from{transform:translateX(-140%)}}
@keyframes inR{from{transform:translateX(140%)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes slam{from{transform:scale(4);opacity:0}}
@keyframes hop{50%{transform:translateY(-14px)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
/* pets */
.petcard{flex-direction:row!important;align-items:center;min-height:0!important;gap:14px}
.petcard .pv{width:84px;flex:none}
.pk.selpk{outline:5px solid var(--gold)}
body[data-k="lucas"] .pk .gtitle{font-size:12px}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phead .title{font-size:clamp(30px,7vw,46px)}
.bars{display:flex;gap:12px;flex:1;min-width:230px}
.bar2{flex:1;display:flex;align-items:center;gap:6px;font-size:22px}
.bar2 i{flex:1;height:16px;border-radius:8px;background:var(--chip);border:3px solid var(--line);overflow:hidden;display:block}
.bar2 b{display:block;height:100%;background:var(--acc2);transition:width .6s}
#mood{width:100%;color:var(--muted);font-size:17px}
.room{position:relative;width:100%;aspect-ratio:16/10;border:4px solid var(--line);border-radius:22px;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none}
.room .wall{position:absolute;left:0;right:0;top:0;bottom:34%}
.room .floor{position:absolute;left:0;right:0;top:66%;bottom:0;border-top:4px solid rgba(0,0,0,.25)}
.it{position:absolute;transform:translate(-50%,-100%);line-height:1;white-space:nowrap;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.it.wall{position:absolute;transform:translate(-50%,-50%);inset:auto;background:none}
.it[data-a]{cursor:pointer}
.rug{position:absolute;width:26cqw;height:7cqw;transform:translate(-50%,-100%);border-radius:50%;background:radial-gradient(#ff8fa3 0 35%,#7048e8 36% 60%,#fcc419 61%);border:3px solid rgba(255,255,255,.6)}
.pet{position:absolute;width:20cqw;min-width:60px;transform:translate(-50%,-100%);cursor:pointer;z-index:5}
.pet::after{content:"";position:absolute;left:14%;right:14%;bottom:-3%;height:7%;background:rgba(0,0,0,.2);border-radius:50%;z-index:-1}
.pflip{transition:transform .2s}
.pet svg{width:100%;height:auto;display:block;animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
.pet.walk svg{animation:stride .4s ease-in-out infinite}
.pet.hop svg{animation:hop .5s ease 4}
.bub{position:absolute;left:50%;top:0;transform:translate(-50%,-100%);font-size:7cqw;line-height:1;pointer-events:none;white-space:nowrap}
@keyframes breathe{50%{transform:scaleY(1.035)}}
@keyframes stride{50%{transform:translateY(-7%) rotate(-3deg)}}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .pill.on{background:var(--acc);color:#fff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.icard{min-height:124px;border-radius:16px;border:3px solid var(--line);background:var(--card);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;text-align:center}
.icard.own{background:var(--chip)}
.icard.sel{outline:4px solid var(--gold)}
.iem{font-size:42px;line-height:1.1}.inm{font-size:15px}.ist{font-size:14px;color:var(--muted)}
body[data-k="milo"] .shop{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
body[data-k="milo"] .iem{font-size:58px}
.toast{min-height:30px;text-align:center;font-size:18px}
/* responsive fit: phones, iPad, MacBook */
.room{width:min(100%,calc((100vh - var(--roomx,240px))*1.6));width:min(100%,calc((100dvh - var(--roomx,240px))*1.6));min-width:min(100%,320px);margin-inline:auto}
.petgrid{display:block}
@media (max-width:600px){
  .players{gap:10px}.player{min-height:150px;padding:10px}.player .av{width:104px}.player .num{font-size:44px}.player .nm{font-size:30px}.player .st{font-size:15px}
  .hero .title{font-size:44px}.hero p{font-size:15px}
  .games{grid-template-columns:repeat(2,minmax(0,1fr))}.gcard{padding:10px;min-height:128px;gap:4px}.gcard .em{font-size:34px}.gcard .gtitle{font-size:16px}.gcard p{font-size:13px;line-height:1.3}.gcard .stars{font-size:18px}
  body[data-k="lucas"] .gcard .gtitle{font-size:11px}
  .petcard{grid-column:1/-1}
  .khead .title{font-size:30px}
}
/* wide screens (MacBook, iPad landscape): room on the left, shop on the right, nothing to scroll */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .wrap{max-width:1180px}
  .petgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
  .room{--roomx:200px;width:100%;margin:0}
  .pright{max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px);overflow-y:auto;padding-right:2px}
  .shop{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (min-width:900px) and (max-height:960px){
  .gcard{min-height:112px;padding:12px;gap:4px}.gcard .em{font-size:34px}.gcard p{font-size:14px;line-height:1.3}.khead .title{font-size:36px}.me svg{width:96px;height:116px}
  body[data-k="lucas"] .gcard .gtitle{font-size:13px}body[data-k="lucas"] .khead .title{font-size:24px}.petcard .pv{width:64px}
}
/* short landscape (phones on their side): compact everything so a screen fits without scrolling */
@media (orientation:landscape) and (max-height:540px){
  body{padding-block:6px}.wrap{gap:8px;max-width:1100px}
  .pill{min-height:40px;padding:2px 12px;font-size:15px}.btn{min-height:46px;font-size:17px;padding:6px 16px}.btn.big{font-size:19px}
  .hero{padding:0}.hero .title{font-size:34px}.hero p{display:none}
  .player{min-height:150px;padding:8px}.player .av{width:92px}.player .num{font-size:36px}.player .nm{font-size:26px}.player .st{font-size:13px}.players{gap:10px}
  .foot .btn{min-height:40px;font-size:14px}
  .khead{gap:8px}.khead .title{font-size:26px}.me svg{width:66px;height:80px}.badge{font-size:11px;padding:2px 8px}.khead div[style]{font-size:15px!important}
  .gcard{min-height:110px;padding:8px}.gcard .em{font-size:30px}.gcard .gtitle{font-size:15px}.gcard p{font-size:12px}
  body[data-k="lucas"] .gcard .gtitle{font-size:10px}
  .stage{gap:10px}.qcard{padding:8px 12px;gap:4px;border-radius:14px}.lvl{font-size:11px}.q{font-size:clamp(15px,2.6vw,20px);line-height:1.3}.q.zh{font-size:22px;line-height:2}.q.huge{font-size:56px}.pic{font-size:46px}.story{font-size:clamp(15px,2.4vw,19px);line-height:1.35}
  .choices{gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.ch{min-height:46px;font-size:clamp(15px,2.6vw,19px);padding:4px;border-width:3px;line-height:1.35;border-radius:12px}

function kangMake(n,kid){const seen=new Set(DB.kids[kid].seen.kang||[]);const out=[];

    if(!pool.length){pool=KANG.map((x,i)=>[x,i]).filter(([x,i])=>x[0]===lvl);DB.kids[kid].seen.kang=(DB.kids[kid].seen.kang||[]).filter(id=>!pool.some(([x,i])=>id==='k'+i))}
    const [x,i]=pick(pool);out.push({id:'k'+i,lvl:`Rung ${lvl} of 5`,prompt:`<div class="q">${x[1]}</div>`,say:x[1],choices:opts(x[3]===undefined?[]:x[2],x[3]),answer:x[3],why:x[4]})}
  return out}

/* ---- NORA 4: Pattern builder ---- */
const COLS=['#7048e8','#f06595','#fcc419','#12b886','#1c7ed6','#fd7e14'],SHP=['circle','square','triangle','star','diamond'];
function tokSVG(key){const [s,c]=key.split('|'),f=`fill="${c}" stroke="#111" stroke-width="2.5" stroke-linejoin="round"`;
  const shape={circle:`<circle cx="20" cy="20" r="15" ${f}/>`,square:`<rect x="6" y="6" width="28" height="28" rx="3" ${f}/>`,triangle:`<polygon points="20,4 36,34 4,34" ${f}/>`,star:`<polygon points="20,3 25,15 38,15 28,23 32,36 20,28 8,36 12,23 2,15 15,15" ${f}/>`,diamond:`<polygon points="20,3 37,20 20,37 3,20" ${f}/>`}[s];
  return `<svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true">${shape}</svg>`}
const TNAME={'#7048e8':'purple','#f06595':'pink','#fcc419':'gold','#12b886':'green','#1c7ed6':'blue','#fd7e14':'orange','#e03131':'red'};
/* ---- 3x3 grid puzzles (Nora: Pattern Builder, Lucas: Grid Detective) ---- */
const GNAME={circle:'circle',square:'square',triangle:'triangle',star:'star',diamond:'diamond'};
function cellSVG(key,px,bg){const [s,c,n]=key.split('|'),N=+n,f=`fill="${c}" stroke="#111" stroke-width="2.5" stroke-linejoin="round"`;
  const sh={circle:`<circle cx="20" cy="20" r="15" ${f}/>`,square:`<rect x="6" y="6" width="28" height="28" rx="3" ${f}/>`,triangle:`<polygon points="20,4 36,34 4,34" ${f}/>`,star:`<polygon points="20,3 25,15 38,15 28,23 32,36 20,28 8,36 12,23 2,15 15,15" ${f}/>`,diamond:`<polygon points="20,3 37,20 20,37 3,20" ${f}/>`}[s];
  const P={1:[[30,30,1.25]],2:[[15,30,.7],[45,30,.7]],3:[[30,15,.6],[15,44,.6],[45,44,.6]]}[N];
  return `<svg viewBox="0 0 60 60" width="${px}" height="${px}" aria-hidden="true">${bg?'<rect x="1" y="1" width="58" height="58" rx="9" fill="#fff"/>':''}${P.map(([x,y,k])=>`<g transform="translate(${x-20*k} ${y-20*k}) scale(${k})">${sh}</g>`).join('')}</svg>`}
function cellName(key){const [s,c,n]=key.split('|');return `${n} ${TNAME[c]} ${GNAME[s]}${n>1?'s':''}`}
const G3='display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:6px auto',
  G3C='width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #1b1f3b;border-radius:10px',
  G3Q='width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:3px dashed #7048e8;border-radius:10px;font-size:30px;font-weight:800;color:#7048e8;background:rgba(112,72,232,.12)';
function gridQ(lv){
  const V={s:shuffle(SHP).slice(0,3),c:shuffle(COLS.slice(0,6)).slice(0,3),n:shuffle([1,2,3])},AT=['s','c','n'],R={};
  if(lv==='n'){const rs=shuffle(['row','col','latin','latinB']).slice(0,3);AT.forEach((a,i)=>R[a]=rs[i])}
  else{const vary=shuffle(AT).slice(0,2),cst=AT.find(a=>!vary.includes(a));R[cst]='const';
    if(lv==='l1'){const o=shuffle(['row','col']);R[vary[0]]=o[0];R[vary[1]]=o[1]}
    else{R[vary[0]]='latin';R[vary[1]]=pick(['row','col'])}}
  const val=(a,r,c)=>{const v=V[a],x=R[a];return x==='row'?v[r]:x==='col'?v[c]:x==='latin'?v[(r+c)%3]:x==='latinB'?v[(r+2*c)%3]:v[0]};
  const cells=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells.push(AT.map(a=>val(a,r,c)).join('|'));
  const miss=lv==='l1'?8:lv==='l2'?6+rnd(0,2):rnd(0,8),ans=cells[miss],A=ans.split('|');
  // near-miss wrong answers: change one feature (and for Nora, one with two features changed)
  const alt=i=>{const a=AT[i],pool=R[a]==='const'?(a==='s'?SHP:a==='c'?COLS.slice(0,6):[1,2,3]).map(String):V[a].map(String);return pool.filter(x=>x!==A[i])};
  const one=[];AT.forEach((a,i)=>alt(i).forEach(x=>{const b=A.slice();b[i]=x;one.push(b.join('|'))}));
  let wrong=shuffle([...new Set(one)]).slice(0,3);
  if(lv==='n'){const i=rnd(0,2),j=(i+1+rnd(0,1))%3,b=A.slice();b[i]=pick(alt(i));b[j]=pick(alt(j));const k=b.join('|');if(!wrong.includes(k)&&k!==ans)wrong.push(k);
    while(wrong.length<4){const x=pick(one);if(!wrong.includes(x))wrong.push(x)}}
  const ANAME={s:'Shape',c:'Color',n:'How many'},RT={row:'each row has its own',col:'each column has its own',latin:'every row and column has all three, once each',latinB:'every row and column has all three, once each',const:'never changes'};
  const why=AT.map(a=>`${ANAME[a]}: ${RT[R[a]]}.`).join(' ')+` So the missing tile is ${cellName(ans)}.`;
  const grid=`<div style="${G3}">${cells.map((k,i)=>i===miss?`<span style="${G3Q}">?</span>`:`<span style="${G3C}">${cellSVG(k,52)}</span>`).join('')}</div>`;
  return{id:`g${lv}-${cells.map(k=>{const [s,c,n]=k.split('|');return SHP.indexOf(s)+''+COLS.indexOf(c)+n}).join('')}-${miss}`,
    prompt:`${grid}<div class="q">Which tile goes in the ? spot?</div>`,
    choices:shuffle([ans,...wrong]).map(k=>({val:k,html:cellSVG(k,56,1)})),answer:ans,why,
    hint:'Look across one row: what stays the same? Then look down one column.',say:'Which tile goes in the question mark spot? Look across the rows and down the columns.'}}
function patGen(i){if(i===1||i===2||i===4)return gridQ('n');const t=rnd(3,7);
  let seq,ans,why;
  if(t===3){const s=rnd(1,20),d=rnd(2,9);seq=[0,1,2,3,4].map(i=>s+d*i);ans=s+d*5;why=`Add ${d} each time.`}
  else if(t===4){const s=pick([1,2,3]),r=pick([2,3]);seq=[0,1,2,3].map(i=>s*r**i);ans=s*r**4;why=`Multiply by ${r} each time.`}
  else if(t===5){const s=rnd(1,15),a=rnd(1,5),b=rnd(6,9);seq=[s];for(let i=0;i<5;i++)seq.push(seq[i]+(i%2?b:a));ans=seq[5]+(5%2?b:a);seq=seq.slice(0,5);ans=seq[4]+(4%2?b:a);why=`The jumps alternate: +${a}, +${b}, +${a}, +${b}.`}
  else if(t===6){const o=rnd(0,3);seq=[1,2,3,4,5].map(i=>i*i+o);ans=36+o;why=`These are square numbers${o?' plus '+o:''}: 1, 4, 9, 16, 25, 36.`}
  else{const a=rnd(1,4),b=rnd(2,5);seq=[a,b];for(let i=2;i<6;i++)seq.push(seq[i-1]+seq[i-2]);ans=seq[5]+seq[4];seq=seq.slice(0,6);why='Each number is the two before it added together.'}
  return{id:`n${seq.join()}`,prompt:`<div class="seq">${seq.map(x=>`<span class="nchip">${x}</span>`).join('')}<span class="qm">?</span></div>`,choices:numChoices(ans,4,0,500),answer:ans,why}}
const patMake=(n,k)=>build(n,'pattern',k,patGen).map(q=>(q.lvl=q.id[0]==='g'?'3×3 grid puzzle':'What comes next?',q.say='',q));

/* ---- LUCAS 3: Zhuyin treasure hunt ---- */
function huntGen(){const w=pick(PICW),mode=rnd(0,1),i=WORDS.indexOf(w);
  if(mode===0){const first=zyOnly(w[0]).trim()[0],all=['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ','ㄧ','ㄨ','ㄩ'].filter(x=>x!==first);
    return{id:'h0'+i,lvl:'Treasure chest',prompt:`<div class="pic">${w[2]}</div><div class="q zh">${zy(w[0])}</div><div class="q">Which zhuyin sound comes first?</div>`,choices:shuffle([first,...shuffle(all).slice(0,3)]).map(x=>({val:x,html:`<span style="font-size:1.4em">${x}</span>`})),answer:first,why:`${plain(w[0])} is ${zyOnly(w[0])}, and it starts with ${first}.`,hint:'Look at the first small symbol above the character.',say:`Which zhuyin sound comes first in ${w[1]}?`}}
  const others=shuffle(PICW.filter(x=>x!==w&&x[1]!==w[1]&&x[2]!==w[2])).slice(0,2);
  return{id:'h1'+i,lvl:'Treasure map',prompt:`<div class="q zh" style="color:var(--acc)">${zyOnly(w[0])}</div><div class="q">Which picture matches this zhuyin?</div>`,choices:shuffle([w,...others]).map(x=>({val:x[1],html:`<span style="font-size:2.2em">${x[2]}</span>`})),answer:w[1],why:`${zyOnly(w[0])} is ${plain(w[0])}: ${w[1]} ${w[2]}.`,hint:'Say the sounds out loud, slowly, one after another.',say:'Which picture matches this zhuyin?'}}

/* ---- LUCAS 4: Shop keeper ---- */
function shopGen(){const t=rnd(0,4);
  if(t===0){const pay=pick([10,20]),p=rnd(1,pay-1);return{id:`s0${pay}${p}`,prompt:`<div class="q">🏪 A pack costs ${p} coins. The customer pays ${pay} coins. How much change?</div>`,choices:numChoices(pay-p,4,0,20),answer:pay-p,why:`${pay} − ${p} = ${pay-p}.`,hint:`Count up from ${p} to ${pay}.`}}
  if(t===1){const n=rnd(2,5),p=pick([2,3,4,5,10]);return{id:`s1${n}${p}`,prompt:`<div class="q">🏪 ${n} card packs cost ${p} coins each. What is the total?</div>`,choices:numChoices(n*p,4,0,60),answer:n*p,why:`${n} × ${p} = ${n*p}.`,hint:`Count by ${p}s, ${n} times.`}}
  if(t===2){const p=pick([2,4,5,10]),m=p*rnd(2,5);return{id:`s2${p}${m}`,prompt:`<div class="q">🏪 Lucas has ${m} coins. Each sticker costs ${p}. How many can he buy?</div>`,choices:numChoices(m/p,4,0,20),answer:m/p,why:`${m} ÷ ${p} = ${m/p}.`,hint:`How many ${p}s fit into ${m}?`}}
  if(t===3){const o=rnd(3,12)*2;return{id:`s3${o}`,prompt:`<div class="q">🏪 Half-price sale! A card costs ${o} coins. What is the sale price?</div>`,choices:numChoices(o/2,4,0,30),answer:o/2,why:`Half of ${o} is ${o/2}.`,hint:'Split it into two equal parts.'}}
  const a=rnd(5,15),b=rnd(3,9);return{id:`s4${a}${b}`,prompt:`<div class="q">🏪 A booster pack is ${a} coins and a card sleeve is ${b} coins. What is the total?</div>`,choices:numChoices(a+b,4,0,40),answer:a+b,why:`${a} + ${b} = ${a+b}.`,hint:`Add ${b} to ${a}.`}}
const shopMake=(n,k)=>build(n,'shop',k,shopGen).map(q=>(q.lvl='Card shop',q.say='',q));

/* ---- LUCAS 5: Soccer number drills ---- */
function drillGen(){const t=rnd(0,3);
  if(t===0){const st=pick([2,3,5,10]),s=st*rnd(1,5),ix=rnd(2,4),seq=[0,1,2,3,4].map(i=>s+st*i),a=seq[ix];return{id:`d0${st}${s}${ix}`,prompt:`<div class="q">⚽ Count by ${st}s</div><div class="seq">${seq.map((x,i)=>i===ix?'<span class="qm">?</span>':`<span class="nchip">${x}</span>`).join('')}</div>`,choices:numChoices(a,4,0,80),answer:a,why:`Each step adds ${st}, so the missing number is ${a}.`,hint:`How far is it from one number to the next?`}}
  if(t===1){const T=pick([10,20]),a=rnd(1,T-1);return{id:`d1${T}${a}`,prompt:`<div class="q">⚽ Pass it! ${a} + ? = ${T}</div>`,choices:numChoices(T-a,4,0,20),answer:T-a,why:`${a} + ${T-a} = ${T}.`,hint:`Count up from ${a} to ${T}.`}}

  const a=rnd(3,12);return{id:`d3${a}`,prompt:`<div class="q">⚽ Lucas makes ${a} passes in the first half and the same in the second half. How many passes in all?</div>`,choices:numChoices(a*2,4,0,30),answer:a*2,why:`${a} + ${a} = ${a*2}.`,hint:'Add the number to itself.'}}

  if(j.t==='wander'){await go(rn(-4.2,4.2),rn(-1.6,3.2));await wait(600)}
  else if(j.t==='sit'){const s=(o.sofa&&Math.random()<.5)?SPOT.sofa:o.rug?SPOT.rug:[rn(-4,4),rn(-1.5,3)];await go(s[0],s[1],0);await wait(700);setPose('happy',pick(['💭','🎵','😊']));await wait(2600);setPose('idle')}
  else if(j.t==='play'){const p=j.toy.p3;await go(p[0]+.95,p[1]+.1,-Math.PI/2);setPose('happy');R3.playToy={id:j.toy.id,t0:performance.now()};fxBurst('sparkles');R3.hop=true;await wait(3200);R3.hop=false;endPlay();P.fun=Math.min(100,P.fun+15);setPose('idle')}
  else if(j.t==='sleep'){const gl=!!R3.glb,b=o.bed?(gl?[2.5,1.1]:SPOT.bed):[rn(-3.5,3),rn(-1,2.5)];await go(b[0],b[1],0);if(o.bed&&!gl)R3.liftT=.55;setPose('sleep');await wait(4800);P.fun=Math.min(100,P.fun+6);R3.liftT=0;setPose('idle')}

function resetQ(){S.att=0;S.dead=[];S.done=false;S.reveal=false;S.hintOn=false;S.gain=0;S.t0=Date.now()}
function startMission(id){const g=GAMES[id];S.game=id;S.kid=g.kid;S.qs=g.make(g.n,g.kid);S.qi=0;S.pts=0;S.times=[];resetQ();S.doSay=true;S.screen='play';save();render();
  clearInterval(clockTimer);if(g.timed)clockTimer=setInterval(()=>{const c=$('#clock');if(c&&!S.done)c.textContent='⏱ '+Math.floor((Date.now()-S.t0)/1000)+'s'},500)}
function markSeen(){const q=S.qs[S.qi],a=DB.kids[S.kid].seen[S.game]=DB.kids[S.kid].seen[S.game]||[];if(!a.includes(q.id))a.push(q.id);save()}
function answer(i){if(S.done)return;const q=S.qs[S.qi],c=q.choices[i],k=S.kid;
  try{const tx=v=>{v=(v&&typeof v==='object')?(v.t||v.text||v.label||v.n||v.html||v.val||JSON.stringify(v)):v;const d=document.createElement('div');d.innerHTML=String(v);return d.textContent.trim()};window.KA&&(KA.setKid(k),KA.answer({q:tx(q.prompt),qid:q.id,given:tx(c),expected:tx(q.answer),correct:!!isAns(q,c),tryNo:S.att+1,topic:S.game}))}catch(e){}
  if(isAns(q,c)){S.done=true;S.gain=S.att===0?2:1;S.pts+=S.gain;S.times.push((Date.now()-S.t0)/1000);markSeen();sfx('ok');if(k==='milo')sfx('roar');say(pick(CHEER[k])+(k==='milo'&&!q.lang?' '+q.final:''),'en-US',k==='milo'?450:0)}
  else{S.att++;S.dead.push(i);sfx('no');
    if(S.att>=2||q.choices.length-S.dead.length<=1){S.done=true;S.reveal=true;S.gain=0;S.times.push((Date.now()-S.t0)/1000);markSeen();say(k==='milo'?(q.lang?'Good try!':'Good try! '+q.final):'Good try! Here is the answer.')}
    else{S.hintOn=KIDS[k].hints;say(pick(OOPS[k]))}}
  render()}
function finishMission(){const n=S.qs.length,r=S.pts/(n*2);S.stars=r>=.85?3:r>=.6?2:1;const st=DB.kids[S.kid].stars;st[S.game]=Math.max(st[S.game]||0,S.stars);DB.kids[S.kid].wallet=wallet(S.kid)+S.stars;save();
  S.missions[S.kid]=(S.missions[S.kid]||0)+1;clearInterval(clockTimer);sfx('win');S.screen='result';render()}

app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='FORM')return;const a=t.dataset.a;if(A_[a])A_[a](t.dataset)});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('form'),a=f.dataset.a;
  if(a==='gateform'){const v=parseInt($('#ans').value,10);if(v===S.gate.a*S.gate.b){S.gate={step:2};render()}else{S.gate={step:1,a:rnd(101,999),b:rnd(11,99),msg:'Not quite. Here is a new question.'};render()}}
  else if(a==='resetform'){const ks=[...f.querySelectorAll('input[name=k]:checked')].map(x=>x.value);ks.forEach(k=>{DB.kids[k]={stars:{},seen:{}}});save();$('#rmsg').textContent=ks.length?'Reset: '+ks.map(k=>KIDS[k].name).join(', '):'Nothing selected.'}});

/* test hook for automated playtests */
window.__test={state:()=>({screen:S.screen,kid:S.kid,game:S.game,qi:S.qi,done:S.done,total:S.qs.length,pts:S.pts,stars:S.stars}),
 solve:()=>{if(S.screen==='splash')return A_.splash();if(S.screen==='intro')return A_.skip();if(S.screen==='play'){if(!S.done){const q=S.qs[S.qi];answer(q.choices.findIndex(c=>isAns(q,c)))}else A_.next()}},
 startGame:id=>startMission(id),ids:()=>Object.keys(GAMES),questions:()=>S.qs.map(q=>({id:q.id,answer:q.answer,choices:q.choices.length}))};
render();
</script>

</body></html>
