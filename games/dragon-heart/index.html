<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../../voice.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>龍心冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#efe3c8;--ink:#2a2140;--panel:#fff8e6;--edge:#2a2140;--btn:#ffffff;--accent:#e4572e;--good:#2e9e5b;--bad:#d64550;
  --hud:#2a2140;--hudink:#fff8e6;--seg:#d8cdb4;--gold:#f2b705;
  --px:"Press Start 2P","Courier New",monospace;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#120e26;--ink:#f4eeff;--panel:#221a42;--edge:#a99cff;--btn:#32285a;--accent:#ff7a45;--good:#35b36a;--bad:#e85a66;--hud:#0c0a1c;--hudink:#f4eeff;--seg:#3a3068;--gold:#ffd84a;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#120e26;--ink:#f4eeff;--panel:#221a42;--edge:#a99cff;--btn:#32285a;--accent:#ff7a45;--good:#35b36a;--bad:#e85a66;--hud:#0c0a1c;--hudink:#f4eeff;--seg:#3a3068;--gold:#ffd84a;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hud);z-index:10}
#app{max-width:640px;margin:0 auto;padding:10px}
#hud{display:flex;align-items:center;gap:8px;background:var(--hud);color:var(--hudink);padding:6px 8px;border:4px solid var(--edge);margin-bottom:8px;min-height:36px}
#hud button{background:transparent;border:0;color:inherit;font-size:1.3rem;min-width:44px;min-height:44px;cursor:pointer}
#hearts{font-size:1rem;letter-spacing:2px;white-space:nowrap}
#party{display:flex;gap:2px;flex:1;justify-content:center}
#party img{width:30px;height:30px;image-rendering:pixelated}
canvas#stage{display:block;width:100%;height:auto;aspect-ratio:208/112;image-rendering:pixelated;border:4px solid var(--edge);background:#000}
#bhud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px;padding:8px 10px;background:var(--panel);border:4px solid var(--edge);font-size:.95rem}
#bhud[hidden]{display:none}
.seg,.pip{display:inline-block;width:16px;height:12px;background:var(--seg);border:2px solid var(--edge);margin-right:2px}
.seg.on{background:var(--accent)}
.pip{width:12px}
.pip.on{background:var(--gold)}
#panel{margin-top:8px;background:var(--panel);border:4px solid var(--edge);box-shadow:5px 5px 0 var(--edge);padding:16px;min-height:200px}
h1.logo{font-family:var(--px);font-size:1.15rem;line-height:1.6;margin:0 0 6px}
h2.ct{font-family:var(--px);font-size:1rem;line-height:1.6;margin:6px 0 16px}
.sub{margin:0 0 14px;font-size:1.05rem}
.btn{font-family:var(--px);font-size:.75rem;padding:14px 16px;min-height:48px;background:var(--accent);color:#fff;border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer;line-height:1.4}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.alt{background:var(--btn);color:var(--ink)}
.spk{font-size:1.2rem;min-width:48px;min-height:48px;background:var(--btn);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer;color:var(--ink)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px}
.who{font-family:var(--px);font-size:.8rem;margin-bottom:8px}
.say{font-size:1.3rem;line-height:1.55;margin:0;min-height:5.2em}
.say.nar{font-style:italic}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:var(--btn);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer;font:inherit}
.card img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.card b{font-family:var(--px);font-size:.8rem}
.card span{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:10px}
.qtag{font-family:var(--px);font-size:.62rem;margin-bottom:10px;color:var(--accent)}
.qbig{font-size:1.35rem;line-height:1.5;margin-bottom:8px;text-align:center}
.qbig .emo{font-size:3.4rem;line-height:1.1}
.qbig .word{font-size:2rem}
.qbig .zy{font-size:2.4rem;letter-spacing:4px}
.qbig .zhbig{font-size:3.2rem}
.qbig .sent{display:block;text-align:left;font-size:1.25rem}
.qbig u{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--accent);text-decoration:none}
.qtext{font-size:1.15rem;font-weight:600;text-align:center;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opts.col{grid-template-columns:1fr}
.opt{font:inherit;font-size:1.2rem;min-height:56px;padding:10px 8px;background:var(--btn);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer}
.opt.zh{font-size:2rem}
.opt.emo{font-size:2.4rem}
.opt.zy{font-size:1.45rem;letter-spacing:2px}
.opt.left{text-align:left;font-size:1.1rem;line-height:1.4}
.opt.ok{background:var(--good);color:#fff}
.opt.no{background:var(--bad);color:#fff;opacity:.55}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:14px}
.hint{margin:0;font-size:1rem;flex:1}
.zc{display:inline-flex;align-items:center;gap:.05em;vertical-align:middle;margin:0 .05em;line-height:1.1}
.z{display:inline-flex;align-items:center;gap:.04em;font-style:normal;font-size:.42em;font-weight:600;line-height:1}
.zs{display:flex;flex-direction:column;align-items:center}
.zn{line-height:.7}
.say .z{font-size:.5em}
.who .z{font-size:.6em}
.opt.zh .z{font-size:.45em}
.qbig .zhbig .z{font-size:.36em}
.fine{margin-top:14px;font-size:.85rem;display:flex;gap:10px;flex-wrap:wrap}
.fine button{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;min-height:36px;padding:0}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.btn:active,.opt:active{transform:none}}
.say{font-size:1.35rem;line-height:2.1}.qtext{line-height:2}.hint{line-height:1.9}.qbig .sent{line-height:2.2}.opt.zhm{font-size:1.5rem}.opt.zhl{font-size:1.2rem;text-align:left;line-height:2}

/* ---- big screens (MacBook, desktop, full screen): stage left, story/questions right, no page scrolling ---- */
@media (min-width:900px) and (min-aspect-ratio:4/3){
  html,body{height:100%;overflow:hidden}
  #app{max-width:none;height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,28vw,460px);grid-template-rows:auto minmax(0,1fr);gap:12px 16px;padding:12px 16px}
  #hud{grid-column:1 / -1;margin:0}
  canvas#stage{grid-column:1;grid-row:2;align-self:center;justify-self:center;width:min(100%,calc((100vh - 120px) * 208 / 112));height:auto}
  #side{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:10px;min-height:0}
  #bhud{margin:0}
  #panel{margin:0;flex:1;min-height:0;overflow:auto}
}
#fsBtn svg{width:22px;height:22px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hud);color:var(--hudink);border:3px solid var(--edge);padding:10px 14px;font-size:1rem;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <div id="hearts" aria-label="Hearts" hidden></div>
    <div id="party" aria-label="Your dragons"></div>
    <button id="voiceBtn" aria-label="自動朗讀開關" title="自動朗讀">🗣️</button>
    <button id="fsBtn" aria-label="全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button>
    <button id="muteBtn" aria-label="Sound on or off">🔊</button>
  </div>
  <canvas id="stage" width="208" height="112" aria-hidden="true"></canvas>
  <div id="side">
  <div id="bhud" hidden></div>
  <main id="panel"></main>
  </div>
</div>
<script src="../../tracker.js" data-game="dragon-heart"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const W=208,H=112;
const cv=$("#stage"),cx=cv.getContext("2d");
const panel=$("#panel");
const Store={
  get(k,d){try{const v=localStorage.getItem("dhqzh:"+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("dhqzh:"+k,JSON.stringify(v));}catch(e){}}
};
let muted=Store.get("muted",false);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let runId=0;
const sleep=ms=>{const id=runId;return new Promise(r=>setTimeout(()=>{if(id===runId)r();},ms));};
const strip=h=>h.replace(/<i class="z">.*?<\/i>/g,"").replace(/<[^>]+>/g,"");
const TONES="ˊˇˋ˙";
function zy(z){
  const all=[...z],tone=all.find(c=>TONES.includes(c))||"",sym=all.filter(c=>!TONES.includes(c)),neu=tone==="˙";
  return `<i class="z"><span class="zs">${neu?'<span class="zn">˙</span>':""}${sym.map(c=>`<span>${c}</span>`).join("")}</span>${tone&&!neu?`<span class="zt">${tone}</span>`:""}</i>`;
}
const ruby=(c,z)=>{const zs=z.split(" ");return [...c].map((ch,i)=>`<span class="zc"><span class="c">${ch}</span>${zy(zs[i]||"")}</span>`).join("");};

/* ================= AUDIO (soft, Ghibli-style: piano, flute, koto, bells, taiko) ================= */
let AC=null,G=null;
const MOODMAP={meadow:"meadow",forest:"forest",cave:"cave",sky:"sky",castle:"castle",home:"home"};
function impulse(a,sec){const n=Math.floor(a.sampleRate*sec),b=a.createBuffer(2,n,a.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}return b;}
function buildGraph(){
  const a=AC,master=a.createGain(),comp=a.createDynamicsCompressor(),rev=a.createConvolver(),send=a.createGain(),mus=a.createGain(),sfx=a.createGain();
  rev.buffer=impulse(a,2.4);send.gain.value=.38;mus.gain.value=.5;sfx.gain.value=.7;master.gain.value=muted?0:1;
  mus.connect(master);sfx.connect(master);mus.connect(send);sfx.connect(send);send.connect(rev);rev.connect(master);master.connect(comp);comp.connect(a.destination);
  G={master,mus,sfx};
}
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();buildGraph();}catch(e){AC=null;G=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function osc(type,f,t,dur,dest,peak,atk,filt){
  const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(filt){const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=filt;o.connect(lp);lp.connect(g);}else o.connect(g);
  g.connect(dest);o.start(t);o.stop(t+dur+.05);return o;
}
const I={
  piano(n,t,d,v,dest){const f=mtof(n);osc("triangle",f,t,d,dest,.5*v,.006,2600);osc("sine",f*2,t,d*.6,dest,.12*v,.004);osc("sine",f*.5,t,d*.8,dest,.1*v,.01);},
  koto(n,t,d,v,dest){const f=mtof(n),o=osc("triangle",f*1.012,t,d,dest,.45*v,.002,3200);o.frequency.exponentialRampToValueAtTime(f,t+.06);osc("sine",f*3,t,Math.min(d,.25),dest,.08*v,.002);},
  flute(n,t,d,v,dest){
    const f=mtof(n),a=AC,o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),g2=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
    o.type="sine";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;
    lfo.frequency.value=5.2;lg.gain.value=f*.006;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
    g2.gain.value=.12;o2.connect(g2);g2.connect(g);o.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3*v,t+.09);g.gain.setValueAtTime(.3*v,t+Math.max(.1,d-.25));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    g.connect(dest);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+d+.05);});
  },
  pad(ns,t,d,v,dest){ns.forEach(n=>{const a=AC,o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=mtof(n);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09*v,t+d*.4);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);});},
  bell(n,t,d,v,dest){const f=mtof(n);osc("sine",f,t,d,dest,.3*v,.003);osc("sine",f*2.76,t,d*.5,dest,.08*v,.003);osc("sine",f*5.4,t,d*.25,dest,.03*v,.003);},
  taiko(t,v,dest){const a=AC,o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.9*v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.7);}
};
const sfx=fn=>()=>{if(muted||!ac()||!G)return;try{fn(AC.currentTime,G.sfx);}catch(e){}};
const SFX={
  ok:sfx((t,d)=>[74,78,81].forEach((n,i)=>I.koto(n,t+i*.08,.6,.7,d))),
  no:sfx((t,d)=>{I.koto(60,t,.45,.6,d);I.koto(57,t+.14,.55,.6,d);}),
  hit:sfx((t,d)=>{I.taiko(t,.7,d);I.bell(86,t+.02,.5,.4,d);}),
  team:sfx((t,d)=>[62,66,69,74,78,81,86].forEach((n,i)=>I.koto(n,t+i*.06,.9,.7,d))),
  win:sfx((t,d)=>[74,78,81,86,81,86].forEach((n,i)=>I.bell(n,t+i*.14,.8,.7,d))),
  click:sfx((t,d)=>I.koto(81,t,.2,.35,d)),
  gain:sfx((t,d)=>[74,78,81,86,90].forEach((n,i)=>I.bell(n,t+i*.09,1,.6,d)))
};
/* original loops: 6/8 time, 8 bars each. Chords are MIDI notes low to high. */
const CHORDS_D=[[50,57,62,66],[47,54,62,66],[43,50,59,62],[45,52,57,61],[50,57,62,66],[42,49,57,61],[43,50,59,62],[45,52,57,61]];
const MEL_D=[[[0,78,3],[3,81,2],[5,78,1]],[[0,76,3],[3,78,3]],[[0,83,3],[3,81,2],[5,78,1]],[[0,81,6]],[[0,78,2],[2,81,2],[4,86,2]],[[0,83,3],[3,81,3]],[[0,78,2],[2,76,2],[4,74,2]],[[0,76,4],[4,74,2]]];
const CHORDS_F=[[45,52,57,60],[41,48,57,60],[48,55,60,64],[43,50,59,62],[45,52,57,60],[41,48,57,60],[40,47,55,59],[45,52,57,60]];
const MEL_F=[[[0,76,2],[2,77,1],[3,76,1],[4,72,2]],[[0,77,3],[3,81,3]],[[0,84,2],[2,81,2],[4,76,2]],[[0,76,3],[3,71,3]],[[0,72,2],[2,76,2],[4,81,2]],[[0,84,3],[3,81,1],[4,77,2]],[[0,76,3],[3,72,3]],[[0,69,6]]];
const CHORDS_M=[[50,57,62,65],[46,53,58,62],[43,50,58,62],[45,52,57,61],[50,57,62,65],[46,53,58,62],[45,52,57,61],[50,57,62,65]];
const MEL_M=[[[0,74,3],[3,77,3]],[[0,82,3],[3,81,2],[5,79,1]],[[0,79,3],[3,77,3]],[[0,81,3],[3,85,3]],[[0,86,3],[3,84,3]],[[0,82,2],[2,81,2],[4,79,2]],[[0,77,3],[3,81,3]],[[0,74,6]]];
const SONGS={
  meadow:{bpm:84,acc:"piano",melo:"flute",pad:1,chords:CHORDS_D,mel:MEL_D},
  home:{bpm:62,acc:"piano",melo:"piano",pad:1,chords:CHORDS_D,mel:MEL_D,melv:.7,accv:.55},
  sky:{bpm:96,acc:"piano",melo:"flute",pad:1,tr:5,chords:CHORDS_D,mel:MEL_D},
  forest:{bpm:70,acc:"koto",melo:"flute",pad:1,chords:CHORDS_F,mel:MEL_F,melv:.8},
  cave:{bpm:58,cave:1,scale:[62,63,67,69,72,74,75,79]},
  castle:{bpm:74,acc:"piano",melo:"flute",pad:1,chords:CHORDS_M,mel:MEL_M,accv:.6,melv:.6},
  boss:{bpm:104,acc:"piano",melo:"flute",pad:1,taiko:1,chords:CHORDS_M,mel:MEL_M,accv:.8}
};
const M={mood:null,want:"home",timer:null,next:0,bar:0,e:0,fade:false};
function setMood(m){M.want=m;}
function playE(S,bar,e,t,ed){
  const dest=G.mus,tr=S.tr||0;
  if(S.cave){if(e===0&&bar%2===0)I.pad([38,45,50,57],t,ed*12,1,dest);if(Math.random()<.35)I.bell(S.scale[Math.floor(Math.random()*S.scale.length)],t,ed*6,.6,dest);return;}
  const c=S.chords[bar];
  I[S.acc](c[[0,1,2,3,2,1][e]]+tr,t,ed*(S.acc==="koto"?5:4),S.accv||.8,dest);
  if(S.pad&&e===0)I.pad(c.slice(1).map(n=>n+tr),t,ed*6,.7,dest);
  S.mel[bar].forEach(([p,n,l])=>{if(p===e)I[S.melo](n+tr,t,ed*l*.97,S.melv||.9,dest);});
  if(S.taiko){if(e===0)I.taiko(t,1,dest);if(e===3)I.taiko(t,.6,dest);}
}
function sched(){
  M.timer=setTimeout(sched,120);
  if(!AC||!G||muted||AC.state!=="running")return;
  if(M.mood===null){M.mood=M.want;M.bar=0;M.e=0;M.next=0;}
  else if(M.want!==M.mood&&!M.fade){
    M.fade=true;const n=AC.currentTime;G.mus.gain.cancelScheduledValues(n);G.mus.gain.setValueAtTime(G.mus.gain.value,n);G.mus.gain.linearRampToValueAtTime(.0001,n+.35);
    setTimeout(()=>{M.mood=M.want;M.bar=0;M.e=0;M.next=0;const k=AC.currentTime;G.mus.gain.cancelScheduledValues(k);G.mus.gain.setValueAtTime(.0001,k);G.mus.gain.linearRampToValueAtTime(.5,k+.5);M.fade=false;},400);
  }
  const S=SONGS[M.mood],ed=60/(S.bpm*3);
  if(M.next<AC.currentTime)M.next=AC.currentTime+.05;
  while(M.next<AC.currentTime+.4){playE(S,M.bar,M.e,M.next,ed);M.next+=ed;if(++M.e>=6){M.e=0;M.bar=(M.bar+1)%8;}}
}
function startMusic(){if(!M.timer)sched();}
const canSpeak="speechSynthesis" in window;
let autoVoice=Store.get("autoVoice",true);
function chooseTaiwanVoice(key){
  if(!canSpeak)return null;
  const vs=speechSynthesis.getVoices();
  const tw=vs.filter(x=>/^zh[-_](TW|Hant)/i.test(x.lang)||(/taiwan|臺灣|台灣/i.test(x.name)&&/^zh/i.test(x.lang)));
  const pool=tw.length?tw:vs.filter(x=>/^zh/i.test(x.lang));
  if(!pool.length)return null;
  /* prefer the natural-sounding neural / premium voices when the device has them */

  set.forEach(c=>{
    const [h,z,e]=c,spk={t:h,l:"zh-TW"},tag="中文";

  });
  return ZHP[n]=out;
}
function pickQ(ch){
  const extra=EXTRA[P.id].filter(q=>q.lvl<=ch);
  let pool=Math.random()<.4&&extra.length?extra:zhPool(ch);
  let fresh=pool.filter(q=>!SEEN.has(q.id));
  if(!fresh.length){pool.forEach(q=>SEEN.delete(q.id));fresh=pool;}
  const q=fresh[Math.floor(Math.random()*fresh.length)];
  SEEN.add(q.id);Store.set("seen:"+P.id,[...SEEN]);
  return q;
}

function setHearts(n,max){const h=$("#hearts");h.hidden=false;h.innerHTML=Array.from({length:max},(_,i)=>i<n?"❤️":"🖤").join("");}

async function dialog(lines){
  for(const [w,t1,t2] of lines){
    const i=who(w),txt=zt(fmt(pk(t1,t2)));
    panel.innerHTML=`<div class="dlg">${i.name?`<div class="who" style="color:${i.c}">${i.name}</div>`:""}<p class="say${i.name?"":" nar"}">${txt}</p><div class="row"><button class="spk" aria-label="朗讀">🔊</button><button class="btn go">下一步 ▶</button></div></div>`;
    panel.querySelector(".spk").onclick=()=>speak(strip(txt),"zh-TW",w);

    await waitClick(".go");
  }
}

function ask(q,hooks){
  const id=runId;
  return new Promise(res=>{
    const order=shuffle(q.o.map((_,i)=>i));
    panel.innerHTML=`<div class="q"><div class="qtag">${q.tag}</div>${q.big?`<div class="qbig">${q.big}</div>`:""}<div class="qtext">${q.text}</div><div class="opts">${order.map(i=>`<button class="opt ${q.oc||""}" data-k="${i}">${q.o[i]}</button>`).join("")}</div><div class="qfoot"><button class="spk" aria-label="朗讀">🔊</button><p class="hint" aria-live="polite"></p></div></div>`;
    const spk=q.spk||{t:strip(q.text),l:"zh-TW"};
    const isText=q.oc==="zhm"||q.oc==="zhl";
    const readQuestion=()=>isText?[strip(q.big||"").replace(/&nbsp;/g,"……"),strip(q.text||""),...order.map(i=>strip(q.o[i]))].filter(Boolean).join("。 "):strip(q.text||"");
    panel.querySelector(".spk").onclick=()=>speak(readQuestion(),"zh-TW");
    autoRead(readQuestion());
    const hint=panel.querySelector(".hint");let busy=false,wrongs=0;
    panel.querySelectorAll(".opt").forEach(b=>{b.onclick=async()=>{
      if(busy||b.disabled||id!==runId)return;busy=true;
      try{window.KA&&(KA.setKid(P&&P.id),KA.answer({q:strip((q.big?q.big+' ':'')+q.text).replace(/&nbsp;/g,'_'),qid:q.id,given:strip(q.o[+b.dataset.k]),expected:strip(q.o[0]),correct:b.dataset.k==="0",tryNo:wrongs+1,topic:q.tag}));}catch(e){}
      if(b.dataset.k==="0"){
        b.classList.add("ok");panel.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        await hooks.right(wrongs);res({ok:true});
      }else{
        b.classList.add("no");b.disabled=true;wrongs++;hint.innerHTML=zt("再想想看。"+q.hint);
        autoRead("再想想看。"+q.hint);
        const dead=await hooks.wrong();busy=false;if(dead)res({dead:true});
      }
    };});
  });
}

        if(team){
          SFX.team();floatText(B.hero.x+4,B.hero.y-4,"合力！","#ffd84a");floatText(B.milo.x,B.milo.y-4,"吼！","#7aff9a");
          await Promise.all(allies.map((a,i)=>shoot(a.x+16*a.s-8,a.y+6*a.s,B.e.x+10,B.e.y+B.e.spr.height*B.e.s/2,a.col||"#fff",i*90)));
          B.hearts=Math.min(MAXH,B.hearts+1);setHearts(B.hearts,MAXH);
          allies.forEach(a=>burst(a.x+8*a.s,a.y+4*a.s,"#ff7aa8",6));floatText(B.hero.x+10,B.hero.y+10,"+♥","#ff7aa8");
        }else{
          SFX.ok();const f=B.dragon||B.hero;
          await shoot(f.x+16*f.s-8,f.y+6*f.s,B.e.x+10,B.e.y+B.e.spr.height*B.e.s/2,f.col||"#fff6a0");
        }
        const prev=B.hp;B.hp=Math.max(0,B.hp-dmg);hitFx(B.e,dmg);bhud(B,st);await sleep(450);
        if(st.talk&&B.hp>0)for(const k of Object.keys(st.talk).map(Number).sort((a,b)=>b-a)){
          if(prev>k&&B.hp<=k&&!B.done[k]){B.done[k]=1;await dialog(st.talk[k]);}
        }
      },
      wrong:async()=>{
        B.streak=0;
        B.hearts--;setHearts(B.hearts,MAXH);bhud(B,st);
        B.e.dx=-34;await sleep(130);const n=performance.now();allies.forEach(a=>a.shakeUntil=n+350);SFX.no();floatText(B.hero.x+4,B.hero.y-4,"-♥","#ff4a6a");B.e.dx=0;
        await sleep(300);return B.hearts<=0;
      }
    });
    if(res.dead){hideBattleUI();return "lose";}
  }
  if(st.boss==="dad"){
    B.e.spr=sp("dadF");B.e.flashUntil=performance.now()+500;SFX.gain();
    for(let i=0;i<5;i++){burst(B.e.x+30,B.e.y+30,"#ff7aa8",14);await sleep(150);}
    panel.innerHTML=`<div class="qtag">${zt("愛心光束！")}</div><p class="say">${zt(fmt(pk("黑暗盔甲裂開了，爸爸自由了！孩子們用的是愛，不是打架。","黑暗盔甲裂開了，爸爸自由了！愛贏了！")))}</p><div class="row"><span></span><button class="btn go">下一步 ▶</button></div>`;
  }else{
    SFX.win();
    for(let i=0;i<10;i++){B.e.alpha=1-i/10;B.e.dy+=2;await sleep(45);}
    B.e.hidden=true;burst(B.e.x+20,B.e.y+20,"#ffe14d",24);
    panel.innerHTML=`<div class="qtag">${zt("勝利！")}</div><p class="say">${zt(final?"女巫的魔法被打破了！":"敵人逃走了。你們合作得真棒！")}</p><div class="row"><span></span><button class="btn go">下一步 ▶</button></div>`;
  }
  hideBattleUI();setMood(st.boss==="dad"?"home":MOODMAP[st.bg]||"home");
  await waitClick(".go");
  return "win";
}

/* ================= EVENT (HEART CHOICE) ================= */
async function runEvent(st){
  setView(st.bg,[]);V.actors.push(mkA("hero",0,40,3),mkA("bro",40,40,3),mkA("milo",80,40,3));
  const d=mkA(st.dragon,150,40,3,{alpha:.45});V.actors.push(d);
  await dialog(st.intro);
  const choice=await new Promise(res=>{
    const id=runId,opts=st.opts.map((o,i)=>({t:pk(o[0],o[3]),ok:o[1],r:pk(o[2],o[4]),i}));
    const order=shuffle(opts);
    panel.innerHTML=`<div class="q"><div class="qtag">${zt("愛心選擇")}</div><div class="qtext">${zt(fmt(pk(st.prompt,st.promptL)))}</div><div class="opts col">${order.map(o=>`<button class="opt left" data-i="${o.i}">${zt(fmt(o.t))}</button>`).join("")}</div><div class="qfoot"><button class="spk" aria-label="朗讀">🔊</button><p class="hint" aria-live="polite"></p></div></div>`;
    const readEvent=()=>fmt(pk(st.prompt,st.promptL))+"。"+order.map(o=>fmt(strip(o.t))).join("。 ");
    panel.querySelector(".spk").onclick=()=>speak(readEvent(),"zh-TW");
    autoRead(readEvent());
    const hint=panel.querySelector(".hint");
    panel.querySelectorAll(".opt").forEach(b=>{b.onclick=()=>{
      if(id!==runId||b.disabled)return;const o=opts[+b.dataset.i];
      if(o.ok){b.classList.add("ok");panel.querySelectorAll(".opt").forEach(x=>x.disabled=true);res(o);}
      else{b.classList.add("no");b.disabled=true;SFX.no();hint.innerHTML=zt(fmt(o.r));autoRead(fmt(o.r),"n");}
    };});
  });
  d.alpha=1;SFX.gain();burst(d.x+24,d.y+24,DPAL[st.dragon].f,30);
  await sleep(500);
  await dialog([["n",choice.r],["n",`${st.dname}（${st.elem}）加入了我們的隊伍！`,`${st.dname}加入了隊伍！`],["n",`${st.dname}說：「${pk(st.line,st.lineL)}」`],["milo","龍！像我的恐龍！吼！"]]);
  if(!SAVE.dragons.includes(st.dragon))SAVE.dragons.push(st.dragon);
  partyUpdate();
}

/* ================= OPENING ANIMATION ================= */
const STARS=Array.from({length:40},(_,i)=>{const r=rng(i*31+7);r();return{x:Math.floor(r()*W),y:Math.floor(r()*66),p:r()*6};});
const HEART=["01010","11111","11111","01110","00100"];
const FLY=["ember","leaf","aqua","spark","star"];
function drawHeart(g,x,y,col,sc){g.fillStyle=col;HEART.forEach((r,j)=>{for(let i=0;i<5;i++)if(r[i]==="1")g.fillRect(x+i*sc,y+j*sc,sc,sc);});}
const NIGHT=["#0b0824","#150f3a","#231658","#35206f"],DAWN=["#3a2a5e","#7a3f78","#c8726e","#ffb27a"];
const hexv=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,k)=>"#"+hexv(a).map((v,i)=>Math.round(v+(hexv(b)[i]-v)*k).toString(16).padStart(2,"0")).join("");
function drawCin(t){
  const g=cx,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dk=cl((t-10800)/3000,0,1),hill1=mix("#1d1440","#3a2650",dk),hill2=mix("#120c2e","#26183e",dk);
  NIGHT.forEach((c,i)=>{g.fillStyle=mix(c,DAWN[i],dk);g.fillRect(0,i*22,W,23);});
  STARS.forEach(s=>{g.globalAlpha=(1-dk)*(.35+.65*Math.abs(Math.sin(t/500+s.p)));g.fillStyle="#ffffff";const z=s.p>3?2:1;g.fillRect(s.x,s.y,z,z);});
  g.globalAlpha=1-dk*.7;g.fillStyle="#f4f0c8";g.fillRect(150,10,14,14);g.fillStyle="#d8d29c";g.fillRect(153,13,3,3);g.fillRect(158,18,2,2);g.globalAlpha=1;
  g.fillStyle=hill1;for(let x=0;x<W;x+=2){const h=Math.round(24+7*Math.sin(x/17)+4*Math.sin(x/7));g.fillRect(x,82-h,2,H);}
  g.fillStyle=hill2;for(let x=0;x<W;x+=2){const h=Math.round(10+5*Math.sin(x/11+1));g.fillRect(x,98-h,2,H);}
  g.fillRect(14,90,50,H);
  g.fillStyle="#4a3022";g.fillRect(48,66,5,9);
  g.fillStyle="#5a3c2b";g.fillRect(22,76,34,16);
  for(let r=0;r<10;r++){const w=42-r*4;g.fillStyle="#9a3636";g.fillRect(Math.round(39-w/2),75-r,w,1);}
  g.fillStyle=t<3600?(Math.sin(t/90)>.92?"#d9a64a":"#ffd36b"):t<10800?"#6b6b7a":"#1a1428";g.fillRect(28,80,8,8);
  g.fillStyle=t>10800?"#07040c":"#3a2418";g.fillRect(44,82,7,10);
  if(t<3600)for(let k=0;k<5;k++){const y=64-((t/40+k*8)%30);g.globalAlpha=Math.max(0,(y-34)/30)*.8;g.fillStyle="#c9c0e0";g.fillRect(Math.round(50+Math.sin(t/400+k)*3+k*.5),Math.round(y),3,3);}
  g.globalAlpha=1;
  const bob=ph=>Math.round(Math.abs(Math.sin(t/260+ph))*1.5);
  const put=(k,x,foot,sc,a)=>{const sr=sp(k),h=sr.height*sc;g.globalAlpha=a===undefined?1:a;g.drawImage(sr,Math.round(x),Math.round(foot-h),sr.width*sc,h);g.globalAlpha=1;};
  if(t<5200){const sick=t>=3600;put(sick?"momC":"mom",sick?70-(t-3600)/1600*26:70,96-bob(0),2,t>4900?cl((5200-t)/300,0,1):1);}
  if(t<10800){const go=t>7200,x=go?96+(t-7200)*.04:96;if(x<212){put("dadH",x,96-(go?Math.round(Math.abs(Math.sin(t/120))*2):bob(1)),2);if(go){g.fillStyle=Math.sin(t/80)>0?"#ffd36b":"#e0a84a";g.fillRect(Math.round(x+30),76,4,5);}}}
  put("nora",122,96-bob(2),2);put("lucas",142,96-bob(3),2);put("milo",164,96-bob(4),2);
  if(t>10800&&t<11300){g.globalAlpha=1-(t-10800)/500;g.fillStyle="#ffffff";g.fillRect(0,0,W,H);g.globalAlpha=1;}
  if(t>12800&&t<15600)for(let i=0;i<5;i++){const p=cl((t-12800-i*350)/2500,0,1);if(p>0)drawHeart(g,Math.round(24+i*34+Math.sin(t/220+i)*3),Math.round(94-p*62),DPAL[FLY[i]].f,2);}
  if(t>15000)FLY.forEach((k,i)=>{const tt=t-15000-i*300;if(tt>0){const x=((tt*.05)%(W+80))-40,y=22+(i%2)*14+i*4+Math.round(Math.sin(t/180+i)*3);g.drawImage(sp(k),Math.round(x),y,32,32);}});
  if(t>15600){const a=cl((t-15600)/800,0,1),o=Math.round((1-a)*10);g.globalAlpha=a;g.font="bold 18px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";g.textAlign="center";
    [["龍心冒險",62]].forEach(([tx,y])=>{g.fillStyle="#2a0a3a";g.fillText(tx,W/2+1,y+o+1);g.fillStyle="#ffd84a";g.fillText(tx,W/2,y+o);});
    g.textAlign="left";g.globalAlpha=1;}
}
async function showIntro(){
  const id=++runId;hideBattleUI();P=null;SAVE=null;partyUpdate();
  V.actors=[];V.proj=[];V.parts=[];V.floats=[];V.cin={t0:performance.now()};
  panel.innerHTML=`<p class="say nar"></p><div class="row"><button class="btn alt snd">🔊 開聲音</button><button class="btn skip">跳過 ▶</button></div>`;

/* ================= FLOW / MENUS ================= */
function saveGame(){Store.set("save4:"+P.id,SAVE);}
function freshSave(){return {step:0,dragons:[]};}
async function play(){
  const id=++runId;hideBattleUI();partyUpdate();startMusic();
  while(SAVE.step<STEPS.length){
    const st=STEPS[SAVE.step];
    if(st.t==="scene")await runScene(st);
    else if(st.t==="title")await runTitle(st);
    else if(st.t==="battle")await runBattle(st);
    else if(st.t==="event")await runEvent(st);
    else if(st.t==="end"){await runEnd();return;}
    SAVE.step++;saveGame();
  }
}
async function runEnd(){
  setView("home",["mom","dadH","hero","milo","bro"]);V.actors.forEach(a=>burst(a.x+24,a.y+10,"#ffe14d",14));SFX.win();
  panel.innerHTML=`<h2 class="ct">${zt("完")}</h2><p class="say" style="min-height:0">${zt(fmt("{me}、{bro}和小洛明用善良、合作，還有五隻龍朋友，救回了爸爸媽媽。"))}</p><p class="qbig" style="margin:14px 0">${ruby("家","ㄐㄧㄚ")} ${ruby("愛","ㄞˋ")}</p><div class="stack"><button class="btn" id="again">再玩一次</button><button class="btn alt" id="menu">選擇英雄</button></div>`;
  $("#again").onclick=()=>{SFX.click();SAVE=freshSave();saveGame();play();};
  $("#menu").onclick=()=>{SFX.click();showMenu();};
}
function showMenu(){
  runId++;hideBattleUI();P=null;SAVE=null;partyUpdate();if(canSpeak)speechSynthesis.cancel();
  setView("meadow",["nora","milo","lucas","ember","leaf"]);
  const card=id=>{const s=Store.get("save4:"+id,null),p=PROFILES[id];const prog=s&&s.step>0?`第${Math.min(5,Math.max(1,Math.floor((s.step-3)/5)+1))}章 · ${s.dragons.length}隻龍`:"新的冒險";
    return `<button class="card" data-p="${id}"><img src="${sp(id).toDataURL()}" alt=""><b>${p.name}</b><span>${prog}</span></button>`;};
  panel.innerHTML=`<h1 class="logo">龍心冒險</h1><p class="sub">${zt("選一位英雄，找到龍，救回家人。")}</p><div class="cards">${card("nora")}${card("lucas")}</div><div class="fine"><button id="clr">家長：清除題目紀錄</button><button id="intro">看開場</button><button id="rst">家長：重設所有進度</button></div>`;
  panel.querySelectorAll(".card").forEach(b=>b.onclick=()=>{ac();SFX.click();chooseProfile(b.dataset.p);});
  $("#intro").onclick=()=>{ac();SFX.click();showIntro();};
  let rarm=false;$("#rst").onclick=e=>{if(!rarm){rarm=true;e.target.textContent="再按一次，清除兩位小朋友的進度";return;}Store.set("save4:nora",null);Store.set("save4:lucas",null);showMenu();};
  let armed=false;$("#clr").onclick=e=>{if(!armed){armed=true;e.target.textContent="再按一次，清除兩位小朋友的題目紀錄";return;}Store.set("seen:nora",[]);Store.set("seen:lucas",[]);e.target.textContent="已清除。";armed=false;};
  setMood("home");startMusic();
}
function chooseProfile(id){
  P=PROFILES[id];SEEN=new Set(Store.get("seen:"+id,[]));
  const s=Store.get("save4:"+id,null);
  if(s&&s.step>0&&STEPS[s.step]&&STEPS[s.step].t!=="end"){
    SAVE=s;partyUpdate();setView("meadow",["hero","milo","bro"]);
    panel.innerHTML=`<h1 class="logo">${P.name}的冒險</h1><p class="sub">${zt("歡迎回來！")}</p><div class="stack"><button class="btn" id="cont">繼續</button><button class="btn alt" id="newg">重新開始</button><button class="btn alt" id="back">返回</button></div>`;
    $("#cont").onclick=()=>{SFX.click();play();};
    $("#newg").onclick=()=>{SFX.click();SAVE=freshSave();saveGame();play();};
    $("#back").onclick=()=>{SFX.click();showMenu();};
  }else{SAVE=freshSave();saveGame();play();}
}
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,4500);}
$("#fsBtn").onclick=async()=>{SFX.click();const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}const r=el.requestFullscreen||el.webkitRequestFullscreen;if(!r)throw 0;await r.call(el);}catch(e){toast("這裡無法自動全螢幕。在 Mac 上請按 Control + Command + F。");}};
$("#menuBtn").onclick=()=>{SFX.click();showMenu();};
showIntro();
requestAnimationFrame(frame);
