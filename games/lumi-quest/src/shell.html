<!doctype html><html><head>
<script src="../../voice.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>/*@inc css/01.css*/</style></head><body>
<title>光靈大冒險</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>/*@inc css/02.css*/</style>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="Lumi Quest game"></canvas>

    <div id="title">
      <button id="btnStart" class="big start" aria-label="Start"></button>
      <div id="menu" hidden>
        <p class="who" id="whoText"></p>
        <div id="profiles"></div>
        <div class="titlebtns">
          <button id="btnReset" class="ghost" aria-label="Reset records"></button>
          <button id="btnSound2" class="ghost" aria-label="Sound">🔊</button>
        </div>
        <p id="saveNote"></p>
      </div>
    </div>

    <div id="creator" hidden>
      <h2 id="crName"></h2>
      <div id="crSteps" class="steps"></div>
      <div id="crBody"></div>
      <div class="crnav"><button id="crBack" class="ghost">◀ Back</button><button id="btnBegin" class="big">Next ▶</button></div>
    </div>

    <div id="hud" hidden>
      <div class="chip">
        <b id="hudName"></b>
        <div class="bar hp"><i id="hudHP"></i><span id="hudHPt"></span></div>
        <div class="bar xp"><i id="hudXP"></i></div>
      </div>
      <div id="hudBtns">
        <span class="stat">🪙 <b id="hudGold">0</b></span>
        <span class="stat">◆ <b id="hudCrys">0/5</b></span>
        <button id="btnBag" aria-label="Bag">🎒<small>Bag</small></button>
        <button id="btnTeam" aria-label="Team">🐾<small>Team</small></button>
        <button id="btnQuest" aria-label="Quest">📜<small>Quest</small></button>
        <button id="btnSound" aria-label="Sound">🔊</button>
        <button id="btnExit" aria-label="Exit">🚪<small>Exit</small></button>
      </div>
    </div>

    <div id="battle" hidden>
      <div id="bLog"></div>
      <div id="bMoves"></div>
    </div>

    <div id="question" hidden>
      <div id="qCard">
        <div class="qhead"><canvas id="qFace" aria-hidden="true"></canvas><span id="qStyle"></span><span id="qMsg"></span><span id="qTries"></span></div>
        <div id="qBigWrap"><div id="qBig" hidden></div><div id="qSub" hidden></div></div>
        <div id="qText"></div>
        <div id="qChoices"></div>
        <div id="qWhy" hidden></div>
        <button id="qNext" class="big" hidden>Continue ▶</button>
      </div>
    </div>

    <div id="dialog" hidden><canvas id="dlgFace" aria-hidden="true"></canvas><div id="dlgMe" hidden><canvas id="dlgMeFace" aria-hidden="true"></canvas><span id="dlgMeName"></span></div><b id="dlgWho"></b><p id="dlgText"></p><button id="dlgNext" class="more" aria-label="Next">▶</button></div>
    <div id="panel" hidden><div id="panelCard"><button id="panelClose" aria-label="Close">✕</button><div id="panelBody"></div></div></div>
    <div id="toast"></div>
    <div id="rotate" hidden><div>📱↻<p>Turn your phone sideways</p></div></div>
  </div>
</div>
<script src="../../tracker.js" data-game="lumi-quest"></script>
<script>/*@inc js/01-Q.js js/02-SPECIES.js js/03-WORLDS.js js/04-LORE.js js/05-Animals.js js/06-Evolve.js js/07-FX.js js/08-Snd.js js/09-save.js js/10-panelOpen.js js/11-worldUnlocked.js js/12-QS.js js/13-leaveBattle.js js/14-resetGate.js js/15-DPR.js*/</script>

<!-- version badge: bump data-v on every update -->
<div id="kaVer" data-v="1.1" data-d="2026-11-25" style="position:fixed;left:8px;bottom:6px;z-index:2147483000;pointer-events:none;font:700 11px/1.2 system-ui,sans-serif;color:#000;opacity:.7;background:#fffc;padding:3px 8px;font-size:12px;border-radius:999px">v1.1 · 2026-11-25</div>
<script>(function(){var e=document.getElementById('kaVer');function go(){setTimeout(function(){if(e)e.style.display='none';},400);removeEventListener('pointerdown',go,true);}addEventListener('pointerdown',go,true);})();</script>
</body></html>
