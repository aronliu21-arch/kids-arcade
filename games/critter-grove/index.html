<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Critter Grove</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap">
<style>
/* Layout: painted jungle stage on top, one play panel underneath; side by side on a phone held sideways. */
:root{--ink:#f4fbe9;--muted:#b9d1bd;--panel:#113327;--panel2:#1c4b39;--edge:#2f6a52;--gold:#e9c46a;--leaf:#8fe05a;--bad:#e8705a;--good:#2f9e44;
  --display:"Fredoka","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#0c2a20;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:minmax(170px,1fr) auto;position:relative}
#stage{position:relative;min-height:0;overflow:hidden;background:#2c7a4a}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
#title{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(34px,8vw,76px);color:#fffbe0;text-shadow:0 4px 0 #1f5a3a,0 0 26px rgba(255,240,150,.8);pointer-events:none}
#title.in{animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-140%) scale(.7);opacity:0}to{transform:none;opacity:1}}
#hud{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100% - 150px);font-weight:700;font-size:14px}
#hud span{background:rgba(10,40,30,.78);padding:4px 10px;border-radius:999px}
#hud .who{color:#fff;font-family:var(--display);font-size:16px}
#snd{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;min-height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--gold);background:rgba(10,40,30,.78);color:var(--ink);font:700 14px var(--body)}
#turn{position:absolute;left:10px;right:10px;bottom:8px;background:rgba(10,40,30,.9);border-radius:12px;padding:6px 6px 6px 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#turn button{min-width:48px;min-height:48px;background:none;border:0;color:var(--ink);font-size:20px}
#panel{background:var(--panel);border-top:3px solid var(--gold);padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:64dvh;overflow-y:auto;min-width:0}
#panel>div{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#app.full .kid{min-height:min(38vh,240px);justify-content:center}#app.full .kid b{font-size:40px}#app.full .kid small{font-size:16px}#app.full{grid-template-rows:1fr}#app.full #stage{display:none}#app.full #panel{max-height:none;border-top:0}
@media (orientation:landscape) and (max-height:540px){
  #app{grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
  #panel{max-height:none;border-top:0;border-left:3px solid var(--gold)}
  #app.full{grid-template-columns:1fr}#app.full #panel{border-left:0}
}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
p{margin:0}.muted{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 150px}
.btn{min-height:56px;padding:8px 18px;border-radius:16px;border:0;background:var(--panel2);color:var(--ink);font:600 19px var(--display);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);cursor:pointer}
.btn.go{background:var(--gold);color:#3a2a05;font-size:24px;min-height:68px}
.btn.small{min-height:48px;font-size:15px;font-family:var(--body);font-weight:700;background:transparent;border:2px solid var(--edge);box-shadow:none}
.btn:focus-visible,.opt:focus-visible,#snd:focus-visible{outline:3px solid #fff;outline-offset:2px}
.kid{color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.kid b{font-size:26px}.kid small{font:700 13px var(--body);opacity:.95}
.q{font-size:22px;font-weight:700;line-height:1.35;display:flex;gap:10px;align-items:flex-start}

.q .spk{flex:none;min-width:48px;min-height:48px;border-radius:50%;border:2px solid var(--edge);background:var(--panel2);color:var(--ink);font:700 12px var(--body)}
.big{font-size:54px;font-family:var(--display);vertical-align:middle;margin-left:8px}
.han{font-size:1.5em;font-weight:400}
.zy{display:inline-flex;align-items:center;margin-right:.12em}
.zy .zv{display:inline-flex;align-items:center;font-style:normal;font-size:.42em;line-height:1;margin-left:1px;color:var(--gold)}.zv b{font-weight:inherit}.zv .zs{display:inline-flex;flex-direction:column;align-items:center}.zv u{text-decoration:none;display:block;line-height:1.05}.zv .zt{font-size:.9em;margin-left:.04em}.zv .zn{font-size:.9em;line-height:.6}.opt .zy .zv{font-size:.48em;color:#2f6a52}
.berries{display:inline-flex;gap:8px;flex-wrap:wrap;vertical-align:middle;margin:4px 8px}
.berries i{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc2d2,#d6336c)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:60px;padding:8px 10px;border-radius:16px;border:0;background:#f4fbe9;color:#12382b;font:600 22px var(--display);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);cursor:pointer}
.opt.wide{font:700 17px var(--body)}
.opt.good{background:var(--good);color:#fff}.opt.bad{background:#6d3a34;color:#f3c9c0;box-shadow:none}
.opt:disabled{cursor:default}
.milo .opts{grid-template-columns:repeat(3,minmax(0,1fr))}.milo .opt{font-size:46px;min-height:96px}.milo .q{font-size:26px}
.fb{min-height:1.4em;font-weight:700}.fb.ok{color:var(--leaf)}.fb.no{color:#ffc9a8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{border-radius:16px;border:3px solid var(--edge);background:var(--panel2);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:700 14px var(--body);text-align:center;min-height:48px}

.card b{font:600 17px var(--display)}.card small{color:var(--muted);font-size:13px}
.tip{background:var(--panel2);border-radius:14px;padding:10px 14px}
.result{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.result>div{flex:1 1 220px;display:flex;flex-direction:column;gap:8px}

/* puzzles */
.pz{display:flex;flex-direction:column;gap:12px;align-items:stretch}.pz.done{pointer-events:none}
.famtag{margin:0;font:700 13px var(--body);color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.center{display:flex;justify-content:center;margin-top:8px}
.emo{font-size:46px;vertical-align:middle}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pick{position:relative;min-width:64px;min-height:64px;border-radius:16px;border:3px solid var(--edge);background:var(--panel2);color:var(--ink);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 18px var(--body);cursor:pointer}
.pick.good{border-color:var(--leaf);background:#1f6b3a}.pick.bad{border-color:var(--bad);opacity:.6}
.pick .num{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3a2a05;display:grid;place-items:center;font:800 15px var(--body)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{min-width:72px;min-height:72px;border:3px dashed var(--edge);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;font:600 24px var(--display);line-height:1.1}.frac b:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.scale{display:flex;flex-direction:column;align-items:center}
.beam{display:flex;justify-content:space-between;gap:8px;width:100%;max-width:520px;border-bottom:8px solid #b07a3a;transition:transform .35s;transform-origin:50% 100%}
.pan{width:48%;min-height:92px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:4px;padding:6px;background:rgba(255,255,255,.07);border-radius:14px 14px 0 0}
.wtag{font:600 24px var(--display);color:var(--gold);align-self:center}
.post{width:16px;height:34px;background:#b07a3a;border-radius:0 0 6px 6px}
.wt{min-width:44px;min-height:44px;border-radius:10px;border:0;background:var(--gold);color:#3a2a05;font:800 17px var(--body);cursor:pointer}
.bry{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc2d2,#d6336c);vertical-align:middle}
.wts .btn{flex:0 1 110px}
.tray{min-height:70px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;border:3px dashed var(--edge);border-radius:14px}
.coin{width:54px;height:54px;border-radius:50%;border:3px solid #8a6a10;background:radial-gradient(circle at 35% 30%,#fff2b8,#d4a017);color:#3a2a05;font:800 17px var(--body);cursor:pointer;flex:0 0 auto}
.coin.c1{width:44px;height:44px;background:radial-gradient(circle at 35% 30%,#f1f3f5,#adb5bd);border-color:#6c757d}
.coin.c50{width:64px;height:64px}
.coins{justify-content:center}.coins>*{flex:0 0 auto}
.clockrow{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.clock{width:200px;height:200px}.clock circle{fill:#f4fbe9;stroke:#2f6a52;stroke-width:5}.clock text{fill:#12382b;font:700 17px var(--body);text-anchor:middle}
.clock .hh{stroke:#12382b;stroke-width:7;stroke-linecap:round}.clock .mh{stroke:#d6336c;stroke-width:4;stroke-linecap:round}.clock .pin{fill:#12382b;stroke:none}
.clockbtns{display:flex;flex-direction:column;gap:8px}.clockbtns .btn{flex:0 1 120px}
.sudoku{display:grid;grid-template-columns:repeat(4,64px);gap:3px;justify-content:center}
.cell{width:64px;height:64px;border-radius:10px;border:2px solid var(--edge);background:#245c47;display:grid;place-items:center;padding:0}
.cell.hole{background:#f4fbe9;border-color:var(--gold);cursor:pointer}.cell.bx{margin-right:6px}.cell.by{margin-bottom:6px}
.paths line{stroke:#b9d1bd;stroke-width:4;stroke-linecap:round}.paths .me{fill:#5fb0ee}.paths .berry{fill:#d6336c}
.mem{display:grid;grid-template-columns:repeat(4,76px);gap:8px;justify-content:center}.mem.n6{grid-template-columns:repeat(3,76px)}.mem.n12{grid-template-columns:repeat(6,72px)}
.memc{height:76px;border-radius:14px;border:3px solid var(--gold);background:repeating-linear-gradient(45deg,#1c4b39 0 8px,#235843 8px 16px);color:var(--gold);font:700 28px var(--display);cursor:pointer;padding:0}
.memc.up{background:#f4fbe9}.memc.good{border-color:var(--leaf)}
.stage{min-height:120px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(0,0,0,.18);font-weight:700}
.pop{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.4)}}
.flashb{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:8px}.grp{display:inline-grid;grid-template-columns:repeat(5,26px);gap:4px}
.grp i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc2d2,#d6336c)}
.spell{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ls{width:48px;height:56px;border-radius:12px;border:3px dashed var(--edge);background:transparent;color:var(--ink);font:600 28px var(--display)}.ls.full{border-style:solid;border-color:var(--gold);background:var(--panel2)}
.tiles{justify-content:center}.tiles>*{flex:0 0 auto}
.lt{width:52px;height:56px;border-radius:12px;border:0;background:#f4fbe9;color:#12382b;font:600 28px var(--display);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);cursor:pointer}.lt:disabled{opacity:.2}
.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.big2{font-size:1.6em}
/* battle */
.battle{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}.battle .rival{flex:0 0 150px}.rules{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.card em{font-style:normal;color:var(--gold);font-size:18px}
.adv{font-weight:800!important}.adv.up{color:var(--leaf)!important}.adv.dn{color:#ffc9a8!important}
.ftag{color:var(--gold)!important}
.calc{display:flex;gap:12px;flex-wrap:wrap}.calc>div{flex:1 1 200px;background:var(--panel2);border-radius:14px;padding:10px 14px}.calc em{font-style:normal;color:var(--gold);font:600 26px var(--display)}
.milo .opt{font-size:40px;min-height:88px}
#gate{position:absolute;inset:0;background:rgba(5,20,15,.86);display:grid;place-items:center;padding:16px;z-index:5}
#gate .sheet{background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
#gate input[type=number]{min-height:52px;font:700 22px var(--body);border-radius:12px;border:2px solid var(--edge);background:#f4fbe9;color:#12382b;padding:0 12px;width:100%;box-sizing:border-box}
#gate label{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:700}
#gate input[type=checkbox]{width:28px;height:28px}
</style>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1000" height="520" aria-hidden="true"></canvas>
    <div id="title">Critter Grove</div>
    <div id="hud"></div>
    <button id="snd" data-a="snd">Sound: on</button>
    <div id="turn" hidden><span>Turn your phone sideways for a bigger picture.</span><button data-a="noturn" aria-label="Close">✕</button></div>
  </div>
  <div id="panel" aria-live="polite"></div>
  <div id="gate" hidden><div class="sheet" id="gateBody"></div></div>
</div>
<script>
(function(){
'use strict';
const W=1000,H=520,DPR=Math.min(window.devicePixelRatio||1,2),TAU=Math.PI*2;
const still=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};

/* ---------- kids and critters ---------- */
const KIDS={
  nora:{name:'Nora',color:'#7048e8',num:9,n:5,opts:4,hints:false,read:false,starter:'fernfox',needCatch:5,foeHp:6},
  lucas:{name:'Lucas',color:'#f76707',num:6,n:5,opts:4,hints:true,read:true,starter:'emberkit',needCatch:4,foeHp:5},
  milo:{name:'Milo',color:'#2f9e44',num:3,n:4,opts:3,hints:true,read:true,starter:'rexlet',needCatch:1,foeHp:2}};
const ORDER=['nora','lucas','milo'];
function P(body,light,dark,belly,inner){return{body:body,light:light,dark:dark,belly:belly,inner:inner}}
const SP=[
 {id:'fernfox',name:'Fernfox',el:'Leaf',pow:4,ear:'cat',top:'leaf',p:P('#5fbf6a','#d6f7c0','#2f8a4a','#f6ffe6','#ffd0dc')},
 {id:'mossling',name:'Mossling',el:'Leaf',pow:2,ear:'round',top:'shroom',p:P('#8fc45a','#e6f7b6','#5a8f34','#fbffe0','#ffd9a6')},
 {id:'bloomlet',name:'Bloomlet',el:'Leaf',pow:3,ear:'long',top:'flower',p:P('#f28fb0','#ffe0ea','#c45a86','#fff4ea','#fff0c9')},
 {id:'emberkit',name:'Emberkit',el:'Fire',pow:5,ear:'cat',top:'flame',p:P('#f58a4a','#ffe0b0','#c4502a','#fff3d6','#ffc0a0')},
 {id:'sunbun',name:'Sunbun',el:'Fire',pow:3,ear:'long',top:'star',p:P('#f7c948','#fff6c0','#d09a20','#fffbe6','#ffc0c8')},
 {id:'cindercub',name:'Cindercub',el:'Fire',pow:6,ear:'round',top:'flame',p:P('#d9574a','#ffc9b0','#9a2f2f','#ffe6d0','#ffb0a0')},
 {id:'dewdrop',name:'Dewdrop',el:'Water',pow:2,ear:'round',top:'drop',p:P('#5fb0ee','#d6f0ff','#2f78c4','#f2fbff','#ffd0e0')},
 {id:'puddlefin',name:'Puddlefin',el:'Water',pow:4,ear:'none',top:'drop',fin:1,p:P('#3fb7b0','#b6f5e6','#1f7f86','#f4ffe6','#ffc9d6')},
 {id:'mistmew',name:'Mistmew',el:'Water',pow:5,ear:'cat',top:'none',p:P('#9fc4f2','#eef6ff','#5f8fd0','#ffffff','#ffd9e6')},
 {id:'glowmoth',name:'Glowmoth',el:'Star',pow:6,ear:'long',top:'star',p:P('#a78bf0','#e9deff','#6a4fc4','#f7f2ff','#ffe9a0')},
 {id:'nightnut',name:'Nightnut',el:'Star',pow:7,ear:'round',top:'star',p:P('#5a6ad0','#c9d2ff','#2f3a8a','#eef0ff','#ffd0f0')},
 {id:'moonpuff',name:'Moonpuff',el:'Star',pow:8,ear:'long',top:'none',p:P('#ffe9c4','#fffdf2','#e0b584','#ffffff','#ffb6c8')},
 {id:'rexlet',name:'Rexlet',el:'Dino',pow:5,ear:'none',top:'none',dino:'spikes',p:P('#6fc46a','#dcf7b0','#3a8a3f','#fbffd6','#ffd0a0')},
 {id:'trikey',name:'Trikey',el:'Dino',pow:6,ear:'none',top:'none',dino:'horns',p:P('#f0a04a','#ffe6b6','#c06a24','#fff6dc','#ffd0a0')},
 {id:'stegolo',name:'Stegolo',el:'Dino',pow:7,ear:'none',top:'none',dino:'plates',p:P('#5fb0c4','#d0f2f7','#2f7a90','#f0fdff','#ffd0a0')},
 {id:'brontobud',name:'Brontobud',el:'Dino',pow:9,ear:'none',top:'leaf',dino:'crest',p:P('#b08af0','#eadcff','#7a50c4','#f8f2ff','#ffd0a0')}];
const byId={};SP.forEach(s=>byId[s.id]=s);
const ELCOL={Leaf:'#5fbf6a',Fire:'#f58a4a',Water:'#5fb0ee',Star:'#a78bf0',Dino:'#e9c46a'};

/* ---------- saved progress (per device) ---------- */
const KEY='critterGrove.v1';
const DECK={nora:['fernfox','sunbun','glowmoth'],lucas:['emberkit','mossling','dewdrop'],milo:['rexlet','bloomlet','dewdrop']};
function blank(k){const cr={};DECK[k].forEach(id=>cr[id]=1);return{stars:0,wins:0,cr:cr,seen:[],read:KIDS[k].read}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}d=d||{};ORDER.forEach(k=>{if(!d[k]||!d[k].cr)d[k]=blank(k);DECK[k].forEach(id=>{if(!d[k].cr[id])d[k].cr[id]=1})});return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let DB=load();

/* ---------- sound, music, voice ---------- */
let AC=null,master=null,musicG=null,muted=false,musTimer=null,step=0,nextT=0;
function audioInit(){if(AC)return;try{const C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);musicG=AC.createGain();musicG.gain.value=0;musicG.connect(master)}catch(e){AC=null}}
function tone(f,t0,d,type,vol,dest){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+d+.05)}catch(e){}}
const N={C3:130.81,F3:174.61,G3:196,A3:220,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25};

function tri(x,a,b,c,d,e,f){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.lineTo(e,f);x.fill()}

const scene={actors:[],shots:[],sparks:[],last:0,t:0};
function actor(sp,x,o){return Object.assign({sp:sp,x:x,s:1.1,ph:Math.random()*6,jt:null,tx:null,vx:0},o||{})}
function burst(x,y,col,n){if(still)return;for(let i=0;i<n;i++){const a=Math.random()*TAU,v=60+Math.random()*120;scene.sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t0:scene.t,col:col})}}
function shoot(from,to,col,cb){if(still||!from||!to){if(to)to.jt=scene.t;cb&&cb();return}
  scene.shots.push({a:from,b:to,t0:scene.t,d:.55,col:col,cb:cb})}
function badge(x,y,k){const kd=KIDS[k],txt=kd.name;c.font='600 17px Fredoka, sans-serif';const w=c.measureText(txt).width+20;c.fillStyle=kd.color;c.beginPath();c.rect(x-w/2,y,w,24);c.fill();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x,y+13)}
function frame(ms){
  const t=ms/1000,dt=Math.min(.05,Math.max(0,t-scene.last));scene.last=t;scene.t=t;const ta=still?1.3:t;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.drawImage(L.bg,0,0,W,H);c.drawImage(L.far,-16+Math.sin(ta*.25)*8,-6,W+32,H+12);c.drawImage(L.mid,0,0,W,H);
  for(const a of scene.actors){
    if(a.vx)a.x+=a.vx*dt;
    if(a.tx!=null)a.x+=(a.tx-a.x)*Math.min(1,dt*3.2);
    let j=0;if(a.jt!=null){const d=t-a.jt;if(d<.5)j=Math.sin(d/.5*Math.PI)*26;else a.jt=null}
    const y=groundY(a.x);
    drawCritter(c,a.x,y,a.s,a.sp,ta,a.ph,{scarf:a.scarf,glow:a.glow,lvl:a.lvl,jump:j,flip:a.flip});
    if(a.kid)badge(a.x,y+12,a.kid);
  }
  c.save();c.globalCompositeOperation='lighter';
  for(let i=scene.shots.length-1;i>=0;i--){const s=scene.shots[i],p=(t-s.t0)/s.d;
    if(p>=1){scene.shots.splice(i,1);s.b.jt=t;burst(s.b.x,groundY(s.b.x)-30,s.col,14);if(s.cb)s.cb();continue}
    const x0=s.a.x,y0=groundY(s.a.x)-34,x1=s.b.x,y1=groundY(s.b.x)-34,px=x0+(x1-x0)*p,py=y0+(y1-y0)*p-Math.sin(p*Math.PI)*90;

  for(let i=scene.sparks.length-1;i>=0;i--){const s=scene.sparks[i],d=t-s.t0;if(d>.8){scene.sparks.splice(i,1);continue}
    c.globalAlpha=1-d/.8;c.fillStyle=s.col;ell(c,s.x+s.vx*d,s.y+s.vy*d+140*d*d,4,4)}
  c.globalAlpha=1;
  for(const f of flies){const fx=(f.x+Math.sin(ta*.4*f.s+f.p)*30+ta*6*f.s)%W,fy=f.y+Math.cos(ta*.5*f.s+f.p)*22,a=.45+.45*Math.sin(ta*2*f.s+f.p);
    c.fillStyle='rgba(255,250,170,'+(a*.16).toFixed(3)+')';ell(c,fx,fy,9,9);c.fillStyle='rgba(255,255,220,'+a.toFixed(3)+')';ell(c,fx,fy,2.2,2.2)}

function wr(ans,cands,k,min){min=min==null?0:min;const out=[];for(const v of cands){if(v!==ans&&v>=min&&out.indexOf(v)<0)out.push(v);if(out.length===k)return out}
  let d=1;while(out.length<k){[ans+d,ans-d].forEach(v=>{if(v>=min&&v!==ans&&out.indexOf(v)<0&&out.length<k)out.push(v)});d++}return out}
function choose(n,r){let a=1;for(let i=1;i<=r;i++)a=a*(n-r+i)/i;return Math.round(a)}

  scene.actors=[actor(byId[m.hand[0]],360,{scarf:'#1c7ed6',glow:true,kid:k,lvl:DB[k].cr[m.hand[0]],flip:true}),actor(m.foe,690,{s:1,scarf:'#e03131'})];
  go('cards');
  const hc=(id,i)=>{const sp=byId[id],up=BEATS[sp.el]===m.foe.el,dn=BEATS[m.foe.el]===sp.el;
    return cardHtml(id,DB[k].cr[id],'<small class="ftag">'+FAMNAME[FAM[sp.el]]+'</small>'+(up?'<small class="adv up">▲ Strong vs '+m.foe.el+' +2</small>':dn?'<small class="adv dn">▼ '+m.foe.el+' is strong vs this</small>':''),'button','data-a="card" data-v="'+i+'"')};
  setPanel('<h2>Round '+(m.round+1)+': pick a card to play</h2>'
    +'<div class="battle"><div class="card rival" style="border-color:#e03131"><canvas width="192" height="192" data-sp="'+m.foe.id+'" data-lvl="1"></canvas><b>Rival '+m.foe.name+'</b><small>'+m.foe.el+' · Power <em>'+m.foePow+'</em></small></div>'
    +'<div class="rules"><p><b>Beat the rival’s power!</b></p><p class="muted">Your card’s power + puzzle bonus (first try +4, second try +2) + type bonus.</p><p class="muted">🔥 beats 🌿 · 💧 beats 🔥 · 🌿 beats 💧 · ⭐ and 🦖 beat each other</p></div></div>'
    +'<div class="cards hand">'+m.hand.map(hc).join('')+'</div>');setHud();
  if(k==='milo')say('Pick a card!');else if(DB[k].read)say('Round '+(m.round+1)+'. Pick a card. The rival has power '+m.foePow+'.')}
function playCard(i){const m=G.m,k=G.kid,id=m.hand.splice(i,1)[0];m.me=id;const me=scene.actors[0];me.sp=byId[id];me.lvl=DB[k].cr[id];me.jt=scene.t;sfx('tap');
  runPuzzle(makePuzzle(k,FAM[byId[id].el]),got=>resolveDuel(id,got))}
function resolveDuel(id,got){const m=G.m,k=G.kid,kd=KIDS[k],sp=byId[id];
  const base=power(k,id),boost=got===2?4:got===1?2:0,adv=BEATS[sp.el]===m.foe.el?2:0,fadv=BEATS[m.foe.el]===sp.el?2:0,mine=base+boost+adv,theirs=m.foePow+fadv;
  m.pts+=got;m.round++;const res=mine>theirs?'win':mine<theirs?'lose':'tie';if(res==='win')m.won++;else if(res==='lose')m.lost++;
  const[me,foe]=scene.actors;if(res==='win'){shoot(me,foe,'#ffe27a');sfx('win')}else if(res==='lose')shoot(foe,me,'#ff6b6b');
  drawCard(m);go('round');
  setPanel('<h2>'+(res==='win'?sp.name+' wins the round! 🎉':res==='lose'?'The rival wins this round.':'It’s a tie!')+'</h2>'
    +'<div class="calc"><div><b>'+kd.name+'’s '+sp.name+'</b><p>Card '+base+(boost?' + puzzle '+boost:'')+(adv?' + type 2':'')+' = <em>'+mine+'</em></p></div><div><b>Rival '+m.foe.name+'</b><p>Card '+m.foePow+(fadv?' + type 2':'')+' = <em>'+theirs+'</em></p></div></div>'
    +'<p>Rounds won: '+kd.name+' '+m.won+' · Rival '+m.lost+'</p><div class="row"><button class="btn go" data-a="nextround">Next ▶</button></div>');setHud();
  if(DB[k].read)say(res==='win'?sp.name+' wins the round!':res==='lose'?'The rival wins this round.':'It is a tie!')}
function finishDuel(){const m=G.m,k=G.kid,kd=KIDS[k],d=DB[k];d.stars+=m.pts;const ok=m.won>m.lost;let head,extra='';
  if(ok){d.wins++;const prize=m.foes.find(id=>!d.cr[id]);
    if(prize){d.cr[prize]=1;head=kd.name+' won the battle! The rival gave '+kd.name+' its '+byId[prize].name+' card!';extra=cardHtml(prize,1)}
    else{const id=m.me||best(k),lv=Math.min(5,(d.cr[id]||1)+1);d.cr[id]=lv;head=kd.name+' won the battle! '+byId[id].name+' grew to level '+lv+'!';extra=cardHtml(id,lv)}
    const foe=scene.actors[1];if(foe){foe.tx=1120;burst(690,270,'#ffe27a',26)}}
  else head=m.won===m.lost?'A draw! Try again to win a card.':'So close! The rival won this time.';
  result(ok,head,extra,m.pts,m.rounds*2,['catch','🌿 Catch a critter'])}

function result(ok,head,extra,pts,max,next){const k=G.kid,kd=KIDS[k],d=DB[k];save();G.row[k]++;if(ok)sfx('win');
  const brk=G.row[k]>=3;go(brk?'break':'result');
  let h='<div class="result">'+(extra?'<div style="flex:0 0 150px">'+extra+'</div>':'')+'<div><h2>'+head+'</h2><p>'+kd.name+' earned ★ '+pts+' of '+max+'.</p><p class="tip"><b>Try it:</b> '+pick(TIPS[k])+'</p></div></div>';
  if(brk)h+='<h2>Great practice! Time for a break</h2><div class="row"><button class="btn go" data-a="finish">Finish for now</button></div>';
  else h+='<div class="row"><button class="btn go" data-a="'+next[0]+'">Next: '+next[1]+' ▶</button><button class="btn small" data-a="home">Home</button></div>';
  setPanel(h);if(d.read)say(head+(brk?' Great practice! Time for a break.':''))}

/* ---------- parent gate ---------- */
let gateAns=0;
function gateAsk(msg){const a=rnd(112,987),b=rnd(12,98);gateAns=a*b;$('#gateBody').innerHTML='<h2>Grown-ups only</h2><p>'+(msg||'Answer this to reset records.')+'</p><p style="font-size:24px;font-weight:700">'+a+' × '+b+' = ?</p><input type="number" inputmode="numeric" id="gateIn" aria-label="Your answer"><div class="row"><button class="btn" data-a="gatecheck">Check</button><button class="btn small" data-a="gateclose">Cancel</button></div>';$('#gate').hidden=false}
function gatePick(){$('#gateBody').innerHTML='<h2>Reset whose records?</h2><p class="muted">This clears stars, critters, seen questions and settings on this device. It cannot be undone.</p>'+ORDER.map(k=>'<label><input type="checkbox" id="rs_'+k+'"> '+KIDS[k].name+'</label>').join('')+'<div class="row"><button class="btn" data-a="gatereset">Reset ticked</button><button class="btn small" data-a="gateclose">Cancel</button></div>'}

/* ---------- input ---------- */
function act(a,v){
  if(a==='snd'){muted=!muted;if(master)master.gain.value=muted?0:1;$('#snd').textContent='Sound: '+(muted?'off':'on');return}
  if(a==='noturn'){$('#turn').hidden=true;return}
  if(a==='start'){audioInit();music(true);sfx('tap');if(still)profiles();else intro();return}
  if(a==='profiles'||a==='finish'){if(G.kid)G.row[G.kid]=0;profiles();return}
  if(a==='kid'){G.kid=v;sfx('tap');home();return}
  if(a==='home'){hush();home();return}
  if(a==='binder'){binder();return}
  if(a==='read'){DB[G.kid].read=!DB[G.kid].read;save();home();return}
  if(a==='catch'){sfx('tap');startCatch();return}
  if(a==='duel'){sfx('tap');startDuel();return}
  if(a==='nextround'){hush();nextDuel();return}
  if(a==='card'){if(G.screen==='cards')playCard(+v);return}
  if(a==='cont'){hush();const f=G.after;G.after=null;if(f)f();return}
  if(a==='speak'){if(G.cur)say(G.cur.p.say);return}
  if(a==='gate'){gateAsk();return}
  if(a==='gateclose'){$('#gate').hidden=true;return}
  if(a==='gatecheck'){if(+$('#gateIn').value===gateAns)gatePick();else gateAsk('Not quite. Here is a new one.');return}
  if(a==='gatereset'){ORDER.forEach(k=>{if($('#rs_'+k).checked){DB[k]=blank(k);G.row[k]=0}});save();$('#gate').hidden=true;profiles();return}
}
document.addEventListener('click',function(e){const b=e.target.closest('[data-a]');if(b){if(!b.disabled)act(b.dataset.a,b.dataset.v);return}
  if(G.screen==='intro')profiles()});
try{const mq=matchMedia('(orientation:portrait) and (max-width:520px)');$('#turn').hidden=!mq.matches;mq.addEventListener('change',e=>{if(!e.matches)$('#turn').hidden=true})}catch(e){}

// Expose for automated playtests. Harmless for players.
window.__test={
  state:()=>({screen:G.screen,kid:G.kid,type:G.m?G.m.type:null,pts:G.m?G.m.pts:0,kind:G.cur?G.cur.p.id:null,done:G.screen==='result'||G.screen==='break',data:DB}),
  solve:()=>{if(G.screen==='question'&&G.cur)G.cur.api.ok();else if(G.screen==='cards')act('card','0');else if(G.screen==='round')act('nextround')},
  miss:()=>{if(G.screen==='question'&&G.cur)G.cur.api.no();if(G.after)act('cont')},
  puzzle:(k,kind)=>{G.kid=k;G.m={type:'catch',n:9,i:0,pts:0,need:1,foe:SP[0]};const p=PZ[kind](k);p.fam='mix';runPuzzle(p,()=>{})},
  act:act};
showStart();requestAnimationFrame(frame);
})();
</script>
