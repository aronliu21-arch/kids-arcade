<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九九乘法表像素冒險</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
:root{--bg:#bfe3f5;--sf:#fffdf3;--ink:#1a1c2c;--bd:#1a1c2c;--mut:#4d556b;--jade:#3db36b;--jadebg:#c4f2d3;--red:#e8454f;--onred:#fff;--redbg:#ffcdd0;--gold:#ffd34d;--line:#b7cbd8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1c2c;--sf:#2b2f4a;--ink:#f4f4f4;--bd:#f4f4f4;--mut:#aab2cc;--jade:#5de08a;--jadebg:#1f5236;--red:#ff6b6b;--onred:#1a1c2c;--redbg:#5a2a30;--gold:#ffd34d;--line:#45507a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1c2c;--sf:#2b2f4a;--ink:#f4f4f4;--bd:#f4f4f4;--mut:#aab2cc;--jade:#5de08a;--jadebg:#1f5236;--red:#ff6b6b;--onred:#1a1c2c;--redbg:#5a2a30;--gold:#ffd34d;--line:#45507a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:conic-gradient(rgba(255,255,255,.14) 25%,transparent 0 50%,rgba(255,255,255,.14) 0 75%,transparent 0);background-size:16px 16px;color:var(--ink);font-family:"DotGothic16","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.num{font-family:"Press Start 2P",monospace}
h1{font-size:1.5rem;margin:0 0 10px;letter-spacing:.06em}
h2.t{font-size:1.4rem;margin:8px 0}
.sub{color:var(--mut);margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.px{image-rendering:pixelated;width:96px;height:96px;display:block;margin:0 auto}
.big{width:128px;height:128px}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 1s steps(1,end) infinite}
#hud{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:6px 12px;background:var(--sf);border:4px solid var(--bd);box-shadow:4px 4px 0 var(--bd)}
#hud .px{margin:0}
.coins{display:flex;align-items:center;gap:8px;font-size:.8rem}
.card{background:var(--sf);border:4px solid var(--bd);box-shadow:6px 6px 0 var(--bd);padding:18px}
.btn{padding:10px 18px;border:4px solid var(--bd);background:var(--red);color:var(--onred);font-weight:700;font-size:1.05rem;box-shadow:4px 4px 0 var(--bd)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--bd)}
.btn.alt{background:var(--sf);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:.95rem;box-shadow:3px 3px 0 var(--bd)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.row.l{justify-content:flex-start;margin-top:8px}
.home{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lv{border:4px solid var(--bd);background:var(--sf);padding:10px 2px;text-align:center;box-shadow:4px 4px 0 var(--bd)}
.lv b{display:block;font-size:1.7rem;line-height:1.4;font-family:"Press Start 2P",monospace}
.lv span{display:block;color:var(--mut);font-size:.9rem}
.lv .st{color:#d89b00;font-size:1.1rem;letter-spacing:.1em}
.lv.done{background:var(--jadebg)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 14px;counter-reset:s}
.steps li{flex:1;text-align:center;padding:4px 0;border:3px solid var(--bd);background:var(--line);color:var(--ink);counter-increment:s;font-size:.9rem}
.steps li::before{content:counter(s) " "}
.steps li.on{background:var(--gold);color:#1a1c2c}
.steps li.done{background:var(--jadebg)}
.q{font-family:"Press Start 2P",monospace;font-size:1.6rem;text-align:center;margin:14px 0 8px;line-height:1.5}
.kou{font-size:1.9rem;font-weight:700;text-align:center;color:var(--jade);margin-bottom:12px;letter-spacing:.1em}
.arr{display:grid;grid-template-columns:repeat(var(--c),var(--s));gap:4px;justify-content:center;margin:8px 0 4px}
.arr i{width:var(--s);height:var(--s);background:var(--jade);box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 rgba(255,255,255,.4)}
.arr i.h{background:var(--gold)}
.arr i.g{background:transparent;box-shadow:none;border:3px dashed var(--mut)}
.fb{min-height:3.4em;text-align:center;margin:12px 0 0;font-size:1.05rem}
.fb strong{font-size:1.25rem}
.gain{font-family:"Press Start 2P",monospace;font-size:.8rem;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.opt{padding:16px 0;border:4px solid var(--bd);background:var(--sf);box-shadow:4px 4px 0 var(--bd);font-family:"Press Start 2P",monospace;font-size:1.2rem}
.opt.ok{background:var(--jadebg);border-color:var(--jade)}
.opt.no{background:var(--redbg);border-color:var(--red)}
.opt:disabled{cursor:default}
.rail{display:flex;gap:6px;margin-bottom:10px}
.rail i{flex:1;height:16px;border:3px solid var(--bd);background:var(--line)}
.rail i.ok{background:var(--jade)}.rail i.no{background:var(--red)}.rail i.now{background:var(--gold)}
.stat{display:flex;justify-content:space-between;color:var(--mut)}
.stars{text-align:center;font-size:2rem;color:#d89b00;letter-spacing:.15em}
.bigtxt{text-align:center;font-size:1.3rem;font-weight:700;margin:6px 0}
ul.w{list-style:none;padding:0;margin:12px 0 0}
ul.w li{padding:8px 0;border-top:3px dotted var(--line)}
.center{text-align:center}
.pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.pc{border:4px solid var(--bd);background:var(--sf);padding:10px 4px;box-shadow:4px 4px 0 var(--bd);text-align:center}
.pc .px{width:80px;height:80px}
.pc.sel{background:var(--gold);color:#1a1c2c}
.pc.sel canvas{animation:bob 1s steps(1,end) infinite}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.item{border:4px solid var(--bd);background:var(--sf);padding:10px;text-align:center;box-shadow:4px 4px 0 var(--bd);display:flex;flex-direction:column;gap:6px;align-items:center}
.item .px{width:72px;height:72px}
.price{display:flex;align-items:center;gap:6px;font-size:.75rem;min-height:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>九九乘法表 像素冒險</h1>
<div id="hud" hidden></div>
<div id="view"></div>
</main>
<script src="../../tracker.js" data-game="times-tables"></script>
<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const view=$('view');
const D='零一二三四五六七八九';
function num(n){if(n<10)return D[n];if(n===10)return '一十';if(n<20)return '十'+(n%10?D[n%10]:'');return D[Math.floor(n/10)]+'十'+(n%10?D[n%10]:'');}
function kou(a,b){if(a>b)[a,b]=[b,a];const p=a*b;return D[a]+D[b]+(p<10?'得'+D[p]:num(p));}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang)||/chinese|中文|國語|国语/i.test(v.name));
  const sc=v=>(/natural|neural|online|premium|enhanced/i.test(v.name)?10:0)+(/google/i.test(v.name)?6:0)+(/hsiao|meijia|mei-jia|yating|ting-ting/i.test(v.name)?5:0)+(/TW|Hant/i.test(v.lang)?4:0)+(v.localService?0:2);
  return vs.sort((a,b)=>sc(b)-sc(a))[0];
}
function say(t){
  try{
    speechSynthesis.cancel();const v=pickVoice();
    [t.slice(0,2),t.slice(2)].forEach(s=>{const u=new SpeechSynthesisUtterance(s);u.lang='zh-TW';if(v)u.voice=v;u.rate=0.72;u.pitch=1.12;speechSynthesis.speak(u);});
  }catch(e){}
}
function options(ans,a,b){
  const set=new Set([ans]);
  for(const c of shuffle([(a+1)*b,(a-1)*b,a*(b+1),a*(b-1),ans+1,ans-1,ans+2,ans-2,ans+10,ans-10])){if(set.size>=4)break;if(c>0&&c<=90)set.add(c);}
  let x=ans+3;while(set.size<4)set.add(x++);
  return shuffle([...set]);
}

/* ---------- save ---------- */
let P={s:{},pet:null,c:0,own:[],wear:{}};
try{const x=JSON.parse(localStorage.getItem('jj-learn'));if(x)P=Object.assign(P,x);}catch(e){}
function save(){try{localStorage.setItem('jj-learn',JSON.stringify(P))}catch(e){}}
const stars=n=>P.s[n]||0, star=k=>'★'.repeat(k)+'☆'.repeat(3-k);

/* ---------- pixel sprites (16x16) ---------- */
const O='#1a1c2c';
const mk=()=>Array.from({length:16},()=>Array(16).fill(null));
function px(g,x,y,c){if(x>=0&&x<16&&y>=0&&y<16)g[y][x]=c;}
function rect(g,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(g,x+i,y+j,c);}
const ANIMALS=[
 {id:'capybara',n:'水豚'},{id:'cat',n:'貓咪'},{id:'dog',n:'小狗'},{id:'bunny',n:'兔子'},
 {id:'panda',n:'熊貓'},{id:'penguin',n:'企鵝'},{id:'frog',n:'青蛙'},{id:'fox',n:'狐狸'}];
const aname=id=>(ANIMALS.find(a=>a.id===id)||{}).n||'';
const PETS={
 capybara:{body:'#a9743f',dark:'#6b4423',belly:'#c99a62',nose:'#3b2412'},
 cat:{body:'#f2a65a',dark:'#c26a2b',belly:'#fbe3c2',nose:'#e86a8a',inner:'#ffb3c1'},
 dog:{body:'#d9b07a',dark:'#7a4b2a',belly:'#f6ead6',nose:'#2a1a12'},
 bunny:{body:'#f1f1f4',dark:'#c9c9d6',belly:'#ffffff',nose:'#f08fa6',inner:'#f6b6c6'},
 panda:{body:'#f7f7f7',dark:'#23232b',belly:'#ffffff',nose:'#23232b'},
 penguin:{body:'#2b3a67',dark:'#1f2a4d',belly:'#ffffff',nose:'#f5a623',feet:'#f5a623'},
 frog:{body:'#5cc75f',dark:'#2f8f3a',belly:'#b9f0a0',nose:'#2f8f3a'},
 fox:{body:'#ec7a2c',dark:'#b44a14',belly:'#ffffff',nose:'#2a1a12'}
};
function outlineGrid(g){
  const og=g.map(r=>r.slice());
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(g[y][x])continue;
    if((y>0&&g[y-1][x])||(y<15&&g[y+1][x])||(x>0&&g[y][x-1])||(x<15&&g[y][x+1]))og[y][x]=O;
  }
  return og;
}
function capyGrid(){
  const g=mk(),B='#b9824a',Dk='#8a5a2e',L='#d6a876',N='#3b2412';
  // side view, facing right: long loaf body, blunt head, big dark nose
  rect(g,2,6,9,1,Dk);rect(g,1,7,11,5,B);rect(g,2,12,9,1,B);
  rect(g,3,10,7,2,L);
  px(g,4,8,Dk);px(g,7,7,Dk);px(g,8,9,Dk);px(g,5,9,Dk);px(g,3,8,Dk);
  rect(g,3,13,2,3,Dk);rect(g,10,13,2,3,Dk);rect(g,6,13,2,2,Dk);
  rect(g,10,6,5,5,B);rect(g,12,5,2,1,B);
  rect(g,10,4,2,2,Dk);
  rect(g,12,9,3,2,L);
  rect(g,13,7,2,2,N);px(g,13,7,'#8a5a33');
  px(g,13,10,Dk);
  px(g,11,6,O);
  return outlineGrid(g);
}
function petGrid(id){
  if(id==='capybara')return capyGrid();
  const p=PETS[id],g=mk(),B=p.body,Dk=p.dark,Bl=p.belly;
  // ears and tails (behind)
  if(id==='capybara'||id==='panda'){rect(g,3,2,2,2,Dk);rect(g,11,2,2,2,Dk);}
  if(id==='cat'||id==='fox'){
    [[3,0,1],[3,1,2],[3,2,3],[12,0,1],[11,1,2],[10,2,3]].forEach(([x,y,w])=>rect(g,x,y,w,1,B));
    if(id==='fox'){px(g,3,0,Dk);px(g,12,0,Dk);}
    if(id==='cat'){px(g,4,2,p.inner);px(g,11,2,p.inner);}
  }
  if(id==='bunny'){rect(g,4,0,2,3,B);rect(g,10,0,2,3,B);rect(g,5,1,1,2,p.inner);rect(g,10,1,1,2,p.inner);}
  if(id==='frog'){rect(g,3,2,3,3,B);rect(g,10,2,3,3,B);}
  if(id==='cat')[[12,13],[13,13],[13,12],[13,11],[14,10]].forEach(([x,y])=>px(g,x,y,B));
  if(id==='fox'){rect(g,12,11,3,3,B);px(g,14,12,Bl);px(g,14,13,Bl);}
  // body
  rect(g,4,10,8,5,B);
  if(id==='penguin'){rect(g,5,10,6,5,Bl);rect(g,3,10,1,4,Dk);rect(g,12,10,1,4,Dk);}
  else rect(g,6,10,4,4,Bl);
  if(id==='panda'){rect(g,4,10,2,3,Dk);rect(g,10,10,2,3,Dk);}
  rect(g,4,15,2,1,p.feet||Dk);rect(g,10,15,2,1,p.feet||Dk);
  // head
  rect(g,4,3,8,1,B);rect(g,3,4,10,5,B);rect(g,4,9,8,1,B);
  if(id==='dog'){rect(g,2,3,2,5,Dk);rect(g,12,3,2,5,Dk);}
  if(id==='cat'){px(g,6,3,Dk);px(g,9,3,Dk);}
  // face
  if(id==='panda'){rect(g,4,5,3,3,Dk);rect(g,9,5,3,3,Dk);px(g,5,6,'#fff');px(g,10,6,'#fff');}
  else if(id==='frog'){rect(g,4,3,2,2,'#fff');rect(g,10,3,2,2,'#fff');px(g,5,4,O);px(g,10,4,O);rect(g,5,8,6,1,Dk);}
  else{
    if(id==='penguin')rect(g,4,5,8,4,Bl);
    px(g,5,6,O);px(g,10,6,O);
  }
  if(id==='capybara'){rect(g,5,7,6,3,Bl);rect(g,6,7,4,1,p.nose);rect(g,7,9,2,1,Dk);}
  else if(id==='penguin'){rect(g,7,7,2,2,p.nose);}
  else if(id==='frog'){}
  else{
    if(id==='dog'||id==='fox')rect(g,6,7,4,3,Bl);
    rect(g,7,7,2,1,p.nose);
  }
  if(id==='cat'||id==='bunny'||id==='panda'){px(g,4,8,'#ff9aa8');px(g,11,8,'#ff9aa8');}
  if(id==='fox'){px(g,4,8,Bl);px(g,11,8,Bl);}
  // outline
  const og=g.map(r=>r.slice());
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(g[y][x])continue;
    if((y>0&&g[y-1][x])||(y<15&&g[y+1][x])||(x>0&&g[y][x-1])||(x<15&&g[y][x+1]))og[y][x]=O;
  }
  return og;
}
const ACC={
 flower:{n:'小花',cost:25,slot:'side',ox:10,oy:2,rows:['.P.','PYP','.P.'],pal:{P:'#ff7eb6',Y:'#ffd34d'}},
 bow:{n:'蝴蝶結',cost:25,slot:'side',ox:10,oy:2,rows:['BB.BB','BBYBB','BB.BB'],pal:{B:'#ff5fa2',Y:'#ffd34d'}},
 shades:{n:'太陽眼鏡',cost:40,slot:'eyes',ox:4,oy:5,rows:['KWKKKKWK','KKK..KKK'],pal:{K:'#1a1c2c',W:'#8fd3ff'}},
 scarf:{n:'圍巾',cost:50,slot:'neck',ox:3,oy:10,rows:['RRWRRWRRWR','.RW.......'],pal:{R:'#e8454f',W:'#ffffff'}},
 party:{n:'派對帽',cost:50,slot:'head',ox:5,oy:0,rows:['..YY..','.RRRR.','.WWWW.','RRRRRR'],pal:{R:'#e8454f',W:'#ffffff',Y:'#ffd34d'}},
 phones:{n:'耳機',cost:70,slot:'ears',ox:1,oy:2,rows:['..GGGGGGGGGG..','.G..........G.','.G..........G.','RR..........RR','RR..........RR','RR..........RR'],pal:{G:'#6c7a89',R:'#4d9bff'}},
 crown:{n:'皇冠',cost:90,slot:'head',ox:5,oy:1,rows:['G.GG.G','GGGGGG','DRDDRD'],pal:{G:'#ffd34d',D:'#d89b00',R:'#e8454f'}},
 cape:{n:'披風',cost:100,slot:'back',ox:2,oy:9,rows:['.RRRRRRRRRR.','RRRRRRRRRRRR','RRRRRRRRRRRR','RRRRRRRRRRRR','RRRRRRRRRRRR','DDDDDDDDDDDD'],pal:{R:'#8a4fe0',D:'#5e2fa8'}}
};
function stamp(g,a){a.rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.')px(g,a.ox+i,a.oy+j,a.pal[ch]);}));}
const SLOTS=['neck','eyes','ears','side','head'];
const CAPYACC={
  party:{ox:9,oy:1},crown:{ox:9,oy:2},shades:{ox:8,oy:6},flower:{ox:12,oy:3},bow:{ox:11,oy:3},
  scarf:{ox:9,oy:6,rows:['RW','RR','WR','RR','RW']},
  phones:{ox:10,oy:4,rows:['.GGGG','RR...','RR...','RR...']},
  cape:{ox:2,oy:6,layer:'front',rows:['RRRRRRR','RRRRRRR','RRRRRRR','DDDDDDD']}
};
function accFor(id,pet){const a=ACC[id];if(!a)return null;const o=pet==='capybara'&&CAPYACC[id];return o?Object.assign({},a,o):a;}
function compose(id,wear){
  wear=wear||{};const g=mk();
  const ba=accFor(wear.back,id);
  if(ba&&ba.layer!=='front')stamp(g,ba);
  const pg=petGrid(id);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(pg[y][x])g[y][x]=pg[y][x];
  SLOTS.forEach(s=>{const a=accFor(wear[s],id);if(a)stamp(g,a);});
  if(ba&&ba.layer==='front')stamp(g,ba);
  return g;
}
const COIN=['..OOOO..','.OGGGGO.','OGGYGGGO','OGYGGGGO','OGGGGGDO','OGGGGDDO','.OGDDDO.','..OOOO..']
  .map(r=>[...r].map(ch=>ch==='.'?null:({O:O,G:'#ffd34d',Y:'#fff3a0',D:'#d89b00'})[ch]));
function paint(cv,g){
  const n=g.length;cv.width=n;cv.height=n;const x=cv.getContext('2d');x.clearRect(0,0,n,n);
  g.forEach((r,y)=>r.forEach((c,xx)=>{if(c){x.fillStyle=c;x.fillRect(xx,y,1,1);}}));
}
function paintAll(){
  document.querySelectorAll('canvas[data-k]').forEach(cv=>{
    const [k,v]=cv.dataset.k.split(':');
    if(k==='coin')paint(cv,COIN);
    else if(k==='pet')paint(cv,compose(v,{}));
    else if(k==='me')paint(cv,compose(P.pet,P.wear));
    else if(k==='try'&&ACC[v])paint(cv,compose(P.pet,{[ACC[v].slot]:v}));
  });
}
new MutationObserver(paintAll).observe(view,{childList:true,subtree:true});
const coinImg=s=>`<canvas class="px" data-k="coin" style="width:${s}px;height:${s}px;display:inline-block;vertical-align:middle;margin:0"></canvas>`;
function hud(){
  const h=$('hud');
  if(!P.pet){h.hidden=true;return;}
  h.hidden=false;
  h.innerHTML=`<canvas class="px" data-k="me" style="width:44px;height:44px"></canvas><span class="coins">${coinImg(22)}<b class="num">${P.c}</b></span>`;
  paintAll();
}
let EA=0;
function earn(k){P.c+=k;EA+=k;save();hud();}
const plus=k=>k>0?`<span class="gain">+${k} ${coinImg(18)}</span>`:'';

/* ---------- screens ---------- */
function arr(n,rows,hi,ghost){
  let h=`<div class="arr" style="--c:${n};--s:${n>6?22:28}px" aria-hidden="true">`;
  for(let r=1;r<=rows+(ghost?1:0);r++){const c=ghost&&r>rows?'g':(hi&&r===rows?'h':'');for(let k=0;k<n;k++)h+=`<i class="${c}"></i>`;}
  return h+'</div>';
}
function head(n,st){
  const names=['學','接龍','測驗','複習'];
  view.innerHTML=`<div class="top"><button class="btn alt sm" id="bk">← 地圖</button><strong>${n} 的乘法</strong></div>
  <ol class="steps">${names.map((x,k)=>`<li class="${k===st?'on':k<st?'done':''}">${x}</li>`).join('')}</ol><div id="body"></div>`;
  $('bk').onclick=map;
}

/* pick a pet */
let offer=null;
function newOffer(){offer=shuffle([ANIMALS[0],...shuffle(ANIMALS.slice(1)).slice(0,4)]);}
function pick(sel){
  if(!offer)newOffer();
  hud();
  view.innerHTML=`<h2 class="t">選一隻寵物</h2><p class="sub">牠會陪你學九九乘法表。答對題目賺金幣，幫牠買新裝備！</p>
  <div class="pets" id="pl"></div>
  <div class="row"><button class="btn alt" id="rr">換一批</button>${P.pet?'<button class="btn alt" id="cc">取消</button>':''}<button class="btn" id="ok" ${sel?'':'disabled'}>就是你了！</button></div>`;
  offer.forEach(a=>{
    const b=document.createElement('button');b.className='pc'+(sel===a.id?' sel':'');
    b.innerHTML=`<canvas class="px" data-k="pet:${a.id}"></canvas><span>${a.n}</span>`;
    b.onclick=()=>pick(a.id);$('pl').appendChild(b);
  });
  $('rr').onclick=()=>{newOffer();pick(null);};
  if(P.pet)$('cc').onclick=()=>{offer=null;map();};
  $('ok').onclick=()=>{P.pet=sel;save();offer=null;map();};
}

/* map */
function map(){
  if(!P.pet){pick(null);return;}
  hud();
  const total=Object.values(P.s).reduce((a,b)=>a+b,0);
  view.innerHTML=`<div class="card home"><canvas class="px big bob" data-k="me" style="margin:0"></canvas>
  <div><strong style="font-size:1.2rem">我的${aname(P.pet)}</strong>
  <div class="row l"><button class="btn sm" id="sh">商店</button><button class="btn alt sm" id="cp">換寵物</button></div></div></div>
  <p class="sub">選一關開始：先學，再接龍，再測驗（最多錯一題），最後複習。已收集 ${total} / 27 顆星。</p><div class="map" id="mp"></div>`;
  $('sh').onclick=()=>shop(map);
  $('cp').onclick=()=>pick(null);
  for(let n=1;n<=9;n++){
    const b=document.createElement('button');b.className='lv'+(stars(n)?' done':'');
    b.innerHTML=`<b>${n}</b><span>${n} 的乘法</span><span class="st">${star(stars(n))}</span>`;
    b.onclick=()=>learn(n,1);$('mp').appendChild(b);
  }
}

/* shop */
function shop(ret){
  hud();const y=window.scrollY;
  view.innerHTML=`<div class="top"><button class="btn alt sm" id="bk">← 返回</button><strong>商店</strong></div>
  <div class="card center"><canvas class="px big bob" data-k="me"></canvas><p class="sub" style="margin:8px 0 0">買了會自動穿上；已擁有的可以隨時穿脫。</p></div><div class="shop" id="sl"></div>`;
  Object.keys(ACC).forEach(id=>{
    const a=ACC[id],own=P.own.includes(id),on=P.wear[a.slot]===id;
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<canvas class="px" data-k="try:${id}"></canvas><b>${a.n}</b>
    <span class="price">${own?'已擁有':coinImg(16)+'<span class="num">'+a.cost+'</span>'}</span>
    <button class="btn sm ${own?'alt':''}" ${(!own&&P.c<a.cost)?'disabled':''}>${own?(on?'脫下':'穿上'):'購買'}</button>`;
    d.querySelector('button').onclick=()=>{
      if(!own){if(P.c<a.cost)return;P.c-=a.cost;P.own.push(id);P.wear[a.slot]=id;}
      else if(on)delete P.wear[a.slot];else P.wear[a.slot]=id;
      save();shop(ret);
    };
    $('sl').appendChild(d);
  });
  $('bk').onclick=ret;
  window.scrollTo(0,y);
}

/* stage 1: learn */
function learn(n,b){
  head(n,0);const p=n*b;
  $('body').innerHTML=`<div class="card"><div class="q">${n} × ${b} = ${p}</div><div class="kou">${kou(n,b)}</div>${arr(n,b,true)}
  <p class="fb">${b>1?`${n*(b-1)} + ${n} = ${p}，每多一排就多 ${n}。`:`先放 1 排，每排 ${n} 顆。`}</p>
  <div class="row"><button class="btn alt" id="pv" ${b===1?'disabled':''}>上一個</button><button class="btn alt" id="sp">唸口訣</button><button class="btn" id="nx">${b<9?'下一個':'去接龍'}</button></div></div>`;
  $('pv').onclick=()=>learn(n,b-1);
  $('sp').onclick=()=>say(kou(n,b));
  $('nx').onclick=()=>b<9?learn(n,b+1):prac(n,2);
}

/* stage 2: skip-add practice (+5 coins for first-try answers) */
function prac(n,b){
  head(n,1);const prev=n*(b-1),p=n*b;let missed=false;
  $('body').innerHTML=`<div class="card"><p class="center sub" style="margin-bottom:4px">已知 ${n} × ${b-1} = ${prev}</p><div class="q">${n} × ${b} = ?</div>${arr(n,b-1,false,true)}
  <div class="opts" id="op"></div><div class="fb" id="fb" aria-live="polite">多放一排，就多 ${n}。</div><div class="row"><button class="btn" id="nx" hidden>${b<9?'下一題':'去測驗'}</button></div></div>`;
  options(p,n,b).forEach(v=>{
    const o=document.createElement('button');o.className='opt';o.textContent=v;
    o.onclick=()=>{
      if(v===p){
        document.querySelectorAll('.opt').forEach(x=>x.disabled=true);o.classList.add('ok');
        if(!missed)earn(5);
        $('fb').innerHTML=`答對了！${prev} + ${n} = ${p}<br><strong>${kou(n,b)}</strong><br>${plus(missed?0:5)}`;
        $('nx').hidden=false;$('nx').focus();
      }else{missed=true;o.classList.add('no');o.disabled=true;$('fb').innerHTML=`再想想：${prev} + ${n} = ?`;}
    };
    $('op').appendChild(o);
  });
  $('nx').onclick=()=>b<9?prac(n,b+1):startTest(n);
}

/* stage 3: test, 1 mistake allowed */
let T=null;
function startTest(n){
  EA=0;
  T={n,i:0,w:[],res:[],lock:false,qs:shuffle([1,2,3,4,5,6,7,8,9]).map(b=>Math.random()<.5?{a:b,b:n}:{a:n,b})};
  tq();
}
function tq(){window.KA&&KA.shown();
  const n=T.n,q=T.qs[T.i],ans=q.a*q.b;head(n,2);T.lock=false;
  $('body').innerHTML=`<div class="card"><div class="rail">${T.qs.map((_,k)=>`<i class="${k===T.i?'now':k<T.i?(T.res[k]?'ok':'no'):''}" id="r${k}"></i>`).join('')}</div>
  <div class="stat"><span>第 ${T.i+1} / 9 題</span><span>可錯 ${Math.max(0,1-T.w.length)} 題</span></div>
  <div class="q">${q.a} × ${q.b} = ?</div><div class="opts" id="op"></div>
  <div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="nx" hidden></button></div></div>`;
  options(ans,q.a,q.b).forEach(v=>{
    const o=document.createElement('button');o.className='opt';o.textContent=v;o.dataset.v=v;
    o.onclick=()=>{
      if(T.lock)return;T.lock=true;const ok=v===ans;try{window.KA&&KA.answer({q:q.a+' × '+q.b,given:v,expected:ans,correct:ok,tryNo:1,topic:T.n+'s times table'});}catch(e){}
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.v===ans)x.classList.add('ok');else if(x===o)x.classList.add('no');});
      T.res[T.i]=ok;$('r'+T.i).className=ok?'ok':'no';if(!ok)T.w.push(q);else earn(5);
      $('fb').innerHTML=`${ok?'答對了！':'答錯了。'}<br><strong>${kou(q.a,q.b)}</strong>　${q.a} × ${q.b} = ${ans}<br>${plus(ok?5:0)}`;
      const over=T.w.length>=2,last=T.i===8;
      $('nx').hidden=false;$('nx').textContent=(over||last)?'看結果':'下一題';$('nx').focus();
      $('nx').onclick=()=>{if(over)fail();else if(last)pass();else{T.i++;tq();}};
    };
    $('op').appendChild(o);
  });
}
function fail(){
  const n=T.n;head(n,2);
  $('body').innerHTML=`<div class="card"><div class="bigtxt">已錯兩題，再練習一下吧</div>
  <p class="center">本次獲得 ${EA} 金幣 ${coinImg(18)}</p>
  <ul class="w">${T.w.map(q=>`<li>${q.a} × ${q.b} = ${q.a*q.b}　<strong>${kou(q.a,q.b)}</strong></li>`).join('')}</ul>
  <div class="row"><button class="btn" id="rt">再試一次</button><button class="btn alt" id="sh">去商店</button><button class="btn alt" id="rl">回去再學</button></div></div>`;
  $('rt').onclick=()=>startTest(n);$('rl').onclick=()=>learn(n,1);$('sh').onclick=()=>shop(fail);
}
function pass(){
  const n=T.n,k=T.w.length===0?3:2;
  P.s[n]=Math.max(stars(n),k);save();head(n,2);
  $('body').innerHTML=`<div class="card"><div class="stars">${star(k)}</div>
  <p class="bigtxt">${n} 的乘法過關！${n===9?'九九乘法表全部通關！':''}</p>
  <p class="center">本次獲得 ${EA} 金幣 ${coinImg(18)}</p>
  ${T.w.length?`<ul class="w">${T.w.map(q=>`<li>錯過：${q.a} × ${q.b} = ${q.a*q.b}　<strong>${kou(q.a,q.b)}</strong></li>`).join('')}</ul>`:'<p class="center sub">一題都沒錯，拿到 3 顆星。</p>'}
  <div class="row"><button class="btn" id="rv">複習測驗（5 題）</button><button class="btn alt" id="sh">去商店</button>${n<9?'<button class="btn alt" id="go">下一關</button>':''}<button class="btn alt" id="mp">回地圖</button></div></div>`;
  $('rv').onclick=()=>startReview(n);$('sh').onclick=()=>shop(pass);if(n<9)$('go').onclick=()=>learn(n+1,1);$('mp').onclick=map;
}

/* stage 4: review, 5 random facts from tables 1..n */
let R=null;
function startReview(n){
  EA=0;
  const seen=new Set(),pool=[];
  for(let a=1;a<=n;a++)for(let b=1;b<=9;b++){const k=Math.min(a,b)+'x'+Math.max(a,b);if(!seen.has(k)){seen.add(k);pool.push([a,b]);}}
  R={n,i:0,w:[],res:[],lock:false,qs:shuffle(pool).slice(0,5).map(([a,b])=>Math.random()<.5?{a:b,b:a}:{a,b})};
  rq();
}
function rq(){window.KA&&KA.shown();
  const q=R.qs[R.i],ans=q.a*q.b;head(R.n,3);R.lock=false;
  $('body').innerHTML=`<div class="card"><div class="rail">${R.qs.map((_,k)=>`<i class="${k===R.i?'now':k<R.i?(R.res[k]?'ok':'no'):''}"></i>`).join('')}</div>
  <div class="stat"><span>第 ${R.i+1} / 5 題</span><span>複習 1–${R.n} 的乘法</span></div>
  <div class="q">${q.a} × ${q.b} = ?</div><div class="opts" id="op"></div>
  <div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="nx" hidden></button></div></div>`;
  options(ans,q.a,q.b).forEach(v=>{
    const o=document.createElement('button');o.className='opt';o.textContent=v;o.dataset.v=v;
    o.onclick=()=>{
      if(R.lock)return;R.lock=true;const ok=v===ans;try{window.KA&&KA.answer({q:q.a+' × '+q.b,given:v,expected:ans,correct:ok,tryNo:1,topic:'times table review 1–'+R.n});}catch(e){}
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.v===ans)x.classList.add('ok');else if(x===o)x.classList.add('no');});
      R.res[R.i]=ok;if(!ok)R.w.push(q);else earn(5);
      $('fb').innerHTML=`${ok?'答對了！':'答錯了。'}<br><strong>${kou(q.a,q.b)}</strong>　${q.a} × ${q.b} = ${ans}<br>${plus(ok?5:0)}`;
      const last=R.i===4;$('nx').hidden=false;$('nx').textContent=last?'看結果':'下一題';$('nx').focus();
      $('nx').onclick=()=>{if(last)rdone();else{R.i++;rq();}};
    };
    $('op').appendChild(o);
  });
}
function rdone(){
  const n=R.n,ok=5-R.w.length;head(n,3);
  $('body').innerHTML=`<div class="card"><div class="stars num" style="font-size:1.4rem">${ok} / 5</div>
  <p class="bigtxt">${ok===5?'複習全對！':'複習完成'}</p>
  <p class="center">本次獲得 ${EA} 金幣 ${coinImg(18)}</p>
  ${R.w.length?`<ul class="w">${R.w.map(q=>`<li>錯過：${q.a} × ${q.b} = ${q.a*q.b}　<strong>${kou(q.a,q.b)}</strong></li>`).join('')}</ul>`:''}
  <div class="row"><button class="btn" id="sh">去商店</button><button class="btn alt" id="ra">再複習一次</button>${n<9?'<button class="btn alt" id="go">下一關</button>':''}<button class="btn alt" id="mp">回地圖</button></div></div>`;
  $('sh').onclick=()=>shop(rdone);$('ra').onclick=()=>startReview(n);if(n<9)$('go').onclick=()=>learn(n+1,1);$('mp').onclick=map;
}

map();
</script>
</body>
</html>
