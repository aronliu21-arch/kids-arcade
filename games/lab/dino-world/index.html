<title>Milo's Dino World · 洛明的恐龍世界</title>
<style>

// a story beat: characters placed left→right (x fraction, size, face-left), plus a prop
function propSVG(kind,x,W,H,state,u){const g=H*.9;let o='';
 if(kind==='grass'){const h=u*(state==='hide'?.8:state==='peek'?.36:.15);for(let k=-6;k<=6;k++){const bx=x+k*u*.05,c=k%2?'#2b8a3e':'#40c057';o+=`<path d="M${bx-u*.04} ${g+4} Q${bx+k*2} ${g-h*.6} ${bx+k*3} ${g-h*(.8+((k*7+13)%5)*.06)} Q${bx+4} ${g-h*.5} ${bx+u*.04} ${g+4}Z" fill="${c}" ${ST} stroke-width="2"/>`;}}
 if(kind==='bridge'){const x0=W*.36,x1=W*.74;o+=`<rect x="${x0-10}" y="${g-6}" width="${x1-x0+20}" height="${u*.2}" fill="#339af0" ${ST}/><path d="M${x0} ${g-6} Q${(x0+x1)/2} ${g-u*.14} ${x1} ${g-6}" stroke="#8b5a2b" stroke-width="${u*.05}" fill="none"/>`;
  for(let k=0;k<=10;k++){const px=x0+(x1-x0)*k/10,py=g-6-Math.sin(Math.PI*k/10)*u*.11;o+=`<rect x="${px-5}" y="${py-6}" width="10" height="12" rx="2" fill="#c08552" ${ST} stroke-width="1.5"/>`;}}
 if(kind==='snow'){const s2=state==='open'?.45:1;o+=`<ellipse cx="${x}" cy="${g}" rx="${u*.7*s2}" ry="${u*.6*s2}" fill="#fff" ${ST}/><ellipse cx="${x-u*.22*s2}" cy="${g-u*.25*s2}" rx="${u*.22*s2}" ry="${u*.09*s2}" fill="#e7f5ff"/>`;}
 if(kind==='rocks'){const h=u*(state==='peek'?.5:1),w=u*.9;o+=`<path d="M${x-w} ${g+4} L${x-w*.8} ${g-h*.7} L${x-w*.3} ${g-h} L${x+w*.25} ${g-h*.8} L${x+w*.75} ${g-h*.9} L${x+w} ${g+4}Z" fill="#868e96" ${ST} stroke-width="3"/><path d="M${x-w*.5} ${g-h*.5} l${w*.2} -${h*.12} M${x+w*.3} ${g-h*.4} l${w*.15} ${h*.1}" stroke="#495057" stroke-width="3" fill="none"/>`;}
 return o;}
function viewSVG(v,spk,W,H){const base=Math.min(H*.55,W*.3);let o='';const pr=v.prop;
 if(pr&&pr[0]==='bridge')o+=propSVG('bridge',W*pr[1],W,H,pr[2],base);
 v.items.forEach(([k,xf,sc,left])=>{const c=CAST[k];if(!c)return;const sz=base*sc/100;const x=W*xf-50*sz;const fly=TPL[c.t].fly;const y=(fly?H*.55:H*.9)-80*sz;
  o+=`<g transform="translate(${left?x+100*sz:x},${y}) scale(${left?-sz:sz},${sz})"><g class="${k===spk?'talk':''}">${dinoSVG(c.t,c.c)}</g></g>`;
  if(k==='goal'&&c.name)o+=`<g><rect x="${W*xf-26}" y="${H*.9+2}" width="52" height="20" rx="7" fill="#fff" ${ST} stroke-width="2"/><text x="${W*xf}" y="${H*.9+17}" text-anchor="middle" font-size="14" font-weight="900" fill="#4a3426">${c.name}</text></g>`;});
 if(pr&&pr[0]!=='bridge')o+=propSVG(pr[0],W*pr[1],W,H,pr[2],base);
 if(v.hearts)for(let k=0;k<5;k++)o+=`<text x="${W*(.3+k*.1)}" y="${H*(.18+(k%2)*.08)}" font-size="${Math.min(W,H)*.08}">❤️</text>`;
 return o;}

function scene(area,cast,lines,done){musicOff();const m=document.createElement('div');m.className='scene';
 m.innerHTML=`<div class="stage2" id="scStage"></div><div class="say"><span class="who" id="scWho"></span><div class="lines" id="scLine"></div><button class="nx" id="scNext" aria-label="Next">▶</button></div>`;
 document.body.appendChild(m);let i=-1;
 const draw=(spk,view)=>{const r=$('scStage').getBoundingClientRect();const W=Math.max(300,r.width),H=Math.max(200,r.height);let o=areaArt(area,W,H);
  if(view){$('scStage').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${o+viewSVG(view,spk,W,H)}</svg>`;return;}
  const list=cast.filter(k=>CAST[k]&&CAST[k].t);const base=Math.min(H*.62,W/(list.length+.6)*.9);
  list.forEach((k,j)=>{const c=CAST[k];const sz=base*c.sz/100;const x=W*(j+1)/(list.length+1)-50*sz,y=H*.9-80*sz;const flip=x>W/2&&k!=='pip';
   o+=`<g transform="translate(${flip?x+100*sz:x},${y}) scale(${flip?-sz:sz},${sz})"><g class="${k===spk?'talk':''}">${dinoSVG(c.t,c.c)}</g></g>`;});
  $('scStage').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;};
 const next=()=>{i++;if(i>=lines.length){m.remove();SOLVE=prevSolve;done&&done();return;}const [who,en,z,view]=lines[i];
  draw(who,view);$('scWho').textContent=(CAST[who]&&CAST[who].em)||'⭐';$('scLine').innerHTML=bi(en,z);say(en,z,null,CAST[who]&&CAST[who].pitch);};

function bpt(b,t){const u=1-t;return [0,1].map(i=>u*u*u*b[0][i]+3*u*u*t*b[1][i]+3*u*t*t*b[2][i]+t*t*t*b[3][i]);}
function bdir(b,t){const u=1-t;return [0,1].map(i=>3*u*u*(b[1][i]-b[0][i])+6*u*t*(b[2][i]-b[1][i])+3*t*t*(b[3][i]-b[2][i]));}

  return function judge(ok,given){if(done||!A||A.n!==qi)return false;
   rec({q:o.label||g.en,given:String(given??''),expected:String(o.expected??''),correct:!!ok,tryNo:tries+1,qid:`${A.id}-${qi}`,topic:g.topic});
   if(ok){done=true;const p=tries?1:2;A.pts+=p;A.marks[qi]=p;A.n++;drawDots();SFX.ding();toast(`+${p} 🧱`);if(!o.quiet){const w=o.win||praise();say(w[0],w[1]);}setTimeout(()=>then(p),o.wait||1300);return true;}
   tries++;SFX.boing();
   if(tries===1){o.hint&&o.hint();const r=o.retry||['Try again!','再試一次!'];say(r[0],r[1]);}
   else{done=true;o.reveal&&o.reveal();A.marks[qi]=0;A.n++;drawDots();const w=o.why||['Here it is!','答案在這裡!'];say(w[0],w[1]);setTimeout(()=>then(0),2600);}
   return false;};},
 end(){endGame();}};
