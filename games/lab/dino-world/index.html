<html lang="en"><head><meta charset="utf-8">

<title>Milo's Dino World · 洛明的恐龍世界</title>
<style>
:root{--ink:#1b1f3b;--bg:#e9f7ef;--card:#fff;--muted:#5b6782;--ok:#2b8a3e;--bad:#e03131;--gold:#ffd43b;--milo:#2f9e44;--blue:#1c7ed6;color-scheme:light;
--font:"Arial Rounded MT Bold",ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

.main{flex:1;min-height:0;position:relative}

function tone(f,d,type,v,when,dest,f2){const a=ac();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);}

function draggable(el,onEnd){el.classList.add('drag');el.addEventListener('pointerdown',e=>{if(el.dataset.lock)return;e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}const sx=e.clientX,sy=e.clientY;let moved=false;
 const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.hypot(dx,dy)>10)moved=true;if(moved){el.classList.add('lift');el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;}};
 const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.classList.remove('lift');el.style.transform='';
  if(!moved){onEnd(null,true);return;}const t=document.elementsFromPoint(ev.clientX,ev.clientY).find(n=>n!==el&&n.dataset&&n.dataset.drop!==undefined);onEnd(t||null,false);};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});}

const ST='stroke="#1b1f3b" stroke-width="2.4" stroke-linejoin="round"';
function shade(h,f){const n=parseInt(h.slice(1),16);const g=x=>Math.max(0,Math.min(255,Math.round(f>1?x+(255-x)*(f-1):x*f)));return '#'+[g(n>>16),g(n>>8&255),g(n&255)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function geoSVG(s,g,fill,cls,extra){cls=cls?` class="${cls}"`:'';extra=extra||'';
 if(s==='tri')return `<polygon${cls} points="${g.p.map(q=>q.join(',')).join(' ')}" fill="${fill}" ${ST} ${extra}/>`;
 if(s==='circ')return `<ellipse${cls} cx="${g.x+g.w/2}" cy="${g.y+g.h/2}" rx="${g.w/2}" ry="${g.h/2}" fill="${fill}" ${ST} ${extra}/>`;
 if(s==='semi')return `<path${cls} d="M${g.x},${g.y+g.h} A${g.w/2},${g.h} 0 0 1 ${g.x+g.w},${g.y+g.h} Z" fill="${fill}" ${ST} ${extra}/>`;
 return `<rect${cls} x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="2.5" fill="${fill}" ${ST} ${extra}/>`;}
// lego-like brick: studs, a darker lower band for depth, and a shine
function brick(s,g,hex){let o='';const dk=shade(hex,.78);
 if((s==='rect'||s==='sq')&&g.w>=10){const n=Math.max(1,Math.floor(g.w/10)),gap=g.w/n;for(let i=0;i<n;i++)o+=`<rect x="${(g.x+gap*i+gap/2-3).toFixed(1)}" y="${g.y-3.6}" width="6" height="4.4" rx="1.2" fill="${dk}" ${ST}/>`;}
 if(s==='semi')o+=`<ellipse cx="${g.x+g.w/2}" cy="${g.y+2}" rx="3.2" ry="2.4" fill="${dk}" ${ST}/>`;
 o+=geoSVG(s,g,hex);
 if(s==='rect'||s==='sq'){o+=`<rect x="${g.x+1.2}" y="${g.y+g.h*.68}" width="${g.w-2.4}" height="${g.h*.3}" rx="2" fill="${dk}" opacity=".45"/><rect x="${g.x+2.5}" y="${g.y+2.5}" width="${Math.max(2,g.w-5)}" height="2.6" rx="1.3" fill="#fff" opacity=".5"/>`;}
 if(s==='circ')o+=`<ellipse cx="${g.x+g.w*.35}" cy="${g.y+g.h*.3}" rx="${g.w*.12}" ry="${g.h*.08}" fill="#fff" opacity=".55"/>`;
 if(s==='semi')o+=`<path d="M${g.x+g.w*.2},${g.y+g.h*.55} Q${g.x+g.w*.3},${g.y+g.h*.2} ${g.x+g.w*.5},${g.y+g.h*.15}" stroke="#fff" stroke-width="2.4" fill="none" opacity=".5" stroke-linecap="round"/>`;
 if(s==='tri'){const p=g.p,cx=(p[0][0]+p[1][0]+p[2][0])/3,cy=(p[0][1]+p[1][1]+p[2][1])/3;o+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.6" fill="#fff" opacity=".5"/>`;}
 return o;}
function iconGeo(s){return {sq:{x:12,y:12,w:36,h:36},rect:{x:4,y:18,w:52,h:26},tri:{p:[[30,6],[56,52],[4,52]]},circ:{x:8,y:8,w:44,h:44},semi:{x:4,y:22,w:52,h:28}}[s];}
function shapeIcon(s,hex){if(s==='star')return `<svg viewBox="0 0 60 60"><polygon points="30,4 37,22 57,23 41,35 47,55 30,43 13,55 19,35 3,23 23,22" fill="${hex}" ${ST}/></svg>`;
 if(s==='heart')return `<svg viewBox="0 0 60 60"><path d="M30 54C8 38 2 28 6 17c4-10 18-11 24-1 6-10 20-9 24 1 4 11-2 21-24 37z" fill="${hex}" ${ST}/></svg>`;
 if(s==='dia')return `<svg viewBox="0 0 60 60"><polygon points="30,3 54,30 30,57 6,30" fill="${hex}" ${ST}/></svg>`;
 return `<svg viewBox="-2 -6 64 64">${brick(s,iconGeo(s),hex)}</svg>`;}

const pieces=t=>{const o=[];TPL[t].steps.forEach((st,i)=>st.g.forEach(g=>o.push({s:st.s,g,step:i})));return o;};
const pieceCount=t=>pieces(t).length;
function needOf(t){const n={};pieces(t).forEach(p=>n[p.s]=(n[p.s]||0)+1);return n;}
function canBuild(t){const n=needOf(t);return Object.keys(n).every(s=>S.bin[s].length>=n[s]);}
function stepCols(t){const c=shuffle(CK);return pieces(t).map(p=>c[p.step%c.length]);}
function solid(t,c){return pieces(t).map(()=>c);}
// a whole dino. cols = one color per piece. opts.built = pieces done (blueprint), opts.cur = piece being asked for
function dinoSVG(t,cols,opts){opts=opts||{};const T=TPL[t];const items=[];const all=opts.built===undefined;
 pieces(t).forEach((p,k)=>{const built=all||k<opts.built;let svg=built?brick(p.s,p.g,COL[cols[k]]?COL[cols[k]][0]:cols[k]):geoSVG(p.s,p.g,'',`slot${opts.cur===k?' now':''}`);
  if(built&&opts.popIdx===k)svg=`<g class="pop">${svg}</g>`;
  if(p.g.leg!==undefined)svg=`<g data-leg="${p.g.leg}">${svg}</g>`;else if(p.g.wing)svg=`<g data-wing="1">${svg}</g>`;
  items.push({z:p.g.z||0,svg});});
 items.sort((a,b)=>a.z-b.z);let o=items.map(x=>x.svg).join('');
 if(all||opts.built>=pieceCount(t)){const [ex,ey]=T.eye;o+=`<g class="eye"><circle cx="${ex}" cy="${ey}" r="4.6" fill="#fff" ${ST}/><circle cx="${ex+1}" cy="${ey}" r="2.3" fill="#1b1f3b"/><circle cx="${ex+1.9}" cy="${ey-1.1}" r=".9" fill="#fff"/></g>`;
  o+=`<ellipse cx="${ex-3}" cy="${ey+8}" rx="3" ry="1.6" fill="#ff8787" opacity=".7"/>`;
  if(T.mouth)o+=`<path d="${T.mouth}" stroke="#1b1f3b" stroke-width="2" stroke-linecap="round" fill="none"/>`;}
 return o;}
const dinoBox=(t,cols,cls)=>`<svg class="${cls||''}" viewBox="-6 -14 112 98" style="overflow:visible">${dinoSVG(t,cols)}</svg>`;

 return out;}

 const w=[`Find the ${c[1]} ${sh[0]}!`,`找一個${c[2]}的${sh[2]}!`];$('bTxt').innerHTML=bi(w[0],w[1]);say(w[0],w[1]);

 rec({q:`build ${B.t}: ${want}`,given:`${COL[o.c][1]} ${SH[o.s][0]}`,expected:want,correct:!!o.ok,tryNo:B.tries+1,topic:'shapes-colors'});

 /* ADVENTURE 3 — dig, then spell a word */
 fossil:{kind:'adv',icon:'🦴',en:'Fossil Dig',zh:'化石挖掘',total:6,topic:'spelling',next:'zhuyin',tip:['Spell your name with toy letters!','用玩具字母拼你的名字!'],
  run(api){const words=shuffle(WORDS).slice(0,2);let wi=0;
   const word=()=>{if(wi>=2)return api.end();const [W,em]=words[wi];const decoys=shuffle(LETTERS.filter(c=>!W.includes(c))).slice(0,2);const letters=shuffle(W.split('').concat(decoys));
    const spots=shuffle([[18,30],[50,28],[82,30],[30,72],[70,72]]);
    const el=api.el;el.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span style="font-size:clamp(2.6rem,10vmin,4rem)">${em}</span><div class="boxes" id="wb">${W.split('').map(c=>`<div class="box">${c}</div>`).join('')}</div></div>
     <div class="dig" id="dig">${letters.map((c,k)=>`<button class="fl" data-l="${c}" style="left:${spots[k][0]}%;top:${spots[k][1]}%">${c}</button><div class="sand" data-hp="3" style="left:${spots[k][0]}%;top:${spots[k][1]}%"></div>`).join('')}</div>`;
    api.prompt('Brush away the sand to find letters!','把沙子刷掉,找到字母!');
    const dig=$('dig'),sands=[...dig.querySelectorAll('.sand')];let down=false,left=sands.length;const lastHit=new WeakMap();
    const brushAt=(x,y)=>{for(const s of sands){if(s.dataset.hp==='0')continue;const r=s.getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)continue;const t=performance.now();if(t-(lastHit.get(s)||0)<120)continue;lastHit.set(s,t);
      const hp=+s.dataset.hp-1;s.dataset.hp=hp;s.style.opacity=hp/3;SFX.brush();if(hp===0){left--;s.style.display='none';if(left===0)spell();}}};
    dig.addEventListener('pointerdown',e=>{down=true;brushAt(e.clientX,e.clientY);});dig.addEventListener('pointermove',e=>{if(down)brushAt(e.clientX,e.clientY);});
    addEventListener('pointerup',()=>down=false,{once:false});
    const tiles=[...dig.querySelectorAll('.fl')];tiles.forEach(t=>t.onclick=()=>{});
    SOLVE=()=>{sands.forEach(s=>{if(s.dataset.hp!=='0'){s.dataset.hp='0';s.style.display='none';left--;}});spell();};
    let spelled=0;const boxes=[...$('wb').children];
    function spell(){SFX.ding();boxes[0].classList.add('now');ask();}
    function ask(){if(spelled>=3){SFX.fanfare();say(`${W.split('').join(', ')}. ${W.toLowerCase()}!`,'');setTimeout(()=>{wi++;word();},1900);SOLVE=null;return;}
     const L=W[spelled];api.prompt(spelled===0?`${W.split('').join(' - ')}, ${W.toLowerCase()}! Tap ${L}!`:`Now tap ${L}!`,`找到字母${L}!`,null,[`Tap ${L}!`,`找到字母${L}!`]);
     const right=tiles.find(t=>t.dataset.l===L&&!t.disabled);
     const judge=api.q({label:`${W} letter ${spelled+1}`,expected:L,quiet:true,wait:450,hint:()=>right.classList.add('wiggle'),reveal:()=>right.classList.add('glow'),why:[`This is ${L}!`,`這是${L}!`]},()=>{put(right);spelled++;ask();});
     tiles.forEach(t=>t.onclick=()=>{if(t.disabled)return;if(judge(t.dataset.l===L,t.dataset.l)){}else{t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),450);}});
     SOLVE=()=>right.click();}
    function put(t){if(t.disabled)return;t.disabled=true;t.style.visibility='hidden';SFX.pop();say(t.dataset.l,'');const b=boxes[spelled];b.classList.remove('now');b.classList.add('full');if(boxes[spelled+1])boxes[spelled+1].classList.add('now');}};
   word();}},
