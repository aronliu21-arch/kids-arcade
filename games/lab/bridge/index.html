<html lang="en"><head><meta charset="utf-8">

<style>

</style></head><body data-pref="land">
<div class="app">
  <div class="top"><a href="../../../#tester" aria-label="Back to arcade">←</a><div class="ttl">🌉 Bridge Builder<span class="tag">sample</span></div><span class="pill" id="cost">💰 $0 / $4000</span><button class="ico" id="snd" aria-label="Sound">🔊</button></div>

</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];

let SOUND=true;try{SOUND=localStorage.getItem('lab.sound')!=='0';}catch(e){}
let ac=null;function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type,vol,dl){if(!SOUND)return;const c=audio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(dl||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05);}catch(e){}}

  boing(){if(!SOUND)return;const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(300,c.currentTime);o.frequency.exponentialRampToValueAtTime(90,c.currentTime+.3);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.start();o.stop(c.currentTime+.4);},
  coin(){tone(1320,.08,'square',.06);tone(1760,.12,'square',.05,.06);},honk(){tone(330,.35,'square',.09);tone(415,.35,'square',.07);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.1));}};
function say(t,rate){if(!SOUND||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.95;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
let tt=0;function toast(h,ms){const t=$('toast');t.innerHTML=h;t.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hide'),ms||1600);}
function modal(html,btns){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px"></div></div>';
  const row=m.querySelector('div>div:last-child');(btns||[]).forEach(([l,f,ghost])=>{const b=document.createElement('button');b.className='btn'+(ghost?' ghost':'');b.textContent=l;b.onclick=()=>{m.remove();f&&f();};row.appendChild(b);});document.body.appendChild(m);return m;}
$('snd').textContent=SOUND?'🔊':'🔇';$('snd').onclick=()=>{SOUND=!SOUND;$('snd').textContent=SOUND?'🔊':'🔇';try{localStorage.setItem('lab.sound',SOUND?'1':'0');}catch(e){}if(!SOUND&&'speechSynthesis' in window)speechSynthesis.cancel();};
/* Drag helper: makeDrag(el,{onDrop(el,x,y)->bool keep}) — pointer events, works with touch + mouse */
function makeDrag(el,o){el.classList.add('drag');el.addEventListener('pointerdown',e=>{if(o.can&&!o.can(el))return;e.preventDefault();audio();el.setPointerCapture(e.pointerId);

  const st={pos:el.style.position,l:el.style.left,t:el.style.top,z:el.style.zIndex,w:el.style.width};
  el.style.width=r.width+'px';el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.zIndex=30;el.style.transform='scale(1.08)';

  const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.style.transform='';
    const keep=o.drop?o.drop(el,ev.clientX,ev.clientY):false;
    if(!keep){el.style.position=st.pos;el.style.left=st.l;el.style.top=st.t;el.style.zIndex=st.z;el.style.width=st.w;}};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});}
const hit=(el,x,y)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/3,vx:rnd(-7,7),vy:rnd(-9,1),c:pick(['#ffd43b','#ff6b6b','#74c0fc','#b197fc','#69db7c'])}));let n=0;
  (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;x.fillStyle=p.c;x.fillRect(p.x,p.y,7,7);});if(++n<120)requestAnimationFrame(f);else c.remove();})();}
const W=800,H=450,ST=65,ROAD=230,X0=140,X1=660,BUDGET=4000;
const cv=$('cv'),cx=cv.getContext('2d');let sc=1,ox=0,oy=0;
const N=[];// grid nodes
for(let x=X0;x<=X1+1;x+=ST)for(const y of [ROAD-130,ROAD-65,ROAD,ROAD+65])N.push({x:x,y:y,fix:(x===X0||x===X1)&&y>=ROAD});
N.push({x:400,y:ROAD+130,fix:true,rock:true});
let beams=[],sel=null,sim=null,msg='';
const near=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<=ST*1.5+1&&a!==b;
const isRoad=b=>N[b.a].y===ROAD&&N[b.b].y===ROAD;
const costOf=b=>Math.round(Math.hypot(N[b.a].x-N[b.b].x,N[b.a].y-N[b.b].y)/ST*100);
const total=()=>beams.reduce((s,b)=>s+costOf(b),0);
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;sc=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2;draw();}
function toW(e){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;return{x:((e.clientX-r.left)*d-ox)/sc,y:((e.clientY-r.top)*d-oy)/sc};}
cv.addEventListener('pointerdown',e=>{if(sim)return;audio();const p=toW(e);
  const px=sc/(devicePixelRatio||1),hr=Math.min(ST*.48,Math.max(20,24/px));let n=-1,bd=1e9;N.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;n=i;}});if(bd>hr)n=-1;
  if(n>=0){if(sel===null){sel=n;sfx.pop();}else if(sel===n)sel=null;else if(near(N[sel],N[n])){const a=Math.min(sel,n),b=Math.max(sel,n);
      if(!beams.some(x=>x.a===a&&x.b===b)){const nb={a:a,b:b};if(total()+costOf(nb)>BUDGET){sfx.bad();toast('💸 Over budget!');}else{beams.push(nb);sfx.pop();}}sel=n;}
    else{sel=n;sfx.pop();}draw();return;}
  // remove a beam near the tap
  const k=beams.findIndex(b=>{const A=N[b.a],B=N[b.b],t=Math.max(0,Math.min(1,((p.x-A.x)*(B.x-A.x)+(p.y-A.y)*(B.y-A.y))/((B.x-A.x)**2+(B.y-A.y)**2)));return Math.hypot(A.x+(B.x-A.x)*t-p.x,A.y+(B.y-A.y)*t-p.y)<Math.max(10,14/(sc/(devicePixelRatio||1)));});
  if(k>=0){beams.splice(k,1);sfx.boing();}sel=null;draw();});
function draw(){const c=cx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(sc,0,0,sc,ox,oy);
  c.fillStyle='#d0ebff';c.fillRect(0,0,W,H);c.fillStyle='#4dabf7';c.fillRect(X0,ROAD+150,X1-X0,H);
  c.fillStyle='#8ce99a';c.strokeStyle='#1b1f3b';c.lineWidth=4;c.fillRect(0,ROAD,X0,H);c.strokeRect(-4,ROAD,X0+4,H);c.fillRect(X1,ROAD,W,H);c.strokeRect(X1,ROAD,W,H);
  c.fillStyle='#868e96';c.beginPath();c.ellipse(400,ROAD+165,46,40,0,0,6.283);c.fill();c.stroke();
  const P=sim?sim.p:N;const live=sim?sim.b:beams.map(b=>Object.assign({},b));
  live.forEach(b=>{if(b.broken)return;const A=P[b.a],B=P[b.b];c.lineCap='round';c.strokeStyle='#1b1f3b';c.lineWidth=isRoad(b)?13:9;c.beginPath();c.moveTo(A.x,A.y);c.lineTo(B.x,B.y);c.stroke();
    const s=sim&&b.s?Math.min(1,b.s):0;c.strokeStyle=isRoad(b)?(s>.5?'#e03131':'#868e96'):`rgb(${200+55*s|0},${150-120*s|0},${60-40*s|0})`;c.lineWidth=isRoad(b)?8:5;c.stroke();});
  if(!sim)N.forEach((q,i)=>{c.fillStyle=q.fix?'#1b1f3b':i===sel?'#ffd43b':'#fff';c.strokeStyle='#1b1f3b';c.lineWidth=2.5;const rr=Math.min(14,Math.max(q.fix?8:7,(q.fix?9:8)/(sc/(devicePixelRatio||1))));c.beginPath();c.arc(q.x,q.y,rr,0,6.283);c.fill();c.stroke();
    if(sel!==null&&near(N[sel],q)){c.strokeStyle='#ffd43b';c.lineWidth=3;c.beginPath();c.arc(q.x,q.y,Math.max(12,13/(sc/(devicePixelRatio||1))),0,6.283);c.stroke();}});
  if(sim){c.font='54px system-ui';c.textAlign='center';c.textBaseline='bottom';c.save();c.translate(sim.tx,sim.ty);c.rotate(sim.ta||0);c.scale(-1,1);c.fillText('🚚',0,4);c.restore();}
  $('cost').textContent='💰 $'+total()+' / $'+BUDGET;}
/* Test: a real truss calculation. Each truck position: solve K·u = F. No triangles = it can't hold (wobbly). Too much force in a beam = it snaps. */
let FMAX=4.5;
function solve(bs,loadAt){
  const used=[...new Set(bs.flatMap(x=>[x.a,x.b]))].filter(i=>!N[i].fix),id={};used.forEach((n,k)=>id[n]=k);const n=used.length*2;if(!n)return{ok:true,f:bs.map(()=>0),u:{}};
  const K=Array.from({length:n},()=>new Float64Array(n+1));
  bs.forEach(x=>{const A=N[x.a],B=N[x.b],L=Math.hypot(B.x-A.x,B.y-A.y),c=(B.x-A.x)/L,s=(B.y-A.y)/L,k=1/L,m=[[c*c,c*s],[c*s,s*s]];
    const put=(i,j,sg)=>{if(id[i]===undefined||id[j]===undefined)return;for(let r=0;r<2;r++)for(let q=0;q<2;q++)K[id[i]*2+r][id[j]*2+q]+=sg*k*m[r][q];};
    put(x.a,x.a,1);put(x.b,x.b,1);put(x.a,x.b,-1);put(x.b,x.a,-1);});
  // loads (y down): truck weight split between the two ends of the road beam under it, plus a little self-weight
  bs.forEach(x=>{const L=Math.hypot(N[x.b].x-N[x.a].x,N[x.b].y-N[x.a].y)/ST*.05;[x.a,x.b].forEach(i=>{if(id[i]!==undefined)K[id[i]*2+1][n]+=L/2;});});
  if(loadAt){const[x,u]=loadAt;if(id[x.a]!==undefined)K[id[x.a]*2+1][n]+=1-u;if(id[x.b]!==undefined)K[id[x.b]*2+1][n]+=u;}
  let mx=0;K.forEach(r=>{for(let j=0;j<n;j++)mx=Math.max(mx,Math.abs(r[j]));});
  for(let col=0;col<n;col++){let pr=col;for(let r=col+1;r<n;r++)if(Math.abs(K[r][col])>Math.abs(K[pr][col]))pr=r;if(Math.abs(K[pr][col])<1e-7*mx)return{ok:false,mech:true};
    [K[col],K[pr]]=[K[pr],K[col]];for(let r=0;r<n;r++){if(r===col)continue;const f=K[r][col]/K[col][col];if(f)for(let j=col;j<=n;j++)K[r][j]-=f*K[col][j];}}
  const U={};used.forEach((nd,k)=>U[nd]=[K[k*2][n]/K[k*2][k*2],K[k*2+1][n]/K[k*2+1][k*2+1]]);
  const disp=i=>U[i]||[0,0],f=bs.map(x=>{const A=N[x.a],B=N[x.b],L=Math.hypot(B.x-A.x,B.y-A.y),c=(B.x-A.x)/L,s=(B.y-A.y)/L,da=disp(x.a),db=disp(x.b);return((db[0]-da[0])*c+(db[1]-da[1])*s)/L;});
  return{ok:true,f:f,u:U};}
$('go').onclick=()=>{if(sim)return;audio();sel=null;
  const bs=beams.map(x=>Object.assign({},x));let fail=null,worst=0,res=[];
  for(let tx=X0;tx<=X1;tx+=5){const on=bs.find(x=>isRoad(x)&&Math.min(N[x.a].x,N[x.b].x)<=tx&&Math.max(N[x.a].x,N[x.b].x)>=tx);
    if(!on){fail=fail||{tx:tx,why:'There was no road under the truck!'};break;}
    const u=(tx-N[on.a].x)/(N[on.b].x-N[on.a].x),r=solve(bs,[on,u]);
    if(!r.ok){fail={tx:tx,why:'The bridge wobbled and folded! It needs triangles.',mech:true};break;}
    const k=r.f.reduce((m,v,i)=>Math.abs(v)>Math.abs(r.f[m])?i:m,0);worst=Math.max(worst,Math.abs(r.f[k]));res.push({tx:tx,r:r});

  const step=()=>{const S=sim;if(!S.fall)S.tx+=2.2;
    const cur=res.filter(x=>x.tx<=S.tx).pop();if(cur&&!S.fall)N.forEach((q,i)=>{const d=cur.r.u[i]||[0,0];S.p[i].x=q.x+d[0]*900;S.p[i].y=q.y+d[1]*900;});
    if(fail&&S.tx>=fail.tx&&!S.fall){S.fall=true;sfx.bad();if(fail.beam!==undefined)bs[fail.beam].broken=true;else bs.forEach(x=>{if(isRoad(x)&&Math.abs((N[x.a].x+N[x.b].x)/2-S.tx)<ST*1.5)x.broken=true;});}

    draw();

    if(S.tx>X1+70){end(true,worst>FMAX*.75?'It held, but some beams were almost at their limit!':'Rock solid!');return;}
    requestAnimationFrame(step);};requestAnimationFrame(step);};
function end(ok,why){const t=total(),stars=ok?(t<=2600?3:t<=3300?2:1):0;
  if(ok){sfx.win();confetti();say('The truck made it across! '+why);}else{sfx.boing();say('Crash! '+why+' Try adding triangles.');}
  setTimeout(()=>modal('<h2>'+(ok?'It held! 🚚✨':'Splash! 🌊')+'</h2><p>'+why+'<br>Cost: $'+t+(ok?' · '+'★'.repeat(stars)+'☆'.repeat(3-stars):'')+'</p><p>💡 '+(ok?(stars<3?'Can you build it cheaper? Triangles are strong and cheap.':'Super engineering!'):'Triangles don’t bend. Squares do. Add diagonal beams!')+'</p>',[['Back to building',()=>{sim=null;draw();}]]),500);}
$('clr').onclick=()=>{if(sim)return;beams=[];sel=null;draw();};
const idx=(x,y)=>N.findIndex(q=>q.x===x&&q.y===y);
$('ex').onclick=()=>{if(sim)return;beams=[];const add=(x1,y1,x2,y2)=>{const a=idx(x1,y1),b=idx(x2,y2);if(a>=0&&b>=0)beams.push({a:Math.min(a,b),b:Math.max(a,b)});};

  for(let x=X0+ST;x<X1-ST;x+=ST)add(x,ROAD-65,x+ST,ROAD-65);
  for(let x=X0+ST;x<X1;x+=ST)add(x,ROAD,x,ROAD-65);
  for(let x=X0;x<X1;x+=ST){const mid=x+ST/2<400;if(mid)add(x,ROAD,x+ST,ROAD-65);else add(x,ROAD-65,x+ST,ROAD);}
  beams=beams.filter(b=>!((N[b.a].y===ROAD-65&&(N[b.a].x===X0||N[b.a].x===X1))||(N[b.b].y===ROAD-65&&(N[b.b].x===X0||N[b.b].x===X1))));
  draw();toast('Here’s one idea. Can you make it cheaper?');};
addEventListener('resize',fit);fit();
window.__test={solve:()=>{let w=0,ok=true;for(let tx=X0;tx<=X1;tx+=5){const on=beams.find(x=>isRoad(x)&&Math.min(N[x.a].x,N[x.b].x)<=tx&&Math.max(N[x.a].x,N[x.b].x)>=tx);if(!on)return{ok:false,why:'noroad'};const r=solve(beams,[on,(tx-N[on.a].x)/(N[on.b].x-N[on.a].x)]);if(!r.ok)return{ok:false,why:'mech',tx:tx};w=Math.max(w,...r.f.map(Math.abs));}return{ok:true,worst:w};},add:(x1,y1,x2,y2)=>{const a=idx(x1,y1),b=idx(x2,y2);beams.push({a:Math.min(a,b),b:Math.max(a,b)});},clear:()=>{beams=[];},state:()=>({beams:beams.length,cost:total(),sim:!!sim}),flat:()=>{beams=[];for(let x=X0;x<X1;x+=ST)beams.push({a:idx(x,ROAD),b:idx(x+ST,ROAD)});draw();},ex:()=>$('ex').click(),go:()=>$('go').click(),sim:()=>sim&&{tx:sim.tx,fall:sim.fall,worst:sim.worst}};
