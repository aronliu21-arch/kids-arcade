<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>四驅小隊 Mini 4WD Racers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>:root{--blue:#1c7ed6;--red:#e03131;--yel:#ffd43b;--ink:#111;--lucas:#f76707;--card:#fffdf5;--bg:#0b2a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.35 system-ui,-apple-system,"PingFang TC","Heiti TC",sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.zc{letter-spacing:0;display:inline-flex;align-items:center;vertical-align:middle;margin:0 .1em 0 0;line-height:1.15}
.zy{display:inline-flex;align-items:center;font-size:.5em;line-height:.98;font-weight:700;color:#555;margin-left:.1em;letter-spacing:0;font-style:normal}
.zb{display:inline-flex;flex-direction:column;align-items:center}.zb i{font-style:normal;display:block}.zb .zl{line-height:.6}
.zt{margin-left:.04em;align-self:center;font-size:1.35em;font-weight:900;line-height:1}
.bi{display:inline-flex;flex-direction:column;align-items:inherit;line-height:1.15}.bi .z{font-weight:900}.bi .e{font-size:.78em;opacity:.85;font-weight:700}
.title-font{font-family:Bangers,Impact,"Arial Black",sans-serif;letter-spacing:1px}
.scr{position:fixed;inset:0;display:none;overflow:hidden}.scr.on{display:block}
/* comic buttons */
.btn{min-height:52px;min-width:52px;padding:8px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--yel);box-shadow:0 5px 0 var(--ink);font-weight:900;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.white{background:#fff}.btn.green{background:#2f9e44;color:#fff}
.btn.blue .zy,.btn.red .zy,.btn.green .zy{color:#e7f5ff}
.btn[disabled]{opacity:.45;pointer-events:none}
/* top bar */
#bar{position:fixed;top:8px;right:8px;z-index:50;display:flex;gap:8px}
#bar .btn{min-height:48px;min-width:48px;padding:4px 10px;font-size:20px;background:#fff}
#bLang{font-size:16px!important;font-weight:900}
/* ---------- title ---------- */
#sTitle{background:#000}
#sTitle .key{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#sTitle .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff3 0 6deg,#0000 6deg 14deg);opacity:0;pointer-events:none}
#sTitle .logo{position:absolute;left:0;right:0;top:4%;text-align:center;pointer-events:none;opacity:0}
.logo .l1{display:inline-block;font-size:clamp(40px,9vw,96px);color:var(--yel);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--red),9px 9px 0 var(--ink);transform:rotate(-4deg)}
.logo .l2{display:block;font-size:clamp(20px,3.6vw,40px);color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);margin-top:6px}
.logo .l2 .zy{color:#fff;-webkit-text-stroke:0;text-shadow:1px 1px 0 var(--ink)}
#tapStart{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:26px;padding:12px 30px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
#sTitle.play .key{animation:kb 4.2s ease-out forwards}
#sTitle.play .rays{animation:rays 4.2s linear forwards}
#sTitle.play .logo{animation:slam .5s 1.4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes kb{from{transform:scale(1.35) translateX(6%)}to{transform:scale(1) translateX(0)}}
@keyframes rays{0%{opacity:0;transform:rotate(0)}30%{opacity:.9}100%{opacity:.25;transform:rotate(40deg)}}
@keyframes slam{from{opacity:0;transform:scale(3)}to{opacity:1;transform:scale(1)}}
#sTitle.done .logo{opacity:1}
/* ---------- menu ---------- */
#sMenu{background:url(assets/key.webp) center/cover;overflow:auto}
#sMenu .wrap{min-height:100%;background:linear-gradient(#0b2a55cc,#0b2a55ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 16px 40px}
#sMenu .logo{opacity:1;position:static;text-align:center}
.profiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.prof{width:200px;min-height:210px;border:4px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 7px 0 var(--ink);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.prof img{width:120px;height:120px;object-fit:cover;object-position:top;border-radius:50%;border:4px solid var(--lucas);background:#ffe8cc;box-shadow:0 0 18px #ffd43b}
.prof .nm{font-size:22px;font-weight:900;color:#fff;background:var(--lucas);border:2px solid var(--ink);border-radius:999px;padding:0 14px}
.prof.tester .nm{background:#5f3dc4}.prof.tester .ic{font-size:72px;line-height:120px}
.prof .sub{font-size:14px;text-align:center}
.mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.jump{display:none;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px}.jump.on{display:flex}
.jump .btn{font-size:15px;min-height:48px}
/* ---------- story ---------- */
#sStory .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.por{position:absolute;bottom:0;height:min(78vh,560px);max-width:48vw;object-fit:contain;object-position:bottom;transition:transform .3s,filter .3s,opacity .3s;opacity:0;filter:drop-shadow(0 0 0 #000)}
.por.L{left:2%}.por.R{right:2%;transform:scaleX(-1)}
.por.on{opacity:1}.por.dim{filter:brightness(.55) saturate(.6)}
.por.L.talk{transform:translateY(-8px)}.por.R.talk{transform:scaleX(-1) translateY(-8px)}
.por.hero{filter:drop-shadow(0 0 10px #ffd43b) drop-shadow(0 0 3px #ffd43b)}
.dlg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(940px,calc(100% - 24px));background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:12px 16px 12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.dlg .nm{position:absolute;top:-20px;left:18px;font-weight:900;color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 12px;font-size:17px}
.dlg .nm:empty{display:none}
.dlg .zh{font-size:22px;font-weight:900;margin-top:6px}.dlg .en{font-size:17px;color:#333}
.dlg .ctl{display:flex;gap:10px;justify-content:flex-end}
.dlg.narr{background:#212529;color:#fff}.dlg.narr .en{color:#dee2e6}.dlg.narr .zy{color:#adb5bd}
/* ---------- garage ---------- */
#sGarage,#sTune{background:#1b3a63 url(assets/bg_shop.webp) center/cover}
.gwrap{position:absolute;inset:0;background:#0b2a55d9;display:flex;flex-direction:column;overflow:auto;padding:64px 12px 16px}
.ghead{color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 10px;width:min(1100px,100%)}
.ghead .step{background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:900}
.gmain{display:flex;gap:14px;width:min(1100px,100%);margin:0 auto;align-items:flex-start}
.side{width:260px;flex:none;display:flex;flex-direction:column;gap:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px}
.slot{aspect-ratio:1;border:2px dashed #adb5bd;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f1f3f5}
.slot img{width:86%;height:86%;object-fit:contain}.slot.in{border:2px solid var(--blue);background:#e7f5ff}.slot.cur{border:3px solid var(--lucas);animation:blink 1s infinite}
@keyframes blink{50%{background:#fff4e6}}
.stats{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:13px}
.stat{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;margin:4px 0}
.stat .bar{height:14px;border:2px solid var(--ink);border-radius:8px;background:#e9ecef;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#4dabf7,#1c7ed6);transition:width .5s}
.stat.warn .bar i{background:#e03131}
.card{flex:1;background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:14px 16px;min-width:0}
.card .top{display:flex;gap:14px;align-items:center}
.card .pimg{width:150px;height:150px;object-fit:contain;flex:none;filter:drop-shadow(3px 4px 0 #0003)}
.card h2{margin:0;font-size:30px}.card h2 .e{font-size:20px}
.box{border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.box .lab{flex:none;font-size:22px}
.box.what{background:#e7f5ff}.box.sci{background:#fff9db}
.box .txt{flex:1}.box .txt .z{font-size:19px;font-weight:900;display:block}.box .txt .e{font-size:15px;display:block;margin-top:2px}
.say{flex:none;min-height:44px;min-width:44px;border:2px solid var(--ink);border-radius:50%;background:#fff;font-size:18px}
.demo{margin-top:10px;border:3px solid var(--ink);border-radius:14px;background:#f8f9fa;padding:10px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo svg,.demo canvas{max-width:100%;height:auto}
.picks{margin-top:10px}.picks .lbl{font-weight:900;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px;text-align:left;min-height:64px;box-shadow:0 4px 0 var(--ink)}
.opt.sel{background:#d0ebff;outline:4px solid var(--blue)}
.opt .z{font-size:18px}.opt small{display:block;font-weight:600;font-size:13px;margin-top:4px;color:#333}
.act{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
/* quiz */
.quiz{margin-top:4px}.quiz .qq{font-size:20px;margin:6px 0 10px}
.quiz .ans{display:grid;gap:10px}
.quiz .ans .btn{justify-content:flex-start;background:#fff;font-size:17px;text-align:left}
.quiz .ans .btn .bi,.opt .bi,.box .bi{align-items:flex-start}
.quiz .ans .btn.ok{background:#b2f2bb}.quiz .ans .btn.no{background:#ffc9c9;opacity:.7}
.quiz .fb{margin-top:10px;font-weight:900;min-height:24px}
.stars{color:#f59f00;font-size:22px;letter-spacing:2px}
/* gear demo */
.spin{transform-box:fill-box;transform-origin:center;animation:rot linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.motorimg{width:120px;transition:transform .2s}.motorimg.go{animation:shake .08s infinite}
@keyframes shake{50%{transform:translate(1px,-1px) rotate(1deg)}}
.flow{stroke-dasharray:6 10;animation:flow .6s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
/* ---------- race ---------- */
#sRace{background:#2b8a3e url(assets/bg_park.webp) center/cover}
#sRace .rwrap{position:absolute;inset:0;background:#0b2a5599;display:flex;flex-direction:column;align-items:center;padding:60px 8px 8px;gap:6px}
#raceCv{flex:1;min-height:0;width:100%;max-width:1200px;touch-action:none}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(1200px,100%)}
.chip{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:900;font-size:15px}
.chip.me{border-color:var(--lucas)}
.ticker{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;min-height:52px;flex:1;min-width:240px;max-width:640px}
.ticker .z{font-size:17px}.ticker .e{font-size:14px}
#cheer{font-size:20px}#camBtn{font-size:15px;padding:4px 12px}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:min(30vw,200px);color:var(--yel);-webkit-text-stroke:5px var(--ink);text-shadow:8px 8px 0 var(--red)}
/* ---------- result / overlay ---------- */
.ovl{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:16px;overflow:auto}
.ovl.on{display:flex}
.ovl .card{max-width:640px;flex:none;width:100%;margin:auto}
.ovl .who{display:flex;gap:12px;align-items:center}
.ovl .who img{width:96px;height:96px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--ink);background:#d0ebff;flex:none}
.big{font-size:44px;text-align:center;margin:4px 0}
.tip{background:#ebfbee;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-top:10px}
#rotHint{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;z-index:60;display:none;pointer-events:none}
@media (orientation:portrait) and (max-width:600px){#rotHint{display:block}}
/* ---------- small screens ---------- */
@media (max-width:760px){
  .gmain{flex-direction:column}.side{width:100%;flex-direction:row}.slots{flex:1;grid-template-columns:repeat(7,1fr)}.stats{flex:1}
  .card .pimg{width:96px;height:96px}.card h2{font-size:24px}
  .opts{grid-template-columns:1fr}
}
@media (max-width:600px){
  .side{flex-direction:column}
  .por{height:40vh;max-width:62vw;bottom:230px}
  .dlg{bottom:44px}
  .stats{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}.stats>b{grid-column:1/-1}.stat{grid-template-columns:1fr;gap:2px}
  .gwrap{padding-bottom:48px}
  #sRace .rwrap{padding-bottom:44px}
  .dlg .zh{font-size:19px}.dlg .en{font-size:15px}
  .prof{width:160px;min-height:190px}.prof img{width:96px;height:96px}
}
@media (max-height:440px){
  .gwrap{padding-top:58px}.side{width:220px}.slots{grid-template-columns:repeat(4,1fr)}
  .gmain{flex-direction:row}.side{flex-direction:column}
  .card .pimg{width:84px;height:84px}.card h2{font-size:22px}
  .por{height:86vh;max-width:34vw}
  .dlg{bottom:6px;padding:8px 12px;width:min(940px,calc(100% - 30vw))}.dlg .zh{font-size:17px}.dlg .en{font-size:14px}
  .dlg .ctl .btn{min-height:44px}
  #sRace .rwrap{padding-top:6px;flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  #raceCv{height:calc(100vh - 14px);flex:none;width:64vw;max-width:64vw}
  .hud{width:auto;flex:1;flex-direction:column;align-items:stretch;padding-top:52px}
  .ticker{min-width:0;flex:none;min-height:0;padding:3px 8px}.ticker .z{font-size:14px}.ticker .e{font-size:12px}
  #cheer{font-size:17px;min-height:48px;padding:4px 8px}#camBtn{font-size:13px;min-height:48px;padding:2px 8px}.hud{gap:5px}
  #sMenu .wrap{padding-top:16px}.logo .l1{font-size:44px}
  .prof{min-height:0;flex-direction:row;width:auto}.prof img{width:64px;height:64px}.prof.tester .ic{font-size:44px;line-height:64px}
}
/* ---------- every screen size: the garage never scrolls; a too-tall card pages instead ---------- */
.gwrap{overflow:hidden}.gmain{flex:1;min-height:0;align-items:stretch}.side{overflow:hidden}
.gmain .card{display:flex;flex-direction:column;overflow:hidden;max-height:100%}
.ovl .card{max-height:100%;display:flex;flex-direction:column;overflow:hidden}
/* ---------- phones: everything fits on one screen, long cards page with ◀ ▶ instead of scrolling ---------- */
.pgnav{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.pgnav .pgd{flex:1;text-align:center;font-weight:900;color:#555}
.pgnav .act{margin:0}
.pgnav .btn{min-height:48px;padding:4px 14px}
.gpart{display:none}.prof .nm,.prof .sub .z{white-space:nowrap}
@media (max-height:500px),(max-width:600px){
  .gwrap{overflow:hidden;padding:8px 8px 8px}
  .ghead{margin:0 196px 6px 0;width:auto;min-height:48px;gap:8px;font-size:14px}
  .gmain{flex:1;min-height:0;align-items:stretch;gap:8px}
  .side{overflow:hidden}
  .gmain .card{display:flex;flex-direction:column;overflow:hidden;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
  .gmain .card>.top{display:none}.gfull{display:none}.gpart{display:inline-flex;font-size:18px}
  .card .pimg{width:56px;height:56px}.card h2{font-size:21px}.card .top{gap:10px}
  .box{margin-top:8px;padding:6px 10px}.box .txt .z{font-size:17px}.box .txt .e{font-size:14px}
  .demo{margin-top:8px;padding:6px}.picks{margin-top:8px}.opt{min-height:52px;padding:8px}.opt .z{font-size:16px}.opt small{font-size:12px}
  .quiz .qq{font-size:18px;margin:4px 0 8px}.quiz .ans{gap:8px}.quiz .ans .btn{font-size:16px;min-height:48px;padding:6px 12px}
  .quiz .fb{margin-top:6px}.tip{margin-top:6px;padding:8px 10px}
  .act{margin-top:8px}
  .ovl{padding:8px;overflow:hidden}
  .ovl .card{max-height:100%;display:flex;flex-direction:column;overflow:hidden;padding:10px 14px}
  .big{font-size:32px}
}
@media (max-width:600px){
  .gwrap{padding-bottom:40px}
  .side .slots{display:none}
  .gmain .card{flex:1;min-height:0}
  .stats{padding:4px 8px;font-size:12px}.stat{margin:1px 0}
}
@media (max-height:500px){
  .side{width:150px}.side .slots{display:none}
  .opts{grid-template-columns:1fr 1fr}#tCard img{display:none}#tCard .picks{margin-top:4px}
  .demo svg,.demo canvas,.demo img{max-height:120px;width:auto!important;flex:none}
  .demo .act{margin-top:6px;gap:6px;flex-wrap:nowrap}.demo .act .btn,.demo>.btn{font-size:14px;padding:4px 10px;min-height:48px}.demo{flex-wrap:nowrap}.demo>div:not([style*=flex]){flex:1 1 160px;min-width:0!important}.demo>div[style*=flex]{flex-wrap:nowrap!important}
  .box{margin-top:6px;padding:4px 8px}.box .txt .z{font-size:16px}.box .txt .e{font-size:13px}
  .stats{padding:5px 8px;font-size:12px}.stat{grid-template-columns:1fr;gap:1px;margin:2px 0}.stat .bar{height:10px}
  .quiz .ans{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .ovl .who img{width:64px;height:64px}
  #sMenu .wrap{padding:8px 200px 8px 16px;gap:8px;justify-content:center}
  #sMenu .logo .l1{font-size:34px}#sMenu .logo .l2{font-size:18px;margin-top:2px}
  .profiles{gap:10px;flex-wrap:nowrap}.prof{padding:6px 12px}.prof .nm{font-size:18px}
  .mrow .btn{min-height:48px;font-size:15px;padding:4px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
/* ---------- Chapter 2 ---------- */
.c2head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.c2head #c2Money{background:#ffd43b;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:900}
#c2Car{width:100%;height:150px;background:#e7f5ff;border:3px solid var(--ink);border-radius:14px;flex:none}
.c2town{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.loc{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px;min-height:96px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer}
.loc .ic{font-size:36px;line-height:1}.loc small{font-size:12px;font-weight:700;color:#444;text-align:center}
.loc.off{opacity:.45;filter:grayscale(.8)}
.c2cal{display:flex;gap:4px;margin-top:10px}.c2cal .dd{flex:1;text-align:center;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:2px;font-size:14px}
.c2cal .dd b{display:block;font-size:13px}.c2cal .dd.now{background:#ffd43b}
.c2goal{margin-top:8px;font-weight:700;font-size:14px}
.c2say{display:flex;gap:10px;align-items:center;margin:4px 0}.c2say img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--ink);background:#d0ebff;flex:none}
.c2say .ic{font-size:48px;line-height:1;flex:none}.c2say b{display:block}
.c2sub{font-weight:800;color:#555;margin-bottom:4px}
.c2tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.c2tabs .btn{min-height:48px;padding:4px 10px;font-size:15px}
.c2parts,.c2tracks,.c2jobs,.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.c2parts .lbl{grid-column:1/-1;font-weight:900;margin-top:4px}
.opt .pr{display:block;font-weight:900;margin-top:4px;color:#1864ab}.opt.own{opacity:.6}.opt.off{opacity:.45}.opt .ic{font-size:28px;margin-right:6px}
.tray{margin-top:8px;padding:8px;border:3px dashed var(--ink);border-radius:14px;background:#fff9db;min-height:56px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- overlay ---------- */
function ovl(html) { $("#ovlCard").innerHTML = html; $("#ovl").classList.add("on"); $("#ovl").scrollTop = 0; setTimeout(function () { Pager.fit($("#ovlCard")); }, 0); }

/* ---------- Pager: on phones, split a too-tall card into pages (◀ ▶) instead of scrolling ---------- */
var FIT = window.matchMedia("all"); // page on every screen size, never scroll
var Pager = {
  fit: function (card, opt) {
    opt = opt || {}; card.__opt = opt;
    var keep = opt.keep ? (card.__pg || 0) : 0;
    var nav = card.querySelector(".pgnav"), act = card.__act;
    if (nav) { if (act && act.__home) { act.__home.insertBefore(act, act.__next || null); act.style.display = ""; } nav.remove(); }
    var blocks = opt.blocks ? opt.blocks() : $$(":scope > *", card).filter(function (b) { return !b.classList.contains("act") && !b.classList.contains("pin"); }); // .pin blocks stay on every page
    act = opt.act ? opt.act() : card.querySelector(":scope > .act");
    blocks.forEach(function (b) { b.style.display = ""; b.style.zoom = ""; });
    card.classList.remove("paged"); card.__pages = null; card.__act = null;
    if (!FIT.matches) return;
    $$("img", card).forEach(function (im) { if (!im.complete) im.addEventListener("load", function () { if (card.__opt === opt) Pager.fit(card, Object.assign({}, opt, { keep: true, find: null })); }, { once: true }); });
    if (card.scrollHeight <= card.clientHeight + 2) return;
    nav = document.createElement("div"); nav.className = "pgnav";
    nav.innerHTML = "<button class='btn white pgp' aria-label='Back'>◀</button><span class='pgd'></span><button class='btn blue pgn'>" + bi("下一頁", "Next") + " ▶</button>";
    if (act) { act.__home = act.parentNode; act.__next = act.nextSibling; nav.appendChild(act); card.__act = act; }
    card.appendChild(nav); card.classList.add("paged");
    var cs = getComputedStyle(card);
    var avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - nav.offsetHeight - 10;
    $$(":scope > .pin", card).forEach(function (pn) { avail -= pn.getBoundingClientRect().height + 6; });
    var pages = [[]], h = 0;
    blocks.forEach(function (b) {
      var bs = getComputedStyle(b), bh = b.getBoundingClientRect().height + parseFloat(bs.marginTop) + parseFloat(bs.marginBottom);
      if (bh > avail) b.style.zoom = Math.max(0.55, avail / bh).toFixed(3), bh = avail;
      if (h + bh > avail && pages[pages.length - 1].length) { pages.push([]); h = 0; }
      pages[pages.length - 1].push(b); h += bh;
    });
    card.__pages = pages;
    var self = this;
    $(".pgp", nav).onclick = function () { sfx("tap"); self.go(card, card.__pg - 1); };
    $(".pgn", nav).onclick = function () { sfx("tap"); self.go(card, card.__pg + 1); };
    var start = opt.find ? pages.findIndex(function (pg) { return pg.indexOf(opt.find()) >= 0; }) : keep;
    this.go(card, start < 0 ? 0 : start);
  },
  go: function (card, i) {
    var pages = card.__pages; if (!pages) return;
    i = Math.max(0, Math.min(pages.length - 1, i)); card.__pg = i;
    pages.forEach(function (pg, j) { pg.forEach(function (b) { b.style.display = j === i ? "" : "none"; }); });
    var nav = card.querySelector(".pgnav"), last = i === pages.length - 1;
    $(".pgp", nav).style.visibility = i ? "" : "hidden";
    $(".pgn", nav).style.display = last ? "none" : "";
    if (card.__act) card.__act.style.display = last ? "" : "none";
    $(".pgd", nav).textContent = pages.length > 1 ? (i + 1) + " / " + pages.length : "";
  },
  refit: function () { $$(".card").forEach(function (c) { if (c.offsetParent || c.closest(".ovl.on")) Pager.fit(c, Object.assign({}, c.__opt || {}, { keep: true, find: null })); }); }
};

/* ---------- story ---------- */
var Story = { key: null, i: 0, done: null };
function playScene(key, done) {
  Story.key = key; Story.i = 0; Story.done = done;
  var sc = SCENES[key];
  $("#sStory .bg").src = A(sc.bg);
  $$(".por").forEach(function (p) { p.classList.remove("on", "talk", "dim", "hero"); p.removeAttribute("src"); });
  show("sStory");
  storyLine();
}
function storyLine() {
  var sc = SCENES[Story.key], ln = sc.lines[Story.i], who = ln[0], c = CAST[who];
  var L = $(".por.L"), R = $(".por.R"), d = $("#dlg");
  if (who === "lucas") { L.src = A(c.img); L.classList.add("on", "hero"); }
  else if (who !== "narr") { if (R.dataset.who !== who) { R.src = A(c.img); R.dataset.who = who; } R.classList.add("on"); }
  L.classList.toggle("talk", who === "lucas"); R.classList.toggle("talk", who !== "lucas" && who !== "narr");
  L.classList.toggle("dim", who !== "lucas" && who !== "narr"); R.classList.toggle("dim", who === "lucas");
  d.classList.toggle("narr", who === "narr");
  var nm = $(".nm", d); nm.innerHTML = who === "narr" ? "" : zh(c.zh) + " " + esc(c.en); nm.style.background = c.col;
  $(".zh", d).innerHTML = zh(ln[1]); $(".en", d).textContent = ln[2];
  Read.pair(ln[1], ln[2], c.pitch);
}
function storyNext() {
  Read.stop(); sfx("tap");
  var sc = SCENES[Story.key];
  if (++Story.i >= sc.lines.length) { var f = Story.done; Story.done = null; if (f) f(); return; }
  storyLine();
}

/* ---------- flow ---------- */
function go(stage) {
  var k = G.kd; k.stage = stage; save(); closeOvl();
  if (stage === "shop") playScene("shop", function () { k.step = 0; go("garage"); });
  else if (stage === "garage") Garage.start(k.step || 0, function () { go("test"); });
  else if (stage === "test") playScene("test", function () { Race.start("practice"); });
  else if (stage === "park") playScene("park", function () { go("race"); });
  else if (stage === "race") Race.start("race");
  else if (stage === "win") playScene("win", finishEpisode);
  else if (stage === "c2") { k.stage = "done"; save(); C2G.start(); }
  else if (stage === "c2pm" || stage === "c2cup" || stage === "c2w2") { // test shortcuts: skip Monday's class
    k.stage = "done"; k.c2 = C2S.fresh(); var c = k.c2; c.intro = true; c.lessons[0] = true; c.slot = 1;
    if (stage === "c2cup") { c.day = 5; c.slot = 0; c.tests[1] = { pct: 1, a: true }; c.money = 1500; c.hasKit = true; c.build = JSON.parse(JSON.stringify(C2.KIT.build)); Object.keys(C2.KIT.build).forEach(function (s2) { C2S.give(c, s2, C2.KIT.build[s2]); }); C2S.give(c, "roller", "yes"); c.build.roller = "yes"; C2S.give(c, "tire", "soft"); c.toolbox = ["tire:soft"]; c.build.tire = "hard"; }
    if (stage === "c2w2") { c.day = 7; c.slot = 0; c.tests[1] = { pct: 1, a: true }; c.cups.c1 = { place: 1 }; c.money = 800; c.hasKit = true; c.build = JSON.parse(JSON.stringify(C2.KIT.build)); Object.keys(C2.KIT.build).forEach(function (s2) { C2S.give(c, s2, C2.KIT.build[s2]); }); }
    save(); C2G.town();
  }
}

    "<div class='big stars'>" + "⭐".repeat(stars) + "☆".repeat(3 - stars) + "</div>" +
    "<div style='text-align:center'>" + bi("科學問題：" + pts + " / " + max + " 分", "Science quiz: " + pts + " / " + max + " points") + "</div>" +

/* ===== Garage: build the car part by part, with demos, choices and a quiz ===== */
function renderStats(el, b) {
  var s = carBars(b), rows = [
    ["最高速度", "Top speed", s.speed], ["上坡力氣", "Hill power", s.hill], ["彎道抓地", "Curve grip", s.grip], ["安全", "Safety", s.safe]];
  el.innerHTML = "<b>" + bi("你的車", "Your car") + "</b>" + rows.map(function (r) {
    var v = Math.max(0.04, Math.min(1, r[2]));
    return "<div class='stat" + (v < 0.3 ? " warn" : "") + "'><span>" + bi(r[0], r[1]) + "</span><span class='bar'><i style='width:" + (v * 100).toFixed(0) + "%'></i></span></div>";
  }).join("");
}
function pickHTML(p, b, chosen) {
  return "<div class='picks'><div class='lbl'>" + bi(p.zh, p.en) + "</div><div class='opts'>" + p.opts.map(function (o) {
    return "<button class='opt" + (chosen && b[p.key] === o.v ? " sel" : "") + "' data-k='" + p.key + "' data-v='" + o.v + "'>" + bi(o.zh, o.en) + "<small>" + zh(o.d[0]) + "<br>" + esc(o.d[1]) + "</small></button>";
  }).join("") + "</div></div>";
}
function gearSVG(teeth, r) {
  var d = "", n = teeth * 2;
  for (var i = 0; i < n; i++) {
    var a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2, rr = i % 2 ? r : r + 7;
    d += (i ? "L" : "M") + (Math.cos(a0) * rr).toFixed(1) + " " + (Math.sin(a0) * rr).toFixed(1) + "L" + (Math.cos(a1) * rr).toFixed(1) + " " + (Math.sin(a1) * rr).toFixed(1);
  }
  return d + "Z";
}

var Garage = {
  start: function (step, done) { this.step = step; this.done = done; show("sGarage"); this.render(); },
  slots: function () {
    var st = this.step;
    $("#slots").innerHTML = PARTS.map(function (p, i) { return "<div class='slot" + (i < st ? " in" : i === st ? " cur" : "") + "' title='" + p.en + "'>" + (i < st ? "<img src='" + A(p.img) + "' alt=''>" : "") + "</div>"; }).join("");
    renderStats($("#stats"), G.kd.build);
  },
  render: function () {
    var p = PARTS[this.step], k = G.kd, self = this;
    this.picked = !p.pick; this.demoOk = p.demo !== "circuit";
    $("#gStep").textContent = (this.step + 1) + " / " + PARTS.length;
    $("#gTitle").innerHTML = "<span class='gfull'>" + bi("組裝你的四驅車", "Build your Mini 4WD") + "</span><span class='gpart'>" + bi(p.zh, p.en) + "</span>";
    this.slots();

    $$(".say", c).forEach(function (b) { b.onclick = function () { var t = p[b.dataset.r]; Read.pair(t[0], t[1]); }; });
    $$(".opt", c).forEach(function (b) {
      b.onclick = function () {
        sfx("pop"); k.build[b.dataset.k] = b.dataset.v; self.picked = true; save();
        $$(".opt", c).forEach(function (o) { o.classList.toggle("sel", o === b); });
        renderStats($("#stats"), k.build); if (self.onPick) self.onPick(b.dataset.v); self.gate();
      };
    });
    $("#gInstall").onclick = function () { sfx("tap"); Read.stop(); self.quiz(); };
    this.onPick = null;
    if (p.demo) Demos[p.demo]($("#demo"), this);
    this.gate();
    $("#sGarage .gwrap").scrollTop = 0;
    Pager.fit(c);
    Read.pair(p.what[0], p.what[1]);
  },
  gate: function () { var b = $("#gInstall"); if (b) b.disabled = !(this.picked && this.demoOk); },
  quiz: function () {
    var p = PARTS[this.step], q = p.q, k = G.kd, self = this, tries = 0;
    var ans = shuffle(q.a.map(function (a, i) { return { a: a, ok: i === 0 }; }));
    $("#gCard").innerHTML = "<div class='top'><img class='pimg' src='" + A(p.img) + "' alt=''><h2>" + bi("科學問題", "Science question") + "</h2></div>" +
      "<div class='quiz'><div class='qq'>" + bi(q.zh, q.en) + " <button class='say' id='qSay'>🔊</button></div><div class='ans'>" +
      ans.map(function (x, i) { return "<button class='btn' data-i='" + i + "'>" + bi(x.a[0], x.a[1]) + "</button>"; }).join("") +
      "</div><div class='fb' id='qFb'></div><div class='act' id='qAct'></div></div>";
    $("#qSay").onclick = function () { Read.pair(q.zh, q.en); };
    $("#gTitle .gpart").innerHTML = bi("科學問題：" + p.zh, "Science question: " + p.en);
    Pager.fit($("#gCard"), { blocks: function () { return [$("#gCard .top"), $("#gCard .qq"), $("#gCard .ans"), $("#qFb")]; }, act: function () { return $("#qAct"); } });
    Read.pair(q.zh, q.en);
    $$(".ans .btn", $("#gCard")).forEach(function (b) {
      b.onclick = function () {
        var x = ans[+b.dataset.i]; tries++;
        if (x.ok) {
          b.classList.add("ok"); sfx("ding");
          var pts = KAKit.score(tries);
          if (!k.quizDone[p.id]) { k.points = (k.points || 0) + pts; k.quizDone[p.id] = pts; }
          self.after(tries === 1 ? ["答對了！⭐⭐", "Correct! ⭐⭐"] : ["答對了！⭐", "Correct! ⭐"], q.why);
        } else {
          b.classList.add("no"); b.disabled = true; sfx("buzz");
          if (tries >= 2) {
            $$(".ans .btn", $("#gCard")).forEach(function (o) { if (ans[+o.dataset.i].ok) o.classList.add("ok"); });
            if (!k.quizDone[p.id]) k.quizDone[p.id] = -1;
            self.after(["正確答案在這裡：", "Here's the right answer:"], q.why);
          } else { $("#qFb").innerHTML = bi("再試一次！", "Try again!"); Pager.fit($("#gCard"), { blocks: function () { return [$("#gCard .top"), $("#gCard .qq"), $("#gCard .ans"), $("#qFb")]; }, act: function () { return $("#qAct"); }, find: function () { return $("#gCard .ans"); } }); Read.pair("再試一次！", "Try again!"); }
        }
      };
    });
  },
  after: function (head, why) {
    var self = this;
    $$(".ans .btn", $("#gCard")).forEach(function (o) { o.disabled = true; });
    $("#qFb").innerHTML = bi(head[0], head[1]) + "<div class='tip'>" + bi(why[0], why[1]) + "</div>";
    Read.pair(head[0] + why[0], head[1] + " " + why[1]);
    var last = this.step === PARTS.length - 1;
    $("#qAct").innerHTML = "<button class='btn blue' id='qNext'>" + (last ? bi("車子組好了！", "Car complete!") : bi("下一個零件", "Next part")) + " ▶</button>";
    $("#qNext").onclick = function () {
      if (this.disabled) return; this.disabled = true; Read.stop(); sfx("pop"); self.step++; G.kd.step = self.step; save();
      if (self.step >= PARTS.length) { self.slots(); sfx("win"); setTimeout(self.done, 400); } else self.render();
    };
    Pager.fit($("#gCard"), { blocks: function () { return [$("#gCard .top"), $("#gCard .qq"), $("#gCard .ans"), $("#qFb")]; }, act: function () { return $("#qAct"); }, find: function () { return $("#qFb"); } });
  }
