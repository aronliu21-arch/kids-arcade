<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nora's Wand-Writing · Inkwell Academy</title>
<style>
:root{--ink:#2a2140;--gold:#f2b632;--parch:#f7edd6;--nora:#7048e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1a3d;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.btn{min-height:52px;min-width:52px;padding:8px 20px;border-radius:16px;border:0;background:var(--gold);color:#2a1a05;font-weight:800;font-size:19px;box-shadow:0 4px 0 #a9761a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a9761a}
.btn.ghost{background:#fffbf0;color:var(--ink);box-shadow:0 4px 0 #b9a98a}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.75}
.icon{min-width:48px;min-height:48px;border-radius:14px;border:0;background:#fff8e8e6;font-size:22px;box-shadow:0 3px 0 #0004}
/* start */
#start{justify-content:center;gap:14px;text-align:center;color:#fff}
#start h1{margin:0;font-family:"Snell Roundhand","Savoye LET","Apple Chancery","TeX Gyre Chorus",cursive;font-size:clamp(46px,9vw,96px);font-weight:400;color:#ffe08a;text-shadow:0 0 22px #ffb80088,0 3px 0 #0006}
#start .sub{font-size:clamp(16px,2.6vw,22px);font-weight:700;text-shadow:0 2px 6px #000}
#start .sub span{display:block;font-size:.8em;opacity:.85}
#tap{font-size:24px;padding:14px 34px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* story */
#story{justify-content:flex-end}
.dlg{width:min(920px,100%);background:#fbf4e4f2;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 8px 30px #0008;border:3px solid #c9a86b}
.por{flex:0 0 auto;width:96px;height:96px;border-radius:50%;background:#2b3f7a;overflow:hidden;border:4px solid #fff}
.por svg{width:100%;height:100%}
.dlg .who{font-weight:900;font-size:18px;margin-bottom:2px}
.dlg .txt{font-size:clamp(18px,2.4vw,23px);line-height:1.38;min-height:2.8em}
.dlg .ctl{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;align-items:center}
#letter{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-2deg);width:min(560px,86vw);background:#fff8e1;border-radius:8px;padding:22px 26px;box-shadow:0 0 60px #ffcc6699,0 10px 30px #0008;display:none;font-family:"Snell Roundhand","Savoye LET","Apple Chancery","TeX Gyre Chorus",cursive;font-size:clamp(24px,4vw,34px);line-height:1.35;color:#4a2f80}
#letter.on{display:block;animation:glowIn 1.2s}
@keyframes glowIn{from{opacity:0;transform:translate(-50%,-46%) rotate(-2deg)}}
/* write */
#write{gap:8px}
.top{width:min(1100px,100%);display:flex;align-items:center;gap:8px}
.ttl{flex:1;background:#fbf4e4ee;border-radius:16px;padding:6px 14px;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.ttl b{font-size:clamp(15px,2.2vw,20px)}
.ttl span{font-size:13px;opacity:.75}
.pips{display:flex;gap:4px}
.pip{width:14px;height:14px;border-radius:50%;background:#fff6;border:2px solid #fff}
.pip.done{background:var(--gold)}
.pip.cur{background:#fff}
#prompt{width:min(1100px,100%);color:#fff;font-weight:800;font-size:clamp(16px,2.4vw,22px);text-align:center;text-shadow:0 2px 6px #000;min-height:1.4em}
#boardWrap{flex:1;width:min(1100px,100%);min-height:0;position:relative;background:var(--parch);border-radius:22px;border:5px solid #b08a5a;box-shadow:0 10px 30px #0007;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#fb{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;font-weight:800;font-size:18px;background:#fff;display:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#fb.on{display:block}
#fb.good{background:#d3f9d8;color:#1b5e20}#fb.bad{background:#ffe3e3;color:#8a1c1c}#fb.info{background:#fff3bf;color:#5c3d00}
.ctrls{display:flex;gap:10px;width:min(1100px,100%);justify-content:center}
#pen{position:absolute;right:10px;bottom:8px;font-size:13px;font-weight:700;opacity:.6}
/* result */
#result{justify-content:center}
.card{width:min(560px,100%);background:#fbf4e4;border-radius:24px;padding:22px;text-align:center;box-shadow:0 10px 40px #000a;border:4px solid #c9a86b;max-height:100%;overflow:auto}
.card h2{margin:4px 0 6px;font-size:26px}
.card .big{font-size:54px;line-height:1.1}
.card p{font-size:18px;margin:8px 0}
.tip{background:#e7f5ff;border-radius:14px;padding:10px 12px;font-size:16px;text-align:left;margin:12px 0}
.lvl{display:flex;flex-direction:column;gap:6px;text-align:left;margin:10px 0}
.lvl div{background:#fff;border-radius:12px;padding:8px 12px;font-size:17px}
#read{gap:10px}.prm{width:min(1100px,100%);color:#fff;font-weight:800;font-size:clamp(16px,2.4vw,22px);text-align:center;text-shadow:0 2px 6px #000}
#scroll{flex:1;min-height:0;width:min(900px,100%);background:#f3e2bd;border-radius:14px;border:5px solid #9c7444;box-shadow:inset 0 0 40px #b8925a88,0 10px 30px #0007;position:relative}
#rcv{position:absolute;inset:0;width:100%;height:100%}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(900px,100%)}
#choices button{min-height:56px;border-radius:16px;border:3px solid #c9a86b;background:#fffbf0;font-size:clamp(19px,2.6vw,24px);font-weight:800;color:var(--ink)}
#choices button.ok{background:#b2f2bb;border-color:#2f9e44}#choices button.no{background:#ffc9c9;border-color:#e03131;opacity:.7}
@media (min-width:700px){#choices{grid-template-columns:repeat(4,minmax(0,1fr))}}
body.hinted .screen{padding-bottom:44px!important}
.tray{display:flex;align-items:center;gap:3px;background:#0006;border-radius:999px;padding:3px 10px}
.ti{font-size:26px;line-height:1;filter:grayscale(1) brightness(.7);opacity:.45;transition:filter .3s,opacity .3s}
.ti.cur{opacity:.85;filter:grayscale(.5);animation:bob 1.2s infinite ease-in-out}
.ti.lit{opacity:1;filter:drop-shadow(0 0 8px #ffd86b);animation:pop .6s}
.left{color:#fff;font-weight:900;font-size:14px;margin-left:6px;white-space:nowrap}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-3px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:41;pointer-events:none;text-align:center;color:#fff;font-weight:900;font-size:clamp(28px,5vw,48px);text-shadow:0 0 18px #ffb800,0 3px 0 #0008;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .3s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font-size:.5em;margin-top:4px}
#chap{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:#000a;color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;display:none;white-space:nowrap}
#chap i{font-style:normal;letter-spacing:1px;color:#ffd86b}
@media (max-width:520px){.ti{font-size:21px}.left{font-size:12px}.tray{padding:2px 6px}}
#hint{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);background:#000b;color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;display:none;z-index:50;pointer-events:none}
@media (max-height:460px){.dlg{padding:8px 12px}.por{width:60px;height:60px}.dlg .txt{font-size:17px;min-height:0}.btn{min-height:48px;font-size:17px;padding:6px 14px}.ttl{min-height:44px;padding:4px 10px}.ttl span{display:none}#prompt{font-size:15px}.card{padding:12px}.card .big{font-size:36px}.card h2{font-size:21px}.card p{font-size:16px}}
@media (max-width:520px){.ttl span{display:none}.ttl b{font-size:15px}.pips .pip{width:11px;height:11px}.por{width:64px;height:64px}.dlg{padding:12px}.top .icon{min-width:44px}}
@media (prefers-reduced-motion:reduce){#tap{animation:none}}
</style>
</head>
<body>
<svg id="bg" viewBox="0 0 1024 640" preserveAspectRatio="xMidYMid slice"></svg>

<section class="screen on" id="start">
 <div class="sub">Nora's Wand-Writing<span>幼晴的魔杖草寫課</span></div>
 <h1>Inkwell Academy</h1>
 <button class="btn" id="tap">▶ Tap to start<small>點一下開始</small></button>
 <div class="row"><button class="btn ghost" id="voiceBtn">🗣 聲音 Voice</button><button class="btn ghost" id="sndBtn">🔊 Sound</button></div>
</section>

<section class="screen" id="story">
 <div id="letter"></div>
 <div class="dlg"><div class="por" id="por"></div><div style="flex:1;min-width:0">
  <div class="who" id="who"></div><div class="txt" id="txt"></div>
  <div class="ctl"><button class="icon" id="sayBtn" aria-label="Read aloud">🔊</button><button class="btn" id="nextBtn">Next ▶<small>下一步</small></button></div>
 </div></div>
</section>

<section class="screen" id="write">
 <div class="top">
  <button class="icon" id="homeBtn" aria-label="Home">🏠</button>
  <div class="ttl"><b id="mTitle"></b><span id="mSub"></span></div>
  <div class="tray" id="pips"></div>
  <button class="icon" id="sndBtn2" aria-label="Sound">🔊</button>
 </div>
 <div id="prompt"></div>
 <div id="boardWrap"><canvas id="board"></canvas><div id="fb"></div><div id="pen"></div></div>
 <div class="ctrls">
  <button class="btn ghost" id="watchBtn">👁 Watch<small>看示範</small></button>
  <button class="btn ghost" id="clearBtn">↺ Clear<small>重寫</small></button>
  <button class="btn" id="castBtn">✨ Cast<small>施咒</small></button>
 </div>
</section>

<section class="screen" id="read">
 <div class="top"><button class="icon" id="homeBtn2" aria-label="Home">🏠</button><div class="ttl"><b>Read the Scroll · 讀古卷</b><span id="rSub">Mission 4 of 5 · What does the cursive say?</span></div><div class="tray" id="rpips"></div></div>
 <div id="prompt2" class="prm">Which word is written on the scroll?</div>
 <div id="scroll"><canvas id="rcv"></canvas></div>
 <div id="choices"></div>
</section>
<section class="screen" id="result"><div class="card" id="rcard"></div></section>
<div id="hint"></div><canvas id="fx"></canvas><div id="toast"></div><div id="chap"></div>

<script src="../../../voice.js"></script>
<script src="../../../tracker.js" data-game="wand-writing"></script>
<script src="../../../house.js"></script>
<script>
"use strict";
const VERSION="1.1";
// Cursive letter centerlines. Units: x-height = 1. Baseline y=0, midline y=-1, ascender y≈-2.1, descender y≈+1.1 (y points down).
// Every joining letter starts at (0,0) and ends at (w,0), so letters chain into one stroke.
// extras = separate strokes (i dot, t cross). join:false = letter does not connect to the next (capital O).
const GLYPHS = {
 a:{w:1.2,d:"M0 0C0.4 0 0.7 -0.4 0.85 -0.92C0.65 -1.08 0.2 -1 0.2 -0.45C0.2 -0.05 0.65 -0.05 0.82 -0.55L0.88 -1C0.85 -0.6 0.82 -0.2 0.92 -0.05C0.97 0.02 1.07 0.02 1.2 0"},
 c:{w:0.95,d:"M0 0C0.4 0 0.7 -0.4 0.88 -0.85C0.7 -1.05 0.2 -1 0.2 -0.45C0.2 -0.05 0.55 0.02 0.95 0"},
 d:{w:1.2,d:"M0 0C0.4 0 0.7 -0.4 0.85 -0.92C0.65 -1.08 0.2 -1 0.2 -0.45C0.2 -0.05 0.65 -0.05 0.82 -0.55L0.98 -2.05C0.9 -1.2 0.82 -0.3 0.92 -0.05C0.97 0.02 1.07 0.02 1.2 0"},
 e:{w:0.85,d:"M0 0C0.4 -0.2 0.75 -0.55 0.65 -0.85C0.55 -1.05 0.25 -0.95 0.25 -0.6C0.25 -0.2 0.45 0 0.85 0"},
 g:{w:1.15,d:"M0 0C0.4 0 0.7 -0.4 0.85 -0.92C0.65 -1.08 0.2 -1 0.2 -0.45C0.2 -0.05 0.65 -0.05 0.82 -0.55L0.88 -1C0.88 -0.3 0.88 0.5 0.78 0.9C0.68 1.2 0.28 1.15 0.33 0.85C0.43 0.4 0.83 0.1 1.15 0"},
 h:{w:1.15,d:"M0 0C0.3 -0.6 0.7 -1.6 0.6 -2.05C0.55 -2.35 0.2 -2.25 0.25 -1.85C0.3 -1.2 0.3 -0.5 0.3 0C0.4 -0.7 0.55 -1 0.75 -1C0.95 -1 0.85 -0.4 0.85 -0.15C0.85 0 1 0.02 1.15 0"},
 i:{w:0.75,d:"M0 0C0.2 -0.3 0.35 -0.7 0.4 -1C0.35 -0.6 0.3 -0.2 0.4 -0.05C0.5 0.05 0.65 0.02 0.75 0",x:["M0.42 -1.5L0.46 -1.42"]},
 l:{w:0.9,d:"M0 0C0.3 -0.6 0.7 -1.6 0.6 -2.05C0.55 -2.35 0.2 -2.25 0.25 -1.85C0.3 -1.2 0.35 -0.5 0.45 -0.1C0.5 0.05 0.7 0.03 0.9 0"},
 n:{w:1.15,d:"M0 0C0.1 -0.5 0.25 -1 0.35 -1C0.42 -1 0.35 -0.4 0.3 0C0.4 -0.7 0.55 -1 0.75 -1C0.95 -1 0.85 -0.4 0.85 -0.15C0.85 0 1 0.02 1.15 0"},
 p:{w:1.1,d:"M0 0C0.15 -0.4 0.3 -0.8 0.35 -1C0.3 -0.3 0.25 0.5 0.22 1.1C0.24 0.5 0.28 -0.4 0.5 -0.85C0.7 -1.1 1 -0.9 0.95 -0.5C0.9 -0.1 0.6 0 0.35 -0.1C0.6 0 0.9 0 1.1 0"},
 t:{w:0.75,d:"M0 0C0.2 -0.4 0.35 -1.1 0.4 -1.7C0.35 -1.1 0.3 -0.3 0.4 -0.05C0.5 0.05 0.65 0.02 0.75 0",x:["M0.12 -1.15L0.7 -1.15"]},
 A:{w:1.45,d:"M1.1 -1.75C0.8 -2.2 0.1 -1.9 0.1 -0.8C0.1 -0.05 0.8 -0.1 1.05 -1.2L1.15 -2C1.1 -1.2 1.05 -0.3 1.15 -0.05C1.2 0.02 1.3 0.02 1.45 0"},
 L:{w:1.35,d:"M0.6 -1.6C0.8 -2.1 1.3 -2.2 1.2 -1.8C1.1 -1.3 0.6 -0.6 0.3 -0.1C0.2 0.1 0 0 0.2 -0.1C0.5 -0.25 0.9 0.05 1.35 0"},
 O:{w:1.45,join:false,d:"M0.95 -2C0.45 -2.05 0.12 -1.4 0.15 -0.8C0.2 -0.1 0.8 0 1.05 -0.5C1.3 -1.1 1.2 -2 0.85 -2C0.6 -2 0.5 -1.8 0.72 -1.6"},
};
// lay out a word: returns {w, strokes:[path strings in units, already offset]}
function layoutWord(word){
 let x=0; const main=[]; const extra=[]; let cur='';
 [...word].forEach((ch,i)=>{const g=GLYPHS[ch]; if(!g) return;
  const shifted=shiftPath(g.d,x,0);
  if(!cur) cur=shifted; else cur+=shifted.replace(/^M[-\d. ]+(?=[CL])/,'');
  (g.x||[]).forEach(p=>extra.push(shiftPath(p,x,0)));
  if(g.join===false){ main.push(cur); cur=''; x+=g.w+0.25; } else x+=g.w;
 });
 if(cur) main.push(cur);
 return {w:x,strokes:[...main,...extra],mainCount:main.length};
}
function shiftPath(d,dx,dy){
 return d.replace(/([ML C])\s*([^MLC]+)/g,(m,cmd,nums)=>{const n=nums.trim().split(/[ ,]+|(?=-)/).filter(Boolean).map(Number);
  const out=[];for(let i=0;i<n.length;i+=2)out.push((+(n[i]+dx).toFixed(3))+' '+(+(n[i+1]+dy).toFixed(3)));return cmd+out.join(' ');}).replace(/ ([MLC])/g,'$1');
}



// ================= storage =================
const SKEY="wandwrite-nora";
let S={trial:null,seen:[],stars:0,ch1:false,scene:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(SKEY)||"{}"));}catch(e){}
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}};
try{KA.setKid&&KA.setKid("nora");}catch(e){}
try{KAH.init({kids:["nora"],keys:["^wandwrite-nora"]});}catch(e){}

// ================= audio =================
let AC=null,master=null,musicGain=null,muted=false,musicOn=false,musicTimer=null;
try{muted=localStorage.getItem("wandwrite-mute")==="1";}catch(e){}
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(master);}catch(e){}return AC;}
function tone(f,t,d,type,vol,dest){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.05,d/4));g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);}
const N=n=>440*Math.pow(2,(n-69)/12);const rnd0=(a,b)=>Math.round(a+Math.random()*(b-a));
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
let bar=0;
function musicBar(){if(!AC)return;const t=AC.currentTime+.05,ch=CHORDS[bar%4];
 ch.forEach(n=>tone(N(n),t,3.6,"triangle",.045,musicGain));tone(N(ch[0]-12),t,3.6,"sine",.08,musicGain);
 const arp=[ch[0]+12,ch[1]+12,ch[2]+12,ch[1]+12,ch[2]+12,ch[0]+24,ch[2]+12,ch[1]+12];
 arp.forEach((n,i)=>tone(N(n),t+i*.45,.9,"sine",.05,musicGain));bar++;}
function music(on){audio();if(!AC)return;try{AC.resume();}catch(e){}const t=AC.currentTime;
 musicGain.gain.cancelScheduledValues(t);musicGain.gain.setValueAtTime(musicGain.gain.value,t);musicGain.gain.linearRampToValueAtTime(on?1:0,t+(on?1.5:1.2));
 if(on&&!musicTimer){musicBar();musicTimer=setInterval(musicBar,3600);}
 if(!on&&musicTimer){const mt=musicTimer;setTimeout(()=>{if(!musicOn){clearInterval(mt);if(musicTimer===mt)musicTimer=null;}},1300);}musicOn=on;}
function sfx(k){audio();if(!AC||muted)return;const t=AC.currentTime;
 if(k==="good")[76,79,83,88].forEach((n,i)=>tone(N(n),t+i*.09,.6,"sine",.18));
 if(k==="great")[72,76,79,84,88,91].forEach((n,i)=>tone(N(n),t+i*.08,.8,"sine",.17));
 if(k==="miss"){tone(N(52),t,.35,"triangle",.15);tone(N(49),t+.15,.4,"triangle",.12);}
 if(k==="tick")tone(N(96),t,.08,"sine",.05);
 if(k==="pop")tone(N(rnd0(84,96)),t,.15,"sine",.12);
 if(k==="whoosh"){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(1800,t+.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+.75);[88,91,95].forEach((n,i)=>tone(N(n),t+.5+i*.07,.5,"sine",.08));}
 if(k==="gate")[40,43,47].forEach((n,i)=>tone(N(n),t+i*.2,1.4,"sawtooth",.05));}
function setMute(m){muted=m;try{localStorage.setItem("wandwrite-mute",m?"1":"0");}catch(e){}if(master)master.gain.value=m?0:1;if(m)voiceStop();
 ["sndBtn","sndBtn2"].forEach(id=>{const b=document.getElementById(id);b.textContent=(m?"🔇":"🔊")+(id==="sndBtn"?" Sound":"");});}
const voiceSay=(t,o)=>{if(muted)return;try{KAVoice.say(t,o);}catch(e){}};
const voiceStop=()=>{try{KAVoice.stop();}catch(e){}};

// ================= painted scene =================
const W=1024,H=640;
const RNG=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(42);
const STARS=Array.from({length:70},()=>[RNG()*W,RNG()*330,RNG()*1.6+.6,RNG()*4]);

function pickUnseen(pool,n,avoid=[]){const fresh=pool.filter(w=>!S.seen.includes(w)&&!avoid.includes(w));const pick=[];const src=fresh.length>=n?fresh:pool.filter(w=>!avoid.includes(w));

function parsePath(d){const segs=[];let cur=null;const re=/([MLC])([^MLC]*)/g;let m;
 while((m=re.exec(d))){const n=(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number);
  if(m[1]==="M"){cur=[n[0],n[1]];}
  else if(m[1]==="L"){for(let i=0;i<n.length;i+=2){segs.push({t:"L",p:[cur,[n[i],n[i+1]]]});cur=[n[i],n[i+1]];}}
  else{for(let i=0;i<n.length;i+=6){const p=[cur,[n[i],n[i+1]],[n[i+2],n[i+3]],[n[i+4],n[i+5]]];segs.push({t:"C",p});cur=p[3];}}}
 return segs;}
function samplePath(d,step){const pts=[];parsePath(d).forEach(s=>{const k=s.t==="L"?6:24;for(let i=0;i<=k;i++){const t=i/k;let x,y;
 if(s.t==="L"){x=s.p[0][0]+(s.p[1][0]-s.p[0][0])*t;y=s.p[0][1]+(s.p[1][1]-s.p[0][1])*t;}
 else{const [a,b,c,e]=s.p,u=1-t;x=u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*e[0];y=u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*e[1];}
 if(!pts.length||Math.hypot(x-pts[pts.length-1][0],y-pts[pts.length-1][1])>=step)pts.push([x,y]);}});
 return pts;}

   ],lanterns);}));}

function lanterns(){const items=pickUnseen(levelPool(),3);
 mission({n:3,icon:"🏮",word:"Lantern",title:"Rune Casting · 點燈咒",sub:"Light the lanterns with Mei",items,prompt:(w,i)=>`Lantern ${i+1}: write “${w}”`,
  onItem:(r,i)=>{SC.lit=Math.min(5,2+i+1);drawScene();}},(r,pts)=>{SC.lit=5;drawScene();
  story([
   {who:"narr",view:"path",t:"One by one, the lanterns glow. Mei copies Nora's wand moves… and her own lantern flickers to life!",lit:5},
   {who:"mei",t:"I did it! You didn't laugh at me even once. Nora… will you be my friend?"},
   {who:"nora",t:"Of course! Everyone fizzles at first. We just keep trying."},
   {who:"mei",t:"Look — there's an old scroll pinned to the lantern post. The words are in cursive, and I can't read cursive yet. Can you?"},
  ],()=>readMission(()=>story([
   {who:"nora",t:"I read it! Writing cursive helps me read it too."},
   {who:"iris",t:"Lanterns? Cute. I'm Iris — top of the class. Bet you can't write a capital L, new girl."},
   {who:"mei",t:"(whispering) Don't worry. Just start at the green dot, like you told me."},
  ],irisChallenge)));});}

function irisChallenge(){const pool=["Lit","Lilac","Leap","Lent","Lean"].filter(w=>[...w].every(c=>GLYPHS[c]));const items=pickUnseen(pool,1);
 mission({n:5,icon:"⚡",word:"Spell",fx:"fireworks",title:"Iris's Challenge · 艾芮絲的挑戰",sub:"Capital L — show her!",items,prompt:w=>`Write “${w}” — capital L joins to the next letter`},(r,pts)=>{
  const won=r[0].pass;
  story([
   won?{who:"iris",t:"Hmph. Not bad… for a beginner. See you in Wand-Writing class, Nora."}:{who:"iris",t:"Ha! Told you. But… you didn't give up. Most people quit after one try."},
   {who:"nora",t:won?"Thanks, Iris! Maybe we can practice together sometime?":"I'll practice. Next time I'll get it!"},
   {who:"narr",t:"That night, Nora looked at Grandma's letter again. At the very bottom, a new line had appeared — and then slowly faded away, letter by letter…"},
  ],chapterEnd);});}

function chapterEnd(){S.ch1=true;save();voiceStop();
 card(`<div class="big">📜✨</div><h2>Chapter 1 complete!</h2><p>The Glowing Letter</p><p style="font-size:30px">⭐ ${S.stars} stars</p>
  <div class="tip">💡 <b>Try it for real:</b> write “Love, Nora” in cursive on a card and give it to someone in your family — just like Grandma's letter.</div>
  <p style="opacity:.7;font-size:15px">Next: Chapter 2 · Mei's Round Letters (coming soon)</p>`,
  [{t:"Next: Chapter 2 ▶<small>即將推出</small>",go:()=>card(`<div class="big">🔒</div><h2>Coming soon!</h2><p>Chapter 2 is being written. Try Chapter 1 again for new spells.</p>`,[{t:"↺ Play Chapter 1 again",go:ch1},{t:"🏠 Arcade",ghost:true,go:home}])},
   {t:"🏠 Arcade",ghost:true,go:home}]);
 voiceSay("Chapter 1 complete! Try it for real: write Love, Nora in cursive on a card for someone in your family.");}
function home(){location.href="../../../";}

// ================= intro =================
let introDone=false,introTimer=0,introRaf=0;
function intro(){show("none");document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
 const L=layoutWord("light"),c=document.createElement("canvas");c.id="introInk";c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none";document.body.appendChild(c);
 const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
 const sc=Math.min(innerWidth/7,innerHeight/5),ox=(innerWidth-L.w*sc)/2,oy=innerHeight*.42;
 const pts=L.strokes.map(d=>samplePath(d,.02).map(([a,b])=>[ox+(a-b*SKEW)*sc,oy+b*sc]));const total=pts.flat().length,t0=performance.now(),dur=3600;
 setView("far");setTimeout(()=>setView("gate",5200),300);
 const f=now=>{const k=Math.min(1,(now-t0)/dur),n=Math.floor(total*k);x.clearRect(0,0,innerWidth,innerHeight);x.lineCap="round";x.lineJoin="round";x.shadowColor="#ffb800";x.shadowBlur=24;x.strokeStyle="#ffd86b";x.lineWidth=Math.max(6,sc*.08);
  let c2=0;for(const g of pts){const take=Math.min(g.length,n-c2);if(take>1){x.beginPath();x.moveTo(...g[0]);for(let i=1;i<take;i++)x.lineTo(...g[i]);x.stroke();}c2+=g.length;}
  if(k<1)introRaf=requestAnimationFrame(f);else{c.style.transition="opacity 1.2s";c.style.opacity="0";}};introRaf=requestAnimationFrame(f);
 introTimer=setTimeout(endIntro,5600);}
function endIntro(){if(introDone)return;introDone=true;clearTimeout(introTimer);cancelAnimationFrame(introRaf);const c=document.getElementById("introInk");c&&c.remove();
 if(S.ch1||S.trial)menu();else ch1();}
function menu(){setView("far");SC.lit=5;SC.gate=false;drawScene();
 card(`<div class="big">🏰</div><h2>Welcome back, Nora!</h2><p>${S.trial?["Letter Apprentice","Joining Adept","Word Scholar"][S.trial.level]:""} · ⭐ ${S.stars}</p>`,
  [{t:"▶ Chapter 1<small>第一章</small>",go:ch1},{t:"🪄 Retake Wand Trial",ghost:true,go:()=>{S.trial=null;save();setView("gate");wandTrial();}}]);}
document.getElementById("tap").onclick=()=>{audio();try{AC.resume();}catch(e){}music(true);sfx("great");if(reduce){endIntro();return;}intro();
 setTimeout(()=>addEventListener("pointerdown",function sk(){removeEventListener("pointerdown",sk);endIntro();}),300);};
document.getElementById("voiceBtn").onclick=e=>{e.stopPropagation();try{KAVoice.picker();}catch(_){}};
document.getElementById("sndBtn").onclick=e=>{e.stopPropagation();audio();setMute(!muted);};
document.getElementById("sndBtn2").onclick=()=>{setMute(!muted);};
document.getElementById("homeBtn").onclick=()=>{voiceStop();menu();};
setMute(muted);drawScene();

// ================= test hook =================
window.__test={
 state:()=>({screen:cur,word:B.word,mission:M&&M.title,item:M&&M.i,done:!!S.ch1,trial:S.trial,stars:S.stars,line:lines[li]&&lines[li].t,version:VERSION}),
 solve:()=>{if(cur==="story"){document.getElementById("nextBtn").click();return;}
  if(cur==="result"){document.querySelector("#rcard button").click();return;}
  if(cur==="read"){const b=document.querySelector(`#choices button[data-w="${R.word}"]`);b&&b.click();return;}
  if(cur==="write"&&!B.locked){cancelAnimationFrame(demoRaf);B.demoT=-1;B.user=B.guide.map(g=>g.map(p=>[p[0]+.5,p[1]+.5]));cast();}},
 fail:()=>{if(cur==="write"&&!B.locked){B.user=[[[5,5],[40,40],[80,20]]];cast();}},
 skipIntro:()=>{document.getElementById("tap").click();setTimeout(endIntro,50);}
};
