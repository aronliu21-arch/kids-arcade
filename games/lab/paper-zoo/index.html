<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Milo's Paper Zoo · 洛明的紙片動物園</title>
<style>
:root{--paper:#fdf8ef;--ink:#3b2f2a;--green:#69a84f;--blue:#4a90c2;--gold:#f6b93b;--red:#e8590c;--milo:#f08c00;--topH:58px;--appH:100vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f2;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","PingFang TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
ruby{ruby-position:over}rt{font-size:.5em;font-weight:600;color:#6b5a50;letter-spacing:0}
.app{position:fixed;left:0;top:0;width:100vw;height:var(--appH);overflow:hidden}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
/* paper look */
.paper{background:var(--paper);border-radius:18px;box-shadow:0 3px 0 rgba(0,0,0,.08),0 6px 14px rgba(60,40,20,.22)}
.pbtn{min-height:56px;min-width:56px;padding:8px 16px;border-radius:16px;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 12px rgba(60,40,20,.25);font-weight:800;font-size:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12),0 3px 6px rgba(60,40,20,.25)}
.pbtn .em{font-size:28px;line-height:1}
.pbtn.big{font-size:24px;min-height:70px;padding:10px 26px}
.pbtn.go{background:#ffe08a}
.pbtn.dis{opacity:.45}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:calc(var(--topH) + env(safe-area-inset-top));padding:calc(6px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;z-index:50;pointer-events:none}
.top>*{pointer-events:auto}
.top .pbtn{min-height:46px;min-width:50px;padding:4px 10px;font-size:18px}
.top .ttl{flex:1;display:flex;justify-content:center;pointer-events:none;min-width:0}
.top .ttl span{background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:900;font-size:17px;box-shadow:0 3px 8px rgba(60,40,20,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.top .ttl span:empty{display:none}
#visBadge{background:#fff3bf}
/* start */
#start{background:url(art/zoo-bg.webp) center bottom/cover}
#start .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);width:min(560px,92vw);padding:18px 18px 22px;text-align:center}
#start h1{margin:4px 0 2px;font-size:clamp(28px,6vw,44px);line-height:1.15}
#start h1 small{display:block;font-size:.55em;margin-top:6px}
#start .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#start .stick{display:flex;justify-content:center;align-items:flex-end;gap:2%;height:min(20vh,140px)}
#start .stick img{height:100%;max-width:24%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#start .stick img.pop{transform:scale(1)}
#start .stick img:nth-child(2){height:130%}
.small{font-size:14px;opacity:.75}
#resetBtn{position:absolute;right:10px;bottom:10px;font-size:13px;min-height:36px;padding:4px 12px;opacity:.7}
/* map */
#map{background:url(art/zoo-bg.webp) center 70%/cover}
#zooLayer{position:absolute;inset:0}
.ani{position:absolute;transform-origin:50% 100%;transition:left 3.2s ease-in-out,top 3.2s ease-in-out;cursor:pointer;touch-action:manipulation}
.ani img{display:block;width:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));transition:transform .3s}
.ani.flip img{transform:scaleX(-1)}
.ani .hop{animation:hop .5s}
@keyframes hop{50%{transform:translateY(-22%)}}
.vis{position:absolute;font-size:clamp(20px,3.4vw,30px);transition:left 6s linear;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.mapBtns{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 8px;z-index:20}
.empty{position:absolute;left:50%;top:calc(var(--topH) + 40px);transform:translateX(-50%);padding:10px 18px;font-size:19px;font-weight:800;text-align:center;max-width:90vw}
/* overlays / panels */
.stage{position:absolute;left:0;right:0;top:calc(var(--topH) + env(safe-area-inset-top));bottom:0;background:#f4ead8 url(art/zoo-bg.webp) center/cover}
.stage::before{content:"";position:absolute;inset:0;background:rgba(253,248,239,.72)}
.prompt{position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:5;padding:8px 16px;font-size:clamp(18px,2.6vw,24px);font-weight:800;text-align:center;max-width:94%;display:flex;align-items:center;gap:10px}
.prompt .spk{min-width:48px;min-height:48px;border-radius:50%;background:#ffe08a;font-size:22px;flex:none}
/* puzzle */
#pzBoard{position:absolute;border-radius:14px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px rgba(120,90,60,.25)}
#pzGhost{position:absolute;inset:0;opacity:.18;border-radius:14px}
.pc{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));z-index:3}
.pc.placed{filter:none;z-index:1;cursor:default}
.pc{transition:transform .15s}
.pc.drag{z-index:10;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
.pc .lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;background:#ffd43b;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.3);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
/* question */
#qBox{position:absolute;inset:0;z-index:60;background:rgba(40,30,20,.45);display:none;align-items:center;justify-content:center;padding:10px}
#qBox.on{display:flex}
#qCard{width:min(640px,96vw);max-height:calc(var(--appH) - 20px);overflow:auto;padding:14px;text-align:center}
#qText{font-size:clamp(19px,2.8vw,26px);font-weight:800;margin:4px 0 8px;display:flex;align-items:center;justify-content:center;gap:10px}
#qVis{font-size:clamp(28px,5vw,44px);line-height:1.25;margin:6px 0 10px;min-height:40px}
#qVis .gone{opacity:.25;filter:grayscale(1)}
#qAns .pen{display:flex;flex-wrap:wrap;justify-content:center;max-width:min(240px,38vw);font-size:clamp(22px,3.6vw,32px);line-height:1.15;padding:4px;border:4px dashed #a07850;border-radius:14px}
#qAns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#qAns .pbtn{min-width:92px;min-height:80px;font-size:34px}
#qAns .pbtn.hint{animation:wig .6s 3;background:#d3f9d8}
#qAns .pbtn.no{background:#ffe3e3}
#qAns .pbtn.yes{background:#b2f2bb}
@keyframes wig{25%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}
#qWhy{min-height:24px;font-weight:700;margin-top:8px;color:#5c4033}
/* habitat */
#habGrid{position:absolute;display:grid;gap:8px;padding:10px;border-radius:18px;background:#c9a47a;box-shadow:inset 0 0 0 6px #8b6a4a,0 6px 12px rgba(0,0,0,.25)}
.slot{border-radius:12px;background:rgba(255,255,255,.35);border:3px dashed rgba(90,60,30,.4);display:flex;align-items:center;justify-content:center;font-size:clamp(26px,5vw,44px);min-width:56px;min-height:56px}
.slot.f{border:0;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.t-grass{background:linear-gradient(160deg,#8fce6a,#5fa443)}
.t-water{background:linear-gradient(160deg,#8ecbf0,#4a90c2)}
.t-ice{background:linear-gradient(160deg,#f1fbff,#b9e3f5)}
.t-rock{background:linear-gradient(160deg,#c9c3bb,#8f877e)}
.t-tree{background:linear-gradient(160deg,#7cc45a,#3f8a2e)}
#habPal{position:absolute;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#habPal .pbtn{min-width:84px;min-height:84px;flex-direction:column;gap:2px;font-size:15px;padding:6px}
#habPal .pbtn .em{font-size:34px}
#habAni{position:absolute;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#habDone{position:absolute}
/* mix */
#mixWrap{position:absolute;display:flex;align-items:center;justify-content:center;gap:10px}
#mixCv{background:#fffaf0;border-radius:18px;box-shadow:0 6px 14px rgba(60,40,20,.22)}
.mixArrows{display:flex;flex-direction:column;justify-content:space-around;height:100%;gap:8px}
.mixArrows .pbtn{min-width:60px;min-height:60px;font-size:26px}
#mixName{position:absolute;left:50%;transform:translateX(-50%);font-size:clamp(22px,3vw,30px);font-weight:900;text-align:center;white-space:nowrap}
#mixBtns{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:10px}
/* safari */
#safari .frame{position:absolute;inset:calc(var(--topH) + env(safe-area-inset-top) + 64px) 10px 10px 10px;border:5px dashed rgba(255,255,255,.85);border-radius:20px;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70;transition:opacity .35s}
/* album */
#albumGrid{position:absolute;left:10px;right:10px;top:calc(var(--topH) + env(safe-area-inset-top) + 8px);bottom:10px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start;padding:6px}
.photo{background:#fff;padding:8px 8px 6px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.25);text-align:center;font-weight:800;font-size:15px;transform:rotate(var(--r))}
.photo .pic{height:96px;border-radius:4px;background:url(art/zoo-bg.webp) center/cover;display:flex;align-items:flex-end;justify-content:center}
.photo .pic img{max-height:90%;max-width:80%}
/* truck + celebrate */
#truck{position:absolute;left:-40%;bottom:16%;font-size:clamp(70px,14vw,130px);z-index:40;transition:left 1.6s cubic-bezier(.2,.8,.3,1);display:none;pointer-events:none}
#truck img{position:absolute;left:12%;bottom:62%;width:62%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:80;padding:16px 26px;font-size:clamp(24px,4vw,36px);font-weight:900;text-align:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#toast.on{transform:translate(-50%,-50%) scale(1)}
.conf{position:absolute;z-index:79;pointer-events:none;width:12px;height:16px;border-radius:2px}
/* break / gate */
.modal{position:absolute;inset:0;z-index:90;background:rgba(40,30,20,.5);display:none;align-items:center;justify-content:center;padding:12px}
.modal.on{display:flex}
.modal .paper{padding:20px;text-align:center;width:min(460px,94vw)}
.modal input{font:inherit;font-size:24px;width:150px;padding:8px;border-radius:10px;border:2px solid #b49a80;text-align:center}
#rotHint{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;font-size:13px;padding:4px 12px;display:none;pointer-events:none;white-space:nowrap}
@media (orientation:portrait) and (max-width:600px){#rotHint{display:block}.prompt{left:8px;right:8px;transform:none;max-width:none;font-size:17px;padding:6px 10px}.mapBtns{bottom:calc(34px + env(safe-area-inset-bottom))}}
@media (max-height:420px){#start .card{transform:translate(-50%,-50%);padding:8px 14px 10px}#start .stick{height:64px}#start h1{font-size:26px;margin:2px 0}#start .row{margin-top:6px}#start .small{display:none}:root{--topH:50px}.pbtn{min-height:50px;font-size:17px}.pbtn .em{font-size:24px}.pbtn.big{min-height:56px;font-size:20px}.top .pbtn{min-height:42px}.prompt{padding:4px 12px;top:4px}#qAns .pbtn{min-height:62px;font-size:28px;min-width:76px}#qVis{margin:2px 0 6px}#qCard{padding:8px}#habPal .pbtn{min-width:66px;min-height:66px}#habPal .pbtn .em{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="top" id="top" style="display:none">
    <button class="pbtn" id="homeBtn" aria-label="Back">🏠</button>
    <div class="ttl" id="ttl"></div>
    <button class="pbtn" id="visBadge" aria-label="Visitors">🧒 <span id="visN">0</span></button>
    <button class="pbtn" id="langBtn" aria-label="Language">中</button>
    <button class="pbtn" id="sndBtn" aria-label="Sound">🔊</button>
  </div>

  <!-- START -->
  <section class="scr on" id="start">
    <div class="card paper">
      <div class="stick" id="stick">
        <img src="art/elephant.webp" alt=""><img src="art/giraffe.webp" alt=""><img src="art/lion.webp" alt=""><img src="art/penguin.webp" alt="">
      </div>
      <h1>Milo's Paper Zoo<small id="zhTitle"></small></h1>
      <div class="row">
        <button class="pbtn big go" id="playBtn"><span class="em">▶</span> Tap to start</button>
      </div>
      <div class="row">
        <button class="pbtn" id="voiceBtn">🗣 聲音 Voice</button>
      </div>
      <div class="small" style="margin-top:10px">Rescue · Puzzle · Build · Snap</div>
    </div>
    <button class="pbtn" id="resetBtn">Reset records</button>
  </section>

  <!-- MAP -->
  <section class="scr" id="map">
    <div id="zooLayer"></div>
    <div class="empty paper" id="emptyMsg"></div>
    <div class="mapBtns">
      <button class="pbtn big go" id="rescueBtn"><span class="em">🚚</span><span class="lb"></span></button>
      <button class="pbtn big" id="safariBtn"><span class="em">📷</span><span class="lb"></span></button>
      <button class="pbtn big" id="mixBtn"><span class="em">✂️</span><span class="lb"></span></button>
      <button class="pbtn big" id="albumBtn"><span class="em">📒</span><span class="lb"></span></button>
    </div>
    <div id="truck">🚚<img id="truckAni" alt=""></div>
  </section>

  <!-- PUZZLE -->
  <section class="scr" id="puzzle">
    <div class="stage" id="pzStage">
      <div class="prompt paper" id="pzPrompt"></div>
      <div id="pzBoard"><canvas id="pzGhost"></canvas></div>
    </div>
  </section>

  <!-- HABITAT -->
  <section class="scr" id="habitat">
    <div class="stage" id="habStage">
      <div class="prompt paper" id="habPrompt"></div>
      <img id="habAni" alt="">
      <div id="habGrid"></div>
      <div id="habPal"></div>
      <button class="pbtn big go" id="habDone">✔ <span class="lb"></span></button>
    </div>
  </section>

  <!-- MIX -->
  <section class="scr" id="mix">
    <div class="stage" id="mixStage">
      <div class="prompt paper" id="mixPrompt"></div>
      <div id="mixWrap">
        <div class="mixArrows" id="mixL"></div>
        <canvas id="mixCv"></canvas>
        <div class="mixArrows" id="mixR"></div>
      </div>
      <div id="mixName"></div>
      <div id="mixBtns"></div>
    </div>
  </section>

  <!-- SAFARI -->
  <section class="scr" id="safari">
    <div class="stage" style="background-position:center 70%"></div>
    <div id="safLayer" style="position:absolute;inset:0"></div>
    <div class="prompt paper" id="safPrompt" style="top:calc(var(--topH) + env(safe-area-inset-top) + 6px)"></div>
    <div class="frame"></div>
  </section>

  <!-- ALBUM -->
  <section class="scr" id="album">
    <div class="stage"></div>
    <div id="albumGrid"></div>
  </section>

  <div id="qBox"><div id="qCard" class="paper">
    <div id="qText"></div><div id="qVis"></div><div id="qAns"></div><div id="qWhy"></div>
  </div></div>

  <div class="modal" id="breakM"><div class="paper">
    <div style="font-size:60px">😴🐘</div>
    <h2 id="breakT"></h2>
    <button class="pbtn big go" id="breakOk"></button>
  </div></div>

  <div class="modal" id="gateM"><div class="paper">
    <h3>Grown-ups only</h3>
    <div id="gateQ" style="font-size:26px;font-weight:800;margin:8px 0"></div>
    <input id="gateIn" inputmode="numeric" autocomplete="off">
    <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
      <button class="pbtn" id="gateNo">Cancel</button><button class="pbtn go" id="gateOk">OK</button>
    </div>
    <div id="gateMsg" style="margin-top:8px;min-height:20px"></div>
  </div></div>

  <div id="toast" class="paper"></div>
  <div id="flash"></div>
  <div id="rotHint" class="paper" style="display:none">Turn your phone sideways ↻ 橫著拿</div>
</div>

<script src="../../../voice.js"></script>
<script src="../../../tracker.js" data-game="paper-zoo"></script>
<script>

let AC=null,musicNodes=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d=.15,type="triangle",v=.18,when=0){if(!S.snd)return;const a=ac();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={
 pop(){tone(660,.08,"sine",.2);tone(990,.1,"sine",.12,.05)},
 snap(){tone(523,.08,"square",.08);tone(784,.12,"triangle",.15,.06)},
 no(){tone(220,.18,"sawtooth",.07)},
 yay(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.16,i*.1))},
 cam(){tone(1800,.04,"square",.08);tone(900,.06,"square",.06,.05)},
 truck(){tone(110,.4,"sawtooth",.05);tone(98,.4,"sawtooth",.05,.35)}
};
function music(on){const a=ac();if(!a)return;if(on&&S.snd&&!musicNodes){const g=a.createGain();g.gain.value=0;g.connect(a.destination);g.gain.linearRampToValueAtTime(.07,a.currentTime+1);const notes=[392,440,523,440,392,330,349,392,523,587,659,587,523,440,392,392];let i=0;const iv=setInterval(()=>{const t=a.currentTime;const o=a.createOscillator(),e=a.createGain();o.type="triangle";o.frequency.value=notes[i%notes.length];e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(1,t+.02);e.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(e).connect(g);o.start(t);o.stop(t+.4);if(i%4===0){const b=a.createOscillator(),be=a.createGain();b.type="sine";b.frequency.value=notes[i%notes.length]/2;be.gain.setValueAtTime(.6,t);be.gain.exponentialRampToValueAtTime(.001,t+.6);b.connect(be).connect(g);b.start(t);b.stop(t+.7)}i++},340);musicNodes={g,iv}}

$("habDone").onclick=()=>{if(!HB)return;const cnt={};HB.slots.forEach(s=>{if(s)cnt[s]=(cnt[s]||0)+1});const need=HB.need;const ok=Object.keys(need).every(k=>cnt[k]===need[k])&&HB.slots.every(s=>s&&need[s]);
 HB.tries=(HB.tries||0)+1;rec({q:"habitat "+HB.k,given:JSON.stringify(cnt),expected:JSON.stringify(need),correct:ok,tryNo:HB.tries,topic:HB.bondMode?"number-bond":"counting"});
 if(ok){finishRescue(HB.k);return}
 sfx.no();const [t1,t2]=AN[HB.k].tiles;const have2=cnt[t2]||0;let en,zh;
 if(HB.slots.includes(null)){en="Fill every space first!";zh="每一格都要放！"}else if(Object.keys(cnt).some(k=>!need[k])){en="Oops, I don't need that one. Tap it to take it out.";zh="這個我不需要，按一下拿出來。"}else if(have2<need[t2]){en=`I need more ${TILE[t2].en}. Count them!`;zh=`${TILE[t2].zh}還不夠，數一數！`}else{en=`Too much ${TILE[t2].en}! Count them!`;zh=`${TILE[t2].zh}太多了，數一數！`}
 ZY["每"]="ㄇㄟˇ";ZY["不"]="ㄅㄨˋ";ZY["夠"]="ㄍㄡˋ";ZY["數"]="ㄕㄨˇ";
 if(HB.tries>=2){HB.slots=[];Object.keys(need).forEach(k=>{for(let i=0;i<need[k];i++)HB.slots.push(k)});habLayout();en=`Like this! ${need[t1]} ${TILE[t1].en} and ${need[t2]} ${TILE[t2].en} make 6. Tap Done!`;zh=`像這樣！${NUMZ[need[t1]]}格${TILE[t1].zh}和${NUMZ[need[t2]]}格${TILE[t2].zh}，一共六格。按完成！`;ZY["像"]="ㄒㄧㄤˋ";ZY["樣"]="ㄧㄤˋ";ZY["共"]="ㄍㄨㄥˋ";HB.tries=-5}
 toast(T(en,zh),2200);say(en,zh)};
function finishRescue(k){sfx.yay();confetti(60);S.rescued.push(k);addVisitors(3);save();missionsInRow++;
 toast(`${T("New home!","新家！")}<br><img src="${AN[k].img}" style="height:100px"><br>🧒🧒🧒 +3`,2200);say(`The ${AN[k].en.toLowerCase()} loves its new home! Three visitors came to see it!`,`${AN[k].zh}好喜歡新家！來了三個遊客！`);ZY["喜"]="ㄒㄧˇ";ZY["歡"]="ㄏㄨㄢ";
 HB=null;PZ=null;setTimeout(()=>{goMap();if(missionsInRow>=3){missionsInRow=0;showBreak()}},2400)}
function showBreak(){$("breakT").innerHTML=Tb("Great practice! Time for a break","練習得好棒！休息一下");ZY["練"]="ㄌㄧㄢˋ";ZY["習"]="ㄒㄧˊ";ZY["得"]="˙ㄉㄜ";$("breakOk").innerHTML=Tb("Finish for now","先到這裡");ZY["裡"]="ㄌㄧˇ";$("breakM").classList.add("on");say("Great practice! Time for a break.","練習得好棒！休息一下。")}
$("breakOk").onclick=()=>{$("breakM").classList.remove("on");show("start")};

/* ---------- MIX-A-ANIMAL ---------- */
let MX=null;const NORM={};
function normCanvas(k){if(NORM[k])return NORM[k];const im=IMG[k];const c=document.createElement("canvas");c.width=300;c.height=360;const x=c.getContext("2d");
 // scale each animal to fill the box height-wise so bands line up (head / body / legs)
 const s=Math.min(300/im.naturalWidth,360/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;x.drawImage(im,(300-w)/2,360-h,w,h);NORM[k]=c;return c}
const BANDS=[[0,.42],[.42,.72],[.72,1]];
function startMix(){const pool=S.rescued.slice();const target=pick(pool);MX={pool,idx:[rnd(pool.length),rnd(pool.length),rnd(pool.length)],target,done:false,mode:"make"};
 if(MX.idx.every(i=>pool[i]===target))MX.idx[0]=(MX.idx[0]+1)%pool.length;
 show("mix",T("Mix-a-Animal","動物剪貼"));mixPrompt();mixLayout()}
function mixPrompt(){const A=AN[MX.target];const en=MX.mode==="make"?`Make ${/^[aeiou]/i.test(A.en)?"an":"a"} ${A.en.toLowerCase()}! Match the head, body and legs.`:"Now make a silly animal! Any mix you like.";const zh=MX.mode==="make"?`做一隻${A.zh}！頭、身體、腳都要對。`:"做一隻奇怪的動物！隨便配！";ZY["身"]="ㄕㄣ";ZY["體"]="ㄊㄧˇ";ZY["腳"]="ㄐㄧㄠˇ";ZY["隨"]="ㄙㄨㄟˊ";ZY["便"]="ㄅㄧㄢˋ";ZY["配"]="ㄆㄟˋ";ZY["、"]="";
 $("mixPrompt").innerHTML=`<button class="spk" onclick="sayAgain()">🔊</button><span>${T(en,zh)}</span>`;say(en,zh)}
function mixLayout(){if(!MX)return;const st=$("mixStage");const {w:W,h:H}=stageRect(st);const top=pBot("mixPrompt",74);const cv=$("mixCv");const short=W>H&&(H-top)<380;const avail=short?H-top-12:H-top-150;const ch=Math.max(140,Math.min(avail,W*.6*1.2));const cw=ch*300/360;
 cv.style.width=cw+"px";cv.style.height=ch+"px";const dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
 const wrap=$("mixWrap");wrap.style.left="0";wrap.style.right=short?"38%":"0";wrap.style.top=top+"px";wrap.style.height=ch+"px";
 ["mixL","mixR"].forEach((id,side)=>{const d=$(id);d.innerHTML="";d.style.height=ch+"px";for(let b=0;b<3;b++){const btn=document.createElement("button");btn.className="pbtn";btn.textContent=side?"▶":"◀";btn.onclick=()=>{MX.idx[b]=(MX.idx[b]+(side?1:MX.pool.length-1))%MX.pool.length;sfx.pop();mixDraw();mixCheck()};d.appendChild(btn)}});
 const nm=$("mixName"),mb=$("mixBtns");if(short){nm.style.left="81%";nm.style.top=(top+ch*.25)+"px";mb.style.left="62%";mb.style.right="0";mb.style.top=(top+ch*.25+56)+"px"}else{nm.style.left="50%";nm.style.top=(top+ch+8)+"px";mb.style.left="0";mb.style.right="0";mb.style.top=(top+ch+52)+"px"}mixDraw()}
function mixDraw(){if(!MX)return;const cv=$("mixCv"),x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);
 BANDS.forEach(([a,b],i)=>{const src=normCanvas(MX.pool[MX.idx[i]]);x.drawImage(src,0,a*360,300,(b-a)*360,0,a*cv.height,cv.width,(b-a)*cv.height)});
 x.strokeStyle="rgba(160,120,80,.35)";x.setLineDash([8,8]);x.lineWidth=2;BANDS.slice(1).forEach(([a])=>{x.beginPath();x.moveTo(0,a*cv.height);x.lineTo(cv.width,a*cv.height);x.stroke()});
 const h=AN[MX.pool[MX.idx[0]]],l=AN[MX.pool[MX.idx[2]]];const same=MX.idx.every(i=>MX.pool[i]===MX.pool[MX.idx[0]]);
 $("mixName").innerHTML=same?Tb(h.en,h.zh):`${esc(h.pre+l.suf)}!`;
 const mb=$("mixBtns");mb.innerHTML="";if(MX.mode==="silly"){const b=document.createElement("button");b.className="pbtn big go";b.innerHTML="📸 "+T("Keep it!","存起來！");ZY["存"]="ㄘㄨㄣˊ";ZY["起"]="ㄑㄧˇ";b.onclick=keepMix;mb.appendChild(b)}}
function mixCheck(){if(MX.mode!=="make")return;const ok=MX.idx.every(i=>MX.pool[i]===MX.target);if(!ok)return;rec({q:"mix "+MX.target,given:MX.target,expected:MX.target,correct:true,tryNo:1,topic:"parts"});
 sfx.yay();confetti(30);addVisitors(1);toast(T("Perfect match!","配對成功！"),1500);ZY["功"]="ㄍㄨㄥ";say(`That's a ${AN[MX.target].en.toLowerCase()}!`,`是${AN[MX.target].zh}！`);
 setTimeout(()=>{MX.mode="silly";mixPrompt();mixLayout()},1700)}
function keepMix(){const name=AN[MX.pool[MX.idx[0]]].pre+AN[MX.pool[MX.idx[2]]].suf;S.mixes.push({parts:MX.idx.map(i=>MX.pool[i]),name});S.album.push({k:"mix",parts:MX.idx.map(i=>MX.pool[i]),name,d:Date.now()});addVisitors(1);save();sfx.cam();flash();say(`Hello, ${name}! It's in your album.`,`${name}放進相簿了！`);ZY["放"]="ㄈㄤˋ";missionsInRow++;
 setTimeout(()=>{goMap();if(missionsInRow>=3){missionsInRow=0;showBreak()}},1600)}

/* ---------- PHOTO SAFARI ---------- */
let SF=null;
function startSafari(){SF={n:0,total:3,qs:[]};show("safari",T("Photo Safari","拍照探險"));ZY["探"]="ㄊㄢˋ";ZY["險"]="ㄒㄧㄢˇ";safLayout();nextSaf()}
function safLayout(){const L=$("safLayer");L.innerHTML="";const W=L.clientWidth,H=L.clientHeight;const pool=S.rescued;const base=W>H?Math.min(W*.2,H*.28):Math.min(W*.27,H*.2);const xs=shuffle([.12,.36,.6,.84]).slice(0,pool.length);
 pool.forEach((k,i)=>{const d=document.createElement("button");d.className="ani";d.style.background="none";d.dataset.k=k;const w=base*(k==="giraffe"?.6:k==="penguin"?.7:1);d.style.width=w+"px";d.style.left=(xs[i]*W-w/2)+"px";d.style.top=(H*.78-w*AN[k].h)+"px";d.innerHTML=`<img src="${AN[k].img}" alt="${AN[k].en}">`;d.onclick=()=>snap(k,d);L.appendChild(d)})}
function safQ(){const pool=S.rescued;const t=pick(S.lang==="zh"?["zy","tall","short","color","name"]:["letter","tall","short","color","name"]);const k=pick(pool);const A=AN[k];
 if(t==="tall"){const best=pool.slice().sort((a,b)=>AN[b].h-AN[a].h)[0];return {ans:best,en:"Snap the TALLEST animal!",zh:"拍最高的動物！",t}}
 if(t==="short"){const best=pool.slice().sort((a,b)=>AN[a].h-AN[b].h)[0];return {ans:best,en:"Snap the SHORTEST animal!",zh:"拍最矮的動物！",t}}
 if(t==="letter")return {ans:k,en:`Snap the animal that starts with ${A.letter}!`,zh:`拍 ${A.letter} 開頭的動物！`,t};
 if(t==="zy")return {ans:k,en:`Snap the animal whose name starts with ${A.zyFirst}!`,zh:`拍名字第一個聲音是 ${A.zyFirst} 的動物！`,t};
 if(t==="color")return {ans:k,en:`Snap the ${A.color} animal!`,zh:`拍${A.colorZh}的動物！`,t};
 return {ans:k,en:`Snap the ${A.en.toLowerCase()}!`,zh:`拍${A.zh}！`,t}}
ZY["名"]="ㄇㄧㄥˊ";
function nextSaf(){let q,g=0;do{q=safQ();g++}while(g<12&&SF.qs.some(p=>p.en===q.en));SF.q=q;SF.qs.push(q);SF.tries=0;
 $("safPrompt").innerHTML=`<button class="spk" onclick="sayAgain()">🔊</button><span>📷 ${T(q.en,q.zh)} <small>(${SF.n+1}/${SF.total})</small></span>`;say(q.en,q.zh)}
function snap(k,el){if(!SF||SF.busy)return;const q=SF.q;flash();sfx.cam();
 if(k===q.ans){rec({q:q.en,given:k,expected:q.ans,correct:true,tryNo:SF.tries+1,topic:"safari-"+q.t});S.album.push({k,d:Date.now()});addVisitors(1);save();SF.busy=true;
  el.querySelector("img").animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:500});say(pick(["Click! Great photo!","Got it!"]),pick(["喀擦！拍得好棒！","拍到了！"]));ZY["喀"]="ㄎㄚ";ZY["擦"]="ㄘㄚ";
  setTimeout(()=>{SF.busy=false;SF.n++;if(SF.n>=SF.total){sfx.yay();confetti();toast(T("3 photos! Look in your album 📒","拍了三張！看看相簿📒"),1800);ZY["張"]="ㄓㄤ";missionsInRow++;setTimeout(()=>{goMap();if(missionsInRow>=3){missionsInRow=0;showBreak()}},1900)}else nextSaf()},1200)}
 else{SF.tries++;rec({q:q.en,given:k,expected:q.ans,correct:false,tryNo:SF.tries,topic:"safari-"+q.t});sfx.no();
  const right=[...$("safLayer").children].find(d=>d.dataset.k===q.ans);
  if(SF.tries===1){say("Hmm, not that one. Look again!","不是這隻，再看看！");right.querySelector("img").animate([{transform:"rotate(0)"},{transform:"rotate(-8deg)"},{transform:"rotate(8deg)"},{transform:"rotate(0)"}],{duration:600,iterations:2})}
  else{say(`It's the ${AN[q.ans].en.toLowerCase()}! Snap it!`,`是${AN[q.ans].zh}！拍它！`);ZY["它"]="ㄊㄚ";right.querySelector("img").animate([{transform:"scale(1)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:700,iterations:2})}}}
function flash(){const f=$("flash");f.style.transition="none";f.style.opacity=".9";void f.offsetWidth;f.style.transition="";f.style.opacity="0"}

/* ---------- ALBUM ---------- */
function showAlbum(){show("album",T("My Album","我的相簿"));const g=$("albumGrid");g.innerHTML="";
 S.album.slice().reverse().forEach(p=>{const d=document.createElement("div");d.className="photo";d.style.setProperty("--r",(Math.random()*6-3)+"deg");
  if(p.k==="mix"){const c=document.createElement("canvas");c.width=150;c.height=180;const x=c.getContext("2d");BANDS.forEach(([a,b],i)=>x.drawImage(normCanvas(p.parts[i]),0,a*360,300,(b-a)*360,0,a*180,150,(b-a)*180));d.innerHTML=`<div class="pic"></div><div>${esc(p.name)}</div>`;c.style.maxHeight="90%";d.querySelector(".pic").appendChild(c);d.onclick=()=>say(p.name+"!",p.name)}
  else{d.innerHTML=`<div class="pic"><img src="${AN[p.k].img}" alt=""></div><div>${Tb(AN[p.k].en,AN[p.k].zh)}</div>`;d.onclick=()=>say(AN[p.k].en,AN[p.k].zh)}
  g.appendChild(d)});say("Your photo album!","你的相簿！")}

/* ---------- test hook ---------- */
window.__test={
 state:()=>({screen:cur,rescued:S.rescued.slice(),visitors:S.visitors,q:!!QA,pz:PZ?{placed:PZ.placed,total:PZ.pieces.length}:null,hab:!!HB,mix:MX?MX.mode:null,saf:SF?SF.n:null}),
 solve:()=>{if(QA){const b=[...$("qAns").children].find(x=>x.dataset.v===String(QA.q.ans));b.click();return "q"}
  if(cur==="puzzle"&&PZ){const p=PZ.pieces.find(p=>!p.placed);if(!p)return "done";if(p.locked){openLockQ(p);return "lock"}placePiece(p);return "piece"}
  if(cur==="habitat"&&HB){HB.slots=[];Object.keys(HB.need).forEach(k=>{for(let i=0;i<HB.need[k];i++)HB.slots.push(k)});habLayout();$("habDone").click();return "hab"}
  if(cur==="mix"&&MX){if(MX.mode==="make"){MX.idx=MX.idx.map(()=>MX.pool.indexOf(MX.target));mixDraw();mixCheck();return "mix"}keepMix();return "keep"}
  if(cur==="safari"&&SF){const d=[...$("safLayer").children].find(d=>d.dataset.k===SF.q.ans);snap(SF.q.ans,d);return "snap"}
  return "none"},
 wrongQ:()=>{if(!QA)return;const b=[...$("qAns").children].find(x=>x.dataset.v!==String(QA.q.ans));b.click()},
 go:(w)=>{if(w==="map")goMap();if(w==="rescue")$("rescueBtn").click();if(w==="safari")startSafari();if(w==="mix")startMix();if(w==="album")showAlbum();if(w==="q")askQ(()=>{})},
 reset:()=>{try{localStorage.removeItem(SKEY)}catch(e){}Object.assign(S,load())}
};
relabel();updTop();
