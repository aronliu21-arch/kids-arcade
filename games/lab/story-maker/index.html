<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Maker 故事工坊</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;min-height:100%;font-family:-apple-system,system-ui,"PingFang TC",sans-serif;background:#fdf3e1;color:#2b2118}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;min-height:48px;min-width:48px;touch-action:manipulation}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.on{display:flex}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:14px}
h1{margin:0;font-size:clamp(30px,6vw,50px);line-height:1.05}
h2{margin:6px 0 10px;font-size:clamp(20px,3.6vw,28px)}
.ver{font-size:13px;color:#8a7a66}
.center{text-align:center}
.kids{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.kid{width:140px;height:140px;font-size:22px;font-weight:800;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.kid span{font-size:44px}
.kid.nora{background:#7048e8}.kid.lucas{background:#f76707}.kid.milo{background:#2f9e44}
.btn{padding:0 18px;font-weight:800;font-size:17px;background:#efe3cf;color:#2b2118}
.go{background:#e8590c;color:#fff}.blue{background:#1c7ed6;color:#fff}.green{background:#2f9e44;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:3;flex-wrap:wrap}
.top .t{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{color:#fff;font-weight:800;padding:0 12px;height:40px;border-radius:12px;display:flex;align-items:center}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.book{background:#fff;border-radius:16px;padding:10px;text-align:left;box-shadow:0 4px 0 #e6d6bb;display:flex;flex-direction:column;gap:6px;min-height:200px}
.book .cv{flex:1;background:#f7efe2 center/contain no-repeat;border-radius:10px;min-height:110px;display:flex;align-items:center;justify-content:center;font-size:44px}
.book b{font-size:17px}.book small{color:#8a7a66}
/* coach */
.coach{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 #e6d6bb;margin-bottom:12px}
.owl{font-size:42px;line-height:1}
.coach p{margin:0 0 6px;font-size:17px;line-height:1.45}
.coach .zh{color:#6b5b48}
.prog{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 #e6d6bb;margin:4px 0 12px}
.prog .lbl{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;flex-wrap:wrap}
.prog .track{position:relative;height:22px;border-radius:11px;background:#efe3cf;margin:10px 26px 4px 0;overflow:visible}
.prog .fill{height:100%;border-radius:11px;background:linear-gradient(90deg,#ffa94d,#e8590c);transition:width .5s}
.prog .run{position:absolute;top:-9px;font-size:26px;transform:translateX(-50%) scaleX(-1);transition:left .5s}
.prog .flag{position:absolute;right:-28px;top:-6px;font-size:24px}
.steps{display:flex;gap:4px;margin:6px 26px 0 0}
.steps i{flex:1;height:6px;border-radius:3px;background:#e6d6bb}
.steps i.done{background:#2f9e44}.steps i.cur{background:#e8590c}
textarea,input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:2px solid #e0cfb2;background:#fff;color:#2b2118}
textarea{min-height:130px;resize:vertical;line-height:1.5}
label.l{display:block;font-weight:800;margin:14px 0 6px}
.pic{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.thumb{width:160px;height:120px;border-radius:12px;background:#fff center/contain no-repeat;border:2px dashed #d9c4a3;display:flex;align-items:center;justify-content:center;font-size:36px;color:#c9b18c}
.choice{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.choice .n{width:40px;height:40px;border-radius:50%;background:#1c7ed6;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{background:#fff;border:2px solid #e0cfb2;padding:0 12px;font-size:16px}
.mood.sel{border-color:#e8590c;background:#fff0e0}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 0 #e6d6bb}
.nav{display:flex;gap:10px;justify-content:space-between;margin:18px 0 30px}
/* map */
.tier{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.arrow{text-align:center;color:#b59a72;font-size:22px;margin:2px 0}
.node{background:#fff;border-radius:14px;padding:8px;width:150px;text-align:center;box-shadow:0 3px 0 #e6d6bb;display:flex;flex-direction:column;gap:4px;align-items:center}
.node .im{width:120px;height:70px;border-radius:8px;background:#f7efe2 center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px}
.node b{font-size:14px}.node small{font-size:12px;color:#6b5b48;min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.node.ok{outline:3px solid #2f9e44}.node.end{background:#fff8db}
.group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:16px;background:rgba(232,89,12,.06)}
/* player */
.page{background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 0 #e6d6bb;max-width:760px;margin:0 auto;width:100%}
.page img{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:#f7efe2;display:block}
.page .txt{font-size:clamp(18px,2.6vw,22px);line-height:1.6;margin:14px 0;white-space:pre-wrap}
.pchoices{display:flex;flex-direction:column;gap:10px}
.pchoices button{background:#1c7ed6;color:#fff;font-weight:800;font-size:18px;padding:10px 16px;text-align:left}
.theend{font-size:34px;font-weight:900;text-align:center;color:#e8590c}
.found{display:flex;gap:6px;justify-content:center;margin:8px 0;font-size:28px}
/* draw modal */
#draw{position:fixed;inset:0;background:#2b2118;display:none;flex-direction:column;z-index:20}
#draw.on{display:flex}
#draw .bar{display:flex;gap:6px;padding:6px;flex-wrap:wrap;align-items:center;background:#3a2e22}
#draw .sw{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:50%;border:3px solid #fff}
#draw .sw.sel{outline:4px solid #ffd43b}
#draw .tool{background:#5a4a38;color:#fff;font-size:20px}
#draw .tool.sel{background:#ffd43b;color:#222}
#draw .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
#dc{background:#fff;border-radius:12px;touch-action:none;max-width:100%;max-height:100%}
#draw .what{color:#ffd43b;font-weight:800;padding:0 8px}
canvas.living{width:min(100%,calc(62vh*4/3));margin:0 auto;aspect-ratio:4/3;display:block;border-radius:14px;background:#eef7ff}
.stagebox{max-width:640px;margin:8px 0}
.blocks{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 #e6d6bb;margin-bottom:6px}
.brow{margin-top:10px}.bq{font-weight:800;margin-bottom:6px;color:#e8590c}
.blocks .mood{font-size:15px;min-height:44px}
.hint{margin:0 0 8px;color:#6b5b48;font-size:15px}
.chk{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#dc.trans{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:32px 32px;background-position:0 0,16px 16px}
#castCtl{margin-top:8px}
#intro{position:fixed;inset:0;z-index:50;background:#fbf1dc;display:flex;align-items:center;justify-content:center}
#intro.gone{display:none}
#ic{position:absolute;inset:0;width:100%;height:100%}
#istart{position:relative;z-index:2;background:#e8590c;color:#fff;font-size:24px;font-weight:900;padding:18px 30px;border-radius:999px;box-shadow:0 8px 0 #a83f06;display:flex;gap:12px;align-items:center;animation:pulse 1.4s ease-in-out infinite}
#istart span{font-size:30px}
#iskip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#a08b70;font-size:14px;display:none;z-index:2}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (max-height:500px){#iskip{bottom:auto;top:8px;right:12px;left:auto;text-align:right}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:600px){.coach .owl{font-size:32px}.thumb{width:130px;height:98px}.node{width:132px}.node .im{width:110px}}
@media (max-height:420px){#draw .bar{padding:3px}#draw .sw{width:34px;height:34px;min-width:34px;min-height:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro"><canvas id="ic"></canvas>
  <button id="istart"><span>▶</span>Tap to start 點一下開始</button>
  <div id="iskip">Tap to skip 點一下跳過</div></div>
<!-- HOME -->
<section id="home" class="screen on"><div class="wrap center">
  <h1>📖 Story Maker<br><span style="font-size:.55em">故事工坊</span></h1>
  <p>Write it, draw it, then play it! 自己寫、自己畫、自己玩!</p>
  <div class="kids">
    <button class="kid nora" data-kid="nora"><span>🦄</span>Nora</button>
    <button class="kid lucas" data-kid="lucas"><span>⚡</span>Lucas</button>
    <button class="kid milo" data-kid="milo"><span>🦖</span>Milo</button>
  </div>
  <p class="ver">Test sample · 測試版 · v0.4 · 5 endings 5 個結局</p>
</div></section>

<!-- SHELF -->
<section id="shelf" class="screen">
  <div class="top"><button class="btn" id="shelfHome">🏠</button><div class="badge" id="shelfWho"></div><div class="t">My stories 我的故事</div></div>
  <div class="wrap">
    <div class="shelf" id="books"></div>
  </div>
</section>

<!-- EDITOR -->
<section id="edit" class="screen">
  <div class="top"><button class="btn" id="toShelf">📚</button><div class="t" id="editTitle"></div>
    <button class="btn" id="toMap">🗺️ Map 地圖</button><button class="btn green" id="toPlay">▶ Play 玩</button></div>
  <div class="wrap">
    <div class="prog" id="steps"></div>
    <div class="coach"><div class="owl">🦉</div><div style="flex:1"><p id="coachEn"></p><p class="zh" id="coachZh"></p>
      <div class="row"><button class="btn" id="say">🔊 Listen 聽</button><button class="btn" id="idea">✨ Idea 給我點子</button></div></div></div>
    <div id="form"></div>
    <div class="nav"><button class="btn" id="prev">◀ Back 上一步</button><span class="ver" id="saved"></span><button class="btn go" id="next">Next 下一步 ▶</button></div>
  </div>
</section>

<!-- MAP -->
<section id="map" class="screen">
  <div class="top"><button class="btn" id="mapBack">✏️ Write 寫</button><div class="t">Story map 故事地圖</div><button class="btn green" id="mapPlay">▶ Play 玩</button></div>
  <div class="wrap" id="mapBody"></div>
</section>

<!-- PLAYER -->
<section id="play" class="screen">
  <div class="top"><button class="btn" id="playBack">✏️ Write 寫</button><div class="t" id="playTitle"></div><button class="btn" id="playSay">🔊</button></div>
  <div class="wrap"><div class="page" id="pageBox"></div></div>
</section>

<!-- DRAW -->
<div id="draw">
  <div class="bar" id="dbar1">
    <span class="what" id="dWhat"></span><span style="flex:1"></span>
    <button class="tool" id="dUndo">↩️</button><button class="tool" id="dClear">🗑️</button>
    <button class="btn" id="dCancel">Cancel 取消</button><button class="btn go" id="dDone">✓ Done 完成</button>
  </div>
  <div class="bar" id="dbar2"></div>
  <div class="stage"><canvas id="dc" width="800" height="600"></canvas></div>
</div>
<div class="toast" id="toast"></div>

<script>
{
const VERSION='v0.4';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)};
const KIDS={nora:{name:'Nora',color:'#7048e8'},lucas:{name:'Lucas',color:'#f76707'},milo:{name:'Milo',color:'#2f9e44'}};
function show(id){try{stopStage()}catch(e){}document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

/* ---------- story shape: 1 beginning → 2 chapters → 5 endings ---------- */
const TREE={start:['a','b'],a:['e1','e2'],b:['e3','e4','e5']};
const ENDS=['e1','e2','e3','e4','e5'];
const PARENT={a:'start',b:'start',e1:'a',e2:'a',e3:'b',e4:'b',e5:'b'};
const ORDER=['chars','start','a','e1','e2','b','e3','e4','e5'];
const MOODS=[['happy','😊 Happy 開心'],['funny','😂 Funny 好笑'],['surprise','😲 Surprise 驚喜'],['sad','😢 Sad 難過']];
const MOODICON={happy:'😊',funny:'😂',surprise:'😲',sad:'😢'};
const NAMES={start:'Beginning 開頭',a:'Chapter A 第一章A',b:'Chapter B 第一章B',e1:'Ending 1 結局',e2:'Ending 2 結局',e3:'Ending 3 結局',e4:'Ending 4 結局',e5:'Ending 5 結局'};
const SPARKS={
 chars:['a brave dragon who is scared of the dark 怕黑的勇敢小龍','a robot that loves soccer 愛踢足球的機器人','a tiny dinosaur with a giant sneeze 打噴嚏超大聲的小恐龍','a girl who can talk to cats 會跟貓說話的女孩','a boy detective with a magic magnifying glass 有魔法放大鏡的小偵探'],
 start:['finds a glowing map under the bed 床底下找到發光的地圖','a strange egg rolls into the garden 一顆奇怪的蛋滾進院子','the school bus starts flying 校車飛起來了','all the cookies in town disappear 鎮上的餅乾全不見了','a door appears in the tree 樹上出現一扇門'],
 mid:['meets a grumpy troll on a bridge 在橋上遇到愛生氣的山怪','gets lost in a candy forest 在糖果森林迷路','a storm blows them to an island 暴風雨把他們吹到小島','finds a talking backpack 撿到會說話的書包','has to cross a river of lava 要過一條岩漿河'],
 end:['they become best friends 他們變成好朋友','it was all a dream… or was it? 原來是一場夢…真的嗎?','they throw a giant party 辦了一個超大派對','the villain says sorry 壞人道歉了','they fly home on a dragon 騎著龍飛回家']};

/* ---------- storage (IndexedDB, one record per story, overwritten) ---------- */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('story-maker',1);r.onupgradeneeded=()=>r.result.createObjectStore('stories',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function dbPut(s){try{const d=await db();await new Promise((res,rej)=>{const t=d.transaction('stories','readwrite');t.objectStore('stories').put(s);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){console.warn(e)}}
async function dbAll(){try{const d=await db();return await new Promise(res=>{const r=d.transaction('stories').objectStore('stories').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}catch(e){return[]}}
async function dbDel(id){try{const d=await db();await new Promise(res=>{const t=d.transaction('stories','readwrite');t.objectStore('stories').delete(id);t.oncomplete=res;t.onerror=res})}catch(e){}}

function newStory(kid){const pages={};['start','a','b',...ENDS].forEach(k=>pages[k]={text:'',img:'',choices:(TREE[k]||[]).map(()=>''),mood:''});
  return{id:'s'+Date.now(),kid,title:'',created:Date.now(),updated:Date.now(),chars:[{name:'',img:''},{name:'',img:''}],pages,found:[]}}

let kid=null,story=null,step=0,dirty=false;
const hero=()=>story.chars[0].name.trim()||'your hero';
const heroZh=()=>story.chars[0].name.trim()||'主角';

/* ---------- home & shelf ---------- */
document.querySelectorAll('.kid').forEach(b=>b.onclick=()=>{kid=b.dataset.kid;try{window.KA&&KA.setKid(kid)}catch(e){}openShelf()});
$('shelfHome').onclick=()=>show('home');
async function openShelf(){await saveNow();const K=KIDS[kid];$('shelfWho').textContent=K.name;$('shelfWho').style.background=K.color;
  const mine=(await dbAll()).filter(s=>s.kid===kid).sort((a,b)=>b.updated-a.updated);
  $('books').innerHTML=`<button class="book" id="newBook" style="align-items:center;justify-content:center;border:3px dashed #e0b57a;background:#fff8ec"><span style="font-size:48px">➕</span><b>New story 新故事</b></button>`+
   mine.map(s=>{const cover=s.pages.start.img||s.chars[0].img;const done=countDone(s);
     return`<button class="book" data-id="${esc(s.id)}"><div class="cv" style="${cover?`background-image:url('${cover}')`:''}">${cover?'':'📖'}</div><b>${esc(s.title||'Untitled 未命名')}</b><small>${done}/9 pages · ${s.found.length}/5 endings found 已發現結局</small></button>`}).join('');
  $('newBook').onclick=()=>{story=newStory(kid);step=0;dirty=true;saveNow();openEdit()};
  document.querySelectorAll('.book[data-id]').forEach(b=>b.onclick=()=>{story=mine.find(s=>s.id===b.dataset.id);step=firstTodo(story);openEdit()});
  show('shelf')}
function pageDone(s,k){if(k==='chars')return!!s.chars[0].name.trim()&&!!s.title.trim();const p=s.pages[k];return!!p.text.trim()&&p.choices.every(c=>c.trim())&&(!ENDS.includes(k)||!!p.mood)}
const countDone=s=>ORDER.filter(k=>pageDone(s,k)).length;
const firstTodo=s=>{const i=ORDER.findIndex(k=>!pageDone(s,k));return i<0?0:i};

/* ---------- coach text per step ---------- */
function coach(k){const H=hero(),Hz=heroZh();
  if(k==='chars')return['Every story needs a hero! Give your story a name, then name and draw your hero. Add a friend — or a sneaky villain!','每個故事都需要主角!先幫故事取名字,再幫主角取名、畫出來。也可以加一個好朋友或壞蛋!','chars'];
  if(k==='start')return[`The beginning: Where does ${H} live? What does ${H} want? Then make a PROBLEM happen! Tap the story blocks to help, then pick 2 choices.`,`開頭:${Hz}住在哪裡?想要什麼?然後發生一個「問題」!點故事積木幫忙,再選 2 個選擇。`,'start'];
  if(k==='a'||k==='b'){const c=story.pages.start.choices[k==='a'?0:1]||'?';const n=TREE[k].length;
    return[`${H} chose: “${c}”. What happens next? Make it exciting! Then write ${n} new choices.`,`${Hz}選了:「${c}」。接下來發生什麼事?寫得刺激一點!然後寫出 ${n} 個新選擇。`,'mid']}
  const par=PARENT[k],idx=TREE[par].indexOf(k),c=story.pages[par].choices[idx]||'?';
  return[`Ending! ${H} chose: “${c}”. How does the story end? Then pick what kind of ending it is.`,`結局!${Hz}選了:「${c}」。故事怎麼結束?再選這是哪一種結局。`,'end']}
function speak(t){try{speechSynthesis.cancel();const zh=/[一-鿿]/.test(t);const u=new SpeechSynthesisUtterance(t);u.lang=zh?'zh-TW':'en-US';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

/* ---------- story blocks: tap choices that write sentences (editable) ---------- */
const DEFLANG={nora:'zh',lucas:'en',milo:'zh'};
const L=()=>story.lang||DEFLANG[story.kid]||'en';
const HTYPES=[['🐉','little dragon','小龍','隻'],['🤖','robot','機器人','個'],['🐱','kitten','小貓','隻'],['🦖','dinosaur','恐龍','隻'],['🦄','unicorn','獨角獸','隻'],['🕵️','kid detective','小偵探','個'],['🧑‍🚀','astronaut','太空人','個'],['⚽','soccer star','足球明星','個'],['🧙','young wizard','小巫師','個'],['🐶','puppy','小狗','隻']];

function sentence(k,ri,oi){const c=cx();const par=PARENT[k];if(par)c.C=story.pages[par].choices[TREE[par].indexOf(k)]||'';

function compose(k){const p=story.pages[k],rows=blocksFor(k),z=L()==='zh';
  return rows.map((_,ri)=>p.picks[ri]!=null?sentence(k,ri,p.picks[ri]):'').filter(Boolean).join(z?'':' ')}
function pickBlock(k,ri,oi){const p=story.pages[k];p.picks=p.picks||{};const before=compose(k);
  p.picks[ri]=p.picks[ri]===oi?null:oi;const row=blocksFor(k)[ri];if(row.mood&&p.picks[ri]!=null)p.mood=row.o[oi][3];
  const after=compose(k);
  if(!p.text.trim()||p.text===before||p.text===p.auto)p.text=after;            // untouched by hand: rebuild in order
  else p.text=p.text.trimEnd()+(L()==='zh'?'':' ')+(p.picks[ri]!=null?sentence(k,ri,oi):''); // kid edited: just add
  p.auto=after;touch();if(p.picks[ri]!=null&&kid==='milo')speak(sentence(k,ri,oi));
  if(!p.fxManual){const f=suggestFx(k);if(f!==p.fx){p.fx=f;setupCast(k)}}}
function suggestFx(k){const p=story.pages[k],q=p.picks||{};let f='none';
  if(k==='start'){f=[null,'sparkle','storm','stars'][q[0]]||f;f=({2:'stars',3:'bubbles',4:'candy',6:'snow',1:'leaves'})[q[1]]||f;if(q[3]===0)f='storm';if(q[3]===3)f='sparkle'}
  else if(ENDS.includes(k))f=({happy:'confetti',funny:'confetti',surprise:'sparkle',sad:'rain'})[p.mood]||f;
  else{f=({0:'shake',2:'sparkle',3:'candy',4:'stars'})[q[3]]||(q[1]===4?'sparkle':f)}
  return f}
function blocksHTML(k){const p=story.pages[k];p.picks=p.picks||{};

function wireBlocks(k){const p=story.pages[k];
  if($('showBlocks')){$('showBlocks').onclick=()=>{story.freeWrite=false;touch();renderStep()};return}
  $('hideBlocks').onclick=()=>{story.freeWrite=true;touch();renderStep()};
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const[ri,oi]=b.dataset.b.split('.').map(Number);pickBlock(k,ri,oi);
    $('fText').value=p.text;document.querySelectorAll(`[data-b^="${ri}."]`).forEach(x=>x.classList.toggle('sel',x.dataset.b===`${ri}.${p.picks[ri]}`));
    document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('sel',x.dataset.m===p.mood))});
  $('dice').onclick=()=>{const rows=blocksFor(k);p.picks={};p.text='';rows.forEach((r,ri)=>{p.picks[ri]=Math.floor(Math.random()*r.o.length)});
    rows.forEach((r,ri)=>{if(r.mood)p.mood=r.o[p.picks[ri]][3]});p.text=p.auto=compose(k);touch();renderStep()}}
function choiceChips(k){const c=cx();return`<div class="moods" style="margin-top:4px">${CHOICES[c.z?'zh':'en'].map(t=>t.replace(/\bF\b|F/g,c.F)).map(t=>`<button class="mood" data-sug="${esc(t)}">💡 ${esc(t)}</button>`).join('')}</div>`}

  $('castbar').innerHTML=avail.length?avail.map(o=>{const on=p.cast.some(m=>m.c===o.i);return`<button class="mood${on?' sel':''}" data-cast="${o.i}">${on?'✓ ':'➕ '}${esc(o.c.name||(o.i?'Friend 朋友':'Hero 主角'))}</button>`}).join('')

  $('castbar').querySelectorAll('[data-cast]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cast,j=p.cast.findIndex(m=>m.c===i);

    $('castCtl').innerHTML=`<b style="align-self:center">${esc(story.chars[m.c].name||'')}:</b>`+MOVES.map(([v,l])=>`<button class="mood${m.m===v?' sel':''}" data-mv="${v}">${l}</button>`).join('')+
      `<button class="mood" data-sz="-1">➖ Smaller 小</button><button class="mood" data-sz="1">➕ Bigger 大</button>`;
    $('castCtl').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{m.m=b.dataset.mv;touch();ctl()});
    $('castCtl').querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>{m.s=clamp(m.s+(+b.dataset.sz)*.07,.15,.8);touch()})};
  $('fxbar').innerHTML=FX.map(([v,l])=>`<button class="mood${(p.fx||'none')===v?' sel':''}" data-fx="${v}">${l}</button>`).join('');

  ctl()}

let stage=null;

  function spawn(ty){const c=['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#da77f2','#ff922b'][Math.floor(rand(0,6))];
    if(ty==='sparkle')return{x:rand(0,W),y:rand(0,H*.85),life:rand(.6,1.1),s:rand(6,14),c:'#ffd43b'};
    if(ty==='rain'||ty==='storm')return{x:rand(-80,W),y:-20,vx:ty==='storm'?220:60,vy:rand(800,1000),life:1};
    if(ty==='snow')return{x:rand(0,W),y:-10,vx:rand(-20,20),vy:rand(35,80),s:rand(3,7),life:12,p:rand(0,6)};
    if(ty==='bubbles')return{x:rand(0,W),y:H+20,vx:0,vy:-rand(40,90),s:rand(6,18),life:12,p:rand(0,6)};
    if(ty==='leaves')return{x:rand(0,W),y:-10,vx:rand(-30,30),vy:rand(45,80),s:rand(7,11),life:12,r:rand(0,6),vr:rand(-3,3),c:Math.random()<.5?'#f08c00':'#e8590c',p:rand(0,6)};
    if(ty==='hearts')return{x:rand(40,W-40),y:H+20,vy:-rand(50,90),life:9,e:'💖',s:rand(22,34),p:rand(0,6)};

    if(ty==='candy')return{x:rand(0,W),y:-30,vx:rand(-15,15),vy:rand(90,140),life:8,e:Math.random()<.5?'🍬':'🍭',s:rand(24,34),r:rand(-.5,.5),vr:rand(-2,2)};
    if(ty==='fire')return{x:rand(0,W),y:H+5,vx:rand(-15,15),vy:-rand(60,150),s:rand(2,5),life:rand(1.5,3),c:Math.random()<.5?'#ff922b':'#ffd43b'};
