<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Maker 故事工坊</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;font-family:-apple-system,system-ui,"PingFang TC",sans-serif;background:#fdf3e1;color:#2b2118}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;min-height:48px;min-width:48px;touch-action:manipulation;color:inherit}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.on{display:flex}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:14px}
h1{margin:0;font-size:clamp(30px,6vw,50px);line-height:1.05}
.ver{font-size:13px;color:#8a7a66}
.center{text-align:center}
.kids{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.kid{width:140px;height:140px;font-size:22px;font-weight:800;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.kid span{font-size:44px}
.kid.nora{background:#7048e8}.kid.lucas{background:#f76707}.kid.milo{background:#2f9e44}
.btn{padding:0 16px;font-weight:800;font-size:16px;background:#efe3cf}
.btn.sm{min-height:44px;font-size:15px;padding:0 12px}
.go{background:#e8590c;color:#fff}.green{background:#2f9e44;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);flex:none}
.top .t{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{color:#fff;font-weight:800;padding:0 12px;height:40px;border-radius:12px;display:flex;align-items:center}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.book{background:#fff;border-radius:16px;padding:10px;text-align:left;box-shadow:0 4px 0 #e6d6bb;display:flex;flex-direction:column;gap:8px}
.book.new{align-items:center;justify-content:center;border:3px dashed #e0b57a;background:#fff8ec;min-height:220px}
.book .cv canvas{width:100%;border-radius:10px;display:block}
.book small{color:#8a7a66}
/* build: half picture, half decision */
#build,#watch{height:100vh;height:100dvh;min-height:0}
.split{flex:1;display:flex;flex-direction:column;min-height:0}
.pic{flex:0 0 47%;display:flex;align-items:center;justify-content:center;background:#2b2118;padding:6px;min-height:0}
.pic>div{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.stagebox{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
canvas.living{display:block;border-radius:12px;background:#eef7ff;touch-action:manipulation}
.panel{flex:1;overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
.prog{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px;flex-wrap:wrap;margin-bottom:6px}
.prog .sc b{font-size:18px;opacity:.55}.prog .sc b.cur{opacity:1}
.prog .dots{display:flex;gap:4px}.prog .dots i{width:22px;height:8px;border-radius:4px;background:#e6d6bb}.prog .dots i.done{background:#2f9e44}.prog .dots i.cur{background:#e8590c}
.q{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:clamp(20px,2.6vw,26px);font-weight:900;margin:2px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.opt{background:#fff;border-radius:16px;box-shadow:0 4px 0 #e6d6bb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;min-height:86px}
.opt .e{font-size:34px;line-height:1.1}
.opt.drawown{background:#fff0e0;border:3px dashed #e8590c}.opt .t{font-size:15px;font-weight:700;text-align:center}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #e6d6bb}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.big{min-height:120px}.opt.big .e{font-size:44px}.opt.big .t{font-size:18px}
.go2{background:#d3f9d8}.end2{background:#fff3bf}
.langpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-weight:800}
.lp{background:#fff;border:3px solid #e6d6bb;padding:0 14px;font-weight:800}.lp.on{border-color:#e8590c;background:#fff0e0}
#mixBox{background:#fff;border-radius:16px;padding:12px;margin-top:12px;box-shadow:0 3px 0 #e6d6bb}
.mixw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mw{background:#f1f3f5;border:2px solid #e6d6bb;padding:0 12px;font-size:15px;min-height:44px}.mw.on{background:#d3f9d8;border-color:#2f9e44}
.goal{display:flex;gap:6px;flex-wrap:wrap;width:100%;font-size:14px}.goal span{background:#fff;border-radius:999px;padding:4px 10px;box-shadow:0 2px 0 #e6d6bb}.goal .bad{background:#fff5f5}.goal .ok{background:#ebfbee}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wtext{font-size:clamp(19px,2.4vw,24px);line-height:1.6;white-space:pre-wrap}
.wctl{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0}
.theend{font-size:34px;font-weight:900;text-align:center;color:#e8590c;width:100%}
#wEnd{flex-direction:column;gap:10px;margin-top:10px}
/* landscape (iPad sideways, Mac, phone sideways): picture left, decisions right */
@media (orientation:landscape){.split{flex-direction:row}.pic{flex:0 0 56%}.panel{padding-top:12px}}
@media (orientation:landscape) and (max-height:500px){.opt{min-height:66px}.opt .e{font-size:26px}.opt .t{font-size:13px}.q{font-size:18px;margin-bottom:6px}.top{padding:3px 8px}.top .btn{min-height:40px}.opts{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.opt.big{min-height:80px}}
/* draw modal */
#draw{position:fixed;inset:0;background:#2b2118;display:none;flex-direction:column;z-index:20}
#draw.on{display:flex}
#draw .bar{display:flex;gap:6px;padding:6px;flex-wrap:wrap;align-items:center;background:#3a2e22}
#draw .sw{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:50%;border:3px solid #fff}
#draw .sw.sel{outline:4px solid #ffd43b}
#draw .tool{background:#5a4a38;color:#fff;font-size:20px}
#draw .tool.sel{background:#ffd43b;color:#222}
#draw .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
#dc{background:#fff;border-radius:12px;touch-action:none;max-width:100%;max-height:100%}
#draw .emo{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}#draw .emo button{background:#5a4a38;font-size:28px;min-width:52px;flex:none}#draw .emo button.sel{background:#ffd43b}#draw .emo span{color:#ffd43b;font-weight:800;white-space:nowrap;padding:0 6px}
@media (max-height:500px){#draw .bar{flex-wrap:nowrap;overflow-x:auto;padding:2px 4px;gap:4px}#draw .what{display:none}#draw .sw{width:30px;height:30px;min-width:30px;min-height:30px;border-width:2px}#draw .tool,#draw .btn{min-height:38px;font-size:15px;flex:none}#draw .emo button{font-size:20px;min-width:40px;min-height:38px}#draw .emo span{display:none}#draw .stage{padding:3px}}
#draw .what{color:#ffd43b;font-weight:800;padding:0 8px}
#dc.trans{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:32px 32px;background-position:0 0,16px 16px}
#intro{position:fixed;inset:0;z-index:50;background:#fbf1dc;display:flex;align-items:center;justify-content:center}
#intro.gone{display:none}
#ic{position:absolute;inset:0;width:100%;height:100%}
#istart{position:relative;z-index:2;background:#e8590c;color:#fff;font-size:24px;font-weight:900;padding:18px 30px;border-radius:999px;box-shadow:0 8px 0 #a83f06;display:flex;gap:12px;align-items:center;animation:pulse 1.4s ease-in-out infinite}
#istart span{font-size:30px}
#iskip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#a08b70;font-size:14px;display:none;z-index:2}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (max-height:500px){#iskip{bottom:auto;top:8px;right:12px;left:auto;text-align:right}}

#intro{position:fixed;inset:0;z-index:50;background:#fbf1dc;display:flex;align-items:center;justify-content:center}
#intro.gone{display:none}
#ic{position:absolute;inset:0;width:100%;height:100%}
#istart{position:relative;z-index:2;background:#e8590c;color:#fff;font-size:24px;font-weight:900;padding:18px 30px;border-radius:999px;box-shadow:0 8px 0 #a83f06;display:flex;gap:12px;align-items:center;animation:pulse 1.4s ease-in-out infinite}
#istart span{font-size:30px}
#iskip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#a08b70;font-size:14px;display:none;z-index:2}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (max-height:500px){#iskip{bottom:auto;top:8px;right:12px;left:auto;text-align:right}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<!-- INTRO -->
<div id="intro"><canvas id="ic"></canvas>
  <button id="istart"><span>▶</span>Tap to start 點一下開始</button>
  <div id="iskip">Tap to skip 點一下跳過</div></div>
<!-- HOME -->
<section id="home" class="screen on"><div class="wrap center">
  <h1>📖 Story Maker<br><span style="font-size:.55em">故事工坊</span></h1>
  <p>Tap, watch it happen, make your own story! 點一點,看故事動起來!</p>
  <div class="kids">
    <button class="kid nora" data-kid="nora"><span>🦄</span>Nora</button>
    <button class="kid lucas" data-kid="lucas"><span>⚡</span>Lucas</button>
    <button class="kid milo" data-kid="milo"><span>🦖</span>Milo</button>
  </div>
  <p class="ver">Test sample · 測試版 · v0.9</p>
</div></section>
<!-- SHELF -->
<section id="shelf" class="screen">
  <div class="top"><button class="btn" id="shelfHome">🏠</button><div class="badge" id="shelfWho"></div><div class="t">My stories 我的故事</div></div>
  <div class="wrap"><div class="shelf" id="books"></div></div>
</section>
<!-- BUILD -->
<section id="build" class="screen">
  <div class="top"><button class="btn" id="bBack">📚</button><div class="t" id="bTitle"></div></div>
  <div class="split"><div class="pic"><div id="bStage"></div></div>
    <div class="panel"><div class="prog" id="bProg"></div><div id="bPanel"></div><div id="mixBox" style="display:none"></div></div></div>
</section>
<!-- WATCH -->
<section id="watch" class="screen">
  <div class="top"><button class="btn" id="wBack">◀</button><div class="t" id="wTitle"></div><span class="ver" id="wCount"></span></div>
  <div class="split"><div class="pic"><div id="wStage"></div></div>
    <div class="panel"><div class="wtext" id="wText"></div>
      <div class="wctl"><button class="btn" id="wPrev">⏮</button><button class="btn" id="wPlay">⏸</button><button class="btn" id="wNext">⏭</button></div>
      <div id="wEnd" style="display:none"></div></div></div>
</section>
<!-- DRAW -->
<div id="draw">
  <div class="bar" id="dbar1">
    <span class="what" id="dWhat"></span><span style="flex:1"></span>
    <button class="tool" id="dUndo">↩️</button><button class="tool" id="dClear">🗑️</button>
    <button class="btn" id="dCancel">Cancel 取消</button><button class="btn go" id="dDone">✓ Done 完成</button>
  </div>
  <div class="bar" id="dbar2"></div>
  <div class="bar emo" id="dbar3"></div>
  <div class="stage"><canvas id="dc" width="800" height="600"></canvas></div>
</div>
<div class="toast" id="toast"></div>
<script>
{
/* ---------- living pictures (Family Zoo style: hop, flip, squash, wander, tap to jump) ---------- */
const FX=[['none','🚫 None 無'],['sparkle','✨ Sparkles 閃亮'],['stars','🌟 Night stars 星空'],['rain','🌧️ Rain 下雨'],['storm','⛈️ Storm 暴風雨'],['snow','❄️ Snow 下雪'],['bubbles','🫧 Bubbles 泡泡'],['leaves','🍂 Leaves 落葉'],['hearts','💖 Hearts 愛心'],['confetti','🎉 Confetti 彩帶'],['candy','🍬 Candy rain 糖果雨'],['fire','🔥 Fire sparks 火花'],['shake','💥 Earthquake 地震']];
const MOVES=[['wander','🚶 Wander 走來走去'],['bounce','🦘 Bounce 原地跳'],['fly','🎈 Fly 飛來飛去'],['stay','🧍 Stay 待著']];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const stickers={};
function sticker(src){if(stickers[src])return stickers[src];const o={ready:false,c:null};stickers[src]=o;const im=new Image();
  im.onload=()=>{const pad=10,c=document.createElement('canvas');c.width=im.width+pad*2;c.height=im.height+pad*2;const x=c.getContext('2d');
    const sil=document.createElement('canvas');sil.width=im.width;sil.height=im.height;const sx=sil.getContext('2d');sx.drawImage(im,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle='#fff';sx.fillRect(0,0,im.width,im.height);
    for(let k=0;k<16;k++)x.drawImage(sil,pad+Math.cos(k/16*6.283)*7,pad+Math.sin(k/16*6.283)*7);x.drawImage(im,pad,pad);o.c=c;o.ready=true};im.src=src;return o}
let AC=null;function boing(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(660,t+.12);o.frequency.exponentialRampToValueAtTime(330,t+.3);
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.4)}catch(e){}}
const VERSION='v0.9';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)};
const KIDS={nora:{name:'Nora',color:'#7048e8'},lucas:{name:'Lucas',color:'#f76707'},milo:{name:'Milo',color:'#2f9e44'}};
const DEFLANG={nora:'zh',lucas:'en',milo:'zh'};
let kid=null,story=null,dirty=false,hist=[];
const Z=()=>story&&story.lang==='zh';
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);if(id!=='build'&&id!=='watch')stopStage()}
function speak(t){try{speechSynthesis.cancel();if(!t)return;
  const clean=t.replace(/[“”"「」『』*_~#…—–]/g,' ').replace(/\s+/g,' ').trim();if(!/[\p{L}\p{N}]/u.test(clean))return;
  const u=new SpeechSynthesisUtterance(clean);u.lang=/[一-鿿]/.test(clean)?'zh-TW':'en-US';u.rate=.95;speechSynthesis.speak(u);return u}catch(e){}}

/* ================= illustrated backgrounds (drawn once, cached) ================= */
const W=800,H=600,BGC={};
function grad(x,a,b,y0=0,y1=H){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function circ(x,cx,cy,r,c){x.fillStyle=c;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
function poly(x,pts,c){x.fillStyle=c;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill()}
function hills(x,y,c,amp=40,ph=0){x.fillStyle=c;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=20)x.lineTo(i,y+Math.sin(i/120+ph)*amp);x.lineTo(W,H);x.fill()}
function cloud(x,cx,cy,s,c='#fff'){[[0,0,1],[-.9,.15,.7],[.9,.15,.75],[-.4,-.4,.7],[.45,-.35,.65]].forEach(([dx,dy,r])=>circ(x,cx+dx*s,cy+dy*s,r*s,c))}
function tree(x,tx,ty,s,c='#2f9e44'){x.fillStyle='#8d5524';x.fillRect(tx-s*.12,ty-s*.9,s*.24,s*.9);circ(x,tx,ty-s*1.1,s*.55,c);circ(x,tx-s*.35,ty-s*.85,s*.4,c);circ(x,tx+s*.35,ty-s*.85,s*.4,c)}
function pine(x,tx,ty,s,c='#2b8a3e'){x.fillStyle='#8d5524';x.fillRect(tx-s*.08,ty-s*.3,s*.16,s*.3);for(let i=0;i<3;i++)poly(x,[[tx,ty-s*1.3+i*s*.3],[tx-s*.5+i*.05*s,ty-s*.3-i*0+i*s*.05-s*.15*(2-i)],[tx+s*.5-i*.05*s,ty-s*.3+i*s*.05-s*.15*(2-i)]],c)}
function palm(x,tx,ty,s){x.strokeStyle='#8d5524';x.lineWidth=s*.12;x.beginPath();x.moveTo(tx,ty);x.quadraticCurveTo(tx+s*.2,ty-s*.6,tx+s*.1,ty-s*1.2);x.stroke();
  x.fillStyle='#2f9e44';for(let a=0;a<5;a++){x.save();x.translate(tx+s*.1,ty-s*1.2);x.rotate(-2.6+a*.65);x.beginPath();x.ellipse(s*.4,0,s*.45,s*.12,0,0,7);x.fill();x.restore()}}
function stars(x,n,maxY,seed=3){let r=seed;const rn=()=>(r=(r*9301+49297)%233280)/233280;for(let i=0;i<n;i++)circ(x,rn()*W,rn()*maxY,rn()*2+.6,'rgba(255,255,255,'+(.5+rn()*.5)+')')}
const BG={
 meadow:x=>{x.fillStyle=grad(x,'#8fd3ff','#e3f6ff');x.fillRect(0,0,W,H);circ(x,680,110,55,'#ffd43b');cloud(x,200,110,40);cloud(x,470,80,30);hills(x,420,'#8ce99a',30);hills(x,470,'#51cf66',25,2);for(let i=0;i<30;i++)circ(x,(i*137)%W,500+(i*53)%90,5,['#ff8787','#ffd43b','#fff'][i%3])},
 castle:x=>{x.fillStyle=grad(x,'#a5d8ff','#fff0f6');x.fillRect(0,0,W,H);cloud(x,130,90,35);cloud(x,640,120,30);hills(x,430,'#b2f2bb',25);
   x.fillStyle='#dee2e6';x.fillRect(300,250,200,220);x.fillRect(255,190,70,280);x.fillRect(475,190,70,280);x.fillRect(370,150,60,110);
   [[255,190,70],[475,190,70],[370,150,60]].forEach(([a,b,w])=>poly(x,[[a-8,b],[a+w/2,b-70],[a+w+8,b]],'#e64980'));
   [[290,120],[510,120],[400,80]].forEach(([a,b])=>{x.fillStyle='#868e96';x.fillRect(a,b-40,3,40);poly(x,[[a+3,b-40],[a+30,b-32],[a+3,b-24]],'#ffd43b')});
   x.fillStyle='#8d5524';x.beginPath();x.moveTo(370,470);x.lineTo(370,400);x.arc(400,400,30,Math.PI,0);x.lineTo(430,470);x.fill();
   [[275,260],[495,260],[390,190],[330,320],[455,320]].forEach(([a,b])=>{x.fillStyle='#4dabf7';x.fillRect(a,b,22,30)});hills(x,480,'#69db7c',15,1)},
 jungle:x=>{x.fillStyle=grad(x,'#96f2d7','#2b8a3e');x.fillRect(0,0,W,H);for(let i=0;i<9;i++){x.save();x.translate((i*97)%W,i%2?40:520);x.rotate(i);x.fillStyle=i%2?'#2b8a3e':'#37b24d';x.beginPath();x.ellipse(0,0,140,45,0,0,7);x.fill();x.restore()}
   x.strokeStyle='#2b8a3e';x.lineWidth=6;for(let i=0;i<6;i++){x.beginPath();x.moveTo(60+i*140,0);x.quadraticCurveTo(80+i*140,120,50+i*140,200+i%3*40);x.stroke()}hills(x,480,'#5c940d',20);[[150,470],[600,500],[420,520]].forEach(([a,b])=>circ(x,a,b,12,'#ff6b6b'))},

  const d=x.getImageData(0,0,260,260).data;let x0=260,y0=260,x1=-1,y1=-1;for(let y=0;y<260;y++)for(let xx=0;xx<260;xx++)if(d[(y*260+xx)*4+3]>20){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}

    ix.globalAlpha=k;ix.fillStyle='#fff3bf';ix.beginPath();ix.arc(840,120,46,0,7);ix.fill();ix.fillStyle='#5f3dc4';ix.beginPath();ix.arc(862,108,40,0,7);ix.fill();
    ix.fillStyle='#2f9e44';ix.beginPath();ix.moveTo(-2000,600);ix.lineTo(-200,IH-20);ix.quadraticCurveTo(250,520,600,640);ix.quadraticCurveTo(850,560,1200,620);ix.lineTo(3000,600);ix.lineTo(3000,IH+3000);ix.lineTo(-2000,IH+3000);ix.fill();ix.globalAlpha=1}
