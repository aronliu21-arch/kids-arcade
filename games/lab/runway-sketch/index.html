<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}

body[data-pref="land"] .rot.l{display:none}
@media (orientation:portrait) and (max-width:600px){body[data-pref="land"] .rot.l{display:block}}
@media (orientation:landscape) and (max-height:450px){body[data-pref="port"] .rot.p{display:block}}
/* phones: never cut things off; scroll instead, and keep the top bar small */
@media (max-width:600px),(max-height:450px){.main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.tag{display:none}.ttl{font-size:1.05rem}.top a,.ico{width:44px;height:44px;flex-basis:44px}.pill{padding:2px 8px;font-size:.9rem}.app{padding-top:4px}}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.zy{display:inline-flex;gap:.06em;vertical-align:middle;line-height:1}.zc{display:inline-flex;align-items:center}.zc .z{display:inline-flex;align-items:center;font-size:.38em;line-height:1.05;margin-left:.04em;color:var(--muted);font-weight:500}
.zc .zs{display:inline-flex;flex-direction:column;align-items:center}.zc .zs i{font-style:normal;display:block;line-height:1.05}.zc .zt{margin-left:.03em;font-size:.85em}.zc .zn{font-size:.85em;line-height:.6}.zc b{font-weight:inherit}

.panel{background:#fffdf8;border:3px solid #4a3426;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}

.it{border:2px solid #e3d6c7;border-radius:14px;background:#fbf7ef;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:96px}

.stage svg{height:100%;max-height:100%;width:auto;max-width:100%}
.badge{position:absolute;top:8px;left:8px;background:#7048e8;color:#fff;border:2px solid #fff;border-radius:999px;padding:2px 12px;font-weight:800;box-shadow:0 0 0 2px #7048e8}
.side{gap:10px}
.theme{background:#fff0f6;border:3px dashed #d6336c;border-radius:16px;padding:8px 10px;text-align:center}
.theme .k{font-size:.8rem;font-weight:700;color:#a61e4d;letter-spacing:.05em}
.theme .t{font-size:clamp(1.2rem,3.4vh,1.6rem);font-weight:800;margin:2px 0}
.theme .zh{font-size:clamp(1.3rem,3.6vh,1.8rem);font-weight:700}
.theme .h{font-size:.85rem;color:var(--muted);margin-top:4px}
.side .btn{width:100%}
.btn.pink{background:#d6336c}
#ready{display:none;position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:15;font-size:1.15rem;box-shadow:0 4px 0 var(--ink),0 6px 18px rgba(0,0,0,.25)}
@media (max-width:600px),(max-height:450px){#ready{display:block}#walk{display:none}.items{padding-bottom:70px}}
.tab.need{animation:need .5s 4;border-color:#d6336c;background:#ffe3ec;color:#a61e4d}@keyframes need{50%{transform:scale(1.12)}}
.small{font-size:.85rem;color:var(--muted);text-align:center}
.runway{position:absolute;inset:0;z-index:20;background:#2b2140;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cat{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:linear-gradient(#2b2140 0 45%,#3d2f5c 45%)}
.cat .walk{position:absolute;bottom:0;left:50%;width:46%;height:0;border-left:solid transparent;border-right:solid transparent}
.strip{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:70%;height:55%;background:#f8f0e3;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.model{position:absolute;bottom:2%;left:50%;height:92%;transform-origin:50% 100%;transform:translateX(-50%) scale(.38) translateY(-60%);transition:transform 3s ease-out}
.model.go{transform:translateX(-50%) scale(1) translateY(0)}
.model svg{height:100%;width:auto}
.flash{position:absolute;width:40px;height:40px;border-radius:50%;background:#fff;opacity:0;animation:fl .5s}

.judges{background:#fffdf8;padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

.jd.show{opacity:1;transform:none}
.jd .f{font-size:1.8rem;line-height:1}.jd b{display:block;font-size:.9rem}.jd .s{color:#f59f00;font-size:1.15rem;letter-spacing:1px}.jd .r{font-size:.78rem;line-height:1.25;color:#4a3426}
.fam button{font-size:1.5rem;background:none;border:0;padding:0;min-width:34px;min-height:44px}.fam #famS{display:flex;justify-content:center;flex-wrap:nowrap}
.total{background:#fffdf8;text-align:center;padding:0 8px 8px;font-weight:800}
@media (max-width:900px) and (orientation:landscape),(max-height:450px){.studio{grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);grid-template-rows:auto auto}.stage{grid-row:1/3;grid-column:1}.closet{grid-column:2;grid-row:2}.side{grid-column:2;grid-row:1}}
@media (max-height:450px){.runway{position:fixed;inset:0;border-radius:0;flex-direction:row}.cat{flex:0 0 38%}.judges{flex:1;grid-template-columns:repeat(2,1fr);overflow:auto;align-content:start}.runway .total{position:absolute;right:0;bottom:0;width:62%;padding:4px}.jd .r{font-size:.72rem}.studio{position:relative;inset:auto;min-height:560px}.stage{height:calc(100vh - 70px);position:sticky;top:0}.items{max-height:none;overflow:visible}.side .btn{min-height:46px;padding:4px 10px}.theme .h{display:none}}
@media (max-width:600px){.studio{position:relative;inset:auto;display:flex;flex-direction:column}.stage{height:40vh;flex:0 0 auto;order:-1;position:sticky;top:0;z-index:3}.items{overflow:visible;grid-template-columns:repeat(3,1fr)}.side{order:-2;flex-direction:row;flex-wrap:wrap;padding:6px}.theme{flex:1 1 100%;padding:4px 8px}.theme .h{display:none}.side .btn{flex:1;width:auto;min-height:46px;padding:4px 8px;font-size:1rem}.small{display:none}
 .judges{grid-template-columns:repeat(2,1fr)}.cat{min-height:46vh}.runway{position:fixed;inset:0;border-radius:0;overflow:auto}}

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];

let ac=null;function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type,vol,dl){if(!SOUND)return;const c=audio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(dl||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05);}catch(e){}}

/* Drag helper: makeDrag(el,{onDrop(el,x,y)->bool keep}) — pointer events, works with touch + mouse */
function makeDrag(el,o){el.classList.add('drag');el.addEventListener('pointerdown',e=>{if(o.can&&!o.can(el))return;e.preventDefault();audio();el.setPointerCapture(e.pointerId);
  const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top,ph=document.createElement('div');

function runway(){if(running)return;audio();
  const need=!look.dress&&!look.top&&!look.bottom?['top','👗 Pick a dress, or a top and a bottom!']:!look.dress&&!look.top?['top','👚 She needs a top! (Or pick a dress.)']:!look.dress&&!look.bottom?['bottom','👖 She needs a bottom! (Or pick a dress.)']:!look.shoes?['shoes','👟 Don’t forget shoes!']:null;
  if(need){sfx.boing();toast(need[1],2600);say(need[1].replace(/[^\w\s!.,’'()]/g,''));tab=need[0];renderTabs();renderItems();const t=[...document.querySelectorAll('.tab')].find(b=>b.textContent===CAT[need[0]].en);if(t){t.classList.add('need');t.scrollIntoView({block:'center',behavior:'smooth'});}return;}
  running=true;const J=judge();const R=document.createElement('div');R.className='runway';
  R.innerHTML='<div class="cat"><div class="strip"></div><div class="model" id="model">'+figureSVG()+'</div></div><div class="judges" id="jd"></div><div class="total" id="tot"></div>';
  $('main').appendChild(R);say('Walking the runway for '+theme.en+'!');
  requestAnimationFrame(()=>requestAnimationFrame(()=>R.querySelector('.model').classList.add('go')));
  let k=0;const fl=setInterval(()=>{const f=document.createElement('div');f.className='flash';f.style.left=rnd(5,90)+'%';f.style.top=rnd(5,40)+'%';R.querySelector('.cat').appendChild(f);tone(1800,.04,'square',.03);setTimeout(()=>f.remove(),500);if(++k>8)clearInterval(fl);},330);
  const jd=R.querySelector('#jd');J.forEach(([f,n,what,s,r])=>{jd.insertAdjacentHTML('beforeend','<div class="jd"><div class="f">'+f+'</div><b>'+n+' · '+what+'</b><div class="s">'+'★'.repeat(s)+'☆'.repeat(5-s)+'</div><div class="r">'+r+'</div></div>');});
  jd.insertAdjacentHTML('beforeend','<div class="jd fam"><div class="f">👨‍👩‍👧‍👦</div><b>Family judge</b><div id="famS">'+[1,2,3,4,5].map(i=>'<button data-v="'+i+'" aria-label="'+i+' stars">☆</button>').join('')+'</div><div class="r">Pass the iPad! Tap your stars.</div></div>');
  [...jd.children].forEach((c,i)=>setTimeout(()=>{c.classList.add('show');if(i<3){tone(660+i*120,.15,'triangle',.12);}},3200+i*700));
  const base=J.reduce((a,x)=>a+x[3],0);let fam=0;
  setTimeout(()=>{$('tot').innerHTML='Judges: '+base+' / 15 ⭐ — waiting for the family judge…';say(J.map(x=>x[1]+' says: '+x[4]).join(' '));},3200+3*700);
  jd.querySelectorAll('#famS button').forEach(b=>b.onclick=()=>{fam=+b.dataset.v;jd.querySelectorAll('#famS button').forEach(x=>x.textContent=+x.dataset.v<=fam?'★':'☆');
    const t=base+fam,title=t>=18?'👑 Runway Superstar!':t>=14?'🌟 Fashion Star!':t>=10?'✨ Stylish!':'💡 Keep designing!';sfx.win();if(t>=14)confetti();
    $('tot').innerHTML=title+' &nbsp;'+t+' / 20 ⭐<div style="display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap"><button class="btn" id="again">New theme ▶</button><button class="btn ghost" id="keep">Keep styling</button></div>';
    $('again').onclick=()=>{R.remove();running=false;fresh();newTheme();renderFig();renderItems();};$('keep').onclick=()=>{R.remove();running=false;timeLeft=Math.max(timeLeft,60);showTime();};});}
$('walk').onclick=runway;$('ready').onclick=runway;
fresh();renderTabs();renderItems();renderFig();newTheme();
window.__test={state:()=>({look:JSON.parse(JSON.stringify(look)),theme:theme.id,running:running}),judge:()=>judge().map(x=>[x[2],x[3],x[4]]),runway:runway,wear:(c,id)=>wear(c,find(c,id)),tab:t=>{tab=t;renderTabs();renderItems();}};

</script></body></html>
