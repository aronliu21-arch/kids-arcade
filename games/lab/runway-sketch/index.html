      const l=x.querySelector('.lgLi'),rr=x.querySelector('.lgRi'),a=walking?Math.sin(q):0;if(l){l.setAttribute('transform','translate('+(a>0?2*a:0)+' '+(a>0?-9*a:0)+')');rr.setAttribute('transform','translate('+(a<0?2*a:0)+' '+(a<0?9*a:0)+')');}});
    const st=Math.floor(ph/Math.PI);if(walking&&st!==lastStep){lastStep=st;step();}
    if(t>nextFlash){flash(p>=1?2:1);nextFlash=t+(p>=1?rnd(.12,.3):rnd(.35,.7));}
    if(p>=1&&!posed){posed=true;MS.forEach(x=>x.classList.add('pose'));crowd('ooh');for(let k=0;k<4;k++)setTimeout(()=>flash(2),k*110);}
    if(t>WALK-.4&&!R._clap){R._clap=1;crowd('clap');sfx.win();}
    if(t<WALK+.6)requestAnimationFrame(frame);};
  requestAnimationFrame(frame);}

function popGraph(){const c=audio();if(!c)return null;if(!POP.master){POP.master=c.createGain();POP.master.gain.value=0;POP.master.connect(c.destination);
  const comp=c.createDynamicsCompressor();POP.bus=c.createGain();POP.bus.connect(comp);comp.connect(POP.master);
  const d=c.createDelay(1);d.delayTime.value=60/POP.bpm*.75;const fb=c.createGain();fb.gain.value=.22;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3000;
  POP.fx=c.createGain();POP.fx.gain.value=.5;POP.fx.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(comp);
  const n=c.createBuffer(1,c.sampleRate,c.sampleRate),ch=n.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;POP.noise=n;}return c;}
function pOsc(c,t,f,dur,type,vol,cut,fx){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);let n=o;
  if(cut){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(cut,t);lp.Q.value=4;o.connect(lp);n=lp;}n.connect(g);g.connect(POP.bus);if(fx)g.connect(POP.fx);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05);}
function pNoise(c,t,dur,type,f,vol){const s=c.createBufferSource();s.buffer=POP.noise;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();s.connect(fl);fl.connect(g);g.connect(POP.bus);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.start(t);s.stop(t+dur+.05);}
function pKick(c,t){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(POP.bus);o.start(t);o.stop(t+.3);}

function popStep(c,t,s){const st=60/POP.bpm/2,bar=(s>>3)&15,b=s&7,ci=bar&3,sec=bar>>2,run=running;
  if(b%2===0)pKick(c,t);if(b===2||b===6){pNoise(c,t,.16,'bandpass',1500,.35);pNoise(c,t+.012,.12,'bandpass',2200,.25);}
  pNoise(c,t+(b%2?0:st*.5)*0,.03,'highpass',8000,b%2?.12:.05);
  if(b===0||b===3||b===6)pOsc(c,t,hz(BS[ci]),st*1.6,'sawtooth',.22,600);
  if(b===0||b===3||b===6)CH[ci].forEach(m=>pOsc(c,t,hz(m+12),st*1.2,'square',.035,2200,true));
  const mel=sec===1||sec===3?(sec===3?MEL2:MEL):null;if(mel||run){const M=(mel||MEL2)[ci][b];if(M){let len=1;while(b+len<8&&(mel||MEL2)[ci][b+len]===null)len++;
    pOsc(c,t,hz(M),st*len*.9,'triangle',.11,0,true);pOsc(c,t,hz(M+12),st*len*.7,'square',.02,3000);}}
  if(run&&b%2===1)pNoise(c,t,.05,'highpass',6000,.1);}
function popTick(){const c=audio();if(!c)return;while(POP.next<c.currentTime+.15){if(running){runStep(c,POP.next,POP.step);POP.next+=60/124/2;POP.step=(POP.step+1)%64;}else{popStep(c,POP.next,POP.step);POP.next+=60/POP.bpm/2;POP.step=(POP.step+1)%128;}}}

function makeBudget(){const fit=c=>CAT[c].items.filter(i=>i.tags.includes(theme.id)).map(price).sort((a,b)=>a-b)[0]||Math.min(...CAT[c].items.map(price));
  const min=Math.min(fit('dress'),fit('top')+fit('bottom'))+fit('shoes')+fit('hair');return Math.ceil((min+ri(10,22))/5)*5;}

/* the computer girl, 小星, dresses for the theme too */
function genCPU(){const fits=c=>CAT[c].items.filter(i=>i.tags.includes(theme.id)),pk=c=>{const f=fits(c);return (f.length&&Math.random()<.72?pick(f):pick(CAT[c].items)).id;};
  const L={hair:pk('hair'),top:null,bottom:null,dress:null,shoes:pk('shoes'),acc:[],col:{},pat:{}};
  if(fits('dress').length&&Math.random()<.5)L.dress=pk('dress');else{L.top=pk('top');L.bottom=pk('bottom');}
  const a=fits('acc');for(let k=0;k<ri(0,2);k++){const x=(a.length&&Math.random()<.7?pick(a):pick(CAT.acc.items)).id;if(!L.acc.includes(x))L.acc.push(x);}
  ['top','bottom','dress','shoes'].forEach(k=>{if(L[k]&&Math.random()<.55)L.col[k]=PAL[pick(theme.col)];});
  if(Math.random()<.45){const k=L.dress?'dress':'top';L.pat[k]=pick(['stripes','dots','stars','hearts','flowers']);}
  return L;}

  const R=document.createElement('div');R.className='runway'+(two?' two':'');
  R.innerHTML='<div class="cat"><div class="backdrop">'+sceneSVG(theme.id)+'</div><div class="strip"></div>'+E.map((e,i)=>'<div class="model" data-i="'+i+'">'+figureSVG(e.look,true)+'<span class="mtag">'+zh(e.name)+'</span></div>').join('')+'</div><div class="judges" id="jd"></div><div class="total" id="tot"></div>';
  $('main').appendChild(R);say(two?'對決開始！':'走秀開始！');showRunway(R);
  const jd=R.querySelector('#jd'),nJ=JS[0].length;
  for(let k=0;k<nJ;k++){const j=JS[0][k];jd.insertAdjacentHTML('beforeend','<div class="jd"><div class="f">'+judgeFace(k)+'</div><b>'+j[1]+' · '+j[2]+'</b>'+
    E.map((e,i)=>{const x=JS[i][k];return (two?'<div class="who">'+zh(e.name)+'</div>':'')+'<div class="s">'+'★'.repeat(x[3])+'☆'.repeat(5-x[3])+'</div><div class="r plain">'+esc(x[6])+'</div>';}).join('<hr>')+'</div>');}
  [...jd.children].forEach((c,i)=>setTimeout(()=>{c.classList.add('show');tone(660+i*120,.15,'triangle',.12);},WALK*1000+i*700));
  const tot=JS.map(j=>j.reduce((a,x)=>a+x[3],0)),max=nJ*5;
  setTimeout(()=>{let head='';
    if(two){const w=tot[0]===tot[1]?null:(tot[0]>tot[1]?0:1);head=(w===null?'🤝 '+zh('平手！'):'🏆 '+zh(E[w].name+'贏了！'))+' &nbsp;'+E.map((e,i)=>zh(e.name)+' '+tot[i]).join(' : ')+' / '+max+' ⭐';
      sfx.win();confetti();say(w===null?'平手！':E[w].name+'贏了！');}
    else{const t=tot[0],r=t/max,title=r>=.93?'👑 '+zh('走秀超級巨星！'):r>=.73?'🌟 '+zh('時尚之星！'):r>=.53?'✨ '+zh('很有型！'):'💡 '+zh('繼續設計！');head=title+' &nbsp;'+t+' / '+max+' ⭐';sfx.win();if(r>=.73)confetti();
      say(JS[0].map(x=>x[5]+'說：'+x[6].replace(/（[^）]*）/g,'')).join(' '));}
    R.querySelectorAll('.model').forEach((x,i)=>{const t=tot[i],st=Math.round(t/max*5),b=document.createElement('div');b.className='bigscore';const ml=parseFloat(x.style.left||'50'),narrow=R.querySelector('.cat').clientWidth<760;b.style.left=(narrow?ml:(two?(i?ml+19:ml-19):ml+24))+'%';if(narrow)b.classList.add('above');
      b.innerHTML='<div class="stars">'+'★'.repeat(st)+'<span>'+'★'.repeat(5-st)+'</span></div><div class="num">'+t+'<small> / '+max+'</small></div>'+(two&&tot[0]!==tot[1]&&t===Math.max(...tot)?'<div class="crown">👑</div>':'');R.querySelector('.cat').appendChild(b);});
    let extra='';if(MODE==='vs'&&VS.kind==='link'&&VS.ch&&two){const url=baseURL()+'#r='+enc({t:theme.id,a:{n:E[0].name,l:E[0].look},b:{n:E[1].name,l:E[1].look}});
      extra='<button class="btn pink" id="back2">🔗 '+zh('把結果傳回給'+E[0].name)+'</button>';R._url=url;}
    $('tot').innerHTML=head+'<div class="row">'+extra+'<button class="btn pink" id="snapR">📸 '+zh('拍照')+'</button><button class="btn" id="again">'+zh('再玩一次')+' ▶</button>'+(two?'':'<button class="btn ghost" id="keep">'+zh('繼續打扮')+'</button>')+'<button class="btn ghost" id="modeB">🏠 '+zh('換模式')+'</button></div>';
    $('snapR').onclick=()=>snap(E,tot,max);
    const close=()=>{R.remove();running=false;POP.step=0;if(POP.on)popLevel(POP.vol,.6);};
    if($('back2'))$('back2').onclick=async()=>{try{await navigator.share({title:'時尚素描本',url:R._url});}catch(e){try{await navigator.clipboard.writeText(R._url);toast('✅ '+zh('已複製'));}catch(e2){prompt('',R._url);}}};
    $('again').onclick=()=>{close();if(MODE==='vs'&&VS.kind==='link'&&VS.ch){VS.ch=null;history.replaceState(null,'',baseURL());ME='幼晴';}VS.stage=0;VS.p1=null;if(MODE==='vs'&&VS.kind==='local')ME='幼晴';startRound();};
    if($('keep'))$('keep').onclick=()=>{close();timeLeft=Math.max(timeLeft,60);showTime();};
    $('modeB').onclick=()=>{close();history.replaceState(null,'',baseURL());showModes();};},WALK*1000+nJ*700);}

function bootLinks(){const h=location.hash;
  if(h.startsWith('#c=')){const d=dec(h.slice(3));if(!d||!d.l)return false;MODE='vs';VS.kind='link';VS.ch={name:String(d.n||'朋友').slice(0,8),look:d.l};setTheme(d.t);fresh();renderFig();renderItems();

    m.querySelector('#fgo').onclick=()=>{ME=(m.querySelector('#fn').value.trim()||'朋友').slice(0,8);m.remove();setBadge(ME);timeLeft=120;showTime();say(VS.ch.name+'邀請你來比賽！主題是'+theme.zh);};return true;}
  if(h.startsWith('#r=')){const d=dec(h.slice(3));if(!d||!d.a||!d.b)return false;MODE='vs';VS.kind='result';setTheme(d.t);ME=d.a.n;setBadge(ME);fresh();renderFig();renderItems();
    setTimeout(()=>show([{name:String(d.a.n).slice(0,8),look:d.a.l},{name:String(d.b.n).slice(0,8),look:d.b.l}]),400);return true;}
  return false;}

const svgImg=str=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str.includes('xmlns=')?str:str.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));});
async function snap(E,tots,max){try{
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fbf7ef';x.fillRect(0,0,W,H);
  const sc=await svgImg(sceneSVG(theme.id).replace('class="scene"','width="1600" height="1200"'));const r=Math.max(W/sc.width,H/sc.height);x.globalAlpha=.9;x.drawImage(sc,(W-sc.width*r)/2,(H-sc.height*r)/2,sc.width*r,sc.height*r);x.globalAlpha=1;
  const two=E.length===2,fh=tots?(two?780:820):(two?880:1000),fw=fh/2;
  for(let i=0;i<E.length;i++){const im=await svgImg(figureSVG(E[i].look).replace('width="200" height="400"','width="'+fw+'" height="'+fh+'"'));const cx=two?(i?W*.72:W*.28):W/2;
    x.drawImage(im,cx-fw/2,H-fh-150,fw,fh);
    x.font='900 46px "PingFang TC","Noto Sans TC",system-ui,sans-serif';x.textAlign='center';const nm=E[i].name,tw=x.measureText(nm).width+50;
    x.fillStyle=i?'#e8590c':'#7048e8';x.strokeStyle='#fff';x.lineWidth=5;rr(x,cx-tw/2,H-150,tw,66,33);x.fill();x.stroke();x.fillStyle='#fff';x.fillText(nm,cx,H-102);
    if(tots){const t=tots[i],st=Math.round(t/max*5);x.font='900 64px system-ui';x.lineWidth=6;x.strokeStyle='#4a3426';
      const stars='★'.repeat(st)+'☆'.repeat(5-st);const top=H-fh-150;x.strokeText(stars,cx,top-110);x.fillStyle='#ffd43b';x.fillText(stars,cx,top-110);
      x.font='900 120px "Lilita One","Arial Black",Impact,system-ui';const g=x.createLinearGradient(0,top-100,0,top);g.addColorStop(0,'#fff6b0');g.addColorStop(.5,'#ffd43b');g.addColorStop(1,'#f08c00');
      const txt=t+'/'+max;x.lineWidth=10;x.strokeText(txt,cx,top-4);x.fillStyle=g;x.fillText(txt,cx,top-4);}}
  x.fillStyle='rgba(255,253,248,.92)';rr(x,30,26,W-60,120,28);x.fill();x.strokeStyle='#4a3426';x.lineWidth=4;x.stroke();
  x.fillStyle='#4a3426';x.textAlign='left';x.font='900 52px "PingFang TC","Noto Sans TC",system-ui,sans-serif';x.fillText('👗 時尚素描本',60,106);
  x.textAlign='right';x.font='800 46px "PingFang TC","Noto Sans TC",system-ui,sans-serif';x.fillText(theme.zh+' '+[...new Intl.Segmenter().segment(TPICS[theme.id]||'')].slice(0,2).map(s=>s.segment).join(''),W-60,104);
  x.textAlign='center';x.font='600 30px system-ui';x.fillStyle='#4a3426';const d=new Date();x.fillText(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(),W/2,H-28);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));const url=URL.createObjectURL(blob),file=new File([blob],'runway-'+d.toISOString().slice(0,10)+'.png',{type:'image/png'});
  sfx.good();shutter&&shutter();
  const m=modal2('<h2>📸 '+zh('拍照')+'</h2><img src="'+url+'" alt="照片" style="width:min(100%,420px);border-radius:14px;border:3px solid #4a3426"><p class="note">'+zh('長按圖片可以存起來')+'</p><div class="row"><button class="btn pink" id="svP">'+zh('儲存')+'</button><button class="btn ghost" id="clP">OK</button></div>');
  m.querySelector('#clP').onclick=()=>m.remove();
  m.querySelector('#svP').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'時尚素描本'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();};
}catch(err){toast('📸 …');}}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
