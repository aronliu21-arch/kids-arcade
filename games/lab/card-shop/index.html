<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Lucas’s Card Shop</title>
<style>
:root{--ink:#1b1f3b;--bg:#eef5ff;--muted:#5b6782;--ok:#2b8a3e;--bad:#e03131;--gold:#ffd43b;--lucas:#f76707;--blue:#1c7ed6;--red:#e03131;color-scheme:light;
--font:"Arial Rounded MT Bold",ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;padding:8px max(10px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-bottom:6px}
.top a,.ico{width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:1.3rem;flex:0 0 48px}
.ttl{flex:1;min-width:0;font-weight:800;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{background:#ffe8cc;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700;margin-left:6px;vertical-align:middle}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;white-space:nowrap}
.main{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.btn{border:3px solid var(--ink);border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:1.1rem;padding:8px 16px;min-height:52px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}.btn.gold{background:var(--gold);color:var(--ink)}.btn.green{background:#2f9e44}.btn[disabled]{opacity:.4}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 18px;font-weight:800;font-size:1.15rem;z-index:50;box-shadow:0 6px 0 var(--ink);text-align:center;max-width:92vw;pointer-events:none;transition:opacity .3s}
.toast.hide{opacity:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:12px;overflow:auto}
.modal>div{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:14px 18px;max-width:560px;width:100%;text-align:center}
.modal h2{margin:4px 0}
.rot{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));pointer-events:none;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.85rem;z-index:45;white-space:nowrap}
@media (orientation:landscape) and (max-height:450px){.rot.p{display:block}}
@media (max-width:600px),(max-height:450px){.tag{display:none}.ttl{font-size:1.05rem}.top a,.ico{width:44px;height:44px;flex-basis:44px}.pill{padding:2px 8px;font-size:.9rem}.app{padding-top:4px}}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.zc{display:inline-flex;align-items:center}.zy{display:inline-flex;align-items:center;font-size:.5em;line-height:1;font-weight:700;margin-left:1px}
.zs{display:inline-flex;flex-direction:column;align-items:center}.zs i{font-style:normal;display:block;line-height:1}.zt{font-size:.8em;margin-left:.02em}.zn{font-size:.8em;line-height:.6}
.zh{font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:800;display:inline-flex;gap:1px;flex-wrap:wrap;justify-content:center}
/* cards */
.cardw{position:relative;aspect-ratio:180/252;width:100%;border-radius:6%;flex:0 0 auto}
.cardw svg{display:block;width:100%;height:100%}
.cardw.holo::after,.cardw.legend::after{content:"";position:absolute;inset:0;border-radius:6%;pointer-events:none;mix-blend-mode:overlay;
 background:linear-gradient(115deg,transparent 25%,rgba(255,80,200,.55) 38%,rgba(80,220,255,.6) 47%,rgba(255,255,120,.55) 56%,transparent 70%);background-size:300% 300%;animation:shine 3.2s linear infinite}
.cardw.legend::after{mix-blend-mode:screen;opacity:.55}
@keyframes shine{from{background-position:100% 50%}to{background-position:0% 50%}}
.cnt{position:absolute;right:-6px;top:-8px;background:var(--lucas);color:#fff;border:3px solid var(--ink);border-radius:999px;font-weight:800;padding:0 8px;font-size:.95rem}
/* title */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px;cursor:pointer;
 background:repeating-conic-gradient(from 0deg at 50% 45%,#ffe066 0 10deg,#ffd43b 10deg 20deg);border-radius:20px;border:4px solid var(--ink)}
.logo{font-size:clamp(2rem,7vw,3.6rem);font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);line-height:1.05}
.fan{display:flex;justify-content:center;height:clamp(140px,30vh,240px);margin:6px 0}
.fan .cardw{width:clamp(90px,20vh,165px);margin:0 -18px;transform-origin:50% 120%}
.fan .cardw:nth-child(1){transform:rotate(-14deg)}.fan .cardw:nth-child(3){transform:rotate(14deg)}.fan .cardw:nth-child(2){z-index:2;transform:translateY(-10px)}
.fan.go .cardw{animation:flyin .9s cubic-bezier(.2,1.4,.4,1) both}.fan.go .cardw:nth-child(2){animation-delay:.25s}.fan.go .cardw:nth-child(3){animation-delay:.5s}
@keyframes flyin{from{opacity:0;translate:0 -60vh;rotate:-180deg}}
.tapgo{font-size:1.4rem}
.small{font-size:.9rem;padding:4px 12px;min-height:44px}
/* hub */
.hub{display:flex;flex-direction:column;gap:10px;max-width:920px;margin:0 auto;padding-bottom:50px}
.hero{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 12px}
.av{position:relative;width:84px;flex:0 0 84px}.av svg{width:100%;display:block}
.av.me svg{filter:drop-shadow(0 0 6px #ffd43b) drop-shadow(0 0 3px #ffd43b)}
.badge{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:var(--lucas);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-weight:800;font-size:.8rem;white-space:nowrap}
.badge.red{background:var(--red)}
.goal{flex:1;min-width:0}.goal b{display:block;font-size:1.05rem}
.bar{height:22px;border:3px solid var(--ink);border-radius:999px;background:#e9ecef;overflow:hidden;margin-top:6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 var(--ink);text-align:center}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile .e{font-size:2rem;line-height:1}.tile .en{font-weight:800;font-size:1.05rem}.tile .zh{font-size:1.05rem;color:var(--muted)}.tile small{color:var(--muted);font-weight:700}
.tile.lock{background:#f1f3f5}.tile.hot{background:#fff3bf}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:96px}.av{width:66px;flex-basis:66px}}
.panel{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 12px}
h2.h{margin:2px 0 8px;font-size:1.3rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
/* grid of cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px 10px}
@media (max-width:420px){.cgrid{grid-template-columns:repeat(3,1fr);gap:10px 6px}}
.pickc{border:none;background:none;padding:0;position:relative;border-radius:8px}

.pickc.sel::before{content:"✓";position:absolute;z-index:3;left:-6px;top:-8px;background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:900}
.ghostc{opacity:.35;filter:grayscale(1)}
/* battle */
.arena{display:grid;grid-template-columns:1fr;grid-template-areas:"opp" "mid" "me" "ctrl";gap:6px;max-width:1000px;margin:0 auto;padding-bottom:40px}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:18px;padding:6px;border:4px solid var(--ink)}
.side.opp{grid-area:opp;background:#ffe3e3}.side.me{grid-area:me;background:#d0ebff}
.slot{width:clamp(96px,20vh,200px)}
.who{display:flex;align-items:center;gap:8px;font-weight:800}
.who .mini{width:38px}.who .mini svg{width:100%;display:block}
.dots{letter-spacing:2px}
.hp{width:clamp(110px,24vh,230px);display:flex;align-items:center;gap:6px;font-weight:800}
.hp .bar{flex:1;margin:0;height:18px}.hp .bar i.low{background:#fab005}.hp .bar i.crit{background:#fa5252}
.mid{grid-area:mid;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 10px;text-align:center;min-height:72px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-weight:700;font-size:1.05rem}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.opts .btn{min-width:78px;font-size:1.25rem}
.ctrl{grid-area:ctrl;background:#fff4e6;border:4px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.ctrl .btn{font-size:1rem;padding:6px 10px}.enpool{font-weight:800;font-size:1.1rem;width:100%;text-align:center}
.shake{animation:shk .45s}@keyframes shk{20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lunge{animation:lng .4s}@keyframes lng{50%{transform:translateY(-18px) scale(1.06)}}
.ko{animation:koa .7s forwards}@keyframes koa{to{transform:rotate(25deg) translateY(40px);opacity:0}}
.dmg{position:fixed;z-index:55;font-size:2.4rem;font-weight:900;color:#fff;text-shadow:3px 3px 0 var(--red),-2px -2px 0 var(--red),2px -2px 0 var(--red),-2px 2px 0 var(--red);pointer-events:none;animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media (orientation:landscape) and (min-width:700px){.arena{grid-template-columns:1fr 1.1fr 1fr;grid-template-areas:"me mid opp" "ctrl ctrl ctrl"}.slot{width:clamp(110px,30vh,230px)}.hp{width:clamp(120px,30vh,240px)}}
@media (orientation:landscape) and (max-height:450px){.arena{grid-template-columns:1fr 1.2fr 1fr;grid-template-areas:"me mid opp" "ctrl ctrl ctrl"}.slot{width:110px}.hp{width:130px}.mid{font-size:.95rem}}
@media (orientation:portrait) and (max-width:600px){.arena{grid-template-columns:1fr 1fr;grid-template-areas:"me opp" "mid mid" "ctrl ctrl"}.slot{width:min(128px,36vw)}.hp{width:min(150px,40vw);font-size:.9rem}.side{padding:4px}.who{font-size:.9rem;gap:4px}.ctrl .btn{flex:1 1 45%;min-height:48px}}
@media (min-width:700px){.cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (max-width:600px) and (orientation:portrait){.pack{width:130px}}
/* bracket */
.brk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.brk div{border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#f1f3f5;font-weight:800}
.brk .done{background:#b2f2bb}.brk .now{background:var(--gold)}.brk .lost{background:#ffc9c9}
/* pack */
.pack{width:clamp(130px,30vh,190px);aspect-ratio:3/4.3;border:4px solid var(--ink);border-radius:14px;background:linear-gradient(135deg,#ff6b6b,#fcc419,#51cf66,#339af0,#9775fa);background-size:300% 300%;animation:shine 4s linear infinite;
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.3rem;text-shadow:2px 2px 0 var(--ink);box-shadow:0 6px 0 var(--ink)}
.pack .e{font-size:3rem}
.pack.tear{animation:tear .6s forwards}@keyframes tear{40%{transform:scale(1.15) rotate(-6deg)}to{transform:scale(.2) rotate(20deg);opacity:0}}
.flip{perspective:800px;border:none;background:none;padding:0;width:clamp(96px,22vw,150px)}
.flip .in{position:relative;transition:transform .55s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip .in>div{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .in>.front{position:absolute;inset:0;transform:rotateY(180deg)}
.flip.open .in{transform:rotateY(180deg)}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:520px;margin:0 auto}
.price{display:block;margin-top:6px}
/* cashier */
.m{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;max-width:1000px;margin:0 auto}
.counter{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.bub{background:#fff4e6;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:700;font-size:1.1rem}
.paid{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800}
.tray{background:#e7f5ff;border:4px dashed var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tray h3{margin:0;font-size:1rem}
#change{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:90px}
#change.glow{background:#fff3bf;border-radius:12px}
.reg{grid-column:1/3;display:flex;gap:12px;justify-content:center;background:#ffe8cc;border:4px solid var(--ink);border-radius:18px;padding:8px;align-items:center;flex-wrap:wrap}
.coin{border-radius:50%;border:3px solid #1a1a1a;display:grid;place-items:center;font-weight:800;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);text-align:center;line-height:1;flex:0 0 auto;color:#1a1a1a}
.coin small{display:block;font-size:.55em;font-weight:700}
.coin.q{width:76px;height:76px;background:#dee2e6;font-size:1.1rem}.coin.d{width:58px;height:58px;background:#e9ecef;font-size:.95rem}
.coin.n{width:66px;height:66px;background:#ced4da;font-size:1rem}.coin.p{width:60px;height:60px;background:#e8a46b;font-size:.95rem}
.bill{width:110px;height:56px;background:#b2f2bb;border:3px solid #1a1a1a;border-radius:8px;display:grid;place-items:center;font-weight:800}
.mini-item{width:86px}
@media (max-width:600px){.m{display:flex;flex-direction:column}.reg{position:sticky;bottom:0;z-index:5}.coin.q{width:66px;height:66px}}
/* sort */
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:60px}
.slots .s{width:clamp(56px,15vw,110px);aspect-ratio:180/252;border:3px dashed var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:900;color:var(--muted);background:#fff}
.sortc{width:clamp(80px,17vw,140px)}
.sortc.hint{outline:5px solid var(--gold);outline-offset:2px;border-radius:8px}
.tip{background:#e6fcf5;border:3px solid #0ca678;border-radius:14px;padding:6px 10px;font-weight:700;margin:6px 0}
.big{font-size:3rem;line-height:1}
.reveal{position:fixed;inset:0;z-index:70;background:#0b1026;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:10px;color:#fff;overflow:hidden;text-align:center;padding:12px}
.reveal .burst{position:absolute;width:220vmax;height:220vmax;left:50%;top:50%;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(var(--rc,rgba(255,212,59,.38)) 0 7deg,transparent 7deg 15deg);animation:spin 14s linear infinite;opacity:0;transition:opacity .8s}
.reveal.on .burst{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}
.reveal h2,.reveal p,.reveal .row,.reveal .flip{position:relative;z-index:2}
.reveal h2{font-size:clamp(1.5rem,5vw,2.4rem);margin:0;color:#ffd43b;text-shadow:3px 3px 0 #000}
.reveal .flip{width:min(250px,62vw,44vh);flex:0 0 auto}
@media (max-height:450px){.reveal{gap:4px}.reveal h2{font-size:1.3rem}.reveal .flip{width:120px}.reveal .name{font-size:1.1rem}}
.reveal .flip.charge .in{animation:charge 1.3s ease-in}
@keyframes charge{0%{transform:scale(.6)}30%{transform:scale(1) rotate(-4deg)}50%{transform:rotate(4deg)}70%{transform:rotate(-6deg) scale(1.05)}90%{transform:rotate(6deg) scale(1.08)}100%{transform:none}}
.reveal .flip.open{filter:drop-shadow(0 0 22px #ffd43b) drop-shadow(0 0 8px #fff)}
.reveal .flip.open .in{transition:transform .7s cubic-bezier(.2,1.5,.4,1)}
.reveal .name{font-size:1.5rem;font-weight:900;opacity:0;transition:opacity .5s}.reveal.shown .name{opacity:1}
.reveal .row .btn{opacity:0;pointer-events:none}.reveal.shown .row .btn{opacity:1;pointer-events:auto}
.cardw.promo::after{content:"";position:absolute;inset:0;border-radius:6%;pointer-events:none;mix-blend-mode:screen;opacity:.6;
 background:linear-gradient(115deg,transparent 20%,rgba(255,120,220,.6) 33%,rgba(120,240,255,.65) 43%,rgba(255,255,140,.6) 53%,rgba(170,255,140,.55) 62%,transparent 75%);background-size:300% 300%;animation:shine 2.4s linear infinite}
.gate input{font:inherit;font-size:1.3rem;width:140px;padding:6px;border:3px solid var(--ink);border-radius:10px;text-align:center}
</style></head><body>
<div class="app">
  <div class="top"><a href="../../../#tester" aria-label="Back to arcade">←</a><div class="ttl">🃏 Lucas’s Card Shop<span class="tag">sample</span></div><span class="pill" id="wal">💵 $0.00</span><span class="pill" id="str">⭐ 0</span><button class="ico" id="snd" aria-label="Sound">🔊</button></div>
  <div class="main" id="main"></div>
</div>
<div class="toast hide" id="toast"></div>
<div class="rot p">Best with your phone upright ↻</div>
<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const money=c=>'$'+(c/100).toFixed(2);
function zh(t){return '<span class="zh" lang="zh-Hant">'+t.map(([c,z])=>{const neutral=z.startsWith('˙'),body=z.replace(/[˙ˊˇˋ]/g,''),tone=(z.match(/[ˊˇˋ]/)||[''])[0];
 const col=(neutral?'<i class="zn">˙</i>':'')+[...body].map(s=>'<i>'+s+'</i>').join('');return '<span class="zc"><span>'+c+'</span><span class="zy"><span class="zs">'+col+'</span>'+(tone?'<span class="zt">'+tone+'</span>':'')+'</span></span>';}).join('')+'</span>';}

/* ---------- save ---------- */
const KEY='lab.cardshop2';
const DEF={started:false,cents:100,stars:0,owned:{},shopOpen:false,trophies:0,shelf:[],masterMet:0,acts:0};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){S=Object.assign({},DEF);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}hud();}
function hud(){$('wal').textContent='💵 '+money(S.cents);$('str').textContent='⭐ '+S.stars;}
let SOUND=true;try{SOUND=localStorage.getItem('lab.sound')!=='0';}catch(e){}

/* ---------- audio ---------- */
let ac=null;function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type,vol,dl,dest){if(!SOUND)return;const c=audio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(dl||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(dest||c.destination);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05);}catch(e){}}
const sfx={good(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,i*.07));},bad(){tone(200,.25,'sawtooth',.08);},pop(){tone(880,.08,'triangle',.14);},
 coin(){tone(1320,.08,'square',.06);tone(1760,.12,'square',.05,.06);},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.1));},
 hit(){tone(140,.2,'square',.12);tone(90,.3,'sawtooth',.08,.05);},ko(){[400,300,200,120].forEach((f,i)=>tone(f,.2,'square',.09,i*.1));},

function musicStart(){if(!SOUND||MUS)return;const c=audio();if(!c)return;const g=c.createGain();g.gain.value=0;g.connect(c.destination);g.gain.linearRampToValueAtTime(.5,c.currentTime+.6);
 const beat=60/132,mel=[[392,659,784,659],[523,659,784,1047],[440,523,659,880],[392,494,587,784]],bass=[131,175,110,98];let bar=0;
 const play=()=>{const m=mel[bar%4],t0=0;m.forEach((f,i)=>{tone(f,beat*.9,'square',.05,t0+i*beat,g);tone(f*2,beat*.4,'triangle',.03,t0+i*beat+beat/2,g);});tone(bass[bar%4],beat*3.8,'triangle',.12,0,g);[0,2].forEach(i=>tone(70,.12,'sine',.18,i*beat,g));bar++;};
 play();MUS={g,id:setInterval(play,beat*4000)};}
function musicStop(){if(!MUS)return;const m=MUS;MUS=null;clearInterval(m.id);try{const c=audio();m.g.gain.cancelScheduledValues(c.currentTime);m.g.gain.setValueAtTime(m.g.gain.value,c.currentTime);m.g.gain.linearRampToValueAtTime(0,c.currentTime+.8);setTimeout(()=>m.g.disconnect(),1500);}catch(e){}}

 setScreen('hub',`<div class="hub"><div class="hero"><div class="av me">${LUCAS}<span class="badge">Lucas</span></div><div class="goal">
 ${S.shopOpen?`<b>🏪 Lucas’s Cards is open!</b><div>🏆 ×${S.trophies} · 📒 ${owned}/${C.length} cards</div>`:`<b>Save ${money(GOAL)} to open your own shop!</b><div>${money(S.cents)} of ${money(GOAL)} · 📒 ${owned}/${C.length} · 🏆 ×${S.trophies}</div><div class="bar"><i style="width:${Math.min(100,S.cents/GOAL*100)}%"></i></div>`}</div></div>
 <div class="tiles">
 ${T2('🧾','Cashier job',[['收','ㄕㄡ'],['銀','ㄧㄣˊ'],['打','ㄉㄚˇ'],['工','ㄍㄨㄥ']],'cash','Earn 25¢ a customer')}
 ${T2('🗂️','Sorting job',[['整','ㄓㄥˇ'],['理','ㄌㄧˇ'],['卡','ㄎㄚˇ'],['片','ㄆㄧㄢˋ']],'sort','Earn 50¢ a row')}
 ${T2('⚔️','Battle',[['對','ㄉㄨㄟˋ'],['戰','ㄓㄢˋ']],'battle','Win 50¢')}
 ${T2('🏆','Tournament',[['錦','ㄐㄧㄣˇ'],['標','ㄅㄧㄠ'],['賽','ㄙㄞˋ']],'tour','Entry 50¢ · prize card','hot')}
 ${T2('🛒','Card store',[['卡','ㄎㄚˇ'],['片','ㄆㄧㄢˋ'],['店','ㄉㄧㄢˋ']],'store','Packs and single cards')}
 ${T2('📒','My binder',[['收','ㄕㄡ'],['藏','ㄘㄤˊ'],['冊','ㄘㄜˋ']],'binder',owned+' of '+C.length)}
 ${S.shopOpen?T2('🏪','My shop',[['我','ㄨㄛˇ'],['的','˙ㄉㄜ'],['店','ㄉㄧㄢˋ']],'myshop','Keep the whole price','hot'):
  T2(S.cents>=GOAL?'🔑':'🔒','My shop',[['我','ㄨㄛˇ'],['的','˙ㄉㄜ'],['店','ㄉㄧㄢˋ']],'open',S.cents>=GOAL?'Ready to open!':'Needs '+money(GOAL),S.cents>=GOAL?'hot':'lock')}
 </div></div>`);
 bindAll({cash:()=>cashier(false),sort:sortJob,battle:()=>teamPick('friendly'),tour:tourStart,store,binder,myshop:()=>cashier(true),
  open(){if(S.cents<GOAL){toast('🔒 Save '+money(GOAL-S.cents)+' more!');sfx.bad();return;}
   modal(`<div class="big">🏪</div><h2>Open your own shop?</h2><p>It costs <b>${money(GOAL)}</b>. You will have ${money(S.cents-GOAL)} left.</p>`,[['Open it! 🎉',()=>{S.cents-=GOAL;S.shopOpen=true;save();confetti();sfx.win();say('Your shop is open! Now customers pay you the whole price.');hub();}],['Not yet',null,'ghost']]);}});
 if(fromAct)maybeMaster();}

/* chained result screen */
const NEXT={cash:['Sorting job',sortJob],sort:['Battle',()=>teamPick('friendly')],battle:['Card store',()=>store()],tour:['Card store',()=>store()],myshop:['Battle',()=>teamPick('friendly')]};

function prizeCard(w){const r=rollR(w),pool=ofR(r),fresh=pool.filter(c=>!S.owned[c.id]);return pick(fresh.length?fresh:pool);}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.06,i*.09));[1047,1319,1568].forEach(f=>tone(f,1.2,'triangle',.08,.45));tone(131,1.2,'sawtooth',.06,.45);}

 if(c.r==='promo')r.style.setProperty('--rc','rgba(177,151,252,.45)');
 const isNew=!S.owned[c.id];S.owned[c.id]=(S.owned[c.id]||0)+1;save();
 r.innerHTML=`<div class="burst"></div><h2>${head}</h2><p style="font-weight:800;margin:0">${from}</p><button class="flip charge"><div class="in"><div>${backSVG()}</div><div class="front">${cardHTML(c)}</div></div></button>
 <p class="name">${c.r==='promo'?'✦ ':c.r==='legend'?'🌟 ':'✨ '}${c.name} · ${R[c.r].n}${isNew?' · <span style="color:#69db7c">NEW!</span>':''}</p><p class="name" style="font-size:1rem;margin:0">HP ${c.hp} · ${c.atk[1].n} does ${c.atk[1].d}!</p><div class="row"><button class="btn gold">Add to my binder ▶</button></div>`;
 document.body.appendChild(r);REV=r;tone(220,1.2,'sawtooth',.04);tone(330,1.2,'sawtooth',.03,.3);
 const f=r.querySelector('.flip');let opened=false;
 const open=()=>{if(opened)return;opened=true;f.classList.remove('charge');f.classList.add('open');r.classList.add('on');fanfare();setTimeout(sfx.shimmer,500);confetti();setTimeout(confetti,500);
  setTimeout(()=>{r.classList.add('shown');say('You got '+c.name+'! '+R[c.r].n+' card!');},700);};
 const t=setTimeout(open,matchMedia('(prefers-reduced-motion:reduce)').matches?100:1400);f.onclick=()=>{clearTimeout(t);open();};
 r.querySelector('.row .btn').onclick=()=>{r.remove();REV=null;then&&then();};}

/* ---------- mystery Card Master ---------- */
const MNAMES=['Master Kenji','Captain Orion','Old Sage Bo','Ranger Tao','Wizard Felix'];
function masterChance(){return S.masterMet===0&&S.acts>=2?1:.22;}
function maybeMaster(then){if(then===undefined){if(Math.random()>=masterChance())return;then=hub;}
 S.masterMet++;save();sfx.magic();const nm=pick(MNAMES);
 const kind=pick(['mult','more','change']);let q,ans,opts,why,extraHTML='';
 if(kind==='mult'){const a=ri(2,5),b=ri(3,6);ans=a*b;q=`I have ${a} packs. Each pack has ${b} cards. How many cards is that?`;opts=shuffle([ans,ans+b,ans-a>0?ans-a:ans+a+1]);why=`${a} × ${b} = ${ans}`;}
 else if(kind==='more'){let x,y;do{x=pick(C);y=pick(C);}while(x.hp===y.hp);ans=x.hp>y.hp?x.name:y.name;q=`Which card has more HP?`;opts=[x.name,y.name];why=`${x.name} has ${x.hp} HP and ${y.name} has ${y.hp} HP.`;extraHTML=`<div class="row"><div style="width:110px">${cardHTML(x)}</div><div style="width:110px">${cardHTML(y)}</div></div>`;}
 else{const p=pick([[200,500],[75,100],[25,100],[200,300],[75,200]]);ans=money(p[1]-p[0]);q=`A card costs ${money(p[0])}. I pay ${money(p[1])}. How much change do I get?`;opts=shuffle([ans,money(p[1]-p[0]+25),money(Math.max(5,p[1]-p[0]-25))]);why=`${money(p[1])} − ${money(p[0])} = ${ans}`;}
 setScreen('master',`<div class="hub"><div class="panel" style="text-align:center;background:#f3f0ff"><div class="av" style="margin:0 auto;width:110px">${MASTER}<span class="badge" style="background:#5f3dc4">${nm}</span></div>
 <h2 class="h" style="margin-top:14px">✨ A mystery Card Master appears!</h2>${zh([['神','ㄕㄣˊ'],['秘','ㄇㄧˋ'],['卡','ㄎㄚˇ'],['片','ㄆㄧㄢˋ'],['大','ㄉㄚˋ'],['師','ㄕ']])}
 <p style="font-size:1.15rem;font-weight:700">“Solve my riddle and I will give you a card, young Lucas.”<br>${q}</p>${extraHTML}<div class="opts" id="mo">${opts.map(o=>`<button class="btn" data-a="o" data-v="${o}">${o}</button>`).join('')}</div><p id="mm" style="font-weight:800;min-height:1.3em"></p></div></div>`);
 say('A mystery Card Master appears! '+q.replace(/\$/g,''));
 let tries=0;window.__mans=ans;
 const gift=(good)=>{const c=prizeCard(good?[['promo',4],['legend',3],['holo',3]]:[['holo',7],['legend',3]]);
  setTimeout(()=>bigReveal(c,'✨ A gift from '+nm+'!',good?'“You solved my riddle. Take this special card!”':'“Keep practicing. This card will help you!”',then),900);};
 bindAll({o(v,b){if(tries<0)return;if(String(v)===String(ans)){tries===0?S.stars+=2:S.stars+=1;save();sfx.good();b.classList.add('green');$('mm').textContent='“Well done!”';tries=-1;gift(true);}
  else{tries++;sfx.bad();b.disabled=true;if(tries>=2){$('mm').innerHTML='The answer is <b>'+ans+'</b>. '+why;tries=-1;gift(false);}else $('mm').textContent='“Hmm, think again…”';}}});}

function store(){

 setScreen('store',`<div class="hub"><div class="panel" style="text-align:center"><h2 class="h">🛒 Card store ${zh([['卡','ㄎㄚˇ'],['片','ㄆㄧㄢˋ'],['店','ㄉㄧㄢˋ']])}</h2>

  buy(i){const c=byId(S.shelf[i]),p=R[c.r].p;if(S.cents<p){sfx.bad();toast('You need '+money(p-S.cents)+' more');return;}
   S.cents-=p;S.owned[c.id]=(S.owned[c.id]||0)+1;S.shelf.splice(+i,1);save();sfx.coin();if(c.r==='holo'||c.r==='legend')sfx.shimmer();toast('📒 '+c.name+' added to your binder!');store();}});}
function openPack(){const cards=[0,1,2].map(()=>randCard([['common',7],['rare',3]])).concat([randCard([['rare',70],['holo',22],['legend',8]])]);
 setScreen('pack',`<div class="hub"><div class="panel" style="text-align:center"><h2 class="h">Tap the pack to rip it open!</h2><div class="row" id="pk"><button class="pack" id="pb"><span class="e">🎁</span>Mystery pack</button></div><p id="pm" style="font-weight:800"></p><div class="row" id="pdone"></div></div></div>`);
 $('pb').onclick=()=>{audio();$('pb').classList.add('tear');tone(300,.3,'sawtooth',.06);setTimeout(()=>{
  $('pk').innerHTML=cards.map((c,i)=>`<button class="flip" data-i="${i}"><div class="in"><div>${backSVG()}</div><div class="front">${cardHTML(c)}</div></div></button>`).join('');$('pm').textContent='Tap each card to flip it!';
  let left=4;$('pk').querySelectorAll('.flip').forEach(f=>f.onclick=()=>{if(f.classList.contains('open'))return;f.classList.add('open');const c=cards[+f.dataset.i];
   if(c.r==='holo'||c.r==='legend'){sfx.shimmer();toast((c.r==='legend'?'🌟 LEGEND! ':'✨ Holo! ')+c.name,1800);}else sfx.flip();
   if(--left===0){cards.forEach(c=>S.owned[c.id]=(S.owned[c.id]||0)+1);save();$('pm').textContent='All 4 cards went into your binder!';
    $('pdone').innerHTML='<button class="btn gold" id="again">Another pack ($1.00)</button><button class="btn ghost" id="hm">🏠 Home</button>';$('again').onclick=()=>{if(S.cents<100){sfx.bad();toast('You need $1.00');return;}S.cents-=100;save();openPack();};$('hm').onclick=()=>hub();}});},550);};}

 setScreen('binder',`<div class="hub"><div class="panel"><h2 class="h">📒 My binder ${zh([['收','ㄕㄡ'],['藏','ㄘㄤˊ'],['冊','ㄘㄜˋ']])} · ${Object.keys(S.owned).length}/${C.length}</h2>
 <div class="cgrid">${C.map(c=>S.owned[c.id]?`<button class="pickc" data-a="see" data-v="${c.id}">${cardHTML(c)}${S.owned[c.id]>1?`<span class="cnt">×${S.owned[c.id]}</span>`:''}</button>`:`<div class="ghostc" style="position:relative">${backSVG()}<span class="cnt" style="background:${c.r==='promo'?'#7048e8':'#868e96'}">${c.r==='promo'?'✦ prize':'#'+c.id}</span></div>`).join('')}</div></div>

/* ---------- cashier job (making change) ---------- */
function makeDrag(el,o){el.classList.add('drag');el.addEventListener('pointerdown',e=>{e.preventDefault();audio();el.setPointerCapture(e.pointerId);
 const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top,st={pos:el.style.position,l:el.style.left,t:el.style.top,z:el.style.zIndex};
 el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.zIndex=30;el.style.transform='scale(1.08)';
 const mv=ev=>{el.style.left=(ev.clientX-dx)+'px';el.style.top=(ev.clientY-dy)+'px';o.move&&o.move(el,ev.clientX,ev.clientY);};
 const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);el.style.transform='';o.drop&&o.drop(el,ev.clientX,ev.clientY);
  el.style.position=st.pos;el.style.left=st.l;el.style.top=st.t;el.style.zIndex=st.z;};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});}
const hit=(el,x,y)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
const CO=[['q',25,'quarter'],['d',10,'dime'],['n',5,'nickel'],['p',1,'penny']];
let CJ=null;
function coinEl(k){const c=CO.find(x=>x[0]===k),d=document.createElement('div');d.className='coin '+k;d.innerHTML=c[1]+'¢<small>'+c[2]+'</small>';d._v=c[1];return d;}
function cashier(own){
 CJ={own,n:0,earn:0,tries:0,price:0,pay:0,item:null};
 setScreen('cash',`<div class="m"><div class="counter"><div style="font-weight:800">${own?'🏪 Lucas’s Cards':'🧾 Cashier job'} · customer <span id="cn">1</span>/3</div><div class="av" id="cav" style="width:90px"></div><div class="bub" id="bub"></div><div class="mini-item" id="it"></div><div class="paid" id="paid"></div></div>
 <div class="tray"><h3>Change tray · tap a coin to take it back</h3><div id="change"></div><button class="btn" id="give">Give change 🤲</button></div>
 <div class="reg" id="reg"><b>Drag coins →</b></div></div>`);
 CO.forEach(([k])=>{const src=coinEl(k);$('reg').appendChild(src);makeDrag(src,{move:(el,x,y)=>$('change').classList.toggle('glow',hit($('change'),x,y)),drop:(el,x,y)=>{$('change').classList.remove('glow');if(hit($('change'),x,y))addCoin(k);}});});
 $('give').onclick=giveChange;nextCust();}
function addCoin(k){const n=coinEl(k);n.onclick=()=>{n.remove();sfx.pop();};$('change').appendChild(n);sfx.coin();}
const trayTotal=()=>[...$('change').children].reduce((a,d)=>a+d._v,0);
function nextCust(){$('change').innerHTML='';CJ.tries=0;const f=pick(FOES);CJ.who=f[0];$('cav').innerHTML=kidSVG(f[1],f[2]);$('cn').textContent=CJ.n+1;
 const c=CJ.own?byId(pick(Object.keys(S.owned).map(Number))):pick(C);CJ.item=c;
 CJ.price=CJ.own?pick([35,45,55,65,75,85]):pick([15,20,30,35,40,45,55,60,65,70,80,85,90]);CJ.pay=CJ.price>50?100:pick([50,100]);
 $('it').innerHTML=cardHTML(c);
 $('bub').innerHTML=`${f[0]}: “I’d like <b>${c.name}</b>. It’s <b>${CJ.price}¢</b>.”`;
 $('paid').innerHTML='He pays: '+(CJ.pay===100?'<div class="bill">$1 = 100¢</div>':'<div class="coin q">25¢</div><div class="coin q">25¢</div>');
 say(f[0]+' wants '+c.name+'. It costs '+CJ.price+' cents. He pays '+CJ.pay+' cents. Drag his change into the tray.');}
function giveChange(){audio();const g=trayTotal(),want=CJ.pay-CJ.price;
 if(g===want){sfx.good();const pay=CJ.own?CJ.price:25;CJ.earn+=pay;S.cents+=pay;S.stars+=CJ.tries?1:2;save();toast(`😄 Right! ${CJ.pay}¢ − ${CJ.price}¢ = ${want}¢<br>+${pay}¢ for you`);say('Thanks! That is right, '+want+' cents.');step();}
 else{CJ.tries++;sfx.bad();if(CJ.tries>=2){toast(`The change is <b>${want}¢</b>: ${CJ.pay}¢ − ${CJ.price}¢ = ${want}¢`,2600);say('The change is '+want+' cents.');step(2600);}
  else{const m=g<want?'Hmm, I think I need more change.':'Whoa, that’s too much change!';toast('😕 '+m+'<br>You gave '+g+'¢');say(m);}}}
function step(ms){setTimeout(()=>{if(++CJ.n>=3){result(CJ.own?'myshop':'cash','🧾 Shift done!',`<div class="big">💵</div><p style="font-size:1.3rem;font-weight:800">You earned ${money(CJ.earn)}</p><p>Wallet: ${money(S.cents)}</p>`,'At the store, count up from the price to what you paid. 65¢ → 75¢ → $1.00 is 35¢ change.');}else nextCust();},ms||1400);}

/* ---------- sorting job ---------- */
let SJ=null;
function sortJob(){SJ={round:0,earn:0};sortRound();}
function sortRound(){const by=SJ.round===0?'hp':'id';let cs;do{cs=shuffle(C).slice(0,5);}while(by==='hp'&&new Set(cs.map(c=>c.hp)).size<5);
 SJ.cards=cs;SJ.order=cs.slice().sort((a,b)=>a[by]-b[by]).map(c=>c.id);SJ.pos=0;SJ.miss=0;SJ.perfect=true;SJ.by=by;
 const ins=by==='hp'?'Tap the cards from <b>smallest HP</b> to <b>biggest HP</b>.':'Tap the cards in <b>number order</b>, smallest No. first.';
 setScreen('sort',`<div class="hub"><div class="panel" style="text-align:center"><h2 class="h">🗂️ Sorting job ${SJ.round+1}/2</h2><p style="font-size:1.15rem;font-weight:700;margin:4px 0">${ins}</p>
 <div class="slots" id="sl">${cs.map((_,i)=>`<div class="s">${i+1}</div>`).join('')}</div></div>
 <div class="row" id="sc">${cs.map(c=>`<button class="pickc sortc" data-a="t" data-v="${c.id}">${cardHTML(c)}</button>`).join('')}</div></div>`);
 say(by==='hp'?'Tap the cards from smallest HP to biggest HP.':'Tap the cards in number order, smallest number first.');
 bindAll({t(id,b){id=+id;if(id===SJ.order[SJ.pos]){place(b);}else{sfx.bad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);SJ.perfect=false;
  if(++SJ.miss>=2){const rb=main.querySelector(`.sortc[data-v="${SJ.order[SJ.pos]}"]`);rb.classList.add('hint');const c=byId(SJ.order[SJ.pos]);toast(`Next is <b>${c.name}</b> (${by==='hp'?c.hp+' HP':'No. '+c.id})`,2200);}}}});}
function place(b){sfx.pop();SJ.miss=0;const slot=$('sl').children[SJ.pos];slot.innerHTML=b.innerHTML;slot.style.border='none';b.remove();
 if(++SJ.pos===5){const pay=50;SJ.earn+=pay;S.cents+=pay;S.stars+=SJ.perfect?2:1;save();sfx.good();toast('📦 Sorted! +50¢');
  setTimeout(()=>{if(++SJ.round<2)sortRound();else result('sort','🗂️ Cards sorted!',`<div class="big">📦</div><p style="font-size:1.3rem;font-weight:800">You earned ${money(SJ.earn)}</p><p>Wallet: ${money(S.cents)}</p>`,'Sort your real cards by number to spot doubles you can trade.');},1300);}}

/* ---------- team pick ---------- */
let PEND=null;
function oppTeam(kind,round){if(kind==='friendly')return [randCard([['common',8],['rare',2]]),randCard([['common',6],['rare',4]])].map(c=>c.id);
 if(round===0)return [0,1,2].map(()=>randCard([['common',1]]).id);if(round===1)return [randCard([['common',1]]),randCard([['rare',1]]),randCard([['rare',1]])].map(c=>c.id);
 return [randCard([['rare',1]]),randCard([['rare',1]]),randCard([['holo',1]])].map(c=>c.id);}
function teamPick(kind,round){
 const foe=PEND&&PEND.kind===kind&&PEND.round===round?PEND.foe:pick(FOES);const opp=PEND&&PEND.kind===kind&&PEND.round===round?PEND.opp:oppTeam(kind,round||0);
 PEND={kind,round,foe,opp};
 const mine=Object.keys(S.owned).map(Number).sort((a,b)=>a-b),need=Math.min(3,mine.length);let sel=[];
 setScreen('pick',`<div class="hub"><div class="panel"><div class="who" style="justify-content:center"><div class="mini">${kidSVG(foe[1],foe[2])}</div><span>${foe[0]}’s team: ${opp.map(i=>{const t=T[byId(i).type];return `<span title="${t.n}" style="font-size:1.6rem">${t.i}</span>`;}).join(' ')}</span></div>
 <p style="text-align:center;font-weight:700;margin:6px 0">Pick <b>${need}</b> cards for your team. Tip: check what ${foe[0]}’s cards are weak to!</p>
 <div class="row" style="font-weight:800">${opp.map(i=>{const c=byId(i);return `<span>${T[c.type].i} is weak to ${T[WEAK[c.type]].i}</span>`;}).join(' · ')}</div></div>
 <div class="cgrid">${mine.map(id=>`<button class="pickc" data-a="p" data-v="${id}">${cardHTML(byId(id))}</button>`).join('')}</div>
 <div class="row" style="position:sticky;bottom:0;padding:6px;background:var(--bg)"><button class="btn gold" id="fight" disabled>⚔️ Battle! (<span id="pc">0</span>/${need})</button><button class="btn ghost" data-a="home">🏠 Home</button></div></div>`);
 bindAll({home:()=>{PEND=null;hub();},p(id,b){id=+id;if(sel.includes(id)){sel=sel.filter(x=>x!==id);b.classList.remove('sel');}else{if(sel.length>=need){sfx.bad();toast('Only '+need+' cards!');return;}sel.push(id);b.classList.add('sel');}sfx.pop();$('pc').textContent=sel.length;$('fight').disabled=sel.length!==need;}});
 $('fight').onclick=()=>{audio();startBattle(sel,PEND);};}

/* ---------- battle ---------- */
let B=null;
function startBattle(team,p){B={kind:p.kind,round:p.round||0,foe:p.foe,me:{team,idx:0,hp:byId(team[0]).hp,en:1},op:{team:p.opp,idx:0,hp:byId(p.opp[0]).hp,en:1},turn:'me',drew:false,busy:false,stars:0};PEND=null;
 setScreen('battle',`<div class="arena"><div class="side opp" id="sOpp"></div><div class="mid" id="mid"></div><div class="side me" id="sMe"></div><div class="ctrl" id="ctrl"></div></div>`);
 renderSide('op');renderSide('me');msg(`${B.foe[0]} wants to battle! Your turn first. Draw an energy card ⚡`);say(B.foe[0]+' wants to battle! Draw an energy card.');renderCtrl();}
const act=s=>byId(B[s].team[B[s].idx]);
function renderSide(s){const P=B[s],c=act(s),el=$(s==='me'?'sMe':'sOpp'),pct=P.hp/c.hp*100;
 const dots=P.team.map((_,i)=>i<P.idx?'✖':'●').join('');
 el.innerHTML=`<div class="who">${s==='me'?`<div class="mini av me" style="width:38px;flex-basis:38px">${LUCAS}</div><span style="color:var(--lucas)">Lucas</span>`:`<div class="mini">${kidSVG(B.foe[1],B.foe[2])}</div><span style="color:var(--red)">${B.foe[0]}</span>`}<span class="dots">${dots}</span></div>
 <div class="slot" id="slot-${s}">${cardHTML(c)}</div><div class="hp"><div class="bar"><i class="${pct<=25?'crit':pct<=50?'low':''}" style="width:${pct}%"></i></div><span>${P.hp}/${c.hp}</span></div>`;}
function msg(h){$('mid').innerHTML='<div>'+h+'</div>';}
function renderCtrl(){const c=act('me'),me=B.me,my=B.turn==='me'&&!B.busy;
 $('ctrl').innerHTML=`<div class="enpool">Your energy: ${me.en?'⚡'.repeat(me.en):'—'} (${me.en})</div>
 <button class="btn gold" data-a="draw" ${!my||B.drew?'disabled':''}>⚡ Draw energy</button>
 ${c.atk.map((a,i)=>`<button class="btn" data-a="atk" data-v="${i}" ${!my||me.en<a.c?'disabled':''}>${'⚡'.repeat(a.c)} ${a.n} · ${a.d}</button>`).join('')}
 <button class="btn ghost" data-a="end" ${!my||!B.drew?'disabled':''}>End turn</button>`;
 bindAll({draw:meDraw,atk:meAttack,end:()=>{if(B.turn!=='me')return;endMyTurn();}});}
function meDraw(){if(B.drew||B.turn!=='me'||B.busy)return;const n=Math.random()<.6?1:2;B.me.en+=n;B.drew=true;sfx.energy();msg(`You drew <b>+${n} energy</b>! ${'⚡'.repeat(n)}<br>Now attack, or end your turn to save energy.`);renderCtrl();}
function meAttack(i){const me=B.me,a=act('me').atk[+i],foe=act('op');if(B.turn!=='me'||B.busy||me.en<a.c)return;
 if(!B.drew){toast('Draw your energy first ⚡');sfx.bad();return;}
 B.busy=true;me.en-=a.c;renderCtrl();
 const weak=WEAK[foe.type]===act('me').type,dmg=weak?a.d*2:a.d,hp=B.op.hp,left=Math.max(0,hp-dmg);
 const q2=()=>ask(left===0?`${foe.name} has <b>${hp} HP</b>. Your attack does <b>${dmg}</b>.<br>HP can’t go below 0. How much HP is left?`:`${foe.name} has <b>${hp} HP</b>. ${hp} − ${dmg} = ?`,
   left,left===0?shuffle([0,10,Math.abs(dmg-hp)||20]):shuffle([left,hp+dmg>200?left+10:hp+dmg,left===10?20:left-10]),`${hp} − ${dmg} ${left===0?'is 0 or less, so it is 0. Knocked out!':'= '+left}`,()=>hit2('op',dmg,`${a.n}!`));
 if(weak)ask(`${a.n} does <b>${a.d}</b>. ${foe.name} is weak to ${T[act('me').type].i} — <b>×2!</b><br>How much damage?`,dmg,shuffle([dmg,a.d,a.d+20]),`${a.d} × 2 = ${dmg}`,q2);
 else q2();}
function ask(h,ans,opts,why,then){opts=[...new Set(opts.map(Number))];if(!opts.includes(ans))opts.push(ans);let tries=0;B.q={ans,go:null};
 $('mid').innerHTML=`<div>${h}</div><div class="opts">${opts.map(o=>`<button class="btn" data-q="${o}">${o}</button>`).join('')}</div>`;say(h.replace(/<[^>]+>/g,' ').replace('−','minus').replace('×','times'));
 const fin=()=>{B.q=null;setTimeout(then,900);};
 B.q.go=()=>{const b=$('mid').querySelector(`[data-q="${ans}"]`);b&&b.click();};
 $('mid').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{if(tries<0)return;if(+b.dataset.q===ans){B.stars+=tries?1:2;S.stars+=tries?1:2;save();sfx.good();b.classList.add('green');tries=-1;fin();}
  else{sfx.bad();b.disabled=true;if(++tries>=2){tries=-1;$('mid').querySelector(`[data-q="${ans}"]`).classList.add('green');$('mid').insertAdjacentHTML('beforeend',`<div>👉 ${why}</div>`);say(why.replace('−','minus').replace('×','times'));setTimeout(fin,1800);}}});}
function floatDmg(el,t){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='dmg';d.textContent=t;d.style.left=(r.left+r.width/2-40)+'px';d.style.top=(r.top+r.height/3)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
function hit2(target,dmg,label){const atkSide=target==='op'?'me':'op',P=B[target];
 const as=$('slot-'+atkSide),ts=$('slot-'+target);as.classList.add('lunge');setTimeout(()=>as.classList.remove('lunge'),420);
 setTimeout(()=>{sfx.hit();ts.classList.add('shake');floatDmg(ts,'-'+dmg);P.hp=Math.max(0,P.hp-dmg);renderSide(target);
  msg(`${label} <b>${dmg} damage!</b>`);
  setTimeout(()=>{if(P.hp===0){sfx.ko();const k=$('slot-'+target);k&&k.classList.add('ko');msg(`${act(target).name} is knocked out! 💫`);
    setTimeout(()=>{if(++P.idx>=P.team.length)return endBattle(target==='op');P.hp=act(target).hp;renderSide(target);msg(`${target==='op'?B.foe[0]+' sends out':'Go,'} <b>${act(target).name}</b>!`);setTimeout(()=>target==='op'?endMyTurn():startMyTurn(),1100);},1000);}
   else{target==='op'?endMyTurn():startMyTurn();}},800);},300);}
function endMyTurn(){B.turn='op';B.busy=true;renderCtrl();setTimeout(oppTurn,700);}
function oppTurn(){const op=B.op,c=act('op'),mine=act('me');op.en+=1;sfx.energy();
 const can=c.atk.filter(a=>a.c<=op.en).sort((x,y)=>y.d-x.d)[0];
 if(!can){msg(`${B.foe[0]} draws energy and waits… ⚡ (${op.en})`);setTimeout(startMyTurn,1300);return;}
 op.en-=can.c;const weak=WEAK[mine.type]===c.type,dmg=weak?can.d*2:can.d;
 msg(`${c.name} uses <b>${can.n}</b>! ${weak?`${can.d} × 2 weakness =`:''}`);setTimeout(()=>hit2('me',dmg,`${c.name} used ${can.n}!`),1100);}
function startMyTurn(){B.turn='me';B.drew=false;B.busy=false;msg(`Your turn! Draw an energy card ⚡`);renderCtrl();}
function endBattle(won){B.busy=true;const st=B.stars;
 if(B.kind==='friendly'){if(won){S.cents+=50;sfx.win();confetti();}else sfx.bad();save();restock();
  return result('battle',won?'🏆 You won!':'Good battle!',`<div class="big">${won?'🥇':'🤝'}</div><p style="font-size:1.2rem;font-weight:800">${won?'You won 50¢!':B.foe[0]+' won this time.'}</p><p>⭐ ${st} stars from your math</p>`,'In the real game, check the weakness before you attack. ×2 can win the match!');}
 tourAfter(won);}

/* ---------- tournament ---------- */
let TR=null;
const RNAMES=['Round 1','Semi-final','Final'];
function tourStart(){if(Object.keys(S.owned).length<3){toast('You need 3 cards');return;}
 setScreen('tour',`<div class="hub"><div class="panel" style="text-align:center"><h2 class="h">🏆 Card Quest Cup ${zh([['錦','ㄐㄧㄣˇ'],['標','ㄅㄧㄠ'],['賽','ㄙㄞˋ']])}</h2>
 <p style="font-weight:700">Win 3 battles in a row to be champion!<br>Entry costs <b>50¢</b>. You have ${money(S.cents)}.</p>
 <div class="brk">${RNAMES.map(r=>`<div>${r}</div>`).join('')}<div>🏆</div></div>
 <div class="tip" style="text-align:left">🏆 Champion: <b>$3.00</b> + a trophy + an exclusive <b>✦ Prize card</b> or Legend (you can’t buy these!)<br>🥈 Lose the final: a <b>Holo or Legend</b> card</div>
 <div class="row"><button class="btn gold" data-a="go">Pay 50¢ and enter ▶</button><button class="btn ghost" data-a="home">🏠 Home</button></div></div></div>`);
 bindAll({home:()=>hub(),go(){if(S.cents<50){sfx.bad();toast('You need 50¢. Try a job! 🧾');return;}S.cents-=50;save();sfx.coin();TR={round:0};tourBracket();}});}
function tourBracket(note){setScreen('tour',`<div class="hub"><div class="panel" style="text-align:center"><h2 class="h">🏆 Card Quest Cup</h2>${note||''}
 <div class="brk">${RNAMES.map((r,i)=>`<div class="${i<TR.round?'done':i===TR.round?'now':''}">${i<TR.round?'✅ ':''}${r}</div>`).join('')}<div>🏆</div></div>
 <p style="font-weight:700">Next: <b>${RNAMES[TR.round]}</b>. ${TR.round===2?'The best player is waiting!':'Pick a strong team.'}</p>
 <div class="row"><button class="btn gold" data-a="go">Pick my team ▶</button></div></div></div>`);
 bindAll({go:()=>teamPick('tour',TR.round)});}
function tourAfter(won){
 if(won&&TR.round<2){TR.round++;sfx.win();return tourBracket('<div class="big">✅</div><p style="font-weight:800">You won! On to the next round.</p>');}
 let c=null,head,body;
 if(won){S.cents+=300;S.trophies++;c=prizeCard([['promo',6],['legend',4]]);head='🏆 CHAMPION!';sfx.win();}
 else if(TR.round===2){c=prizeCard([['holo',8],['legend',2]]);head='🥈 Runner-up!';sfx.good();}
 else{head='Out in '+RNAMES[TR.round];sfx.bad();}
 save();restock();
 const show=()=>result('tour',head,`${c?`<p style="font-weight:800">Prize card${won?' and $3.00':''}:</p><div style="width:min(200px,55vw);margin:0 auto">${cardHTML(c)}</div><p><b>${c.name}</b> · ${R[c.r].n}</p>`:`<div class="big">💪</div><p style="font-weight:800">Practice with friendly battles and try again!</p>`}`,
  'At a real tournament, shake hands and say “good game” whether you win or lose.');
 TR=null;if(c)bigReveal(c,won?'🏆 Champion prize!':'🥈 Runner-up prize!',won?'The Card Quest Cup winner gets an exclusive card!':'Great final! Here is your prize.',show);else show();}

/* ---------- test hook ---------- */
window.__test={
 state:()=>({screen:SCREEN,cents:S.cents,stars:S.stars,owned:Object.keys(S.owned).length,turn:B&&B.turn,meHp:B&&B.me.hp,opHp:B&&B.op.hp,q:!!(B&&B.q),change:CJ&&CJ.pay-CJ.price}),
