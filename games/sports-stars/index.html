let voices=[];
function lv(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}
function pick(lang){const pref=lang==='zh'?['zh-tw','zh-hk','zh-cn','zh']:['en-us','en-gb','en'];
  for(const p of pref){const v=voices.find(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(p));if(v)return v;}return null;}
function norm(t,lang){if(lang==='zh')return t.replace(/[（(]/g,'，').replace(/[）)]/g,'，').replace(/\s*×\s*/g,'乘以').replace(/\s*÷\s*/g,'除以').replace(/\s*−\s*/g,'減').replace(/\s*\+\s*/g,'加').replace(/\s*=\s*/g,'等於').replace(/，+/g,'，').replace(/，([。？！])/g,'$1');
  return t.replace(/\s*×\s*/g,' times ').replace(/\s*÷\s*/g,' divided by ').replace(/\s*−\s*/g,' minus ').replace(/\s*\+\s*/g,' plus ').replace(/\s*=\s*/g,' equals ');}
function speak(text,lang){if(lang==='zh'&&typeof VOICE!=='undefined'&&VOICE.byText[text]){try{speechSynthesis.cancel();}catch(e){}playClip(VOICE.byText[text]);return;}
  if(typeof VOICE!=='undefined'&&VOICE.cur){try{VOICE.cur.pause();}catch(e){}VOICE.cur=null;}
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(norm(text,lang));const v=pick(lang);if(v)u.voice=v;
  u.lang=lang==='zh'?'zh-TW':'en-US';u.rate=lang==='zh'?.8:.95;speechSynthesis.speak(u);}catch(e){}}

    const k=+b.dataset.k;
    try{window.KA&&KA.answer({q:clean(p.q),qid:'pz:'+cur,given:clean(String(p.o[k])),expected:clean(String(p.o[p.a])),correct:k===p.a,tryNo:tries+1,topic:'math puzzle'});}catch(e){}
    if(k===p.a){SND.correct();recPuzzle(tries===0,tries>=2);if(TR.on){trainNext();return;}lbAttack(tries===0?'first':'retry',catchRound);return;}
    SND.wrong();if(!TR.on){S.lch=0;save();}tries++;wrong.push(k);
    if(tries===1){msg='Not quite, champ. Try again!';cls='oops';}
    else{msg='💡 Clue: '+p.h;cls='hint';speak(p.h,'en');}
    renderCase();
  });
}

let target,choices,cWrong;
function catchRound(){
  S.zl=S.zl||4;S.miss=S.miss||[];
  const pool=ZY.slice(0,S.zl);
  target=(S.miss.length&&Math.random()<.5)?ZY.find(z=>z[0]===S.miss[Math.floor(Math.random()*S.miss.length)]):pool[Math.floor(Math.random()*pool.length)];
  choices=shuffle([target,...shuffle(pool.filter(z=>z!==target)).slice(0,2)]);
  cWrong=[];renderCatch('');
}
function renderCatch(m){
  const mon=MON[cur];
  app.innerHTML=`<div class="top"><button id="h" aria-label="Home">🏠</button><span>Sign the player!</span></div>
  <section class="panel catch"><p class="story" data-say="en">You won! A new player wants to join your team!</p>
  ${sceneHTML(cur,`<div class="silh">${mon.e}</div>`)}
  <p class="q" data-say="en">To sign them, read this sound. Which picture starts with it?</p>
  <div class="sym">${target[0]}</div>${cWrong.length?'<br><button class="read" id="hs">🔊 Hear the sound</button>':''}
  <div class="pics">${choices.map((c,k)=>`<button class="pic" data-k="${k}"${cWrong.includes(k)?' disabled':''} aria-label="${c[2]}">${c[1]}<small>${c[2]}</small></button>`).join('')}</div>
  <div class="msg oops" aria-live="polite">${m}</div></section>`;
  $('#h').onclick=home;
  if($('#hs'))$('#hs').onclick=()=>speak(ZYS[target[0]],'zh');
  app.querySelectorAll('.pic').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,c=choices[k];speak(c[2],'zh');
    try{window.KA&&KA.answer({q:'Which starts with '+target[0]+'?',qid:'zy:'+target[0],given:c[2],expected:target[2],correct:c===target,tryNo:cWrong.length+1,topic:'zhuyin sounds'});}catch(e){}
    if(c===target){SND.correct();logL('zy:'+target[0],!cWrong.length,false);if(!cWrong.length){S.miss=S.miss.filter(x=>x!==target[0]);S.zl=Math.min(ZY.length,S.zl+1);}else if(!S.miss.includes(target[0]))S.miss.push(target[0]);save();setTimeout(reveal,900);}
    else{SND.wrong();cWrong.push(k);setTimeout(()=>renderCatch(`Hmm, ${c[2]} doesn’t start with ${target[0]}. Say the sound out loud and try again!`),700);}
  });
}

function reveal(){
  if(!S.got.includes(cur))S.got.push(cur);save();
  const m=MON[cur];
  app.innerHTML=`<section class="catch" style="text-align:center"><h2 style="font-size:32px;margin-top:8px" data-say="en">Welcome to the team! 🎉</h2>
  ${cardHTML(cur,true)}
  <button class="alt" id="rf">🔊 Hear the fact</button>
  ${nextIdx()>=0?'<button class="go" id="nx">Next game</button>':'<button class="go" id="hm">See my whole team 🏆</button>'}
  <button class="alt" id="hh">🏠 Home</button></section>`;
  sparkle();SND.win();
  $('#rf').onclick=()=>speak(m.n+'. '+m.fact,'en');
  if($('#nx'))$('#nx').onclick=()=>openCase(nextIdx());
  if($('#hm'))$('#hm').onclick=binder;
  $('#hh').onclick=home;
}

function binder(){
  app.innerHTML=`<div class="top"><button id="h" aria-label="Home">🏠</button><span>${S.got.length} / ${MON.length} players</span></div>
  <div class="binder">${MON.map((m,i)=>S.got.includes(i)?`<button class="slot" style="--r:${RAR[m.r]}" data-i="${i}"><div class="e">${m.e}</div><b>${m.n}</b><span>${m.zh}</span></button>`:`<div class="slot empty"><div class="e">?</div><b>Not signed yet</b></div>`).join('')}</div>`;
  $('#h').onclick=home;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;const o=document.createElement('div');o.className='modal';
    o.innerHTML=`<div style="width:100%;max-width:320px">${cardHTML(i,false)}<button class="go" style="margin-top:4px">Close</button></div>`;
    document.body.appendChild(o);speak(MON[i].n+'. '+MON[i].fact,'en');
    o.querySelector('button').onclick=()=>o.remove();
    o.onclick=e=>{if(e.target===o)o.remove();};
  });
}

home();
cloudInit();
voiceLoad();
</script>
