<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九九乘法表闖關</title>
<style>
:root{--bg:#eef3f1;--sf:#fff;--ink:#1b2a2f;--mut:#5b6f75;--jade:#1f8a70;--jadebg:#d8efe8;--red:#c8372d;--redbg:#f8dedb;--gold:#e0a526;--line:#cfdcd8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12201f;--sf:#1b2e2c;--ink:#e8f1ee;--mut:#97aeaa;--jade:#4cc3a2;--jadebg:#1d4a41;--red:#ff7a6e;--redbg:#4d2623;--gold:#f0bd47;--line:#2f4743;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12201f;--sf:#1b2e2c;--ink:#e8f1ee;--mut:#97aeaa;--jade:#4cc3a2;--jadebg:#1d4a41;--red:#ff7a6e;--redbg:#4d2623;--gold:#f0bd47;--line:#2f4743;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.08em}
.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button,.chip,.btn,.opt,.cell{font:inherit;color:inherit;cursor:pointer}
.tabs button{flex:1;padding:10px;border:2px solid var(--line);background:var(--sf);border-radius:12px;font-weight:600}
.tabs button[aria-selected="true"]{border-color:var(--jade);background:var(--jadebg)}
.card{background:var(--sf);border:2px solid var(--line);border-radius:18px;padding:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 20px}
.chip{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--sf);font-size:1.15rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff}
.btn{padding:12px 22px;border-radius:12px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:1.05rem}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rail{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.rail i{flex:1;height:14px;border-radius:7px;background:var(--line);transition:background .2s}
.rail i.ok{background:var(--jade)}.rail i.no{background:var(--red)}.rail i.now{background:var(--gold)}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.q{font-size:3.2rem;font-weight:800;text-align:center;margin:18px 0 10px;letter-spacing:.04em}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar b{display:block;height:100%;width:100%;background:var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:16px 0;border-radius:40px;border:2px solid var(--line);background:var(--sf);font-size:1.7rem;font-weight:700}
.opt.ok{background:var(--jadebg);border-color:var(--jade)}
.opt.no{background:var(--redbg);border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{min-height:3.2em;text-align:center;margin:14px 0 6px;font-size:1.1rem}
.fb strong{font-size:1.3rem}
.big{font-size:3rem;font-weight:800;text-align:center;margin:6px 0}
.stars{text-align:center;font-size:2rem;letter-spacing:.2em}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
ul.wrong{list-style:none;padding:0;margin:14px 0 0}
ul.wrong li{padding:8px 0;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.cell{aspect-ratio:1;border:0;border-radius:8px;background:var(--jadebg);font-size:clamp(.62rem,2.7vw,.95rem);font-weight:600;padding:0}
.cell.h{background:var(--line);font-weight:800}
.cell.hl{background:var(--gold);color:#1b2a2f}
.cell.pick{background:var(--red);color:#fff}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>九九乘法表</h1>
<p class="sub">十題闖關，最多可以錯一題，第二次答錯就結束。</p>
<div class="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true">闖關</button>
  <button role="tab" id="t2" aria-selected="false">乘法表</button>
</div>

<section id="game">
  <div class="card" id="setup">
    <strong>選擇要練習的乘數</strong>
    <div class="chips" id="chips"></div>
    <button class="btn" id="start">開始闖關</button>
    <p class="sub" style="margin:16px 0 0" id="best"></p>
  </div>

  <div class="card" id="play" hidden>
    <div class="rail" id="rail"></div>
    <div class="stat"><span id="qn"></span><span id="sc"></span></div>
    <div class="q" id="q"></div>
    <div class="bar" aria-hidden="true"><b id="tb"></b></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn" id="next" hidden>下一題</button></div>
  </div>

  <div class="card" id="end" hidden>
    <div class="stars" id="stars"></div>
    <div class="big" id="final"></div>
    <p class="sub" style="text-align:center" id="summary"></p>
    <ul class="wrong" id="wrong"></ul>
    <div class="row">
      <button class="btn" id="again">再玩一次</button>
      <button class="btn alt" id="back">重新選擇</button>
    </div>
  </div>
</section>

<section id="table" hidden>
  <div class="card">
    <div class="scroll"><div class="grid" id="grid"></div></div>
    <div class="fb" id="tfb">點一下格子，看口訣。</div>
  </div>
</section>
</main>

<script>
const D='零一二三四五六七八九';
function num(n){if(n<10)return D[n];if(n===10)return '一十';if(n<20)return '十'+(n%10?D[n%10]:'');return D[Math.floor(n/10)]+'十'+(n%10?D[n%10]:'');}
function kou(a,b){if(a>b)[a,b]=[b,a];const p=a*b;return D[a]+D[b]+(p<10?'得'+D[p]:num(p));}
const $=id=>document.getElementById(id);
const TOTAL=10,SECS=15;
let sel=new Set([1,2,3,4,5,6,7,8,9]),qs=[],i=0,score=0,streak=0,right=0,wrongs=[],locked=false,t0=0,timer=null,rail=[];

/* tabs */
function tab(n){$('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);$('game').hidden=n!==1;$('table').hidden=n!==2;if(n===2)stopTimer();}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* chips */
for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed','true');
  b.onclick=()=>{if(sel.has(n)){if(sel.size===1)return;sel.delete(n)}else sel.add(n);b.setAttribute('aria-pressed',sel.has(n));};
  $('chips').appendChild(b);}
function showBest(){let v=null;try{v=localStorage.getItem('jj-best')}catch(e){}$('best').textContent=v?'最高分：'+v:'';}
showBest();

/* build questions */
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function build(){
  const pool=[];sel.forEach(a=>{for(let b=1;b<=9;b++)pool.push([a,b]);});
  shuffle(pool);const out=[];
  while(out.length<TOTAL)out.push(...shuffle(pool.slice())); // repeat only if pool is small
  return out.slice(0,TOTAL).map(([a,b])=>{
    if(Math.random()<.5)[a,b]=[b,a];
    const ans=a*b,set=new Set([ans]);
    const cand=shuffle([(a+1)*b,(a-1)*b,a*(b+1),a*(b-1),ans+1,ans-1,ans+2,ans-2,ans+10,ans-10]);
    for(const c of cand){if(set.size>=4)break;if(c>0&&c<=90)set.add(c);}
    let x=ans+3;while(set.size<4){set.add(x++);}
    return{a,b,ans,opts:shuffle([...set])};
  });
}

/* play */
function start(){
  qs=build();i=0;score=0;streak=0;right=0;wrongs=[];
  $('setup').hidden=true;$('end').hidden=true;$('play').hidden=false;
  $('rail').innerHTML='';rail=[];for(let k=0;k<TOTAL;k++){const e=document.createElement('i');$('rail').appendChild(e);rail.push(e);}
  show();
}
function stopTimer(){clearInterval(timer);timer=null;}
function show(){
  const q=qs[i];locked=false;
  rail.forEach((e,k)=>{if(k===i)e.className='now'});
  $('qn').textContent='第 '+(i+1)+' / '+TOTAL+' 題　可錯 '+Math.max(0,1-wrongs.length)+' 題';
  $('sc').textContent='分數 '+score+(streak>1?'　連對 '+streak:'');
  $('q').textContent=q.a+' × '+q.b+' = ?';
  $('fb').textContent='';$('next').hidden=true;
  const o=$('opts');o.innerHTML='';
  q.opts.forEach((v,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.dataset.v=v;b.onclick=()=>answer(v);o.appendChild(b);});
  t0=Date.now();$('tb').style.width='100%';stopTimer();
  timer=setInterval(()=>{const left=SECS*1000-(Date.now()-t0);$('tb').style.width=Math.max(0,left/SECS/10)+'%';if(left<=0)answer(null);},100);
}
function answer(v){
  if(locked)return;locked=true;stopTimer();
  const q=qs[i],ok=v===q.ans;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.v===q.ans)b.classList.add('ok');else if(+b.dataset.v===v)b.classList.add('no');});
  rail[i].className=ok?'ok':'no';
  if(ok){right++;streak++;score+=10+Math.min(streak-1,5)*2;}
  else{streak=0;wrongs.push(q);}
  $('sc').textContent='分數 '+score+(streak>1?'　連對 '+streak:'');
  $('qn').textContent='第 '+(i+1)+' / '+TOTAL+' 題　可錯 '+Math.max(0,1-wrongs.length)+' 題';
  $('fb').innerHTML=(ok?'答對了！':(v===null?'時間到。':'再想想。'))+'<br><strong>'+kou(q.a,q.b)+'</strong>　'+q.a+' × '+q.b+' = '+q.ans;
  if(ok&&i<TOTAL-1&&wrongs.length<2){setTimeout(()=>{if(locked&&$('play').hidden===false)advance();},1100);}
  else{$('next').hidden=false;$('next').textContent=(i<TOTAL-1&&wrongs.length<2)?'下一題':'看成績';$('next').focus();}
}
let advTok=0;
function advance(){ if(!locked)return; locked=false; i++; if(i>=TOTAL||wrongs.length>=2)finish(); else show(); }
$('next').onclick=advance;

function finish(){
  stopTimer();$('play').hidden=true;$('end').hidden=false;
  const st=right>=10?3:right>=8?2:right>=5?1:0;
  $('stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('stars').style.color='var(--gold)';
  $('final').textContent=score+' 分';
  $('summary').textContent='答對 '+right+' / '+TOTAL+' 題'+(wrongs.length>=2?'，已錯兩題，挑戰結束':'，全部完成');
  const w=$('wrong');w.innerHTML='';
  if(wrongs.length){const h=document.createElement('li');h.style.border='0';h.innerHTML='<strong>需要再練習</strong>';w.appendChild(h);
    wrongs.forEach(q=>{const li=document.createElement('li');li.textContent=q.a+' × '+q.b+' = '+q.ans+'　'+kou(q.a,q.b);w.appendChild(li);});}
  try{const b=+(localStorage.getItem('jj-best')||0);if(score>b)localStorage.setItem('jj-best',score);}catch(e){}
  showBest();
}
$('start').onclick=start;$('again').onclick=start;
$('back').onclick=()=>{$('end').hidden=true;$('setup').hidden=false;};

/* keyboard 1-4 */
document.addEventListener('keydown',e=>{
  if($('play').hidden||locked)return;
  const n=+e.key;if(n>=1&&n<=4){const b=$('opts').children[n-1];if(b)b.click();}
});

/* table */
(function(){
  const g=$('grid');const cells=[];
  for(let r=0;r<=9;r++)for(let c=0;c<=9;c++){
    const b=document.createElement('button');b.className='cell';
    if(r===0||c===0){b.classList.add('h');b.textContent=r===0&&c===0?'×':(r||c);b.tabIndex=-1;}
    else{b.textContent=r*c;b.setAttribute('aria-label',r+' 乘 '+c+' 等於 '+r*c);
      b.onclick=()=>{cells.forEach(x=>x.el.classList.remove('hl','pick'));
        cells.forEach(x=>{if((x.r===r&&x.c<=c)||(x.c===c&&x.r<=r))x.el.classList.add('hl');});b.classList.add('pick');
        $('tfb').innerHTML='<strong>'+kou(r,c)+'</strong>　'+r+' × '+c+' = '+r*c;};
      cells.push({el:b,r,c});}
    g.appendChild(b);
  }
})();
</script>
</body>
</html>
