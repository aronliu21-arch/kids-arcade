<style>

}

}
:root[data-theme="dark"]{--sky:#16233A;--panel:#2C2A22;--ink:#FFF6DE;--soft:#D8C9A8;--egg:#F4CF5C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--sky);color:var(--ink);font-size:22px;line-height:1.4;user-select:none;-webkit-user-select:none}
#app{max-width:760px;margin:0 auto;padding:10px 14px 30px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:5px solid var(--orange);outline-offset:3px}
h1{font-size:44px;margin:0 0 2px}
.name{font-size:30px;font-weight:800;margin:4px 0 0;line-height:1.9}
.name rt{font-size:13px;font-weight:600;opacity:.8}
.spk{display:inline-grid;place-items:center;width:34px;height:34px;margin-left:8px;border-radius:50%;background:rgba(127,127,127,.2);font-size:16px;line-height:1;vertical-align:middle}
.sub{color:var(--soft);margin:0 0 12px}
.pet{display:block;margin:0 auto;width:220px}
.pet svg{width:220px;display:block;transform-origin:bottom center;animation:breathe 3s ease-in-out infinite}
.pet.roar svg{animation:roar .6s ease-out}
@keyframes breathe{50%{transform:scaleY(1.05)}}

.lands{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}

.land small{display:block;font-size:14px;font-weight:700}
.land.done{opacity:.8}

.go{background:var(--orange);color:#fff;font-weight:800;font-size:30px;border-radius:26px;padding:16px 44px;margin-top:12px;box-shadow:0 7px 0 #C4621F}

.friends{margin-top:16px;font-size:18px;color:var(--soft)}

.together{margin-top:14px;font-size:16px;color:var(--soft)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top button{background:var(--panel);border-radius:16px;padding:6px 14px;font-size:26px}
.top b{font-size:22px}
.map{border-radius:30px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.15);margin:0 auto;max-width:min(520px,calc((100vh - 190px)*400/560))}
.map svg{display:block;width:100%;height:auto}
.stop.now{transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#tok{transition:transform 1.3s ease-in-out;cursor:pointer}
.tokin.walk{animation:hop .33s ease-in-out infinite}
@keyframes hop{50%{transform:translate(-36px,-64px) scale(.36)}}
.deco{cursor:pointer;transform-box:fill-box;transform-origin:center}
.deco.wig{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-15deg) scale(1.2)}75%{transform:rotate(15deg) scale(1.2)}}
.hid{filter:brightness(0) opacity(.4)}
#fr{transition:filter .8s}
.mama{filter:hue-rotate(-95deg) saturate(1.3)}
.ov{position:fixed;inset:0;background:rgba(30,40,20,.45);display:grid;place-items:center;z-index:20;padding:12px}
.card{background:var(--panel);border-radius:30px;padding:16px 14px 22px;width:min(580px,100%);max-height:100%;overflow:auto;animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.story{font-size:22px;font-weight:700;margin:0 0 6px}
.say{background:var(--blue);color:#0E2A3A;border-radius:999px;padding:8px 20px;font-size:20px;font-weight:700;margin:4px 0 10px}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:440px;margin:0 auto}
.ob{font-size:50px;line-height:1.1;border-radius:18px;padding:2px 4px;transition:transform .15s}
.ob.lit{background:color-mix(in srgb,var(--egg) 55%,transparent);transform:scale(1.12)}
.ob .n{display:block;font-size:18px;font-weight:800;height:22px}
.sum{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:220px;background:color-mix(in srgb,var(--egg) 25%,transparent);border-radius:20px;padding:6px}
.grp .ob{font-size:40px}
.op{font-size:50px;font-weight:800}
.prop{font-size:96px;line-height:1.1}
.zy{font-size:120px;font-weight:700;line-height:1.15}
.choices{display:flex;justify-content:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.ch{background:var(--egg);color:#3B2C1E;min-width:116px;min-height:116px;border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;font-size:54px;font-weight:800;box-shadow:0 7px 0 #C9A73A;padding:6px 14px}
.ch small{display:block;font-size:20px}
.ch:disabled{opacity:.3}
.ch.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.yay svg{width:170px;animation:stomp .7s ease-out}
@keyframes stomp{0%{transform:translateY(-50px) scale(.6)}60%{transform:translateY(0) scale(1.12)}100%{transform:scale(1)}}
.big{font-size:100px;font-weight:800;line-height:1.1}
.word{font-size:56px;font-weight:800;letter-spacing:.08em}
.prompt{font-size:19px;color:var(--soft);margin:6px 0}
.keys{font-size:14px;color:var(--soft);margin-top:10px}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:4px}
.pair .m svg{width:200px}.pair .b svg{width:110px}
.mus{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;width:50px;height:50px;border-radius:50%;font-size:22px;background:rgba(127,127,127,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){
  .pet svg,.pet.roar svg,.stop.now,.tokin.walk,.deco.wig,.card,.yay svg,.ch.shake{animation:none}
  #tok{transition:none}
}
@media (max-width:520px){
  #app{padding:6px 10px 12px}
  h1{font-size:34px}
  .name{font-size:24px;line-height:1.8}
  .pet,.pet svg{width:min(190px,24vh)}
  .sub{margin-bottom:6px;font-size:18px}
  .lands{gap:5px;margin:6px 0}.land{font-size:24px;min-width:58px;padding:4px 6px}.land small{font-size:12px}
  .go{font-size:24px;padding:12px 30px;margin-top:8px}
  .friends{margin-top:8px}.friends span{font-size:30px}
  .together{margin-top:8px;font-size:13px}
  .card{padding:12px 10px 16px}
  .story{font-size:19px}
  .say{font-size:17px;padding:6px 14px;margin:2px 0 6px}
  .ob{font-size:42px}.grp .ob{font-size:30px}.grp{max-width:160px;padding:4px}.op{font-size:38px}
  .ob .n{font-size:15px;height:18px}
  .prop{font-size:70px}.zy{font-size:96px}
  .choices{gap:10px;margin-top:10px}
  .ch{min-width:96px;min-height:96px;font-size:44px}.ch small{font-size:17px}
  .big{font-size:80px}.word{font-size:44px}.yay svg{width:140px}
  .prompt{font-size:16px;margin:4px 0}

.ch.shp{background:#FFFDF5}.ch.emo{font-size:52px}.ch.sym{font-size:64px}
.ch.col{width:104px;height:120px;min-width:0;min-height:0}
.ch.nest{border-radius:26px;min-width:0;width:46%;max-width:220px;min-height:120px;font-size:30px;line-height:1.25;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;padding:10px}
.pat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:44px;margin:6px 0}.pat .qm{opacity:.7}
.movebtn svg{width:170px;display:block;margin:0 auto}.movebtn.bounce svg{animation:stomp .5s ease-out}
.cnt{font-size:52px;font-weight:800}
.season{display:inline-block;background:var(--egg);color:#3B2C1E;border-radius:999px;padding:2px 14px;font-size:16px;font-weight:800;margin:2px 0 4px}
.pair .s svg{width:80px}.sibc{filter:hue-rotate(150deg)}
@media (max-width:520px){.ch.nest{font-size:24px;min-height:100px}.ch.col{width:88px;height:102px}.movebtn svg{width:140px}.cnt{font-size:44px}.pat{font-size:36px}.pair .m svg{width:150px}.pair .b svg{width:90px}.pair .s svg{width:62px}}
.cloudnote{font-size:13px;opacity:.7;margin:10px 0 0}
.gpa{filter:hue-rotate(160deg) saturate(.55) brightness(1.05)}
.ob.shake{animation:shake .4s}
.blank{display:inline-block;min-width:.8em;border-bottom:6px solid var(--orange);color:transparent}
.ch.lower{font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;text-transform:none}
.chap{display:inline-block;background:#2E7D32;color:#fff;border-radius:999px;padding:3px 16px;font-size:17px;font-weight:700;margin:2px 0 4px}
.choices .ch.shp svg{display:block}
:root{--font-display:"Fredoka","Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;--font-body:"Noto Sans TC","PingFang TC","Heiti TC","Fredoka",system-ui,sans-serif}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
.studio{max-width:640px;margin:0 auto;text-align:left}
.tips{background:var(--panel,var(--paper));color:var(--ink);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.55;margin-bottom:8px}
.tips p{margin:4px 0}
.vgroup{margin:14px 4px 6px;font-weight:700;font-size:17px}
.vrow{display:grid;grid-template-columns:50px 1fr repeat(4,44px);gap:6px;align-items:center;background:var(--panel,var(--paper));color:var(--ink);border-radius:14px;padding:6px 8px;margin-bottom:6px;border:2px solid transparent}
.vrow.has{border-color:#3DAA4A}
.vsym{font-size:28px;font-weight:700;text-align:center;font-family:var(--font-display)}
.vsay{font-size:15px;line-height:1.3}.vsay small{opacity:.65;font-size:12px}
.vrow button,.vup{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:rgba(127,127,127,.16);cursor:pointer}
.vrow button:disabled{opacity:.3}
.vrec{color:#E8423F;font-size:22px}
.vrec.on{background:#E8423F;color:#fff;animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{transform:scale(1.08)}}
.vmsg{color:#E8423F;font-weight:700;min-height:20px}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}.vbtn{display:inline-block;background:rgba(127,127,127,.16);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;cursor:pointer}
.plink{display:block;margin:10px auto 0;font-size:15px;text-decoration:underline;opacity:.75}
@media (prefers-reduced-motion:reduce){.vrec.on{animation:none}}
body{font-family:var(--font-display)}
h1{font-weight:700;color:#fff;letter-spacing:.01em;text-shadow:3px 0 #2E7D32,-3px 0 #2E7D32,0 3px #2E7D32,0 -3px #2E7D32,2px 2px #2E7D32,-2px -2px #2E7D32,2px -2px #2E7D32,-2px 2px #2E7D32,0 7px 0 rgba(0,0,0,.18)}
.go{font-weight:700;letter-spacing:.02em}

.map{border:5px solid #fff}
.ch,.big,.word,.story,.cnt{font-weight:700}
.pet,.lands{animation:enter .35s cubic-bezier(.2,.8,.2,1) both}

.choices.locked{opacity:0;pointer-events:none}
.choices{transition:opacity .3s}
.again{display:inline-block;background:#FFE7C2;color:#8A4B12;border-radius:999px;padding:2px 12px;font-size:15px;font-weight:700;margin:0 0 4px}
.newsym{display:inline-block;background:#FFF1A8;color:#5A4300;border-radius:14px;padding:4px 14px;font-weight:700;margin:4px 0;animation:popin .4s}
.skip2{font-size:15px;text-decoration:underline;opacity:.7;margin-top:8px}
.plinks{display:flex;flex-direction:column;align-items:center;gap:2px}
.report .tips small{opacity:.7}
.rsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.rsum div{background:var(--panel);border-radius:16px;padding:8px;text-align:center}.rsum b{display:block;font-size:26px}.rsum small{font-size:13px;opacity:.75}
.rchips{display:flex;flex-wrap:wrap;gap:6px}.rchip{background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:700}.rchip small{opacity:.6;font-weight:500}
.rrow{display:grid;grid-template-columns:110px 1fr 86px;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:6px 10px;margin-bottom:5px;font-size:15px}
.rl{font-weight:700}.rbar{height:12px;background:rgba(127,127,127,.18);border-radius:999px;overflow:hidden}.rbar i{display:block;height:100%}
.rn{font-size:13px;text-align:right;opacity:.8}
.ch.sz{background:#FFFDF5;min-width:104px;min-height:120px;display:grid;place-items:center}
.shd{filter:brightness(0) opacity(.78);font-size:52px}
.ch.where{position:relative;width:104px;height:120px;min-width:0;min-height:0;padding:0;background:#FFFDF5;border-radius:24px}
.wb{position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);font-size:50px;line-height:1}
.ws{position:absolute;font-size:30px;line-height:1}
.ch.where:has(.w-nextto) .wb{left:36%}
.w-on{left:50%;top:4px;transform:translateX(-50%)}.w-under{left:50%;bottom:2px;transform:translateX(-50%)}.w-nextto{right:2px;top:50%;transform:translateY(-30%)}
.eggs .gone{opacity:.25;filter:grayscale(1)}.eggs .arrive{outline:3px dashed var(--orange);border-radius:12px;animation:popin .6s}
.pfr{font-size:40px;letter-spacing:4px}
@media (max-width:520px){.ch.sz,.ch.where{width:96px;height:110px;min-width:0}}
/* ---- laptop / wide-screen fit ---- */
@media (min-width:560px) and (min-aspect-ratio:1/1){
  .homewrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 90px)}

  .homewrap .hr .go{margin-top:6px}
  .homewrap .friends{margin-top:10px}.homewrap .friends span{font-size:min(34px,4.5vh)}
  .homewrap .together{margin-top:8px;font-size:14px}
}

  .yay svg{width:min(150px,20vh)}.big{font-size:min(100px,12vh)}.word{font-size:min(56px,7vh)}
  .prop{font-size:min(96px,11vh)}.zy{font-size:min(120px,14vh)}.card{padding:12px 14px 16px}
  .ch{min-width:min(116px,15vh);min-height:min(116px,15vh);font-size:min(54px,7vh)}
}
@media (max-width:520px){.friends{margin-top:8px;font-size:14px}.friends span{font-size:22px;margin:0 1px}}
@media (max-width:520px) and (max-height:700px){.together{display:none}}
@media (min-width:560px) and (max-width:900px) and (max-height:640px){.homewrap .together{display:none}}
</style>

const SND=(()=>{
  const CFG={id:'milo',music:true,bar:3.4,steps:8,arp:.5,ring:.9,oct:12,wave:'sine',vol:.45,cut:3000};
  let ctx=null,master=null,mg=null,on=CFG.music,nextBar=0,bar=0;
  try{const v=localStorage.getItem('music-'+CFG.id);if(v!==null)on=v==='1';}catch(e){}
  const N=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC();}catch(e){return false;}
    master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=CFG.cut;lp.connect(master);
    mg=ctx.createGain();mg.gain.value=0;mg.connect(lp);
    setInterval(tick,200);return true;
  }
  function tone(f,t,d,o){o=o||{};const os=ctx.createOscillator(),g=ctx.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
    if(o.glide)os.frequency.exponentialRampToValueAtTime(o.glide,t+d);
    const a=o.a||.015,v=o.v||.15;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g);g.connect(o.dest||master);os.start(t);os.stop(t+d+.05);}
  const PROG=[[48,[60,64,67,71]],[45,[57,60,64,67]],[41,[57,60,64,65]],[43,[59,62,67,64]]];
  const PENT=[72,74,76,79,81,84,86,88];
  function playBar(t){
    const [root,ch]=PROG[bar%PROG.length];bar++;const L=CFG.bar;
    tone(N(root),t,L*.95,{v:.09,a:.3,dest:mg});
    ch.forEach(m=>tone(N(m),t,L*1.05,{v:.035,a:L*.35,type:'triangle',dest:mg}));
    const dt=L/CFG.steps;
    for(let i=0;i<CFG.steps;i++)if(Math.random()<CFG.arp)tone(N(PENT[Math.floor(Math.random()*PENT.length)]+CFG.oct),t+i*dt,CFG.ring,{v:.05,dest:mg,type:CFG.wave});
  }
  function tick(){
    const speaking=(('speechSynthesis' in window)&&speechSynthesis.speaking)||!!(window.VOICE_PLAYING&&window.VOICE_PLAYING());
    const target=on&&!document.hidden?(speaking?CFG.vol*.25:CFG.vol):0;
    mg.gain.setTargetAtTime(target,ctx.currentTime,.4);
    if(!on)return;
    if(nextBar<ctx.currentTime)nextBar=ctx.currentTime+.1;
    while(nextBar<ctx.currentTime+.6){playBar(nextBar);nextBar+=CFG.bar;}
  }
  function unlock(){if(init()&&ctx.state!=='running')ctx.resume();}
  document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);
  const btn=document.createElement('button');btn.className='mus';btn.type='button';
  function label(){btn.textContent=on?'🎵':'🔇';btn.setAttribute('aria-label',on?'Music on':'Music off');btn.setAttribute('aria-pressed',String(on));}
  label();
  btn.onclick=e=>{e.stopPropagation();unlock();on=!on;try{localStorage.setItem('music-'+CFG.id,on?'1':'0');}catch(err){}label();};
  document.body.appendChild(btn);
  function fx(fn){if(!init())return;if(ctx.state!=='running')ctx.resume();fn(ctx.currentTime+.02);}
  return{
    correct:()=>fx(t=>[72,76,79,84].forEach((m,i)=>tone(N(m),t+i*.09,.5,{type:'triangle',v:.16}))),
    wrong:()=>fx(t=>{tone(N(64),t,.25,{v:.09});tone(N(60),t+.16,.35,{v:.09});}),
    win:()=>fx(t=>{[72,74,76,79,81,84,88].forEach((m,i)=>tone(N(m),t+i*.06,.4,{type:'triangle',v:.12}));[72,76,79].forEach(m=>tone(N(m),t+.5,1.2,{v:.08}));}),
    pop:()=>fx(t=>tone(N(67),t,.18,{v:.15,glide:N(79)})),
    thump:()=>fx(t=>tone(110,t,.3,{v:.25,glide:55})),
    roar:()=>fx(t=>{tone(170,t,.55,{type:'triangle',v:.22,glide:85});tone(255,t,.45,{type:'square',v:.03,glide:120});}),
    step:()=>fx(t=>tone(180,t,.12,{v:.12,glide:120})),
    bell:()=>fx(t=>{tone(N(69),t,2.5,{v:.07});tone(N(76),t,2.5,{v:.035});})
  };
})();

function walk(){
  if(busy)return;ensure();

  tok.style.transform=`translate(${target[0]}px,${target[1]}px)`;

/* --- learning state: answer log, 注音 levels, review queue --- */
function ensure(){S.zl=S.zl||4;S.zfl=S.zfl||0;S.zstreak=S.zstreak||0;S.log=S.log||{};S.review=S.review||[];}
const zyPool=()=>ZY.slice(0,S.zl);
const zyhPool=()=>[...ZY.slice(0,S.zl),...ZYF.slice(0,S.zfl).map(f=>[f[0],'',''])];
function weightPick(pool,keyFn){
  const w=pool.map(x=>{const e=S.log[keyFn(x)];if(!e)return 3;const miss=1-e[1]/e[0];return 1+3*miss;});
  let t=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<pool.length;i++){t-=w[i];if(t<=0)return pool[i];}return pool[pool.length-1];
}
function unlockNext(){
  if(S.zl<21&&(S.zl<8||S.zfl>=Math.floor((S.zl-6)/2))){S.zl++;return ZY[S.zl-1][0];}
  if(S.zfl<16){S.zfl++;return ZYF[S.zfl-1][0];}
  if(S.zl<21){S.zl++;return ZY[S.zl-1][0];}
  return null;
}
function itemKey(r){switch(r.type){case 'count':return 'count:'+r.ans;case 'add':return 'add:'+r.a+'+'+r.b;case 'letter':return 'letter:'+r.ans;case 'word':return 'word:'+r.ans[0];
  case 'zy':return 'zy:'+r.ans[0];case 'zyhear':return 'hear:'+r.ans[0];case 'shape':return 'shape:'+r.ans[0];case 'color':return 'color:'+r.ans[0];case 'sound':return 'sound:'+r.ans[1];
  case 'number':return 'number:'+r.ans;case 'more':return 'more:'+(Math.abs(r.a-r.b)<2?'close':'far');case 'pattern':return 'pattern:'+(r.unitLen===3?'AAB':'AB');case 'biggest':return 'big:'+(r.big?'biggest':'smallest');case 'animal':return 'animal:'+r.ans[0];case 'feel':return 'feel:'+r.ans[0];case 'shadow':return 'shadow:'+r.ans[0];case 'odd':return 'odd:'+r.cat[0];case 'where':return 'where:'+r.ans[0];case 'together':return 'together:'+r.ans[0];case 'onemore':return 'onemore:'+(r.more?'more':'less');case 'countkind':return 'countkind:'+r.ans;case 'missing':return 'missing:'+r.w[0];case 'upper':return 'upper:'+r.X;case 'subtract':return 'sub:'+r.n+'-'+r.k;case 'pattern3':return 'pattern3:'+(r.abc?'ABC':'ABB');case 'zyfirst':return 'zyfirst:'+r.ans[0];case 'combo':return 'combo:'+r.ans[1][0]+' '+r.ans[0][0];case 'order':return 'order:'+r.q[0][0];}return null;}
function specOf(r){const type=r.type;switch(r.type){case 'count':return{type:'count',n:r.ans};case 'add':return{type:'add',a:r.a,b:r.b};case 'letter':return{type:'letter',x:r.ans};case 'word':return{type:'word',w:r.ans[0]};
  case 'zy':return{type:'zy',sym:r.ans[0]};case 'zyhear':return{type:'zyhear',sym:r.ans[0]};case 'shape':return{type:'shape',name:r.ans[0]};case 'color':return{type:'color',name:r.ans[0]};
  case 'sound':return{type:'sound',w:r.ans[1]};case 'number':return{type:'number',n:r.ans};case 'animal':case 'feel':case 'shadow':case 'together':return{type:r.type,name:r.ans[0]};case 'where':return{type:'where',name:r.ans[0]};case 'countkind':return{type,n:r.ans};case 'missing':return{type,w:r.w[0]};case 'upper':return{type,x:r.X};case 'subtract':return{type,n:r.n,k:r.k};case 'zyfirst':return{type,sym:r.ans[0]};case 'order':return{type,name:r.q[0][0]};default:return{type:r.type};}}
function record(r,first){
  ensure();const key=itemKey(r);if(!key)return;
  const e=S.log[key]||[0,0,0];e[0]++;if(first)e[1]++;S.log[key]=e;
  const ix=S.review.findIndex(x=>x.k===key);
  if(first){if(ix>=0)S.review.splice(ix,1);}
  else if(ix<0){S.review.push({...specOf(r),k:key,j:S.journeys});if(S.review.length>8)S.review.shift();}
  if(r.type==='zy'||r.type==='zyhear'||r.type==='zyfirst'){
    if(first){S.zstreak++;if(S.zstreak>=3){S.zstreak=0;r.newSym=unlockNext();}}else S.zstreak=0;
  }
  save();
}
function saidIt(r){const key=itemKey(r);if(!key||!S.log[key])return;S.log[key][2]=(S.log[key][2]||0)+1;save();}

function makeRound(type,spec){
  ensure();spec=spec||{};const L=land(),M=maxN(),li=S.land%LANDS.length;
  if(type==='count'){const n=spec.n||2+rnd(M-1);return{type,ans:n,opts:numChoices(n),story:`Count the ${L.objN}!`};}
  if(type==='add'){let a=spec.a,b=spec.b;if(!a||!b){a=1+rnd(Math.min(4,M-1));b=1+rnd(Math.min(4,M-a));}return{type,a,b,ans:a+b,opts:numChoices(a+b),story:`${a} ${L.objN} and ${b} more!`};}
  if(type==='letter'){const x=spec.x||ABC[rnd(26)];return{type,ans:x,opts:shuffle([x,...shuffle([...ABC].filter(y=>y!==x)).slice(0,2)]),story:`The gate opens with the letter ${x}!`};}
  if(type==='word'){const w=(spec.w&&WORDS.find(y=>y[0]===spec.w))||WORDS[rnd(WORDS.length)];return{type,ans:w,opts:shuffle([w,...pickOthers(WORDS,w,2)]),story:`Who is hiding? Find the ${w[0]}!`};}
  if(type==='zy'){const pool=zyPool();const z=(spec.sym&&ZY.find(y=>y[0]===spec.sym))||weightPick(pool,x=>'zy:'+x[0]);const o=pickOthers(pool.includes(z)?pool:[...pool,z],z,1)[0];return{type,ans:z,opts:shuffle([z,o]),story:'The talking rock says a sound!'};}
  if(type==='shape'){const sh=(spec.name&&SHAPES.find(x=>x[0]===spec.name))||SHAPES[rnd(SHAPES.length)];const cols=shuffle(COLORS);const opts=shuffle([sh,...pickOthers(SHAPES,sh,2)]);return{type,ans:sh,opts,cols:opts.map((_,k)=>cols[k][2]),story:`Find the ${sh[0]}!`};}
  if(type==='more'){let a,b;do{a=1+rnd(M);b=1+rnd(M);}while(Math.abs(a-b)<(li<2?2:1));return{type,a,b,ans:a>b?0:1,opts:[0,1],story:`Which nest has more ${L.objN}?`};}
  if(type==='pattern'){const Pp=li===0?[L.obj,'🦕']:PAIRS[rnd(PAIRS.length)];const unit=li<2||rnd(2)?[Pp[0],Pp[1]]:[Pp[0],Pp[0],Pp[1]];const seq=Array.from({length:5},(_,k)=>unit[k%unit.length]);return{type,seq,unitLen:unit.length,ans:unit[5%unit.length],opts:shuffle([Pp[0],Pp[1]]),story:'What comes next?'};}
  if(type==='move'){const m=MOVES[rnd(MOVES.length)],n=2+rnd(3);return{type,m,n,ans:null,opts:[],story:`${m[0]} ${n} times!`};}
  if(type==='color'){const c=(spec.name&&COLORS.find(x=>x[0]===spec.name))||COLORS[rnd(COLORS.length)];return{type,ans:c,opts:shuffle([c,...pickOthers(COLORS,c,2)]),story:`Find the ${c[0]} egg!`};}
  if(type==='sound'){const w=(spec.w&&SOUNDW.find(x=>x[1]===spec.w))||SOUNDW[rnd(SOUNDW.length)];return{type,ans:w,opts:shuffle([w,...pickOthers(SOUNDW,w,2,(x,y)=>x[0]===y[0])]),story:`Which one starts with ${w[0]}?`};}
  if(type==='number'){const n=spec.n||1+rnd(9);return{type,ans:n,opts:numChoices(n),story:`Find the number ${n}!`};}
  if(type==='biggest'){const e=pickOthers(SHADOWS,null,1)[0][1];const big=Math.random()<.5;const sizes=shuffle([0,1,2]);return{type,e,sizes,big,ans:sizes.indexOf(big?2:0),opts:[0,1,2],story:big?'Which one is the BIGGEST?':'Which one is the SMALLEST?'};}
  if(type==='animal'){const a=(spec.name&&ANIMALS.find(x=>x[0]===spec.name))||ANIMALS[rnd(ANIMALS.length)];return{type,ans:a,opts:shuffle([a,...pickOthers(ANIMALS,a,2,(x,y)=>x[4]===y[4])]),story:`Who says “${a[1]}”?`};}
  if(type==='feel'){const fe=(spec.name&&FEELS.find(x=>x[0]===spec.name))||FEELS[rnd(FEELS.length)];return{type,ans:fe,opts:shuffle([fe,...pickOthers(FEELS,fe,2)]),story:`Which dino feels ${fe[0]}?`};}
  if(type==='shadow'){const sh=(spec.name&&SHADOWS.find(x=>x[0]===spec.name))||SHADOWS[rnd(SHADOWS.length)];return{type,ans:sh,opts:shuffle([sh,...pickOthers(SHADOWS,sh,2)]),story:`Find the ${sh[0]}’s shadow!`};}
  if(type==='odd'){const cs=shuffle(ODD_CATS);const c=cs[0],o=cs[1];const three=shuffle(c[2]).slice(0,3),odd=o[2][rnd(o[2].length)];return{type,cat:c,ocat:o,ans:odd,opts:shuffle([...three,odd]),story:'Which one is different?'};}
  if(type==='where'){const pr=WHERE_PAIRS[rnd(WHERE_PAIRS.length)],p=(spec.name&&POS.find(x=>x[0]===spec.name))||POS[rnd(POS.length)];return{type,pr,ans:p,opts:shuffle([...POS]),story:`Find the ${pr[0]} ${p[0].toUpperCase()} the ${pr[3]}!`};}
  if(type==='together'){const t=(spec.name&&TOGETHER.find(x=>x[0]===spec.name))||TOGETHER[rnd(TOGETHER.length)];return{type,ans:t,opts:shuffle([t,...pickOthers(TOGETHER,t,2)]),story:`What goes with the ${t[0]}?`};}
  if(type==='onemore'){const more=Math.random()<.5;const n=more?1+rnd(Math.min(8,M)):2+rnd(Math.min(8,M)-1);const ans=more?n+1:n-1;return{type,n,more,ans,opts:numChoices(ans),story:more?`${n} ${L.objN}. One more comes!`:`${n} ${L.objN}. One goes away!`};}

    case 'number':show=`<div class="big">${r.ans}</div>`;voice=[[`Yes! ${EN_NUM[r.ans]}!`,'en'],[ZH_NUM[r.ans],'zh']];prompt=`Say it: ${r.ans} — ${ZH_NUM[r.ans]}`;break;
    case 'zyhear':show=`<div class="big">${r.ans[0]}</div>${r.ans[1]?`<div class="word">${r.ans[1]} ${r.ans[2]}</div>`:''}`;voice=[[ZYS[r.ans[0]],'zh'],[r.ans[2],'zh']];prompt=r.ans[2]?`跟恐龍說：${r.ans[0]} — ${r.ans[2]}`:`跟恐龍說：${r.ans[0]}`;break;
    case 'biggest':show=`<div style="font-size:110px;line-height:1.1">${r.e}</div>`;voice=[[r.big?'Yes! The biggest one!':'Yes! The smallest one!','en'],[r.big?'最大':'最小','zh']];prompt=r.big?'Say it: “big, bigger, biggest!”':'Say it: “small, smaller, smallest!”';break;
    case 'animal':show=`<div class="big">${r.ans[2]}</div><div class="word">${r.ans[0]}</div>`;voice=[[`The ${r.ans[0]} says ${r.ans[1]}!`,'en'],[`${r.ans[3]}說${r.ans[4]}`,'zh']];prompt=`Make the sound together: “${r.ans[1]}!” — ${r.ans[4]}`;break;
    case 'feel':show=`<div class="big">${r.ans[2]}</div><div class="word">${r.ans[0]}</div>`;voice=[[`Yes! ${r.ans[0]}!`,'en'],[r.ans[1],'zh']];prompt=`Can Milo make a ${r.ans[0]} face? — ${r.ans[1]}`;break;
    case 'shadow':show=`<div class="big">${r.ans[1]}</div><div class="word">${r.ans[0]}</div>`;voice=[[`Yes! That’s the ${r.ans[0]}’s shadow!`,'en']];prompt=`Say it: “${r.ans[0]}”`;break;
    case 'odd':show=`<div class="big">${r.ans[1]}</div>`;voice=[[`Yes! The ${r.ans[0]} is not one of the ${r.cat[0]}!`,'en']];prompt=`The others are ${r.cat[0]} — ${r.cat[1]}`;break;
    case 'where':show=`<div class="ch where" style="margin:6px auto;pointer-events:none"><span class="wb">${r.pr[4]}</span><span class="ws w-${r.ans[0].replace(' ','')}">${r.pr[1]}</span></div>`;voice=[[`Yes! The ${r.pr[0]} is ${r.ans[0]} the ${r.pr[3]}!`,'en'],[`${r.pr[2]}在${r.pr[5]}${r.ans[1]}`,'zh']];prompt=`Say it: “${r.ans[0]}” — ${r.ans[1]}`;break;
    case 'together':show=`<div class="big">${r.ans[1]} ${r.ans[3]}</div>`;voice=[[`Yes! The ${r.ans[0]} and the ${r.ans[2]} go together!`,'en']];prompt=`Say it: “${r.ans[0]} and ${r.ans[2]}”`;break;
    case 'countkind':show=`<div class="big">${r.ans} ${r.t[0]}</div>`;voice=[[`Yes! ${r.ans} ${r.t[1]}!`,'en'],[ZH_NUM[r.ans]+r.t[2],'zh']];prompt=`Say it together: ${r.ans} — ${ZH_NUM[r.ans]}`;break;
    case 'missing':show=`<div class="big">${r.w[1]}</div><div class="word">${[...r.w[0]].map((c,j)=>j===r.i?`<span style="color:var(--orange)">${c}</span>`:c).join('')}</div>`;voice=[[`Yes! ${[...r.w[0]].join(', ')}. ${r.w[0]}!`,'en']];prompt=`Sound it out: “${[...r.w[0]].join(' – ')}… ${r.w[0]}”`;break;
    case 'upper':show=`<div class="big">${r.X} <span style="font-family:Avenir Next,Arial,sans-serif">${r.ans}</span></div>`;voice=[[`Yes! Big ${r.X}, little ${r.ans}!`,'en']];prompt=`Say it: “${r.X}”`;break;
    case 'subtract':show=`<div class="big">${r.n} − ${r.k} = ${r.ans}</div>`;voice=[[`Yes! ${r.n} take away ${r.k} is ${r.ans}!`,'en'],[ZH_NUM[r.ans],'zh']];prompt=`${r.n} take away ${r.k} → ${r.ans} — ${ZH_NUM[r.ans]}`;break;
    case 'pattern3':show=`<div class="pat">${[...r.seq,r.ans].map(x=>`<span>${x}</span>`).join('')}</div>`;voice=[['Yes! The pattern keeps going!','en']];prompt='Read the pattern out loud together!';break;
    case 'zyfirst':show=`<div class="big">${r.ans[1]}</div><div class="word">${r.ans[0]} ${r.ans[2]}</div>`;voice=[[r.ans[2],'zh'],[ZYS[r.ans[0]],'zh']];prompt=`跟恐龍說：${r.ans[2]} — ${r.ans[0]}`;break;
    case 'combo':show=`<div style="margin:6px 0">${shapeSVG(r.ans[0],r.ans[1][2],110)}</div><div class="word">${r.ans[1][0]} ${r.ans[0][0]}</div>`;voice=[[`Yes! The ${r.ans[1][0]} ${r.ans[0][0]}!`,'en'],[`${r.ans[1][1]}的${r.ans[0][1]}`,'zh']];prompt=`Say it: “${r.ans[1][0]} ${r.ans[0][0]}” — ${r.ans[1][1]}的${r.ans[0][1]}`;break;
    case 'order':show=`<div class="pat">${r.q.map(x=>`<span>${x[1]}</span>`).join('<span>➡️</span>')}</div>`;voice=[[`Yes! ${r.q[0][0]}, then ${r.q[1][0]}, then ${r.q[2][0]}!`,'en']];prompt=`Tell the story: “first… then… last…”`;break;
    case 'onemore':show=`<div class="big">${r.ans}</div>`;voice=[[`Yes! ${r.n} ${r.more?'and one more':'take away one'} is ${r.ans}!`,'en'],[ZH_NUM[r.ans],'zh']];prompt=`${r.more?'One more':'One less'}: ${r.n} → ${r.ans}`;break;
  }
  const newBadge=r.newSym?`<p class="newsym">⭐ New sound unlocked: <b>${r.newSym}</b></p>`:'';
  if(r.newSym)voice=[...voice,['A new sound!','en'],[ZYS[r.newSym],'zh']];
  const sayType=SAYTYPES.includes(r.type);
  const nextLabel=WARM.active?'Next ➜':'Keep walking ➜';
  openOv(`<div class="yay">${DINO}</div>${show}${newBadge}<p class="prompt">👨‍👩‍👦 ${prompt}</p>
  <button class="say" id="again">🔊 Hear it again</button><br>
  ${sayType?`<button class="go" id="nx">👍 Milo said it!</button><br><button class="skip2" id="skipsay">${nextLabel.replace(' ➜','')} without saying it</button>`:`<button class="go" id="nx">${nextLabel}</button>`}`);
  say(voice);
  $('#again').onclick=()=>say(voice);
  const go=()=>{if(WARM.active){nextWarm();return;}S.stop++;save();map();};
  $('#nx').onclick=()=>{if(sayType){saidIt(r);SND.correct();}go();};
  const sk=$('#skipsay');if(sk)sk.onclick=go;
}

/* --- parent progress report --- */
function report(){
  ensure();closeOv();
  const pct=e=>e[0]?Math.round(e[1]/e[0]*100):0;
  const items=Object.entries(S.log);
  const total=items.reduce((a,[,e])=>a+e[0],0),first=items.reduce((a,[,e])=>a+e[1],0),said=items.reduce((a,[,e])=>a+(e[2]||0),0);
  const label=k=>{const[t,v]=k.split(':');return t==='more'?(v==='close'?'close amounts':'clear amounts'):v;};
  const need=items.filter(([,e])=>e[0]>=2&&pct(e)<60).sort((a,b)=>pct(a[1])-pct(b[1])).slice(0,8);
  const good=items.filter(([,e])=>e[0]>=2&&pct(e)>=80).sort((a,b)=>b[1][0]-a[1][0]).slice(0,10);
  const G=[['注音 — sound to picture','zy:'],['注音 — hear the sound','hear:'],['Counting','count:'],['Adding','add:'],['Numbers','number:'],['Letters','letter:'],['English words','word:'],['First sounds','sound:'],['Shapes','shape:'],['Colors','color:'],['More or fewer','more:'],['Patterns','pattern:'],['Biggest & smallest','big:'],['Animal sounds','animal:'],['Feelings','feel:'],['Shadows','shadow:'],['Which one is different','odd:'],['On / under / next to','where:'],['What goes together','together:'],['One more / one less','onemore:'],['Ch.2 — count only some','countkind:'],['Ch.2 — missing letter','missing:'],['Ch.2 — big & little letters','upper:'],['Ch.2 — take away','sub:'],['Ch.2 — 3-part patterns','pattern3:'],['Ch.2 — 注音 first sound','zyfirst:'],['Ch.2 — color + shape','combo:'],['Ch.2 — what comes next','order:']];
  const chip=([k,e])=>`<span class="rchip">${label(k)} <small>${e[1]}/${e[0]}</small></span>`;
  app.innerHTML=`<section class="studio report">
  <div class="top"><button id="h" aria-label="Home">🏠</button><b>📊 Milo’s progress</b><span></span></div>
  ${total?`<div class="rsum"><div><b>${total}</b><small>answers</small></div><div><b>${Math.round(first/total*100)}%</b><small>right first try</small></div><div><b>${said}</b><small>said out loud</small></div></div>`:'<div class="tips"><p>No answers recorded yet. Tracking starts with his next journey.</p></div>'}
  <div class="tips"><p><b>注音 unlocked:</b> ${ZY.slice(0,S.zl).map(z=>z[0]).join(' ')} <small>(${S.zl} of 21)</small>${S.zfl?`<br><b>Finals:</b> ${ZYF.slice(0,S.zfl).map(z=>z[0]).join(' ')} <small>(${S.zfl} of 16)</small>`:''}</p>
  <p><small>A new symbol unlocks after 3 注音 answers in a row are right the first time.</small></p></div>
  ${need.length?`<div class="vgroup">🔁 Needs practice</div><div class="rchips">${need.map(chip).join('')}</div>`:''}
  ${good.length?`<div class="vgroup">⭐ Going well</div><div class="rchips">${good.map(chip).join('')}</div>`:''}
  ${G.map(([g,p])=>{const rows=items.filter(([k])=>k.startsWith(p));if(!rows.length)return'';return `<div class="vgroup">${g}</div>`+rows.sort((a,b)=>a[0].localeCompare(b[0],'zh')).map(([k,e])=>`<div class="rrow"><span class="rl">${label(k)}</span><span class="rbar"><i style="width:${pct(e)}%;background:${pct(e)>=80?'#3DAA4A':pct(e)>=60?'#F6C531':'#E8423F'}"></i></span><span class="rn">${e[1]}/${e[0]}${e[2]?` · 👍${e[2]}`:''}</span></div>`).join('');}).join('')}
  <p class="cloudnote">Numbers show right-first-try / times seen. 👍 = times you tapped “Milo said it”.</p></section>`;
  $('#h').onclick=home;
}

/* ---------- ARRIVAL ---------- */
function arrive(){
  const L=land(),FR=friendNow(),isGpa=FR[0]==='grandpa',isMama=FR[0]==='mama'||isGpa,isSib=FR[0]==='sib',isParty=FR[0]==='party';
  if(!S.friends.includes(FR[0]))S.friends.push(FR[0]);
  S.journeys++;S.land=(S.land+1)%LANDS.length;S.stop=0;save();
  const fr=$('#fr');if(fr)fr.classList.remove('hid');SND.win();say([['Look!','en']]);
  setTimeout(()=>{
  const partyPic=`<div class="big">🎂🎈</div><div class="pfr">${S.friends.filter(f=>!['mama','sib','party','grandpa'].includes(f)).join(' ')}</div>`;
  const pic=isParty?partyPic:isMama||isSib?`<div class="pair"><span class="m"><span class="${isGpa?'gpa':'mama'}" style="display:inline-block">${DINO}</span></span><span class="b">${DINO}</span>${isSib?`<span class="s"><span class="sibc" style="display:inline-block">${DINO}</span></span>`:''}</div>`:`<div class="big">${FR[0]}</div>`;
  const line=isGpa?'Little Dino found Grandpa Dino! Now the whole family is together! Hooray!':isParty?'Surprise! It’s Little Dino’s birthday party — all the friends came!':isSib?'Surprise! Mama’s egg hatched — a new baby dino! Little Dino is a big sibling now!':isMama?'Little Dino found Mama! Hooray!':`You found ${FR[1]}! A new friend!`;
  openOv(`${pic}<p class="story" data-say="en">${line}</p><button class="go" id="nx">Yay! ➜</button>`);
  say([[line,'en']]);
  $('#nx').onclick=nap;
  },1100);
}
function nap(){
  closeOv();
  const next=land();
  app.innerHTML=`<div class="card" style="margin-top:30px;animation:none"><div class="pet" style="width:200px">${DINO}</div>
  <p style="font-size:30px;font-weight:800;margin:6px 0" data-say="en">Great journey, Milo! 洛明好棒！</p>
  <p class="prompt" data-say="en">Little Dino is sleepy. Next time: the ${next.n}!</p>
  <button class="go" id="h2">🏠 Home</button>
  <p class="keys"><button id="more" style="text-decoration:underline;color:var(--soft)">Parent: start the next journey now</button></p></div>`;
  say([['Great journey, Milo! Time for a nap.','en']]);
  $('#h2').onclick=home;$('#more').onclick=map;
}

/* ---------- OVERLAY + KEYS ---------- */
function openOv(html){let o=$('.ov');if(!o){o=document.createElement('div');o.className='ov';document.body.appendChild(o);}
  o.innerHTML=`<div class="card" role="dialog">${html}</div>`;}
function closeOv(){const o=$('.ov');if(o)o.remove();}
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){const b=$('.ov #nx')||(!$('.ov')&&$('#go'));if(b){e.preventDefault();b.click();}return;}
  if(/^[0-9]$/.test(e.key)&&round&&$('.ov .ch')&&!$('.ov .choices.locked')){
    const btn=[...document.querySelectorAll('.ov .ch')].find(b=>b.textContent.trim()===e.key);if(btn)btn.click();
    return;}
  if(/^[a-z]$/i.test(e.key)&&round&&round.type==='letter'&&$('.ov .ch')){
    const btn=[...document.querySelectorAll('.ov .ch')].find(b=>b.textContent.trim()===e.key.toUpperCase());if(btn)btn.click();}
});

window.__test={state:()=>({screen:$('.ov .ch,#mv')?'play':$('#pet')?'home':'other',type:round&&round.type,stop:S.stop,land:S.land,ch:S.ch}),
  solve:()=>{const r=round;if(!r)return;const c=$('#chs');if(c)c.classList.remove('locked');const k=r.opts.indexOf(r.ans);const b=document.querySelector(`.ov .ch[data-k="${k}"]`);if(b)b.click();}};
home();
cloudInit();
voiceLoad();
</script>
