.msg{min-height:30px;margin:14px 0 6px;font-size:20px;color:var(--stamp)}

.explain{background:var(--tint)}
.fact{border:2px dashed var(--gold)}

.explain h3,.fact h3,.report h3{font-size:18px;display:flex;align-items:center;gap:8px}
.explain p,.fact p,.report p{margin:6px 0}
details.sol summary{cursor:pointer;color:var(--soft);font-size:17px;margin-top:12px}
.calm{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;z-index:20;padding:20px}
.calmbox{background:var(--paper);border-radius:24px;padding:26px 22px;max-width:420px;width:100%;text-align:center}
.cmsg{font-size:20px;margin:0 0 10px}
.breath{position:relative;height:220px;display:grid;place-items:center}
.ball{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#BFE6D4,#6CB89A);transform:scale(.8);transition:transform 4s ease-in-out}
.ball.in{transform:scale(1.6)}
.ball.out{transform:scale(.8);transition-duration:6s}
.breath span{position:absolute;font-size:24px;font-weight:700;color:#173A2D}
.small{font-size:15px;color:var(--soft);margin:6px 0}
@media (prefers-reduced-motion:reduce){
  .ball,.ball.in,.ball.out{transform:none;transition:opacity 2s}
  .ball.out{opacity:.5}
  .stamp{animation:none}
}
.sent{cursor:pointer;border-radius:6px;transition:background .3s}
.sent:hover{background:rgba(226,169,59,.18)}
.sent.on{background:rgba(226,169,59,.4)}
.strat{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip.st.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.skip{display:block;margin:8px auto 0;font-size:15px;color:var(--soft);text-decoration:underline}
.qline{background:var(--tint);border-radius:14px;padding:10px 14px;margin-top:4px}
.qline p{margin:0 0 8px;font-size:22px;font-weight:700;line-height:1.6}

let voices=[];
function lv(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}
function pick(lang){
  const pref=lang==='zh'?['zh-tw','zh-hk','zh-cn','zh']:['en-us','en-gb','en'];
  for(const p of pref){const v=voices.find(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(p));if(v)return v;}
  return null;
}
function norm(t,lang){if(lang==='zh')return t.replace(/[（(]/g,'，').replace(/[）)]/g,'，').replace(/\s*×\s*/g,'乘以').replace(/\s*÷\s*/g,'除以').replace(/\s*−\s*/g,'減').replace(/\s*\+\s*/g,'加').replace(/\s*=\s*/g,'等於').replace(/，+/g,'，').replace(/，([。？！])/g,'$1');
  return t.replace(/\s*×\s*/g,' times ').replace(/\s*÷\s*/g,' divided by ').replace(/\s*−\s*/g,' minus ').replace(/\s*\+\s*/g,' plus ').replace(/\s*=\s*/g,' equals ');}
function speak(text,lang){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(norm(text,lang));const v=pick(lang);if(v)u.voice=v;
  u.lang=lang==='zh'?'zh-TW':'en-US';u.rate=lang==='zh'?.82:.92;speechSynthesis.speak(u);}catch(e){}
}

const SND=(()=>{
  const CFG={id:'nora',music:false,bar:4.8,steps:4,arp:.4,ring:2.2,oct:0,wave:'sine',vol:.55,cut:1600};
  let ctx=null,master=null,mg=null,on=CFG.music,nextBar=0,bar=0;
  try{const v=localStorage.getItem('music-'+CFG.id);if(v!==null)on=v==='1';}catch(e){}
  const N=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC();}catch(e){return false;}
    master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=CFG.cut;lp.connect(master);
    mg=ctx.createGain();mg.gain.value=0;mg.connect(lp);
    setInterval(tick,200);return true;
  }
  function tone(f,t,d,o){o=o||{};const os=ctx.createOscillator(),g=ctx.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
    if(o.glide)os.frequency.exponentialRampToValueAtTime(o.glide,t+d);
    const a=o.a||.015,v=o.v||.15;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g);g.connect(o.dest||master);os.start(t);os.stop(t+d+.05);}
  const PROG=[[48,[60,64,67,71]],[45,[57,60,64,67]],[41,[57,60,64,65]],[43,[59,62,67,64]]];
  const PENT=[72,74,76,79,81,84,86,88];
  function playBar(t){
    const [root,ch]=PROG[bar%PROG.length];bar++;const L=CFG.bar;
    tone(N(root),t,L*.95,{v:.09,a:.3,dest:mg});
    ch.forEach(m=>tone(N(m),t,L*1.05,{v:.035,a:L*.35,type:'triangle',dest:mg}));
    const dt=L/CFG.steps;
    for(let i=0;i<CFG.steps;i++)if(Math.random()<CFG.arp)tone(N(PENT[Math.floor(Math.random()*PENT.length)]+CFG.oct),t+i*dt,CFG.ring,{v:.05,dest:mg,type:CFG.wave});
  }
  function tick(){
    const speaking=(('speechSynthesis' in window)&&speechSynthesis.speaking)||!!(window.VOICE_PLAYING&&window.VOICE_PLAYING());
    const target=on&&!document.hidden?(speaking?CFG.vol*.25:CFG.vol):0;
    mg.gain.setTargetAtTime(target,ctx.currentTime,.4);
    if(!on)return;
    if(nextBar<ctx.currentTime)nextBar=ctx.currentTime+.1;
    while(nextBar<ctx.currentTime+.6){playBar(nextBar);nextBar+=CFG.bar;}
  }
  function unlock(){if(init()&&ctx.state!=='running')ctx.resume();}
  document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);
  const btn=document.createElement('button');btn.className='mus';btn.type='button';
  function label(){btn.textContent=on?'🎵':'🔇';btn.setAttribute('aria-label',on?'Music on':'Music off');btn.setAttribute('aria-pressed',String(on));}
  label();
  btn.onclick=e=>{e.stopPropagation();unlock();on=!on;try{localStorage.setItem('music-'+CFG.id,on?'1':'0');}catch(err){}label();};
  document.body.appendChild(btn);
  function fx(fn){if(!init())return;if(ctx.state!=='running')ctx.resume();fn(ctx.currentTime+.02);}
  return{
    correct:()=>fx(t=>[72,76,79,84].forEach((m,i)=>tone(N(m),t+i*.09,.5,{type:'triangle',v:.16}))),
    wrong:()=>fx(t=>{tone(N(64),t,.25,{v:.09});tone(N(60),t+.16,.35,{v:.09});}),
    win:()=>fx(t=>{[72,74,76,79,81,84,88].forEach((m,i)=>tone(N(m),t+i*.06,.4,{type:'triangle',v:.12}));[72,76,79].forEach(m=>tone(N(m),t+.5,1.2,{v:.08}));}),
    pop:()=>fx(t=>tone(N(67),t,.18,{v:.15,glide:N(79)})),
    thump:()=>fx(t=>tone(110,t,.3,{v:.25,glide:55})),
    bell:()=>fx(t=>{tone(N(69),t,2.5,{v:.07});tone(N(76),t,2.5,{v:.035});})
  };
})();

const CLOUD={ref:null,timer:null,ready:false};
async function cloudInit(){
  try{
    if(!window.claude||typeof claude.use!=='function')return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;CLOUD.db=db;CLOUD.uid=id;
    CLOUD.ref=db.collection('data/users/'+id).doc(KEY);
    const snap=await CLOUD.ref.get();
    if(snap.exists){const d=snap.data();if(d&&typeof d.state==='string'){try{S=MERGE(S,JSON.parse(d.state));}catch(e){}}}
    CLOUD.ready=true;
    if(typeof voiceLoad==='function')voiceLoad();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    cloudPush(true);
    if(ON_HOME())home();
  }catch(e){}
}
function cloudPush(now){
  if(!CLOUD.ref||!CLOUD.ready)return;

  if(now)go();else CLOUD.timer=setTimeout(go,700);
}

  bg(false);
  app.innerHTML=`<section class="center"><h2 data-say="zh" data-text="開始前，你現在感覺怎麼樣？很平靜、有點卡卡，還是很煩躁？">開始前，你現在感覺怎麼樣？</h2>
  <div class="moods"><button data-m="a">😌<span>很平靜</span></button><button data-m="b">😕<span>有點卡卡</span></button><button data-m="c">😣<span>很煩躁</span></button></div></section>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.m;S.moods=(S.moods||[]).concat([{d:Date.now(),m}]).slice(-60);save();
    if(m==='a')next();
    else if(m==='b'){app.innerHTML=`<section class="center"><p class="big" data-say="zh">謝謝你告訴我。<br>卡卡的感覺很正常。<br>我們先做一題就好，慢慢來。</p><button class="primary" id="ok">好</button></section>`;$('#ok').onclick=next;}
    else calm(next,'謝謝你說出來。煩躁的時候，大腦需要先充電。我們一起呼吸三次。');
  });
}

function openCase(i){
  if(i<0){home();return;}
  cur=i;tries=0;wrong=[];hintOn=false;showEn=false;note='';phase='full';
  introThen(renderCase);
}

let phase='full',RT=0;
const isPhone=()=>matchMedia('(max-width:520px)').matches;
function lastSent(t,en){const a=t.split(en?/(?<=[?!.])\s+(?=[A-Z“])/:/(?<=[。？！])/).filter(Boolean);return a[a.length-1];}
function renderCase(){
  const c=CC();bg(false);const tok=++RT;
  const txt=showEn?c.en:c.zh,lang=showEn?'en':'zh';
  const head=`<div class="peek" aria-hidden="true">${CAT}</div>
  <header class="file">${PR.on?`<span>🎯 弱點特訓：${SKILLS[PR.skill]}</span><span>${PR.i+1} / ${PR.items.length}</span>`:`<span>🌀 傳送門 → ${c.icon} ${c.place}</span><span>任務 ${cur+1} / ${CASES.length}</span>`}</header>
  <h2 data-say="zh">${c.title}</h2>`;
  const story=`<div class="story"><p>${sents(txt,showEn)}</p><p class="small tip">點一句，就只唸那一句。</p>
  <div class="tools"><button class="chip" id="read">🔊 唸給我聽</button>${phase==='full'?'<button class="chip" id="ro">🔊 唸選項</button>':''}<button class="chip" id="en">${showEn?'看中文':'看英文 English'}</button></div></div>
  ${c.words.length?`<div class="words"><span class="wl">生字</span>${c.words.map((w,k)=>`<button class="word" data-k="${k}" aria-label="${w[0]}">${ruby(w[0],w[1])}</button>`).join('')}</div>`:''}`;
  const opts=`<div class="opts">${c.opts.map((o,k)=>`<button class="opt${wrong.includes(k)?' no':''}" data-k="${k}"${wrong.includes(k)?' disabled':''}><b>${L[k]}</b>${o}</button>`).join('')}</div>
  <div class="msg${hintOn?' hint':''}"${(hintOn||note)?' data-say="zh"':''} aria-live="polite">${hintOn?'💡 '+c.hint:note}</div>`;
  const bar=`<div class="bar"><button class="quiet" id="calm">🫧 冷靜一下</button>${tries>0&&!hintOn?'<button class="quiet" id="hint">💡 看提示</button>':''}<button class="quiet" id="home" aria-label="回首頁">🏠</button></div>`;
  let body;
  if(phase==='read')body=story+`<button class="primary" id="toans">我讀完了，去作答 ➜</button>`;
  else if(phase==='answer')body=`<div class="qline"><p data-say="${lang}">${lastSent(txt,showEn)}</p><div class="tools"><button class="chip" id="seeq">📜 再看題目</button><button class="chip" id="ro">🔊 唸選項</button></div></div>`+opts;
  else body=story+opts;
  app.innerHTML=`${battleBar()}<section class="case">${head}${body}${bar}</section>`;
  if(phase==='full'&&isPhone()&&document.documentElement.scrollHeight>innerHeight+2){phase='read';renderCase();return;}
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
  on('#read',()=>speak(txt,lang));
  on('#ro',()=>speak(c.opts.map((o,k)=>L[k]+'，'+o).join('。'),'zh'));
  app.querySelectorAll('.sent').forEach(s=>{const go=()=>{speak(s.textContent,lang);s.classList.add('on');setTimeout(()=>s.classList.remove('on'),1800);};s.onclick=go;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  on('#en',()=>{showEn=!showEn;phase='full';renderCase();});
  on('#toans',()=>{phase='answer';renderCase();scrollTo(0,0);});
  on('#seeq',()=>{phase='read';renderCase();scrollTo(0,0);});
  app.querySelectorAll('.word').forEach(b=>b.onclick=()=>speak(c.words[b.dataset.k][0],'zh'));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  on('#calm',()=>calm(null,'休息一下沒關係。我們一起慢慢呼吸。'));
  on('#hint',()=>{hintOn=true;renderCase();});
  on('#home',home);
  if(phase==='full'&&isPhone())setTimeout(()=>{if(tok===RT&&phase==='full'&&$('.opts')&&document.documentElement.scrollHeight>innerHeight+2){phase='read';renderCase();}},150);
}

function answer(k){
  const c=CC();
  try{const t=v=>{const d=document.createElement('div');d.innerHTML=String(v);return d.textContent.trim()};window.KA&&KA.answer({q:t(c.title),qid:c.title,given:t(c.opts[k]),expected:t(c.opts[c.ans]),correct:k===c.ans,tryNo:tries+1,topic:'math case'});}catch(e){}
  if(k===c.ans){SND.correct();const f=tries===0;logAns(f,hintOn);pickSpell(f?'first':'retry',e=>battleHit(f?'first':'retry',e,()=>solved(true)));return;}
  SND.wrong();const sh=comboBreak();tries++;wrong.push(k);
  if(tries===1){note=sh?`${sh.e} ${sh.n}的保護罩擋住了！連擊沒有中斷。再看一次線索！`:'咒語差一點點！再看一次線索，你可以的。';renderCase();}
  else if(tries===2){calm(()=>{hintOn=true;renderCase();},'這題有點難，魔女也需要補充魔力。補充完，給你一個提示。');}
  else{logAns(false,hintOn);pickSpell('assist',e=>battleHit('assist',e,()=>solved(false)));}
}

function solved(self){
  RT++;const c=CC();
  if(!PR.on){if(!seenT().includes(c.title))S.seen=seenT().concat([c.title]);if(self&&!S.solved.includes(cur))S.solved.push(cur);S.idx=(cur+1)%CASES.length;}save();
  const sol=`<div class="explain"><h3>解法</h3><p data-say="zh">${c.explain}</p></div>`;
  app.innerHTML=`${battleBar()}<section class="case">
  <div class="scene" style="background:linear-gradient(160deg,${PR.on?'#F6E7FF,#8E6CC0':SCENES[cur]})"><span class="sicon">${c.icon}</span><div class="mini-m"><img src="${ART_FACE}" alt=""></div></div>
  <div class="stampwrap"><div class="stamp">${self?'咒語成功':'合力完成'}</div></div>
  <h2 data-say="zh">${self?'你找到答案了！':'這題我們一起看看'}</h2>
  <p class="ans" data-say="zh">答案是 <b>${L[c.ans]}　${c.opts[c.ans]}</b></p>
  ${self?'':sol}
  <div class="report" id="rep"><h3>📔 魔法日記</h3><p data-say="zh">${self?'把你是怎麼想的，說給爸爸或媽媽聽。說完就能拿一顆星星。':'看完解法，換你用自己的話說一次給爸爸或媽媽聽。'}</p>
  ${self?`<p class="small" data-say="zh">你用了哪個方法？可以選很多個。</p><div class="strat">${STRAT.map((s,k)=>`<button class="chip st" data-k="${k}" aria-pressed="false">${s}</button>`).join('')}</div>`:''}
  <button class="primary" id="star">⭐ 我說完了</button><button class="skip" id="skip">先跳過</button></div>
  <div id="st2" hidden>
  ${self||PR.on?'':'<p class="small" data-say="zh">這種題型之後會在 🎯 弱點特訓 用新的題目再練習！</p>'}
  ${self?`<details class="sol"><summary>看看魔法書的解法</summary>${sol}</details>`:''}
  ${c.fact?`<div class="fact"><h3>📖 魔法書小知識 <button class="chip" id="rf">🔊</button></h3><p>${c.fact}</p></div>`:''}
  <button class="primary" id="next">${PR.on?'下一題 ✨':'下一個任務 ✨'}</button></div>
  </section>`;
  bg(true);if(self)confetti();setTimeout(()=>SND.thump(),150);
  app.querySelectorAll('.st').forEach(b=>b.onclick=()=>{b.classList.toggle('sel');b.setAttribute('aria-pressed',String(b.classList.contains('sel')));});
  $('#star').onclick=e=>{SND.win();S.stars++;S.strat=S.strat||{};app.querySelectorAll('.st.sel').forEach(b=>{const k=b.dataset.k;S.strat[k]=(S.strat[k]||0)+1;});save();e.target.disabled=true;e.target.textContent='⭐ 拿到一顆星星了！';setTimeout(step2,700);};
  const step2=()=>{$('#rep').hidden=true;$('#st2').hidden=false;scrollTo(0,0);};
  $('#skip').onclick=step2;
  if($('#rf'))$('#rf').onclick=()=>speak(c.fact,'zh');
  const goNext=()=>{
    if(PR.on){PR.i++;if(PR.i>=PR.items.length)practiceDone();else openPractice();return;}
    session++;
    if(CASES.every(c=>seenT().includes(c.title))){home();return;}
    if(session>=3)rest();
    else if(session===2)mood(()=>openCase(nextCase()));
    else openCase(nextCase());
  };
  $('#next').onclick=()=>{const b=PR.on?PRB:S.battle;if(b&&b.hp<=0&&!b.shown)victory(goNext);else goNext();};
}

function rest(){
  bg(true);
  app.innerHTML=`<section class="center"><div class="hero-art">${MASCOT}</div>
  <h2 data-say="zh">今天完成了3個任務，魔力用了好多！</h2>
  <p class="big" data-say="zh">去喝口水、伸伸懶腰，或到外面走一走吧。</p>
  <button class="primary" id="h">回到首頁</button>
  <button class="quiet" id="more" style="width:100%;margin-top:12px">休息好了，再辦一個</button></section>`;
  $('#h').onclick=home;
  $('#more').onclick=()=>{session=0;mood(()=>openCase(nextCase()));};
}

function calm(done,msg){
  const o=document.createElement('div');o.className='calm';o.setAttribute('role','dialog');
  o.innerHTML=`<div class="calmbox"><p class="cmsg" data-say="zh">${msg}</p>
  <div class="breath"><div class="ball"></div><span>準備</span></div>
  <p class="small cyc">&nbsp;</p>
  <button class="primary rd" disabled>我準備好了</button>
  <p class="small" data-say="zh">也可以喝口水，或用力握拳再放鬆。</p></div>`;
  document.body.appendChild(o);
  const ball=o.querySelector('.ball'),bt=o.querySelector('.breath span'),cyc=o.querySelector('.cyc'),rd=o.querySelector('.rd');
  let n=0,alive=true;
  function run(){
    if(!alive)return;
    if(n>=3){bt.textContent='很棒';speak('很棒，你做到了','zh');rd.disabled=false;return;}
    n++;cyc.textContent=`第 ${n} 次，共 3 次`;
    SND.bell();bt.textContent='吸氣…';speak('吸氣','zh');ball.className='ball in';
    setTimeout(()=>{if(!alive)return;bt.textContent='吐氣…';speak('吐氣','zh');ball.className='ball out';
      setTimeout(()=>{if(n===1)rd.disabled=false;run();},6000);},4000);
  }
  setTimeout(run,700);
  rd.onclick=()=>{alive=false;o.remove();if(done)done();};
}

home();
cloudInit();
</script>
