<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nora's Cursive Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nora:#7048e8; --nora-dk:#5233c4; --nora-lt:#e9e2ff;
  --pink:#f06595; --gold:#fcc419; --gold-dk:#e8a800; --mint:#20c997; --sky:#4dabf7; --coral:#ff8787; --blue:#1c7ed6;
  --ok:#2f9e44; --bad:#e8590c;
  --ink:#2b2350; --muted:#6c6489; --paper:#fffdf7; --card:#ffffff; --card-2:#f7f3ff; --border:#e6dfff;
  --line-top:#74c0fc; --line-mid:#a5d8ff; --line-base:#e64980; --line-desc:#dee2e6;
  --bg1:#ffe8f3; --bg2:#e3f2ff; --bg3:#e6fcf5;
  --shadow:0 6px 0 rgba(60,40,140,.14), 0 10px 24px rgba(60,40,140,.12);
  --radius:22px;
  --font: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f3f0ff; --muted:#b9b2d6; --paper:#fffdf7; --card:#2a2348; --card-2:#352c5c; --border:#4a3f7a;
    --bg1:#231a46; --bg2:#1a2747; --bg3:#18352f; color-scheme: dark;
  }
}
:root[data-theme="dark"]{ --ink:#f3f0ff; --muted:#b9b2d6; --card:#2a2348; --card-2:#352c5c; --border:#4a3f7a; --bg1:#231a46; --bg2:#1a2747; --bg3:#18352f; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overscroll-behavior:none}
body{font-family:var(--font); color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)); background-attachment:fixed;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overflow-x:hidden}
body.bg-ocean,body.bg-candy,body.bg-castle,body.bg-forest{--ink:#2b2350; --muted:#6c6489; --card:#ffffff; --card-2:#f7f3ff; --border:#e6dfff; color-scheme:light}
body.bg-ocean{--bg1:#c5f6fa; --bg2:#a5d8ff; --bg3:#d0ebff}
body.bg-candy{--bg1:#ffdeeb; --bg2:#fff3bf; --bg3:#e5dbff}
body.bg-space{--bg1:#1b1446; --bg2:#2b1f6b; --bg3:#0d3b66; --ink:#f8f5ff; --muted:#c8c0ea; --card:#2a2358; --card-2:#3a2f78; --border:#5a4ca0}
body.bg-castle{--bg1:#fff0f6; --bg2:#f3d9fa; --bg3:#d0bfff}
body.bg-forest{--bg1:#ebfbee; --bg2:#d3f9d8; --bg3:#fff9db}
#decor{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
#app{position:relative; z-index:1; min-height:100%; max-width:1180px; margin:0 auto; padding-block:12px 28px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none; touch-action:manipulation}
.screen{display:none; animation:pop .35s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important} }

h1,h2,h3{margin:0 0 .4em; line-height:1.15}
h1{font-size:clamp(28px,4.5vw,46px)} h2{font-size:clamp(22px,3.2vw,32px)} h3{font-size:clamp(18px,2.4vw,24px)}
p{margin:.3em 0 .6em; font-size:clamp(16px,2vw,20px); line-height:1.4}
.muted{color:var(--muted)}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.center{text-align:center} .grow{flex:1}
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; border:2px solid var(--border)}

.btn{min-height:56px; min-width:56px; padding:12px 22px; border-radius:18px; font-size:clamp(18px,2.2vw,22px); font-weight:600;
  background:var(--nora); color:#fff; box-shadow:0 5px 0 var(--nora-dk); transition:transform .08s, box-shadow .08s; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--nora-dk)}
.btn.big{min-height:72px; font-size:clamp(22px,3vw,28px); padding:14px 30px; border-radius:24px}
.btn.gold{background:var(--gold); color:#4a3500; box-shadow:0 5px 0 var(--gold-dk)}
.btn.mint{background:var(--mint); box-shadow:0 5px 0 #0ca678}
.btn.pink{background:var(--pink); box-shadow:0 5px 0 #c2255c}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:0 5px 0 var(--border); border:2px solid var(--border)}
.btn.sky{background:var(--sky); box-shadow:0 5px 0 #1c7ed6}
.btn[disabled]{opacity:.45; pointer-events:none}
.icon-btn{width:56px; height:56px; border-radius:18px; background:var(--card); border:2px solid var(--border); box-shadow:0 4px 0 var(--border); font-size:26px; display:inline-flex; align-items:center; justify-content:center}
.icon-btn.off{opacity:.5}

/* top bar */
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.topbar .title{font-weight:700; font-size:clamp(18px,2.4vw,24px); flex:1; min-width:120px}
.star-pill{background:var(--gold); color:#4a3500; font-weight:700; border-radius:999px; padding:10px 16px; font-size:20px; box-shadow:0 4px 0 var(--gold-dk); white-space:nowrap}
.badge-nora{display:inline-flex; align-items:center; gap:8px; background:var(--card); border-radius:999px; padding:4px 14px 4px 4px; border:2px solid var(--border)}
.badge-nora .av{width:48px; height:48px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 3px var(--gold),0 0 14px 3px rgba(252,196,25,.7); background:#fff}
.badge-nora .nm{background:var(--nora); color:#fff; border-radius:999px; padding:2px 10px; font-weight:700}

/* intro */
#intro{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center;
  background:radial-gradient(circle at 50% 40%, #fff6c8 0, #ffd8f0 35%, #b197fc 75%, #7048e8 100%); overflow:hidden}
#intro.on{display:flex}
#intro .rays{position:absolute; inset:-50%; background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.28) 0 8deg, rgba(255,255,255,0) 8deg 20deg); animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#intro .stage{position:relative; width:min(92vw,900px); height:min(78vh,640px)}
#intro .nora-intro{position:absolute; left:50%; bottom:0; width:min(46vh,340px); transform:translateX(-50%)}
#intro .tapstart{position:relative; z-index:3}
#intro .skip{position:absolute; bottom:18px; right:18px; z-index:4; color:#fff; font-size:18px; opacity:.85}
#intro .ititle{position:absolute; top:2%; left:0; right:0; z-index:2}
#intro .ititle svg{width:min(88vw,760px); height:auto; filter:drop-shadow(0 4px 0 rgba(80,40,160,.35))}
.speed-lines{position:absolute; inset:0; pointer-events:none}
.floaty{position:absolute; font-size:42px; animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}

/* welcome */
.hero{display:grid; grid-template-columns:minmax(180px,300px) 1fr; gap:20px; align-items:center}
.hero .nora-wrap{position:relative}
.comp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px}
.comp{background:var(--card-2); border:3px solid var(--border); border-radius:20px; padding:8px; text-align:center; font-weight:600; position:relative; min-height:150px}
.comp svg{width:100%; height:100px}
.comp.sel{border-color:var(--nora); box-shadow:0 0 0 4px var(--nora-lt)}
.comp.locked{filter:grayscale(1); opacity:.6}
.comp .lock{position:absolute; top:6px; right:8px; font-size:14px; background:var(--card); border-radius:999px; padding:2px 8px}

/* map */
.map-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:16px}
.worlds{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.world-card{position:relative; border-radius:24px; padding:14px; min-height:150px; color:#fff; text-align:left; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; justify-content:space-between}
.world-card .wn{font-size:14px; opacity:.9; font-weight:600; letter-spacing:.5px}
.world-card > div:nth-child(2){padding-right:56px}
.world-card .wt{font-size:clamp(19px,2.3vw,24px); font-weight:700; line-height:1.1}
.world-card .wbar{height:12px; border-radius:99px; background:rgba(255,255,255,.35); overflow:hidden; margin-top:8px}
.world-card .wbar i{display:block; height:100%; background:#fff; border-radius:99px}
.world-card .wico{position:absolute; right:10px; top:8px; font-size:44px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.world-card.locked{filter:grayscale(.85) brightness(.95)}
.world-card.locked::after{content:'🔒'; position:absolute; right:12px; bottom:10px; font-size:30px}
.w1{background:linear-gradient(135deg,#9775fa,#7048e8)} .w2{background:linear-gradient(135deg,#f783ac,#e64980)}
.w3{background:linear-gradient(135deg,#4dabf7,#1c7ed6)} .w4{background:linear-gradient(135deg,#38d9a9,#0ca678)}
.w5{background:linear-gradient(135deg,#ffa94d,#f76707)} .w6{background:linear-gradient(135deg,#fcc419,#f08c00)}
.side-stack{display:flex; flex-direction:column; gap:14px}
.daily .task{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--border); font-size:18px}
.daily .task:last-child{border:none}
.daily .task .chk{width:30px; height:30px; border-radius:50%; border:3px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none}
.daily .task.done .chk{background:var(--ok); border-color:var(--ok); color:#fff}
.prog{height:10px; background:var(--card-2); border-radius:99px; overflow:hidden; flex:1}
.prog i{display:block; height:100%; background:var(--mint)}
.next-card{background:linear-gradient(135deg,#fff3bf,#ffe066); color:#4a3500; border:none}
.next-card .btn{width:100%}

/* world screen */
.lesson-groups{display:flex; flex-direction:column; gap:16px}
.lgroup h3{display:flex; align-items:center; gap:8px}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px}
.tile{background:var(--card); border:3px solid var(--border); border-radius:20px; min-height:110px; padding:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 4px 0 var(--border); position:relative}
.tile:active{transform:translateY(3px); box-shadow:0 1px 0 var(--border)}
.tile svg{height:62px; width:100%; color:var(--ink)}
.tile .tl{font-size:15px; font-weight:600; text-align:center; line-height:1.15}
.tile .ts{font-size:14px; letter-spacing:1px; color:var(--gold-dk); min-height:18px}
.tile.done{border-color:var(--mint)}
.tile.suggest{border-color:var(--gold); box-shadow:0 0 0 4px rgba(252,196,25,.4), 0 4px 0 var(--gold-dk); animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(252,196,25,.25), 0 4px 0 var(--gold-dk)}}
.tile.wide{grid-column:span 2}
.tile .emo{font-size:36px}
.gate-card{display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#e5dbff,#d0bfff); color:#2b2350; border:none}

/* lesson / pad */
.pad-col{display:flex; flex-direction:column; min-height:min(72vh,640px)}
.lesson{display:grid; grid-template-columns:minmax(240px,32%) 1fr; gap:14px; align-items:stretch}
.lesson .info{display:flex; flex-direction:column; gap:10px}
.letter-show{display:flex; align-items:center; justify-content:space-around; gap:8px; background:var(--paper); border-radius:18px; padding:8px; color:#2b2350}
.letter-show svg{height:120px; max-width:65%}
.letter-show .print{font-size:68px; font-weight:600; font-family:system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; color:#495057}
.letter-show .lab{font-size:13px; color:#868e96; text-align:center}
.steps{display:flex; gap:6px; flex-wrap:wrap}
.steps span{flex:1; min-width:64px; text-align:center; padding:6px 4px; border-radius:12px; background:var(--card-2); font-size:14px; font-weight:600; color:var(--muted)}
.steps span.cur{background:var(--nora); color:#fff} .steps span.done{background:var(--mint); color:#fff}
.tipbox{background:var(--card-2); border-radius:16px; padding:10px 14px; font-size:clamp(16px,1.9vw,19px); line-height:1.35}
.tipbox b{color:var(--nora)}
.pad-wrap{position:relative; background:var(--paper); border-radius:24px; box-shadow:var(--shadow); border:3px solid var(--border); overflow:hidden; display:flex; flex-direction:column}
.pad-wrap canvas{display:block; width:100%; flex:1 1 0; height:0; touch-action:none; min-height:300px}
.pad-tools{display:flex; gap:10px; padding:10px; background:var(--card-2); flex-wrap:wrap; justify-content:center}
.pad-label{position:absolute; top:10px; right:14px; font-weight:700; color:#5c5480; background:rgba(255,255,255,.85); padding:4px 12px; border-radius:999px; font-size:16px; pointer-events:none}
.feedback{display:none; position:absolute; inset:0; background:rgba(255,253,247,.94); flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; color:#2b2350}
.feedback.on{display:flex; animation:pop .3s}
.feedback .stars{font-size:54px; letter-spacing:6px}
.checks{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px 14px; margin:10px 0; text-align:left; font-size:17px; max-width:560px; width:100%}
.checks div{display:flex; gap:6px; align-items:center}
.fb-tips{font-size:18px; max-width:560px; color:#5c5480}
.compare{display:flex; gap:10px; align-items:center; justify-content:center}
.compare canvas{border-radius:12px; background:#fff; border:2px solid #eee; max-width:44%; height:auto}

/* quiz */
.quiz{display:flex; flex-direction:column; gap:14px; align-items:center}
.qhead{width:100%; display:flex; align-items:center; gap:10px}
.dots{display:flex; gap:6px; flex-wrap:wrap; flex:1; justify-content:center}
.dots i{width:16px; height:16px; border-radius:50%; background:var(--card-2); border:2px solid var(--border)}
.dots i.ok{background:var(--ok); border-color:var(--ok)} .dots i.half{background:var(--gold); border-color:var(--gold)} .dots i.no{background:var(--coral); border-color:var(--coral)} .dots i.cur{border-color:var(--nora); transform:scale(1.25)}
.prompt{width:100%; min-height:170px; background:var(--paper); border-radius:24px; box-shadow:var(--shadow); padding:16px; text-align:center; color:#2b2350; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px}
.prompt .q{font-size:clamp(19px,2.5vw,26px); font-weight:600}
.prompt svg.big{height:clamp(110px,22vh,190px); max-width:100%}
.prompt .printbig{font-size:clamp(56px,10vw,96px); font-family:system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; font-weight:600; color:#343a40}
.prompt .emoji{font-size:clamp(56px,9vw,84px)}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; width:100%}
.opt{background:var(--card); border:3px solid var(--border); border-radius:22px; min-height:96px; padding:8px; box-shadow:0 5px 0 var(--border); display:flex; align-items:center; justify-content:center; font-size:clamp(30px,4.5vw,46px); font-weight:600; transition:transform .1s}
.opt svg{height:78px; max-width:100%; color:var(--ink)}
.opt .pr{font-family:system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.opt:active{transform:translateY(3px); box-shadow:0 2px 0 var(--border)}
.opt.ok{background:#d3f9d8; border-color:var(--ok); color:#2b8a3e; box-shadow:0 5px 0 #8ce99a}
.opt.no{background:#ffe3e3; border-color:var(--coral); animation:shake .4s}
.opt.no svg, .opt.ok svg{color:#2b2350}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
.reveal{width:100%; display:none; background:#fff4e6; color:#5c3d00; border-radius:20px; padding:12px 16px; border:2px solid #ffd8a8}
.reveal.on{display:flex; gap:14px; align-items:center; flex-wrap:wrap; animation:pop .3s}
.reveal canvas{background:var(--paper); border-radius:14px; width:220px; height:150px}
.timer{height:16px; width:100%; background:var(--card-2); border-radius:99px; overflow:hidden; border:2px solid var(--border)}
.timer i{display:block; height:100%; background:linear-gradient(90deg,var(--mint),var(--gold),var(--coral)); transition:width .25s linear}

/* games */
.arcade{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px}
.game-card{border-radius:24px; padding:16px; color:#fff; text-align:left; min-height:150px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px}
.game-card .ge{font-size:46px} .game-card .gt{font-size:22px; font-weight:700} .game-card .gd{font-size:15px; opacity:.95}
.match-board{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%}
.match-col{display:grid; gap:10px}
.mcard{background:var(--card); border:3px solid var(--border); border-radius:18px; min-height:76px; display:flex; align-items:center; justify-content:center; font-size:38px; box-shadow:0 4px 0 var(--border); font-weight:600}
.mcard svg{height:62px; color:var(--ink)} .mcard .pr{font-family:system-ui,-apple-system,Arial,sans-serif}
.mcard.sel{border-color:var(--nora); box-shadow:0 0 0 4px var(--nora-lt)}
.mcard.gone{visibility:hidden}
.mcard.ok{background:#d3f9d8; border-color:var(--ok)}
.mcard.no{animation:shake .4s; border-color:var(--coral)}
.hunt{display:grid; gap:8px; width:100%; grid-template-columns:repeat(var(--cols,5),1fr)}
.hcell{background:var(--paper); border-radius:16px; border:3px solid var(--border); aspect-ratio:1.15; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 var(--border); color:#2b2350}
.hcell svg{height:80%; max-width:92%}
.hcell.found{background:#d3f9d8; border-color:var(--ok)} .hcell.found::after{content:'💎'; position:absolute; font-size:22px; transform:translate(24px,-24px)}
.hcell{position:relative}
.hcell.no{animation:shake .4s; border-color:var(--coral)}
.builder-slots{display:flex; gap:6px; justify-content:center; min-height:120px; align-items:center; background:var(--paper); border-radius:20px; width:100%; padding:8px; color:#2b2350}
.builder-slots svg{height:110px; max-width:100%}
.builder-tiles{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.btile{width:92px; height:96px; background:var(--card); border:3px solid var(--border); border-radius:18px; box-shadow:0 4px 0 var(--border); display:flex; align-items:center; justify-content:center}
.btile svg{height:72px; color:var(--ink)} .btile.used{visibility:hidden} .btile.no{animation:shake .4s; border-color:var(--coral)}

/* results */
.results{max-width:760px; margin:0 auto; text-align:center}
.results .bigstars{font-size:64px; letter-spacing:8px}
.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0; text-align:left}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.chip{background:var(--card-2); border-radius:12px; padding:2px 8px; display:inline-flex; align-items:center; border:2px solid var(--border)}
.chip svg{height:38px; width:auto; color:var(--ink)}
.tip-life{background:#e7f5ff; color:#1864ab; border-radius:18px; padding:12px 16px; font-size:18px; margin:10px 0}

/* rewards */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.tabs button{padding:10px 18px; border-radius:16px; background:var(--card); border:2px solid var(--border); font-size:18px; font-weight:600; min-height:52px}
.tabs button.on{background:var(--nora); color:#fff; border-color:var(--nora)}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.bdg{background:var(--card); border:3px solid var(--border); border-radius:20px; padding:12px; text-align:center}
.bdg .be{font-size:48px} .bdg .bt{font-weight:700} .bdg .bd{font-size:14px; color:var(--muted)}
.bdg.locked{opacity:.45; filter:grayscale(1)}
.bg-swatch{height:90px; border-radius:16px; margin-bottom:6px}

/* parent */
.dash{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.stat{font-size:34px; font-weight:700; color:var(--nora)}
.bars{display:flex; gap:6px; align-items:flex-end; height:110px; padding-top:6px}
.bars div{flex:1; background:var(--sky); border-radius:8px 8px 0 0; position:relative; min-height:2px}
.bars div span{position:absolute; bottom:-22px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted)}
.bars div b{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); font-weight:500}
table.mini{width:100%; border-collapse:collapse; font-size:15px} table.mini td,table.mini th{padding:5px 4px; border-bottom:1px solid var(--border); text-align:left}
.lgrid{display:grid; grid-template-columns:repeat(13,1fr); gap:3px}
.lgrid div{aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff}
.keypad{display:grid; grid-template-columns:repeat(3,72px); gap:10px; justify-content:center; margin-top:10px}
.keypad button{height:62px; border-radius:16px; background:var(--card-2); font-size:26px; font-weight:700; border:2px solid var(--border)}
.gate-ans{font-size:34px; font-weight:700; min-height:48px; letter-spacing:2px}

/* overlays */
.overlay{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(30,20,70,.55); padding:16px}
.overlay.on{display:flex}
.overlay .card{max-width:560px; width:100%; text-align:center; animation:pop .35s}
.celebrate .be{font-size:96px; animation:float 2s ease-in-out infinite}
#confetti{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:70}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(140%); background:var(--ink); color:var(--card); padding:12px 22px; border-radius:999px; font-weight:600; z-index:80; transition:transform .3s; font-size:18px; max-width:92vw; text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#rotate-hint{display:none; background:#fff3bf; color:#5c3d00; border-radius:14px; padding:8px 12px; margin-bottom:10px; font-weight:600; text-align:center}
@media (max-width:600px) and (orientation:portrait){ body.needs-wide #rotate-hint{display:block} }

@media (max-width:860px){
  .map-grid{grid-template-columns:1fr}
  .letter-show svg{height:90px}
  .hero{grid-template-columns:1fr; justify-items:center; text-align:center}
}
@media (max-width:520px){
  .worlds{grid-template-columns:1fr}
  .res-grid{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
  .opt svg{height:60px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
}

@media (max-width:860px) and (orientation:portrait){ .lesson{grid-template-columns:1fr} .pad-col{min-height:min(52vh,520px)} }
@media (max-height:520px){
  #app{padding-block:6px 10px}
  .topbar{margin-bottom:6px} .icon-btn{width:48px; height:48px; font-size:22px} .star-pill{padding:6px 12px; font-size:17px}
  .lesson{grid-template-columns:minmax(170px,27%) 1fr; gap:8px}
  .letter-show svg{height:64px} .letter-show .print{font-size:38px}
  .lesson .tipbox{font-size:14px; padding:6px 10px} .lesson .info > .row{display:none}
  .steps span{font-size:12px; min-width:0; padding:4px 2px}
  .pad-col{min-height:calc(100vh - 72px)} .lesson .info{max-height:calc(100vh - 72px); overflow:auto} .lesson .tipbox .muted{display:none} .pad-wrap canvas{min-height:180px}
  .pad-tools{padding:6px} .pad-tools .btn{min-height:48px; padding:8px 14px; font-size:17px}
  .prompt{min-height:110px; padding:10px} .prompt svg.big{height:90px} .opt{min-height:72px} .opt svg{height:56px}
}

function d2(a, b) { const dx = a[0]-b[0], dy = a[1]-b[1]; return Math.sqrt(dx*dx+dy*dy); }

// Centripetal Catmull-Rom segment p1->p2, n samples (excluding p2)
function crSeg(p0, p1, p2, p3, n, out) {
  const k = (a, b) => Math.pow(Math.max(d2(a, b), 1e-4), 0.5);

  for (let i = 0; i < n; i++) {
    const t = t1 + (t2-t1)*i/n;
    const A1 = L(p0, p1, t0, t1, t), A2 = L(p1, p2, t1, t2, t), A3 = L(p2, p3, t2, t3, t);
    const B1 = L(A1, A2, t0, t2, t), B2 = L(A2, A3, t1, t3, t);
    out.push(L(B1, B2, t1, t2, t));
  }

    for (const [f, dt, d, ty, v] of seq) this.tone(f, t + dt, d, ty, v);
  },
  // Cheerful synthesized anthem for menus (I–V–vi–IV in C)
  startMusic() {
    if (!this.ctx || this.playing) { this.fadeMusic(); return; }
    this.playing = true; this.nextT = this.ctx.currentTime + 0.1; this.step = 0;
    this.timer = setInterval(() => this.schedule(), 100);

  fadeMusic() {

      const s = this.step, bar = Math.floor(s / 8) % 4, ch = chords[bar], t = this.nextT;

      const m = mel[s % 32]; if (m > 0 && Math.floor(s / 32) % 2 === 0) this.tone(f(m), t, beat * 1.6, 'triangle', 0.1, this.musicGain);

      this.nextT += beat; this.step++;
    }
  },
  setMusicWanted(on) { this.wantMusic = on; if (on) this.startMusic(); else this.fadeMusic(); },
};

// ---------- Voice (device speech, warm female voice when available) ----------
const Voice = {
  v: null, ready: false,
  pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices(); if (!vs.length) return;
    const prefs = ['Samantha (Enhanced)', 'Ava (Premium)', 'Ava (Enhanced)', 'Zoe (Premium)', 'Zoe (Enhanced)', 'Allison (Enhanced)', 'Susan (Enhanced)', 'Samantha', 'Ava', 'Allison', 'Zoe', 'Susan', 'Karen', 'Moira', 'Tessa', 'Serena', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Victoria'];
    for (const p of prefs) { const m = vs.find(v => v.name.startsWith(p) && /^en/i.test(v.lang)); if (m) { this.v = m; return; } }
    this.v = vs.find(v => /en[-_]US/i.test(v.lang) && /female|woman/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  init() {
    if (!('speechSynthesis' in window)) return;
    this.pickVoice(); speechSynthesis.onvoiceschanged = () => this.pickVoice();
  },
  say(text, opts = {}) {
    if (!S.settings.voice || !('speechSynthesis' in window) || !text) return Promise.resolve();
    return new Promise(res => {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/✨|🌟|⭐|💎|🎉/g, ''));
        if (this.v) u.voice = this.v;
        u.lang = (this.v && this.v.lang) || 'en-US'; u.rate = opts.rate || 0.96; u.pitch = opts.pitch || 1.12; u.volume = 1;
        let done = false; const fin = () => { if (!done) { done = true; res(); } };
        u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 90);
        speechSynthesis.speak(u);
      } catch (e) { res(); }
    });
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} },
};

const Confetti = {
  parts: [], run: false,
  burst(n = 120) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#confetti'), W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
    const cols = ['#7048e8', '#f06595', '#fcc419', '#20c997', '#4dabf7', '#ff8787'];
    for (let i = 0; i < n; i++) this.parts.push({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 22 * devicePixelRatio, vy: (-Math.random() * 22 - 6) * devicePixelRatio, r: (4 + Math.random() * 6) * devicePixelRatio, c: pick(cols), a: Math.random() * 6, star: Math.random() < .3, life: 0 });
    if (!this.run) { this.run = true; requestAnimationFrame(() => this.tick()); }
  },
  tick() {
    const c = $('#confetti'), g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
    this.parts = this.parts.filter(p => p.life < 160 && p.y < c.height + 40);
    for (const p of this.parts) {
      p.life++; p.vy += 0.6 * devicePixelRatio; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += 0.15;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c;
      if (p.star) { g.font = `${p.r * 3}px sans-serif`; g.fillText('★', -p.r, p.r); } else g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      g.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.tick()); else { this.run = false; g.clearRect(0, 0, c.width, c.height); }
  },
};
function overlay(contentEl, { cls = '' } = {}) {
  const o = $('#overlay'); o.innerHTML = ''; const card = h('div', { class: 'card ' + cls }); card.append(contentEl); o.append(card); o.classList.add('on');

}

    this.tools = h('div', { class: 'pad-tools' });

    host.append(this.wrap);
    this.ctx = this.cv.getContext('2d');

  }

/* cfg: {title, types, n, ctx, timed (sec), speed (bool), missionId, gameId, onEnd} */
function runQuiz(cfg) {
  const s = screen('quizscreen');
  Snd.setMusicWanted(false);
  const ctx = Object.assign({ lower: poolFor('lower'), upper: poolFor('upper'), mixCase: true }, cfg.ctx || {});
  s.append(topbar(cfg.title, { onBack: cfg.onBack || goMap, backLabel: '✕' }));
  const q = h('div', { class: 'quiz' }); s.append(q);
  const head = h('div', { class: 'qhead' }); const dots = h('div', { class: 'dots' }); const timer = h('div', { class: 'timer' }, h('i', { style: 'width:100%' }));
  head.append(cfg.timed ? timer : dots); q.append(head);
  const prompt = h('div', { class: 'prompt' }); const opts = h('div', { class: 'opts' }); const reveal = h('div', { class: 'reveal' });
  const nextBtn = h('button', { class: 'btn big', style: 'display:none' }, 'Next ➜');
  q.append(prompt, opts, reveal, nextBtn);
  const results = []; let i = 0, points = 0, maxPoints = 0, ended = false, tLeft = cfg.timed || 0, tid = null;
  const total = cfg.timed ? Infinity : cfg.n;
  if (!cfg.timed) for (let k = 0; k < cfg.n; k++) dots.append(h('i'));
  const recordLetter = (qq, ok) => {
    for (const c of qq.letters) { const l = L(c); if (ok) l.right++; else { l.wrong++; if (!S.recentMiss.includes(c)) S.recentMiss.push(c); if (S.recentMiss.length > 12) S.recentMiss.shift(); } l.last = Date.now(); if (ok && S.recentMiss.includes(c) && isMastered(c)) { S.recentMiss = S.recentMiss.filter(x => x !== c); S.counts.comeback = (S.counts.comeback || 0) + 1; } }
    if (qq.word) { const w = S.words[qq.word] || (S.words[qq.word] = { right: 0, wrong: 0, traced: 0, written: 0 }); ok ? w.right++ : w.wrong++; }
    if (ok) track('right');
  };
  const finish = () => {
    if (ended) return; ended = true; clearInterval(tid);
    const correct = results.filter(r => r.pts > 0).length;
    const n = results.length;
    const pct = cfg.speed ? Math.min(1, correct / 12) : (maxPoints ? points / maxPoints : 0);
    if (!cfg.speed && n >= 5) { if (pct >= 0.85 && S.level.read < 3) S.level.read++; else if (pct < 0.55 && S.level.read > 1) S.level.read--; }
    if (!cfg.speed && n >= 5) { if (pct >= 0.85 && S.level.words < 3) S.level.words++; else if (pct < 0.5 && S.level.words > 1) S.level.words--; }
    S.quizHist.push({ d: Date.now(), title: cfg.title, right: correct, n, pct: Math.round(pct * 100) }); if (S.quizHist.length > 60) S.quizHist.shift();
    S.counts.quizzes++;
    if (cfg.speed) S.counts.speedBest = Math.max(S.counts.speedBest || 0, correct);
    const letters = [...new Set(results.flatMap(r => r.q.letters))];
    const missed = [...new Set(results.filter(r => r.pts < 2).flatMap(r => r.q.letters.length ? r.q.letters : [r.q.target]))];
    const mastered = letters.filter(c => isMastered(c) && !missed.includes(c));
    const stars = Math.max(1, pct >= 0.9 ? 3 : pct >= 0.65 ? 2 : 1);
    if (cfg.gameId === 'detective' && correct === n && n >= 8) S.counts.detectivePerfect = 1;
    if (cfg.gameId === 'superstar' && pct >= 0.8) S.counts.superstar = 1;
    if (cfg.gameId) track('game:' + cfg.gameId); if (cfg.gameId) track('game');
    finishMission({ title: cfg.title, missionId: cfg.missionId, stars, correct, total: n, points, maxPoints, mastered, practice: missed, speed: cfg.speed, wrongWords: results.filter(r => r.pts < 2 && r.q.word).map(r => r.q.word) });
  };
  const next = () => {
    if (ended) return;
    if (i >= total) return finish();
    reveal.classList.remove('on'); reveal.innerHTML = ''; nextBtn.style.display = 'none';
    const type = pick(cfg.types);
    let qq; try { qq = GEN[type](ctx); } catch (e) { console.warn(e); qq = GEN.recLower(ctx); }
    qq.type = type; qq.tries = 0;
    $$('i', dots).forEach((d, k) => d.classList.toggle('cur', k === i));
    prompt.innerHTML = ''; opts.innerHTML = '';
    if (qq.write) return askWrite(qq);
    prompt.innerHTML = `<div class="q">${escapeHTML(qq.q)}</div>${qq.prompt}`;
    if (qq.wide) opts.style.gridTemplateColumns = 'repeat(auto-fit,minmax(220px,1fr))'; else opts.style.gridTemplateColumns = '';
    Voice.say(qq.say);
    let locked = false;
    const done = (pts) => {
      locked = true; results.push({ q: qq, pts }); points += pts; maxPoints += 2;
      const dot = $$('i', dots)[i]; if (dot) dot.classList.add(pts === 2 ? 'ok' : pts === 1 ? 'half' : 'no');
      recordLetter(qq, pts > 0); save(); i++;
    };
    const choose = (key, btn) => {
      if (locked) return;
      if (key === qq.answer) {
        btn.classList.add('ok'); Snd.play('ok'); const pts = cfg.speed ? 2 : (qq.tries === 0 ? 2 : 1);
        done(pts); if (!cfg.speed) Voice.say(pick(PRAISE)); setTimeout(next, cfg.speed ? 350 : 1000);
      } else {
        btn.classList.add('no'); Snd.play('no'); qq.tries++;
        if (cfg.speed) { done(0); $$('.opt', opts).forEach(b => { if (b.dataset.key === qq.answer) b.classList.add('ok'); }); setTimeout(next, 700); return; }
        if (qq.tries < 2) { Voice.say(pick(RETRY)); setTimeout(() => btn.classList.add('dim'), 400); return; }
        // second miss: reveal the answer with a short reason and a demo
        done(0);

        reveal.innerHTML = '';
        reveal.append(demoBox(qq.demo, qq.joins), h('div', { class: 'grow', style: 'min-width:200px' }, h('b', {}, 'Here\'s the answer! '), qq.explain));
        reveal.classList.add('on'); nextBtn.style.display = ''; Voice.say(`Here's the answer. ${qq.explain}`);
      }

    for (const o of qq.options) { const b = h('button', { class: 'opt', 'data-key': o.key, html: o.html, 'aria-label': 'Answer option', onclick: () => choose(o.key, b) }); opts.append(b); }
    CUR = { kind: 'mcq', answer: qq.answer, choose: () => { const b = $$('.opt', opts).find(b => b.dataset.key === qq.answer); if (b) choose(qq.answer, b); }, next: () => nextBtn.style.display !== 'none' && nextBtn.click(), cleanup: () => clearInterval(tid) };
  };

    const host = h('div', { style: 'width:100%;height:min(46vh,380px);display:flex' });
    prompt.append(host); prompt.style.padding = '10px';

  const play = () => {
    board.innerHTML = '';
    const mode = cfg.mode || (S.level.read >= 3 && capsReady() && Math.random() < 0.5 ? 'mixed' : 'print');
    let pool = cfg.letters ? cfg.letters.slice() : poolFor('lower');
    let picks = shuffle(pool.filter(c => !used.has(c))); if (picks.length < 4) picks = shuffle(pool);

          if (!tries[c]) firstTry++; pairsTotal++; matched++; const l = L(c); l.right++; sel = null; track('right');
          if (matched === picks.length) { round++; Voice.say(pick(PRAISE)); setTimeout(() => round < rounds ? play() : end(), 900); }
        } else {

function groupPool(letters, order) { const p = letters.split(''); for (const c of order) { if (p.length >= 6) break; if (!p.includes(c) && S.letters[c] && S.letters[c].intro) p.push(c); } for (const c of order) { if (p.length >= 4) break; if (!p.includes(c)) p.push(c); } return p; }
function worldProgress(n) { const ls = worldLessons(n); const done = ls.filter(l => lessonStars(l.id) > 0).length; return { done, total: ls.length, pct: done / ls.length }; }
function gateReady(n) { return n < 6 && (worldProgress(n).pct >= 0.5 || S.settings.unlockAll); }

  for (const c of [...LOWER, ...UPPER]) { const m = mastery(c), l = S.letters[c]; const col = !l || !(l.practiced || l.right || l.wrong) ? '#ced4da' : m >= 0.72 ? '#2f9e44' : m >= 0.4 ? '#fab005' : '#fa5252'; lg.append(h('div', { style: 'background:' + col, title: c }, c)); }
  dash.append(card('🔤 Letter map', lg, h('p', { class: 'muted', style: 'font-size:14px' }, '🟩 mastered · 🟨 learning · 🟥 needs help · ⬜ not started yet. Mastery needs both reading (quizzes) and writing (tracing/writing) practice.')));
  const strong = [...LOWER, ...UPPER].filter(isMastered).sort((a, b) => mastery(b) - mastery(a)).slice(0, 12);
  const weak = weakLetters(10);
  const chipRow = list => { const c = h('div', { class: 'chips' }); list.forEach(x => c.append(h('span', { class: 'chip', html: cursiveSVG(x, { unit: 24 }) + `<span style="margin-left:4px;font-size:14px">${x}${S.letters[x] ? ` ${S.letters[x].right}✓ ${S.letters[x].wrong}✗` : ''}</span>` }))); return c; };
  dash.append(card('💪 Strengths', strong.length ? chipRow(strong) : h('p', { class: 'muted' }, 'Not enough practice yet.')));
  dash.append(card('🩹 Weak letters', weak.length ? chipRow(weak) : h('p', { class: 'muted' }, 'None so far!'), S.recentMiss.length ? h('p', { class: 'muted', style: 'font-size:14px' }, 'Recently missed: ' + S.recentMiss.join(' ')) : ''));
  const tb = h('table', { class: 'mini' }, h('tr', {}, h('th', {}, 'When'), h('th', {}, 'Activity'), h('th', {}, 'Score')));
  for (const q of S.quizHist.slice(-8).reverse()) tb.append(h('tr', {}, h('td', {}, new Date(q.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })), h('td', {}, q.title), h('td', {}, `${q.right}/${q.n} (${q.pct}%)`)));
  dash.append(card('📝 Recent quiz results', S.quizHist.length ? tb : h('p', { class: 'muted' }, 'No quizzes yet.')));
  const sug = nextSuggestions().slice(0, 3);
  const sl = h('div', {}); sug.forEach(x => sl.append(h('button', { class: 'btn ghost', style: 'width:100%;margin-bottom:8px;justify-content:flex-start', onclick: () => x.run() }, x.label)));
  dash.append(card('🧭 Suggested next activities', sl));
  const bdg = Object.keys(S.badges).map(id => BADGES.find(b => b.id === id)).filter(Boolean);
  dash.append(card('🏅 Badges', h('p', {}, bdg.length ? bdg.map(b => b.e + ' ' + b.t).join(' · ') : 'None yet.')));
  // settings
  const tog = (label, key) => { const cb = h('input', { type: 'checkbox', style: 'width:26px;height:26px' }); cb.checked = !!S.settings[key]; cb.onchange = () => { S.settings[key] = cb.checked; save(); Snd.fadeMusic(); }; return h('label', { class: 'row', style: 'font-size:18px;margin:6px 0' }, cb, label); };
  dash.append(card('⚙️ Settings', tog('Sound effects & music', 'sound'), tog('Background music', 'music'), tog('Narrator voice', 'voice'), tog('Unlock all worlds (skip the gates)', 'unlockAll'),
    h('p', { class: 'muted', style: 'font-size:14px' }, `Voice: ${Voice.v ? Voice.v.name : 'device default'}. For the most natural voice on iPad, install an “Enhanced” English voice (Settings › Accessibility › Spoken Content › Voices). Progress is saved on this device only.`),
    h('button', { class: 'btn pink', onclick: () => parentGate(resetFlow, 'Reset records') }, '🗑️ Reset records')));
}
function resetFlow() {
  const cb = h('input', { type: 'checkbox', style: 'width:28px;height:28px' });
  const el = h('div', {}, h('h2', {}, 'Reset whose records?'), h('p', { class: 'muted' }, 'This clears stars, progress, seen questions and settings on this device.'),
    h('label', { class: 'row', style: 'justify-content:center;font-size:22px;margin:12px' }, cb, 'Nora'),
    h('div', { class: 'row', style: 'justify-content:center' }, h('button', { class: 'btn ghost', onclick: () => close() }, 'Cancel'),
      h('button', { class: 'btn pink', onclick: () => { if (!cb.checked) { toast('Tick a name first'); return; } S = freshState(); save(); close(); applyBg(); toast('Records reset.'); showTitle(); } }, 'Reset')));
  const close = overlay(el);
}

// ---------- Title / intro / welcome ----------
function showTitle() {
  const it = $('#intro'); it.classList.add('on'); it.innerHTML = '';
  it.append(h('div', { class: 'rays' }));
  const stage = h('div', { class: 'stage' }); it.append(stage);
  const title = h('div', { class: 'ititle', html: cursiveSVG("Nora's Cursive Quest", { unit: 60, color: '#fff', sw: 13, style: 'overflow:visible' }) });
  stage.append(title, h('div', { class: 'nora-intro', html: noraSVG({ kit: 'explorer' }) }));
  const btn = h('button', { class: 'btn big gold tapstart', style: 'position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:30px;min-height:84px;padding:16px 40px' }, '▶ Tap to start');
  stage.append(btn);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.onclick = async () => {
    Snd.init(); Snd.setMusicWanted(true); Snd.play('unlock');
    btn.remove();
    let skipped = false; const skip = h('div', { class: 'skip' }, 'Tap anywhere to skip ⏭'); it.append(skip);
    const done = () => { if (skipped) return; skipped = true; it.classList.remove('on'); it.onclick = null; showWelcome(); };
    setTimeout(() => { it.onclick = done; }, 300);
    // animate title being written + Nora jumping in
    const paths = $$('path', title); let delay = 0;
    if (!reduce) {
      for (const p of paths) { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.style.transition = `stroke-dashoffset ${len / 900}s linear ${delay}s`; delay += len / 900 + 0.05; }
      requestAnimationFrame(() => requestAnimationFrame(() => paths.forEach(p => p.style.strokeDashoffset = 0)));
      const n = $('.nora-intro', stage); n.animate([{ transform: 'translate(-50%,110%)' }, { transform: 'translate(-50%,-6%)' }, { transform: 'translate(-50%,0)' }], { duration: 1100, easing: 'cubic-bezier(.2,1.4,.4,1)' });
      $('.ponytail', n).animate([{ transform: 'rotate(0)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }], { duration: 1400, delay: 900 });
      for (let i = 0; i < 10; i++) { const f = h('div', { class: 'floaty', style: `left:${5 + rnd(88)}%;top:${10 + rnd(70)}%;animation-delay:${(i * 0.3).toFixed(1)}s;font-size:${30 + rnd(30)}px` }, pick(['✨', '⭐', '🌟', '💜', 'a', 'b', 'c'].map(x => x))); f.animate([{ opacity: 0, transform: 'scale(.2)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 600, delay: 300 + i * 150, fill: 'both' }); stage.append(f); }
      // speed lines
      const sl = h('div', { class: 'speed-lines', html: `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">${Array.from({ length: 14 }, (_, i) => `<line x1="${50 + 60 * Math.cos(i / 14 * 6.28)}" y1="${70 + 60 * Math.sin(i / 14 * 6.28)}" x2="${50 + 40 * Math.cos(i / 14 * 6.28)}" y2="${70 + 40 * Math.sin(i / 14 * 6.28)}" stroke="white" stroke-width=".6" opacity=".7"/>`).join('')}</svg>` });
      stage.prepend(sl); sl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1500, fill: 'forwards' });
    }
    Voice.say('Hi Nora! Ready for a cursive adventure?');
    await sleep(reduce ? 1200 : Math.max(4200, delay * 1000 + 1200));
    done();
  };
  CUR = { kind: 'title', choose: () => { if (btn.isConnected) btn.click(); else it.click(); } };
}
function showWelcome() {
  const s = screen('', false); Snd.setMusicWanted(true);
  const first = !S.companion;
  const hero = h('div', { class: 'hero card' });
  hero.append(h('div', { class: 'nora-wrap', html: noraSVG({ kit: 'explorer' }) }));
  const right = h('div', {});
  right.append(h('h1', {}, first ? 'Welcome, Nora! 🌟' : 'Welcome back, Nora! 🌟'), h('p', { style: 'font-size:clamp(20px,2.6vw,26px)' }, first ? 'Are you ready to become a Cursive Superstar?' : `You have ⭐ ${S.stars} stars. Let's keep going!`));
  if (first) right.append(h('h3', {}, 'Choose your adventure buddy:'));
  const grid = h('div', { class: 'comp-grid' }); let sel = S.companion || null;
  const avail = COMPANIONS.filter(c => owned(null, c));
  for (const c of (first ? avail : [])) {
    const b = h('button', { class: 'comp' + (sel === c.id ? ' sel' : ''), 'data-comp': c.id, html: companionSVG(c.id) }); b.append(h('div', {}, c.name));
    b.onclick = () => { sel = c.id; $$('.comp', grid).forEach(x => x.classList.toggle('sel', x === b)); Snd.play('pop'); Voice.say(`Hi Nora! I'm ${c.name}. Let's go on a cursive quest together!`); go.disabled = false; };
    grid.append(b);
  }
  if (first) right.append(grid);
  else right.append(h('div', { class: 'row' }, h('div', { style: 'width:120px;height:120px', html: companionSVG(S.companion, S.acc) }), h('p', {}, `${companionName()} missed you!`)));
  const go = h('button', { class: 'btn big', style: 'margin-top:14px', disabled: first && !sel, onclick: () => { if (!sel) return; S.companion = sel; save(); Snd.play('unlock'); goMap(); } }, first ? 'Let\'s go! ✨' : 'Continue my quest ✨');
  right.append(go); hero.append(right); s.append(hero);
  Voice.say(first ? 'Welcome, Nora! Are you ready to become a Cursive Superstar? Choose your adventure buddy!' : `Welcome back, Nora! ${companionName()} missed you!`);
  CUR = { kind: 'welcome', choose: () => { if (first && !sel) $('.comp', grid).click(); go.click(); } };
}

// ---------- Test hook (harmless for players) ----------
window.__test = {
  state: () => ({ screen: CUR ? CUR.kind : 'none', stars: S.stars, done: false }),
  solve: () => CUR && CUR.choose && CUR.choose(),
  next: () => CUR && CUR.next && CUR.next(),
  S: () => S, go: { map: () => goMap(), world: n => openWorld(n), arcade: () => openArcade(), parent: () => openParent(), rewards: t => openRewards(t), gate: n => runGate(n) },
  games: () => GAMES, worldLessons, GEN, layoutText, scoreInk, recognize,
};

// ---------- Boot ----------
function boot() {
  load(); Voice.init(); applyBg(); ensureDaily();
  const unlock = () => { Snd.init(); };
  document.addEventListener('pointerdown', unlock, { once: true });
  showTitle();
}
boot();

</script>
