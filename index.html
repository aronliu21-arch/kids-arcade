<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1f3b;
  --bg:#dcecff;
  --bg2:#c4ddfb;
  --text:#1b1f3b;
  --muted:#3d4a6b;
  --team:#1c7ed6;
  --nora:#7048e8;
  --lucas:#f76707;
  --milo:#2f9e44;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a2e; --bg2:#16264a; --text:#f1f5ff; --muted:#b8c4e0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --bg:#0f1a2e; --bg2:#16264a; --text:#f1f5ff; --muted:#b8c4e0; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  background-image:repeating-linear-gradient(90deg,var(--bg) 0 80px,var(--bg2) 80px 160px);
  color:var(--text);
  font-family:"Nunito","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header{
  background:var(--team);
  border-bottom:5px solid var(--ink);
  padding:22px 20px 18px;
  text-align:center;
}
h1{
  margin:0;
  font-family:"Lilita One","Arial Rounded MT Bold","PingFang TC",system-ui,sans-serif;
  font-weight:400;
  font-size:clamp(2.2rem,6vw,3.6rem);
  line-height:1;
  color:#fff;
  letter-spacing:.01em;
  text-shadow:4px 4px 0 var(--ink);
  -webkit-text-stroke:2px var(--ink);
  paint-order:stroke fill;
}
.hzh{display:flex;justify-content:center;gap:2px;margin-top:8px;color:#fff;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:900;font-size:1.6rem;text-shadow:2px 2px 0 var(--ink)}
.sub{margin:10px 0 0;color:#fff;font-weight:800;font-size:1.15rem}
main{max-width:1200px;margin:0 auto;padding:28px 18px 40px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));
  gap:22px;
}
.cart{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  text-decoration:none;color:#fff;
  background:var(--c);
  border:4px solid var(--ink);
  border-radius:18px 18px 10px 10px;
  box-shadow:6px 6px 0 var(--ink);
  padding:30px 14px 16px;
  min-height:230px;
  transition:transform .08s,box-shadow .08s;
  touch-action:manipulation;
}
.cart::before{ /* cartridge grip notch */
  content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:44%;height:14px;background:var(--bg);
  border:4px solid var(--ink);border-top:none;border-radius:0 0 10px 10px;
}
.cart:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--ink)}
.cart:focus-visible{outline:4px solid #ffd43b;outline-offset:4px}
.emblem{
  width:96px;height:96px;border-radius:50%;
  background:#fff;border:4px solid var(--ink);
  display:grid;place-items:center;
}
.emblem svg{width:66px;height:66px}
.name{
  margin:14px 0 10px;text-align:center;
  font-family:"Lilita One","Arial Rounded MT Bold","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  font-size:1.45rem;line-height:1.15;
  text-shadow:2px 2px 0 var(--ink);
}
.name.zh{font-size:1.6rem;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 1px;margin-bottom:6px}
.name.zh.long{font-size:1.3rem;flex-wrap:nowrap}
.name.zh.xl{font-size:1.15rem}
.en{margin:0 0 12px;text-align:center;font-weight:800;font-size:1.02rem;line-height:1.2;color:#fff;opacity:.95}
.zc{display:inline-flex;align-items:center}
.zy{writing-mode:vertical-rl;text-orientation:upright;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:.55em;line-height:1;letter-spacing:0;text-shadow:none;font-weight:700;margin-left:1px}
.who{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kid{
  font-weight:800;font-size:.95rem;color:#fff;
  padding:3px 11px;border-radius:999px;border:3px solid var(--ink);
  background:var(--k);
}
.kid.nora{--k:var(--nora)} .kid.lucas{--k:var(--lucas)} .kid.milo{--k:var(--milo)}

h2.q{margin:6px 0 24px;text-align:center;font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--text)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:26px;max-width:980px;margin:0 auto}
.kidbtn{
  font:inherit;cursor:pointer;color:#fff;background:var(--k);
  border:5px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink);
  padding:26px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:transform .08s,box-shadow .08s;touch-action:manipulation;
}
.kidbtn:active{transform:translate(6px,6px);box-shadow:2px 2px 0 var(--ink)}
.kidbtn:focus-visible{outline:4px solid #ffd43b;outline-offset:4px}
.kidbtn.nora{--k:var(--nora)} .kidbtn.lucas{--k:var(--lucas)} .kidbtn.milo{--k:var(--milo)}
.face{width:min(160px,38vw);aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.face svg{width:88%;height:88%}
.kname{font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;font-size:2.6rem;line-height:1;text-shadow:3px 3px 0 var(--ink)}
.kzh{display:flex;gap:2px;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:800;font-size:1.5rem;text-shadow:2px 2px 0 var(--ink)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.back{
  font:inherit;font-weight:800;font-size:1.2rem;cursor:pointer;color:var(--ink);background:#fff;
  border:4px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);padding:10px 20px;
  touch-action:manipulation;
}
.back:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.who-now{display:flex;align-items:center;gap:12px;font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;font-size:clamp(1.8rem,5vw,2.4rem);color:var(--text)}
.who-now .mini{width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.who-now .mini svg{width:88%;height:88%}
[hidden]{display:none!important}
footer{text-align:center;color:var(--muted);font-weight:700;font-size:.9rem;padding:0 18px 28px}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Kids Arcade</h1>
  <div class="hzh" lang="zh-Hant" id="hzh"></div>
  <p class="sub" id="sub">誰要玩？ · Who’s playing?</p>
</header>
<main>
  <section id="pickView">
    <h2 class="q">點你的名字 · Tap your name!</h2>
    <div class="pick" id="pick"></div>
  </section>
  <section id="gameView" hidden>
    <div class="bar">
      <button class="back" id="back" type="button">← Change player</button>
      <div class="who-now" id="whoNow"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer>Stars and progress save inside each game, on this device.</footer>

  nora:[["幼","ㄧㄡˋ"],["晴","ㄑㄧㄥˊ"]],

  milo:[["洛","ㄌㄨㄛˋ"],["明","ㄇㄧㄥˊ"]]
};
const $ = id => document.getElementById(id);
$("hzh").innerHTML = titleHTML([["小","ㄒㄧㄠˇ"],["朋","ㄆㄥˊ"],["友","ㄧㄡˇ"],["遊","ㄧㄡˊ"],["戲","ㄒㄧˋ"],["廳","ㄊㄧㄥ"]]);
$("pick").innerHTML = Object.keys(NAMES).map(k => `
  <button class="kidbtn ${k}" type="button" data-kid="${k}" aria-label="${NAMES[k]}">
    <div class="face" aria-hidden="true">${FACES[k]}</div>
    <div class="kname">${NAMES[k]}</div>
    <div class="kzh" lang="zh-Hant">${titleHTML(ZH[k])}</div>
  </button>`).join("");
$("pick").addEventListener("click", e => {
  const b = e.target.closest(".kidbtn"); if (b) location.hash = b.dataset.kid;
});
$("back").addEventListener("click", () => { location.hash = ""; });
function cardHTML(g){
  return `<a class="cart" href="${g.url}" target="_blank" rel="noopener" style="--c:${g.color}">
    <div class="emblem" aria-hidden="true">${ICONS[g.icon]}</div>
    <div class="name zh${g.zh.length>6?' xl':g.zh.length>4?' long':''}" lang="zh-Hant">${titleHTML(g.zh)}</div>
    <div class="en" lang="en">${g.en}</div>
  </a>`;
}
function show(){
  const kid = location.hash.slice(1);
  const valid = Object.prototype.hasOwnProperty.call(NAMES, kid);
  $("pickView").hidden = valid;
  $("gameView").hidden = !valid;
  $("sub").textContent = valid ? "點一個遊戲 · Tap a game to play!" : "誰要玩？ · Who\u2019s playing?";
  if (!valid) return;
  $("whoNow").innerHTML = `<span class="mini" aria-hidden="true">${FACES[kid]}</span><span>${NAMES[kid]}\u2019s games</span>`;
  $("grid").innerHTML = GAMES.filter(g => g.kids.includes(kid)).map(cardHTML).join("");
  window.scrollTo(0, 0);
}

show();
