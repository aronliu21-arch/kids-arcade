<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1f3b;
  --bg:#dcecff;
  --bg2:#c4ddfb;
  --text:#1b1f3b;
  --muted:#3d4a6b;
  --team:#1c7ed6;
  --nora:#7048e8;
  --lucas:#f76707;
  --milo:#2f9e44;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a2e; --bg2:#16264a; --text:#f1f5ff; --muted:#b8c4e0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --bg:#0f1a2e; --bg2:#16264a; --text:#f1f5ff; --muted:#b8c4e0; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  background-image:repeating-linear-gradient(90deg,var(--bg) 0 80px,var(--bg2) 80px 160px);
  color:var(--text);
  font-family:"Nunito","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header{
  background:var(--team);
  border-bottom:5px solid var(--ink);
  padding:22px 20px 18px;
  text-align:center;
}
h1{
  margin:0;
  font-family:"Lilita One","Arial Rounded MT Bold","PingFang TC",system-ui,sans-serif;
  font-weight:400;
  font-size:clamp(2.2rem,6vw,3.6rem);
  line-height:1;
  color:#fff;
  letter-spacing:.01em;
  text-shadow:4px 4px 0 var(--ink);
  -webkit-text-stroke:2px var(--ink);
  paint-order:stroke fill;
}
.hzh{display:flex;justify-content:center;gap:2px;margin-top:8px;color:#fff;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:900;font-size:1.6rem;text-shadow:2px 2px 0 var(--ink)}
.sub{margin:10px 0 0;color:#fff;font-weight:800;font-size:1.15rem}
main{max-width:1200px;margin:0 auto;padding:28px 18px 40px}
.grid.cats{display:block}
.catsec{margin:0 0 30px}
.cathead{display:flex;align-items:center;gap:12px;margin:0 4px 14px;font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink)}
.cathead .ci{font-size:2rem;line-height:1}
.cathead .cz{font-size:1.5rem}
.cathead .ce{font-size:1.15rem;opacity:.75;font-family:system-ui,sans-serif;font-weight:800}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:22px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));
  gap:22px;
}
.cart{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  text-decoration:none;color:#fff;
  background:var(--c);
  border:4px solid var(--ink);
  border-radius:18px 18px 10px 10px;
  box-shadow:6px 6px 0 var(--ink);
  padding:30px 14px 16px;
  min-height:230px;
  transition:transform .08s,box-shadow .08s;
  touch-action:manipulation;
}
.cart::before{ /* cartridge grip notch */
  content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:44%;height:14px;background:var(--bg);
  border:4px solid var(--ink);border-top:none;border-radius:0 0 10px 10px;
}
.cart:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--ink)}
.cart:focus-visible{outline:4px solid #ffd43b;outline-offset:4px}
.emblem{
  width:96px;height:96px;border-radius:50%;
  background:#fff;border:4px solid var(--ink);
  display:grid;place-items:center;
}
.emblem svg{width:66px;height:66px}
.name{
  margin:14px 0 10px;text-align:center;
  font-family:"Lilita One","Arial Rounded MT Bold","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  font-size:1.45rem;line-height:1.15;
  text-shadow:2px 2px 0 var(--ink);
}
.name.zh{font-size:1.6rem;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 1px;margin-bottom:6px}
.name.zh.fit{flex-wrap:nowrap;white-space:nowrap}
.name.zh.xl{font-size:1.15rem}
.en{margin:0 0 12px;text-align:center;font-weight:800;font-size:1.02rem;line-height:1.2;color:#fff;opacity:.95}
.zc{display:inline-flex;align-items:center}
.zy{display:inline-flex;align-items:center;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:.55em;line-height:1;letter-spacing:0;text-shadow:none;font-weight:700;margin-left:1px}
.zs{display:inline-flex;flex-direction:column;align-items:center}.zs i{font-style:normal;display:block;line-height:1}
.zt{font-size:.8em;line-height:1;margin-left:.02em}.zn{font-size:.8em;line-height:.6}
.who{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kid{
  font-weight:800;font-size:.95rem;color:#fff;
  padding:3px 11px;border-radius:999px;border:3px solid var(--ink);
  background:var(--k);
}
.slot{position:relative;display:flex;flex-direction:column}
.slot>.cart{flex:1}
.upd{display:block;text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:6px}
.fav{
  position:absolute;top:8px;right:8px;z-index:2;
  width:48px;height:48px;border-radius:50%;
  background:#fff;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation;
}
.fav svg{width:28px;height:28px}
.fav:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.fav:focus-visible{outline:4px solid #ffd43b;outline-offset:3px}
.slot.on .fav{background:#fff3bf}
.slot.on>.cart{outline:5px solid #ffd43b;outline-offset:-10px}
.favtag{position:absolute;top:8px;left:8px;z-index:2;background:#ffd43b;color:var(--ink);font-weight:800;font-size:.85rem;padding:3px 9px;border:3px solid var(--ink);border-radius:999px;pointer-events:none}
.tip{text-align:center;color:var(--muted);font-weight:800;margin:-8px 0 18px}
.kid.nora{--k:var(--nora)} .kid.lucas{--k:var(--lucas)} .kid.milo{--k:var(--milo)}

h2.q{margin:6px 0 24px;text-align:center;font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--text)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:26px;max-width:980px;margin:0 auto}
.kidbtn{
  font:inherit;cursor:pointer;color:#fff;background:var(--k);
  border:5px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink);
  padding:26px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:transform .08s,box-shadow .08s;touch-action:manipulation;
}
.kidbtn:active{transform:translate(6px,6px);box-shadow:2px 2px 0 var(--ink)}
.kidbtn:focus-visible{outline:4px solid #ffd43b;outline-offset:4px}
.kidbtn.nora{--k:var(--nora)} .kidbtn.lucas{--k:var(--lucas)} .kidbtn.milo{--k:var(--milo)} .kidbtn.tester{--k:#495057}
.face{width:min(160px,38vw);aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.face svg{width:88%;height:88%}
.kname{font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;font-size:2.6rem;line-height:1;text-shadow:3px 3px 0 var(--ink)}
.kzh{display:flex;gap:2px;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:800;font-size:1.5rem;text-shadow:2px 2px 0 var(--ink)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.back{
  font:inherit;font-weight:800;font-size:1.2rem;cursor:pointer;color:var(--ink);background:#fff;
  border:4px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);padding:10px 20px;
  touch-action:manipulation;
}
.back:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.who-now{display:flex;align-items:center;gap:12px;font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;font-size:clamp(1.8rem,5vw,2.4rem);color:var(--text)}
.who-now .mini{width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.who-now .mini svg{width:88%;height:88%}
[hidden]{display:none!important}
.testerrow{text-align:center;margin-top:34px}
.testerbtn{font:inherit;font-size:.8rem;font-weight:700;color:var(--muted);background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 14px;min-height:32px;opacity:.55;cursor:pointer;touch-action:manipulation}
.testerbtn:hover,.testerbtn:focus-visible{opacity:1}
footer{text-align:center;color:var(--muted);font-weight:700;font-size:.9rem;padding:0 18px 28px}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Kids Arcade</h1>
  <div class="hzh" lang="zh-Hant" id="hzh"></div>
  <p class="sub" id="sub">誰要玩？ · Who’s playing?</p>
</header>
<main>
  <section id="pickView">
    <h2 class="q">點你的名字 · Tap your name!</h2>
    <div class="pick" id="pick"></div>
    <div class="testerrow"><button class="testerbtn" type="button" data-kid="tester">Tester</button></div>
  </section>
  <section id="gameView" hidden>
    <div class="bar">
      <button class="back" id="back" type="button">← Change player</button>
      <div class="who-now" id="whoNow"></div>
    </div>
    <p class="tip" id="tip">點 ☆ 把最愛的遊戲放在最上面 · Tap ☆ to keep a favorite on top</p>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer>Stars and progress save inside each game, on this device.</footer>

function titleHTML(t){
  if (typeof t === "string") return t;
  return t.map(([c,z]) => {
    const neutral = z.startsWith("˙"), body = z.replace(/[˙ˊˇˋ]/g, ""), tone = (z.match(/[ˊˇˋ]/) || [""])[0];
    const col = (neutral ? '<i class="zn">˙</i>' : "") + [...body].map(s => `<i>${s}</i>`).join("");
    return `<span class="zc"><span>${c}</span><span class="zy"><span class="zs">${col}</span>${tone ? `<span class="zt">${tone}</span>` : ""}</span></span>`;
  }).join("");
}

const STAR = on => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?"#fcc419":"#fff"}" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/></svg>`;
const favKey = kid => "arcade-favs-" + kid;
function getFavs(kid){ try { const v = JSON.parse(localStorage.getItem(favKey(kid)) || "[]"); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
let memFavs = {};
function loadFavs(kid){ return memFavs[kid] || (memFavs[kid] = getFavs(kid)); }
function saveFavs(kid, list){ memFavs[kid] = list; try { localStorage.setItem(favKey(kid), JSON.stringify(list)); } catch(e){} }
function slotHTML(g, on){
  const label = on ? `Remove ${g.en} from favorites` : `Add ${g.en} to favorites`;
  return `<div class="slot${on?" on":""}">${on?'<span class="favtag">⭐ 最愛 Fave</span>':''}<button class="fav" type="button" data-url="${g.url}" aria-pressed="${on}" aria-label="${label}">${STAR(on)}</button>${cardHTML(g)}</div>`;
}
function cardHTML(g){
  const k = location.hash.slice(1), href = g.url + (g.url.includes("?") ? "&" : "?") + "kid=" + encodeURIComponent(k);
  return `<a class="cart" href="${href}" target="_blank" rel="noopener" style="--c:${g.color}">
    <div class="emblem" aria-hidden="true">${ICONS[g.icon]}</div>
    <div class="name zh${g.zh.length>6?' xl':' fit'}" lang="zh-Hant">${titleHTML(g.zh)}</div>
    <div class="en" lang="en">${g.en}</div>
  </a>`;
}
function show(){
  const kid = location.hash.slice(1);
  const valid = Object.prototype.hasOwnProperty.call(NAMES, kid);
  $("pickView").hidden = valid;
  $("gameView").hidden = !valid;
  $("sub").textContent = valid ? "點一個遊戲 · Tap a game to play!" : "誰要玩？ · Who\u2019s playing?";
  if (!valid) return;
  $("whoNow").innerHTML = `<span class="mini" aria-hidden="true">${FACES[kid]}</span><span>${NAMES[kid]}\u2019s games</span>`;
  renderGrid(kid);
  window.scrollTo(0, 0);
}
const CATS = [
  {k:"fav", ic:"⭐", en:"Favorites", zh:[["最","ㄗㄨㄟˋ"],["愛","ㄞˋ"]]},
  {k:"story", ic:"📖", en:"Stories & Adventures", zh:[["故","ㄍㄨˋ"],["事","ㄕˋ"],["冒","ㄇㄠˋ"],["險","ㄒㄧㄢˇ"]]},
  {k:"math", ic:"🔢", en:"Math", zh:[["數","ㄕㄨˋ"],["學","ㄒㄩㄝˊ"]]},
  {k:"read", ic:"✏️", en:"Reading & Writing", zh:[["讀","ㄉㄨˊ"],["寫","ㄒㄧㄝˇ"]]},
  {k:"sport", ic:"⚽", en:"Sports", zh:[["運","ㄩㄣˋ"],["動","ㄉㄨㄥˋ"]]},
  {k:"art", ic:"🎨", en:"Draw & Create", zh:[["畫","ㄏㄨㄚˋ"],["畫","ㄏㄨㄚˋ"],["創","ㄔㄨㄤˋ"],["作","ㄗㄨㄛˋ"]]},
  {k:"life", ic:"🌱", en:"Life & Thinking", zh:[["生","ㄕㄥ"],["活","ㄏㄨㄛˊ"],["思","ㄙ"],["考","ㄎㄠˇ"]]},
  {k:"lab", ic:"🧪", en:"Testing Lab", zh:[["試","ㄕˋ"],["驗","ㄧㄢˋ"],["室","ㄕˋ"]]}
];
// which shelf each game sits on (anything not listed goes to Testing Lab)
const GCAT = {
  "games/lab/dino-world/":"story","games/dino-journey/":"story","games/dragon-heart/":"story","games/dragon-heart-en/":"story","games/lumi-quest/":"story","games/magic-academy/":"story","games/question-beasts/":"story",
  "https://aronliu21-arch.github.io/math-quest/":"math","games/kanga-hop/":"math","games/times-tables/":"math","games/times-challenge/":"math","games/calendar-quest/":"math","games/card-quest/":"math",
  "games/spelling-bees/":"read","games/zhuyin/":"read","games/cursive-quest/":"read",
  "games/pitch-smarts/":"sport","games/sports-stars/":"sport",
  "games/family-zoo/":"art","https://aronliu21-arch.github.io/drawing-game-/":"art","games/runway-sketch/":"art",
  "games/life-skills/":"life","games/critter-grove/":"life","games/game-room/":"life"
};
// when each game was last changed (written by tools/stamp-updated.py on every push); newest first in the Tester list
let UPD = {}; try { UPD = JSON.parse(localStorage.getItem("ka.updated") || "{}"); } catch (e) {}
(async () => {
  for (const u of ["https://raw.githubusercontent.com/aronliu21-arch/kids-arcade/main/updated.json?t=" + Date.now(), "updated.json?t=" + Date.now()]) {
    try { const r = await fetch(u, {cache: "no-store"}); if (!r.ok) continue; UPD = await r.json();
      try { localStorage.setItem("ka.updated", JSON.stringify(UPD)); } catch (e) {}
      if (location.hash.slice(1) === "tester") renderGrid("tester"); return; } catch (e) {}
  }
})();
const updTime = g => Date.parse(UPD[g.url] || "") || 0;
function updLabel(g){ const t = updTime(g); if (!t) return ""; const d = new Date(t), now = new Date();
  const day = d.toDateString() === now.toDateString() ? "Today 今天" : d.toLocaleDateString([], {month:"short", day:"numeric"});
  return `<span class="upd">🕒 ${day} ${d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</span>`; }
function renderGrid(kid){
  const favs = loadFavs(kid);
  const mine = GAMES.filter(g => g.kids.includes(kid)).reverse(); // newest first
  if (kid === "tester") {   // no shelves: favorites first, then most recently changed
    const order = new Map(mine.map((g, i) => [g.url, i]));
    const byNew = [...mine].sort((a, b) => (updTime(b) - updTime(a)) || (order.get(a.url) - order.get(b.url)));
    const list = [...byNew.filter(g => favs.includes(g.url)), ...byNew.filter(g => !favs.includes(g.url))];
    $("grid").classList.add("cats");
    $("grid").innerHTML = `<section class="catsec"><div class="catgrid">${list.map(g => slotHTML(g, favs.includes(g.url)).replace(/<\/div>$/, updLabel(g) + "</div>")).join("")}</div></section>`;
    fitNames(); return;
  }
  const groups = {};
  mine.forEach(g => { const k = favs.includes(g.url) ? "fav" : (GCAT[g.url] || "lab"); (groups[k] = groups[k] || []).push(g); });
  $("grid").classList.add("cats");
  $("grid").innerHTML = CATS.filter(c => groups[c.k]).map(c => `<section class="catsec"><h3 class="cathead"><span class="ci" aria-hidden="true">${c.ic}</span><span class="cz" lang="zh-Hant">${titleHTML(c.zh)}</span><span class="ce" lang="en">${c.en}</span></h3>
    <div class="catgrid">${groups[c.k].map(g => slotHTML(g, c.k === "fav")).join("")}</div></section>`).join("");
  fitNames();
}
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".fav"); if (!b) return;
  e.preventDefault();
  const kid = location.hash.slice(1), url = b.dataset.url;
  const favs = loadFavs(kid).filter(u => u !== url);
  if (b.getAttribute("aria-pressed") !== "true") favs.push(url);
  saveFavs(kid, favs);
  renderGrid(kid);
  const nb = [...document.querySelectorAll(".fav")].find(x => x.dataset.url === url);
  if (nb) { nb.focus({preventScroll:true}); nb.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
});
function fitNames(){
  document.querySelectorAll(".name.zh.fit").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize), max = el.parentElement.clientWidth - 16;
    while (el.scrollWidth > max && size > 12) { size -= 1; el.style.fontSize = size + "px"; }
  });
}
window.addEventListener("resize", fitNames);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
