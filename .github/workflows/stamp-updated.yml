name: Stamp game update times
on:
  push:
    branches: [main]
    paths-ignore: ['updated.json']
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/stamp-updated.py
      - run: |
          git config user.name "arcade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updated.json
          git diff --cached --quiet || (git commit -m "Update game times [skip ci]" && git pull --rebase -q && git push)
